<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Manga Oku - Kage 95</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#0e0c0c">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon-192.png">
    <script src="js/pwa.js"></script>
    <script src="js/tema.js"></script>
    <link rel="stylesheet" href="css/vurgu.css?v=20261026k">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500&display=swap" rel="stylesheet">

    <script src="js/config.js?v=20261025c"></script>
    <script src="js/liderlik.js"></script>
    <script src="js/puan.js"></script>
    <script src="js/adstili.js"></script>

    <!-- React ve Babel Kütüphaneleri -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="js/yorum.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --vurgu-rengi: #8e0e15;
            --vurgu-parlak: #e0343c;
            --bg-okuyucu: #0a0808;
            --bg-kutu: #121010;
            --border-renk: #2a2323;
            --text-ana: #ece8e4;
            --text-ikincil: #8f8782;
            /* Boşluk ölçüsü: 8 / 16 / 24 / 32 */
            --s1: 8px;
            --s2: 16px;
            --s3: 24px;
            --s4: 32px;
            --satir-olcu: 65ch;
            --parlaklik: 1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
        }

        /* body'de overflow-x:hidden sticky'yi bozar; clip kaydırma kapsayıcısı oluşturmaz */
        html { overflow-x: hidden; max-width: 100%; }
        body { overflow-x: clip; max-width: 100%; }

        body {
            background-color: var(--bg-okuyucu);
            color: var(--text-ana);
            min-height: 100vh; min-height: 100dvh;
            line-height: 1.5;
            font-weight: 400;
            user-select: none; /* Yanlışlıkla seçim olmaması için okuyucuda */
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- ÜST ÇUBUK (kaydırınca gizlenir) --- */
        .reader-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-okuyucu);
            border-bottom: 1px solid var(--border-renk);
            padding: var(--s1) var(--s3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--s2);
            flex-wrap: wrap;
            transition: transform 0.15s ease;
        }
        .reader-header.gizli { transform: translateY(-100%); }
        .reader-header.gizli:focus-within { transform: none; }
        .reader-header > * { min-width: 0; }

        .header-sol, .header-sag {
            display: flex;
            align-items: center;
            gap: var(--s1);
        }

        /* Düğmeler: ikincil (şeffaf + 1px kenarlık) ve düz metin */
        .btn-geri, .btn-aksiyon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-ikincil);
            padding: 0 var(--s2);
            border-radius: 2px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.15s ease, border-color 0.15s ease;
            text-decoration: none;
            min-height: 40px;
            min-width: 40px;
        }
        @media (hover:hover) { .btn-geri:hover, .btn-aksiyon:hover:not(:disabled) { color: var(--text-ana); } }
        .btn-aksiyon:disabled { opacity: 0.35; cursor: not-allowed; }
        .btn-aksiyon.aktif { color: var(--vurgu-parlak); }
        .btn-aksiyon svg { width: 16px; height: 16px; }
        .btn-geri:focus-visible, .btn-aksiyon:focus-visible, .nav-btn:focus-visible,
        .bolum-secici:focus-visible, .yorum-gonder-btn:focus-visible {
            outline: 2px solid var(--vurgu-parlak);
            outline-offset: 2px;
        }

        .manga-baslik-alani { text-align: center; flex: 1 1 160px; }
        .manga-baslik-alani h1 {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-ana);
            margin: 0;
            overflow-wrap: anywhere;
        }
        .manga-baslik-alani span { font-size: 0.875rem; color: var(--text-ikincil); }

        .bolum-secici {
            background: var(--bg-okuyucu);
            color: var(--text-ana);
            border: 1px solid var(--border-renk);
            padding: 0 var(--s1);
            border-radius: 2px;
            font-size: 0.9rem;
            font-weight: 400;
            outline: none;
            cursor: pointer;
            min-height: 40px;
            max-width: 100%;
            transition: border-color 0.15s ease;
        }
        .bolum-secici:focus { border-color: var(--vurgu-parlak); }

        /* --- OKUMA AYARLARI PENCERESİ --- */
        .ayar-perde {
            position: fixed;
            inset: 0;
            z-index: 300;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--s2);
            animation: perdeAc 0.15s ease;
        }
        .ayar-modal {
            width: 100%;
            max-width: 480px;
            max-height: calc(100dvh - 32px);
            display: flex;
            flex-direction: column;
            background: var(--bg-kutu);
            color: var(--text-ana);
            border: 1px solid var(--border-renk);
            border-radius: 4px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
            user-select: none;
        }
        .ayar-modal-ust {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--s2);
            padding: var(--s1) var(--s1) var(--s1) var(--s3);
            border-bottom: 1px solid var(--border-renk);
        }
        .ayar-modal-ust h2 { font-size: 1rem; font-weight: 500; margin: 0; }
        .ayar-modal-govde {
            overflow-y: auto;
            overscroll-behavior: contain;
            padding: var(--s2) var(--s3) var(--s3);
            display: flex;
            flex-direction: column;
            gap: var(--s3);
        }
        .ayar-bolum { display: flex; flex-direction: column; gap: var(--s1); }
        .ayar-grup-etiket {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            letter-spacing: 0.02em;
            color: var(--text-ikincil);
        }
        .ayar-grup-etiket b { color: var(--text-ana); font-weight: 500; }
        .ayar-buton-satir { display: flex; gap: 6px; flex-wrap: wrap; }
        .ayar-kucuk-btn {
            flex: 1 1 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 40px;
            padding: 0 12px;
            background: transparent;
            border: 1px solid var(--border-renk);
            border-radius: 2px;
            color: var(--text-ikincil);
            font: inherit;
            font-size: 0.875rem;
            cursor: pointer;
            transition: color 0.15s ease, border-color 0.15s ease;
        }
        @media (hover:hover) { .ayar-kucuk-btn:hover { color: var(--text-ana); } }
        .ayar-kucuk-btn.aktif { border-color: var(--vurgu-parlak); color: var(--text-ana); }
        .ayar-kucuk-btn:focus-visible, .ayar-sifirla:focus-visible, .ayar-kaydirici:focus-visible {
            outline: 2px solid var(--vurgu-parlak);
            outline-offset: 2px;
        }
        .tema-nokta {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid;
            flex: none;
        }
        .ayar-kaydirici {
            width: 100%;
            min-height: 36px;
            accent-color: var(--vurgu-parlak);
            cursor: pointer;
        }
        .ayar-sifirla {
            align-self: flex-start;
            background: none;
            border: 0;
            padding: 8px 0;
            min-height: 40px;
            color: var(--text-ikincil);
            font: inherit;
            font-size: 0.875rem;
            text-decoration: underline;
            cursor: pointer;
        }
        @keyframes perdeAc { from { opacity: 0; } to { opacity: 1; } }

        /* --- SAYFA GEÇİŞ EFEKTLERİ (klasik / çift) --- */
        .gecis-solma .sayfa-gorsel-kapsayici .manga-sayfasi { animation: sayfaSolma 0.25s ease; }
        .gecis-kayma .sayfa-gorsel-kapsayici .manga-sayfasi { animation: sayfaKayma 0.25s ease-out; }
        @keyframes sayfaSolma { from { opacity: 0; } to { opacity: 1; } }
        @keyframes sayfaKayma { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }

        /* --- OKUYUCU GÖVDE ALANI --- */
        .reader-alani {
            width: 100%;
            max-width: var(--okuma-genislik, 960px);
            margin: 0 auto;
            padding: var(--s3) var(--s2) var(--s4);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .reader-alani.mod-cift {
            max-width: min(1680px, 96vw);
        }
        .cift-sayfa-satir {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 12px;
            width: 100%;
        }
        .cift-sayfa-satir .manga-sayfasi {
            width: calc(50% - 6px);
            max-width: calc(50% - 6px);
            height: auto;
        }
        .reader-alani.mod-cift .sayfa-gorsel-kapsayici > .manga-sayfasi {
            max-width: var(--okuma-genislik, 960px);
        }
        @media (max-width: 768px) {
            .cift-sayfa-satir { flex-direction: column; align-items: center; }
            .cift-sayfa-satir .manga-sayfasi { width: 100%; max-width: 100%; }
        }
        /* Görsellere parlaklık filtresi */
        .manga-sayfasi, .webtoon-sayfasi { filter: brightness(var(--parlaklik, 1)); }

        /* KLASİK MOD */
        .klasik-kapsayici {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--s2);
        }
        .sayfa-gorsel-kapsayici {
            position: relative;
            width: 100%;
            max-width: 100%;
            display: flex;
            justify-content: center;
            cursor: pointer;
        }
        .manga-sayfasi {
            width: 100%;
            max-width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            background-color: var(--bg-okuyucu);
        }
        .sayfa-tiklama-bolgesi { position: absolute; top: 0; bottom: 0; width: 50%; z-index: 10; }
        .tiklama-sol { left: 0; cursor: w-resize; }
        .tiklama-sag { right: 0; cursor: e-resize; }

        .navigasyon-cubugu {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--s2);
            width: 100%;
            max-width: 480px;
        }

        /* İkincil düğme (varsayılan); .btn-dolgu = ana eylem */
        .nav-btn {
            background: transparent;
            border: 1px solid var(--border-renk);
            color: var(--text-ana);
            padding: 0 var(--s3);
            border-radius: 2px;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: color 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
            flex: 1;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: var(--s1);
            min-height: 40px;
            text-decoration: none;
        }
        @media (hover:hover) { .nav-btn:hover:not(:disabled) { border-color: var(--vurgu-parlak); } }
        .nav-btn.btn-dolgu { background: var(--vurgu-rengi); border-color: var(--vurgu-rengi); color: #fff; }
        @media (hover:hover) { .nav-btn.btn-dolgu:hover:not(:disabled) { background: var(--vurgu-parlak); border-color: var(--vurgu-parlak); } }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .sayfa-gostergesi {
            font-size: 0.9rem;
            color: var(--text-ikincil);
            white-space: nowrap;
            min-width: 64px;
            text-align: center;
        }

        /* WEBTOON MODU: görseller arasında hiç boşluk yok */
        .webtoon-kapsayici {
            width: 100%;
            max-width: var(--okuma-genislik, 800px);
            display: flex;
            flex-direction: column;
            gap: 0;
            line-height: 0;
            font-size: 0;
            overflow: hidden;
        }
        .webtoon-sayfasi {
            display: block;
            width: 100%;
            height: auto;
            margin: 0;
            padding: 0;
            border: 0;
            vertical-align: top;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        img.webtoon-sayfasi:not(.yuklendi), .manga-sayfasi:not(.yuklendi) {
            min-height: 60vh;
            background: linear-gradient(90deg, #151111 0%, #251a1b 50%, #151111 100%);
            background-size: 200% 100%;
            animation: okuyucu-iskelet 1.6s infinite ease-in-out;
        }
        @keyframes okuyucu-iskelet {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* KLAVYE KISAYOL BİLGİSİ */
        .kisayol-bilgi {
            margin-top: var(--s2);
            font-size: 0.875rem;
            color: var(--text-ikincil);
            text-align: center;
            max-width: var(--satir-olcu);
        }
        .kisayol-bilgi kbd { font-family: monospace; color: var(--text-ana); }

        /* --- OKUMA İLERLEME ÇİZGİSİ --- */
        .okuma-ilerleme {
            position: fixed;
            left: 0;
            right: 0;
            top: 0;
            height: 3px;
            z-index: 150;
            pointer-events: none;
            background: rgba(14, 12, 12, 0.4);
        }
        .okuma-ilerleme > span {
            display: block;
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--vurgu-rengi, #8e0e15), var(--vurgu-parlak, #e0343c));
            box-shadow: 0 0 10px rgba(224, 52, 60, 0.75);
            transform-origin: left center;
            transition: transform 0.15s linear;
        }

        /* --- HIZLI BÖLÜM GEÇİŞ ÇUBUĞU (KONTROLLER AÇIKKEN) --- */
        .okuyucu-hizli-alt-bar {
            position: fixed;
            bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            z-index: 110;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 8px 18px;
            background: rgba(14, 12, 12, 0.92);
            border: 1px solid var(--border-belirgin, #3a3030);
            border-radius: 999px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 12px 32px rgba(0,0,0,0.65), 0 0 16px rgba(224, 52, 60, 0.18);
            animation: hizli-bar-belir 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes hizli-bar-belir {
            from { opacity: 0; transform: translate(-50%, 12px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
        .hizli-bolum-bilgi {
            font-size: .86rem;
            font-weight: 600;
            color: var(--text-ana, #ede7e2);
            white-space: nowrap;
            padding: 0 4px;
        }
        .hizli-btn {
            min-height: 36px;
            padding: 0 14px;
            font-size: .82rem;
            border-radius: 999px;
        }

        /* --- DURUM (yükleniyor / hata / boş) --- */
        .durum-kutusu {
            width: 100%;
            max-width: 480px;
            margin: var(--s4) auto;
            padding: var(--s4) 0;
            text-align: center;
            color: var(--text-ikincil);
        }
        .durum-kutusu h2 { color: var(--text-ana); font-size: 1rem; font-weight: 500; margin-bottom: var(--s1); }
        .durum-kutusu p { max-width: var(--satir-olcu); margin-inline: auto; }
        .durum-ikon { display: flex; justify-content: center; margin-bottom: var(--s2); color: var(--text-ikincil); }
        .durum-ikon svg { width: 32px; height: 32px; }
        .durum-aksiyonlar { display: flex; gap: var(--s2); justify-content: center; flex-wrap: wrap; margin-top: var(--s3); }
        .durum-aksiyonlar .nav-btn { flex: 0 1 auto; min-width: 140px; }

        .uyari-serit {
            width: 100%;
            max-width: 800px;
            margin: 0 0 var(--s2);
            padding: 0 0 var(--s2);
            border-bottom: 1px solid var(--border-renk);
            color: var(--text-ikincil);
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: var(--s2);
            flex-wrap: wrap;
        }
        .uyari-serit svg { width: 20px; height: 20px; flex-shrink: 0; }
        .uyari-serit .uyari-metin { flex: 1 1 240px; max-width: var(--satir-olcu); }
        .uyari-serit .btn-aksiyon { color: var(--text-ana); text-decoration: underline; padding: 0; }

        .spinner {
            width: 24px;
            height: 24px;
            margin: 0 auto var(--s2);
            border-radius: 50%;
            border: 1.5px solid var(--border-renk);
            border-top-color: var(--text-ikincil);
            animation: don 0.8s linear infinite;
        }
        @keyframes don { to { transform: rotate(360deg); } }

        /* --- KAGE-95 BÖLÜM SONU KARTI --- */
        .bolum-sonu {
            width: 100%;
            max-width: var(--okuma-genislik, 800px);
            margin: var(--s4) auto var(--s2);
            padding: 0 4px;
        }
        .k95-bs-kart {
            position: relative;
            overflow: hidden;
            background: linear-gradient(175deg, rgba(28, 20, 22, 0.96) 0%, rgba(14, 12, 12, 0.98) 100%);
            border: 1px solid rgba(224, 52, 60, 0.28);
            border-top: 2px solid var(--vurgu-parlak, #e0343c);
            border-radius: 16px;
            padding: 34px 22px 28px;
            text-align: center;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65), 0 0 28px rgba(224, 52, 60, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .k95-bs-kart::before {
            content: '完';
            position: absolute;
            right: -10px;
            bottom: -22px;
            font-size: 130px;
            font-family: var(--font-kanji, "Hiragino Mincho ProN", "Yu Mincho", serif);
            color: rgba(224, 52, 60, 0.05);
            pointer-events: none;
            line-height: 1;
            user-select: none;
        }
        .k95-bs-rozet {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(224, 52, 60, 0.25) 0%, rgba(142, 14, 21, 0.08) 70%);
            border: 1px solid rgba(224, 52, 60, 0.45);
            color: var(--vurgu-parlak, #e0343c);
            font-size: 1.4rem;
            font-family: var(--font-kanji, serif);
            box-shadow: 0 0 18px rgba(224, 52, 60, 0.35);
            margin-bottom: 12px;
        }
        .k95-bs-etiket {
            font-size: 0.74rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--vurgu-parlak, #e0343c);
            margin-bottom: 6px;
        }
        .k95-bs-baslik {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-ana, #ede7e2);
            margin: 0 0 8px;
            letter-spacing: -0.3px;
        }
        .k95-bs-aciklama {
            font-size: 0.9rem;
            color: var(--text-ikincil, #b3a7a1);
            max-width: 520px;
            margin: 0 auto 22px;
            line-height: 1.5;
        }
        .k95-bs-aksiyonlar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .k95-bs-ana-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 360px;
            min-height: 44px;
            padding: 0 24px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, #8e0e15 0%, #b81720 50%, #e0343c 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(224, 52, 60, 0.45);
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease, filter 0.2s;
            text-decoration: none;
        }
        .k95-bs-ana-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 26px rgba(224, 52, 60, 0.65);
            filter: brightness(1.08);
        }
        .k95-bs-ana-btn:active {
            transform: scale(0.97);
        }
        .k95-bs-ikincil-grup {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            width: 100%;
            max-width: 520px;
        }
        .k95-bs-ikinci-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            font-size: 0.84rem;
            font-weight: 500;
            color: var(--text-ana, #ede7e2);
            background: rgba(30, 24, 25, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.15s ease;
        }
        .k95-bs-ikinci-btn:hover {
            background: rgba(224, 52, 60, 0.15);
            border-color: rgba(224, 52, 60, 0.4);
            color: #ffffff;
            transform: translateY(-1px);
        }
        .k95-bs-ikinci-btn:active {
            transform: scale(0.96);
        }

        /* --- YÜZEN SAYFA GÖSTERGESİ (FLOATING PAGE PILL) --- */
        .okuyucu-yuzen-sayfa {
            position: fixed;
            left: 50%;
            transform: translateX(-50%) translateY(12px) scale(0.95);
            bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            z-index: 95;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 16px;
            background: rgba(14, 12, 12, 0.88);
            border: 1px solid rgba(224, 52, 60, 0.35);
            border-radius: 999px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65), 0 0 16px rgba(224, 52, 60, 0.2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-ana, #ede7e2);
            letter-spacing: 0.4px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), bottom 0.2s ease;
            user-select: none;
        }
        .okuyucu-yuzen-sayfa.gorunur {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
        }
        .okuyucu-yuzen-sayfa.bar-acik {
            bottom: calc(74px + env(safe-area-inset-bottom, 0px));
        }
        .okuyucu-yuzen-sayfa .oys-nokta {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--vurgu-parlak, #e0343c);
            box-shadow: 0 0 8px var(--vurgu-parlak, #e0343c);
            display: inline-block;
        }
        .okuyucu-yuzen-sayfa .oys-mevcut {
            color: #ffffff;
            font-variant-numeric: tabular-nums;
        }
        .okuyucu-yuzen-sayfa .oys-bolu {
            color: var(--text-ikincil, #888);
            font-size: 0.75rem;
        }
        .okuyucu-yuzen-sayfa .oys-toplam {
            color: var(--text-ikincil, #b3a7a1);
            font-variant-numeric: tabular-nums;
        }
        @media (max-width: 640px) {
            .okuyucu-yuzen-sayfa {
                padding: 5px 13px;
                font-size: 0.78rem;
                bottom: calc(18px + env(safe-area-inset-bottom, 0px));
            }
            .k95-bs-kart {
                padding: 26px 16px 22px;
            }
            .k95-bs-baslik {
                font-size: 1.1rem;
            }
        }

        /* --- YORUMLAR --- */
        .yorumlar-bolumu {
            max-width: 640px;
            width: 100%;
            margin: var(--s4) auto;
            user-select: auto;
        }
        .bolum-puan { margin: 0 0 var(--s3); padding-bottom: var(--s2); border-bottom: 1px solid var(--border-renk); }

        @media (prefers-reduced-motion: reduce) {
            .reader-header, .okuma-ilerleme > span, .btn-geri, .btn-aksiyon, .nav-btn, .ayar-kucuk-btn,
            .bolum-secici { transition: none; }
            .ayar-perde, .sayfa-gorsel-kapsayici .manga-sayfasi { animation: none !important; }
            .spinner { animation-duration: 2.4s; }
        }

        /* --- Safe-area (çentik / yatay mod) --- */
        .reader-header { padding-left: max(var(--s3), env(safe-area-inset-left)); padding-right: max(var(--s3), env(safe-area-inset-right)); padding-top: max(var(--s1), env(safe-area-inset-top)); }
        .reader-alani { padding-left: max(var(--s2), env(safe-area-inset-left)); padding-right: max(var(--s2), env(safe-area-inset-right)); padding-bottom: max(var(--s4), calc(var(--s3) + env(safe-area-inset-bottom))); }
        .yorum-textarea, .bolum-secici { font-size: 1rem; }
        .yorum-textarea { scroll-margin-block: 120px; }
        html { -webkit-text-size-adjust: 100%; }

        /* Dokunmatik (tablet dahil): hedefler en az 44px */
        @media (pointer: coarse) {
            .btn-geri, .btn-aksiyon, .nav-btn, .yorum-gonder-btn, .bolum-secici, .ayar-kucuk-btn { min-height: 44px; min-width: 44px; }
            .yorum-uyari a { display: inline-block; padding: 14px 4px; margin: -14px 0; }
        }

        /* Kısa ekran (yatay telefon): üst çubuk sayfayla kayar, kompakt; sayfa genişliğe oturur */
        @media (max-height: 500px) {
            .reader-header { position: relative; transform: none !important; padding-top: max(4px, env(safe-area-inset-top)); padding-bottom: 4px; gap: 0 var(--s2); }
            .manga-baslik-alani { flex: 1 1 200px; }
            .manga-sayfasi { max-height: none; }
            .reader-alani { padding-top: var(--s1); }
            .btn-geri, .btn-aksiyon, .nav-btn, .yorum-gonder-btn, .bolum-secici, .ayar-kucuk-btn { min-height: 44px; min-width: 44px; }
        }

        /* Mobil: üst çubuk statik kalır (sayfayla birlikte kayar) */
        @media (max-width: 640px) {
            .reader-header {
                position: relative;
                z-index: 100;
                transform: none !important;
                padding-left: max(var(--s2), env(safe-area-inset-left));
                padding-right: max(var(--s2), env(safe-area-inset-right));
                flex-direction: column;
                align-items: stretch;
                gap: 0;
            }
            .ayar-perde { align-items: flex-end; padding: 0; }
            .ayar-modal { max-width: none; max-height: 88dvh; border-radius: 12px 12px 0 0; border-bottom: 0; padding-bottom: env(safe-area-inset-bottom); }
            .ayar-modal-govde { padding-left: max(var(--s2), env(safe-area-inset-left)); padding-right: max(var(--s2), env(safe-area-inset-right)); }
            .ayar-kaydirici { min-height: 44px; }
            .btn-geri, .btn-aksiyon, .nav-btn, .yorum-gonder-btn, .bolum-secici, .ayar-kucuk-btn { min-height: 44px; min-width: 44px; }
            .header-sol, .header-sag { width: 100%; gap: 0; }
            .header-sol { flex-wrap: nowrap; }
            .header-sol .btn-geri { padding: 0 var(--s1) 0 0; white-space: nowrap; }
            .header-sol .btn-aksiyon { padding: 0 var(--s1); flex: none; }
            .header-sol .bolum-secici { flex: 1 1 0; min-width: 72px; margin: 0 var(--s1); text-overflow: ellipsis; }
            .header-sag { flex-wrap: nowrap; justify-content: flex-end; gap: 4px; }
            .header-sag .btn-aksiyon { padding: 0 var(--s1); white-space: nowrap; font-size: 0.85rem; }
            .header-sag .btn-ayar { flex: 1 1 auto; border-color: var(--border-renk); }
            .manga-baslik-alani { order: -1; text-align: left; flex: none; padding: 2px 0 0; }
            .manga-baslik-alani h1 { font-size: 1.05rem; }
            .reader-alani { padding-top: var(--s2); padding-left: max(var(--s1), env(safe-area-inset-left)); padding-right: max(var(--s1), env(safe-area-inset-right)); }
            .webtoon-kapsayici { width: calc(100% + 16px); max-width: none; margin: 0 -8px; }
            .navigasyon-cubugu { gap: var(--s1); }
            .nav-btn { padding: 0 var(--s2); }
            .yorum-gonder-satir { flex-direction: column; align-items: stretch; }
            .yorumlar-bolumu { margin-top: var(--s3); padding: 0 var(--s1); }
            .uyari-serit .btn-aksiyon { display: inline-flex; align-items: center; min-height: 44px; }
            .kisayol-bilgi { display: none; }
            .okuma-ek-eylemler { justify-content: center; }
            .okuma-ek-eylemler button:nth-of-type(2) { display: none; }
            .bolum-sonu-ctalar .nav-btn { flex: 1 1 130px; }
            .durum-aksiyonlar .nav-btn { flex: 1 1 140px; }
        }
        @media (hover: none) { .sayfa-tiklama-bolgesi { cursor: default; } .tiklama-sol, .tiklama-sag { cursor: default; } }

        ::selection { background: var(--vurgu-rengi); color: #fff; }
        html { scrollbar-color: var(--kaydirma, #3a3232) var(--bg-okuyucu); scrollbar-width: thin; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-okuyucu); }
        ::-webkit-scrollbar-thumb { background: var(--kaydirma, #3a3232); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--vurgu-rengi); }
    
        /* iOS zoom önlemi: mobilde form alanları en az 16px */
        @media (max-width: 768px) {
            input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]), select, textarea { font-size: 16px !important; }
        }
    </style>

</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const API = (window.KAGE95_API_URL || 'http://localhost:5034/api').replace(/\/$/, '');
        const KAYMA_ORANI = 0.45;       // tek dokunuşta kayma miktarı

        // --- Yardımcılar ---
        const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
        const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

        // login.html henüz token yazmıyor; olası anahtarları ve JSON kullanıcı nesnesini dener.
        const tokenAl = () => {
            for (const k of ['kage95_token', 'token', 'jwt', 'authToken', 'kage95_jwt']) {
                const v = lsGet(k);
                if (v) return v.replace(/^"|"$/g, '');
            }
            for (const k of ['kage95_user', 'kage95_kullanici', 'user']) {
                try {
                    const o = JSON.parse(lsGet(k) || 'null');
                    if (o && (o.token || o.Token)) return o.token || o.Token;
                } catch (e) {}
            }
            return null;
        };

        // Bağımsız yıldız bileşeni (js/puan.js) için ince React sarmalayıcı.
        const PuanKutu = ({ url, etiket }) => {
            const ref = React.useRef(null);
            React.useEffect(() => {
                if (!ref.current || !window.Kage95Puan) return;
                const h = window.Kage95Puan.baslat(ref.current, { url, etiket, token: tokenAl });
                return () => h.yoksay();
            }, [url]);
            return <div ref={ref}></div>;
        };

        const apiGet = async (yol) => {
            const r = await fetch(API + yol);
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
        };

        // Kendi ürettiğimiz yer tutucu sayfa (SVG data-URI)
        // Bölüm adı zaten "Bölüm N: ..." ile başlıyorsa tekrarlanmasın.
        const temizAd = (ad, no) => {
            if (!ad) return '';
            return String(ad).replace(new RegExp('^\\s*Bölüm\\s*' + String(no).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?!\\d)\\s*[:\\-–.]?\\s*', 'i'), '').trim();
        };
        const yerTutucu = (n, toplam) => {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200">
<rect width="800" height="1200" fill="#171313"/><rect x="30" y="30" width="740" height="1140" fill="none" stroke="#3a3232" stroke-width="2"/>
<rect x="70" y="80" width="660" height="420" fill="#221b1b"/><rect x="70" y="540" width="320" height="300" fill="#221b1b"/><rect x="410" y="540" width="320" height="300" fill="#221b1b"/><rect x="70" y="880" width="660" height="250" fill="#221b1b"/>
<text x="400" y="620" text-anchor="middle" font-family="Arial" font-size="40" fill="#9ca3af">Örnek sayfa</text>
<text x="400" y="680" text-anchor="middle" font-family="Arial" font-size="120" font-weight="400" fill="#8f8782">${n}</text>
<text x="400" y="740" text-anchor="middle" font-family="Arial" font-size="30" fill="#6b7280">/ ${toplam}</text></svg>`;
            return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        };
        const ORNEK_SAYFALAR = [1, 2, 3].map((n) => yerTutucu(n, 3));

        // Sade çizgi ikonlar (currentColor, 1.5px)
        const Ikon = ({ ad }) => {
            const yollar = {
                solOk: <path d="M15 5l-7 7 7 7" />,
                sagOk: <path d="M9 5l7 7-7 7" />,
                uyari: <><path d="M12 3 2.5 20h19L12 3z" /><path d="M12 10v5M12 17.5v.5" /></>,
                bos: <><rect x="4" y="3" width="16" height="18" rx="1" /><path d="M8 15l3-3 2 2 3-4M9 8h.01" /></>,
                yorum: <><path d="M4 5h16v11H9l-5 4V5z" /><path d="M8 9h8M8 12h5" /></>
            };
            return (
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" focusable="false">
                    {yollar[ad]}
                </svg>
            );
        };

        const OkumaSayfasi = () => {
            const params = new URLSearchParams(window.location.search);
            const mangaIdParam = parseInt(params.get('id') || '', 10);
            const bolumIdParam = parseInt(params.get('chapter') || '', 10);

            const [bolumId, setBolumId] = React.useState(Number.isFinite(bolumIdParam) ? bolumIdParam : null);
            const [veri, setVeri] = React.useState(null);          // /chapters/{id}/pages yanıtı
            const [bolumler, setBolumler] = React.useState([]);     // bölüm seçici
            const [durum, setDurum] = React.useState('yukleniyor'); // yukleniyor | hata | hazir | bos | demo
            const [hataMesaji, setHataMesaji] = React.useState('');
            const [yenile, setYenile] = React.useState(0);

            const [sayfaIndex, setSayfaIndex] = React.useState(0);
            const [okumaModu, setOkumaModu] = React.useState(() =>
                lsGet('kage95_okumaModu') ||
                (window.matchMedia && window.matchMedia('(max-width: 640px)').matches ? 'webtoon' : 'klasik'));

            const sayfalar = durum === 'hazir' && veri ? veri.sayfalar
                : (durum === 'demo' || durum === 'bos') ? ORNEK_SAYFALAR : [];
            const mangaId = veri ? veri.mangaId : (Number.isFinite(mangaIdParam) ? mangaIdParam : null);
            const yerTutucuMu = durum === 'demo' || durum === 'bos';

            // --- Bölüm yükleme ---
            React.useEffect(() => {
                let iptal = false;
                const calistir = async () => {
                    setDurum('yukleniyor'); setHataMesaji(''); setVeri(null);
                    try {
                        let id = bolumId;
                        if (id == null && Number.isFinite(mangaIdParam)) {
                            const manga = await apiGet('/mangas/' + mangaIdParam);
                            const liste = (manga.bolumler || []).slice().sort((a, b) => a.bolumNo - b.bolumNo);
                            if (iptal) return;
                            setBolumler(liste);
                            if (!liste.length) { setDurum('bos'); return; }
                            id = liste[0].id;
                            setBolumId(id);
                            return; // bolumId değişince efekt yeniden çalışır
                        }
                        if (id == null) { setDurum('demo'); return; }

                        const d = await apiGet('/chapters/' + id + '/pages');
                        if (iptal) return;
                        setVeri(d);
                        const kayit = parseInt(lsGet('kage95_sayfa_bolum_' + id) || '0', 10);
                        const adet = (d.sayfalar || []).length;
                        setSayfaIndex(kayit >= 0 && kayit < adet ? kayit : 0);
                        setDurum(adet ? 'hazir' : 'bos');
                        document.title = `${d.mangaAdi} - Bölüm ${d.bolumNo} | Kage 95`;
                    } catch (e) {
                        if (iptal) return;
                        setHataMesaji(e && e.message && e.message.indexOf('404') > -1
                            ? 'Bu bölüm bulunamadı.'
                            : 'Sunucuya ulaşılamadı. API çalışıyor mu?');
                        setDurum('hata');
                    }
                };
                calistir();
                return () => { iptal = true; };
            }, [bolumId, yenile]);

            // Bölüm listesi (seçici) — hata olursa sessizce geç
            React.useEffect(() => {
                if (!veri || veri.mangaId == null) return;
                if (bolumler.length && bolumler.some((b) => b.id === veri.bolumId)) return;
                let iptal = false;
                apiGet('/mangas/' + veri.mangaId).then((m) => {
                    if (iptal) return;
                    setBolumler((m.bolumler || []).slice().sort((a, b) => a.bolumNo - b.bolumNo));
                }).catch(() => {});
                return () => { iptal = true; };
            }, [veri && veri.mangaId]);

            const modDegistir = (m) => { setOkumaModu(m); lsSet('kage95_okumaModu', m); if (m !== 'webtoon') setOtoKaydir(false); };

            // --- Sayfa genişliği ve otomatik kaydırma ---
            const GENISLIKLER = { dar: '720px', normal: '960px', genis: '1240px', tam: '100%' };
            const [genislik, setGenislik] = React.useState(() => {
                const g = lsGet('kage95_genislik') || 'normal';
                return GENISLIKLER[g] ? g : 'normal';
            });
            React.useEffect(() => {
                document.documentElement.style.setProperty('--okuma-genislik', GENISLIKLER[genislik] || '960px');
                lsSet('kage95_genislik', genislik);
            }, [genislik]);

            const [otoKaydir, setOtoKaydir] = React.useState(false);
            const [otoHiz, setOtoHiz] = React.useState(() => {
                const h = parseInt(lsGet('kage95_otoHiz') || '2', 10);
                return [1, 2, 3, 4].includes(h) ? h : 2;
            });
            React.useEffect(() => { lsSet('kage95_otoHiz', String(otoHiz)); }, [otoHiz]);
            React.useEffect(() => {
                if (!otoKaydir || okumaModu !== 'webtoon') return;
                let raf = null, sonZaman = performance.now();
                const adim = (simdi) => {
                    const dt = Math.min(64, simdi - sonZaman);
                    sonZaman = simdi;
                    const maks = document.documentElement.scrollHeight - window.innerHeight;
                    if (window.scrollY >= maks - 2) { setOtoKaydir(false); return; }
                    window.scrollBy(0, (otoHiz * 45 * dt) / 1000);
                    raf = requestAnimationFrame(adim);
                };
                raf = requestAnimationFrame(adim);
                return () => { if (raf) cancelAnimationFrame(raf); };
            }, [otoKaydir, otoHiz, okumaModu]);

            // --- Parlaklık (gece okuma) ---
            const [parlaklik, setParlaklik] = React.useState(() => {
                const v = parseInt(lsGet('kage95_parlaklik') || '100', 10);
                return Number.isFinite(v) ? Math.min(100, Math.max(40, v)) : 100;
            });
            React.useEffect(() => {
                document.documentElement.style.setProperty('--parlaklik', String(parlaklik / 100));
                lsSet('kage95_parlaklik', String(parlaklik));
            }, [parlaklik]);

            // --- Okuma Ayarları penceresi ---
            const [ayarAcik, setAyarAcik] = React.useState(false);
            const ayarDugmeRef = React.useRef(null);
            React.useEffect(() => {
                if (!ayarAcik) return;
                const tus = (e) => {
                    if (e.key === 'Escape') { setAyarAcik(false); return; }
                    if (e.key !== 'Tab') return;
                    // Odak pencerenin içinde kalır
                    const odaklar = document.querySelectorAll('.ayar-modal button, .ayar-modal input');
                    if (!odaklar.length) return;
                    const ilk = odaklar[0], son = odaklar[odaklar.length - 1];
                    const modal = document.querySelector('.ayar-modal');
                    if (modal && !modal.contains(document.activeElement)) { e.preventDefault(); ilk.focus(); }
                    else if (e.shiftKey && document.activeElement === ilk) { e.preventDefault(); son.focus(); }
                    else if (!e.shiftKey && document.activeElement === son) { e.preventDefault(); ilk.focus(); }
                };
                document.addEventListener('keydown', tus);
                const eskiTasma = document.body.style.overflow;
                document.body.style.overflow = 'hidden';
                return () => {
                    document.removeEventListener('keydown', tus);
                    document.body.style.overflow = eskiTasma;
                    if (ayarDugmeRef.current) ayarDugmeRef.current.focus();
                };
            }, [ayarAcik]);

            // Tema (js/tema.js ortak sistemi)
            const temaListe = (window.Kage95Tema && window.Kage95Tema.liste) || [];
            const [tema, setTema] = React.useState(() => (window.Kage95Tema ? window.Kage95Tema.al() : 'kage'));
            React.useEffect(() => {
                const dinle = () => { if (window.Kage95Tema) setTema(window.Kage95Tema.al()); };
                window.addEventListener('kage95-tema', dinle);
                return () => window.removeEventListener('kage95-tema', dinle);
            }, []);
            const temaSec = (id) => { if (window.Kage95Tema) window.Kage95Tema.sec(id); setTema(id); };

            // Sayfa geçiş efekti (klasik / çift)
            const [gecis, setGecis] = React.useState(() => {
                const g = lsGet('kage95_gecis');
                return ['yok', 'solma', 'kayma'].includes(g) ? g : 'solma';
            });
            React.useEffect(() => { lsSet('kage95_gecis', gecis); }, [gecis]);

            const ayarlariSifirla = () => {
                setGenislik('normal'); setParlaklik(100); setGecis('solma'); setOtoHiz(2);
            };

            // --- Yüzen sayfa göstergesi (kaydırma veya sayfa değişiminde belirir) ---
            const [yuzenSayfaGoster, setYuzenSayfaGoster] = React.useState(false);
            const yuzenTimerRef = React.useRef(null);
            const tetikleYuzenSayfa = React.useCallback(() => {
                setYuzenSayfaGoster(true);
                if (yuzenTimerRef.current) clearTimeout(yuzenTimerRef.current);
                yuzenTimerRef.current = setTimeout(() => {
                    setYuzenSayfaGoster(false);
                }, 1600);
            }, []);

            React.useEffect(() => {
                tetikleYuzenSayfa();
            }, [sayfaIndex, tetikleYuzenSayfa]);

            React.useEffect(() => {
                return () => { if (yuzenTimerRef.current) clearTimeout(yuzenTimerRef.current); };
            }, []);

            // --- Üst çubuğu gizle/göster + webtoon kaydırma yüzdesi ---
            const [ustGizli, setUstGizli] = React.useState(false);
            const [kaydirmaOrani, setKaydirmaOrani] = React.useState(0);
            React.useEffect(() => {
                let son = window.scrollY, bekliyor = false;
                const hesapla = () => {
                    bekliyor = false;
                    const y = Math.max(0, window.scrollY);
                    const fark = y - son;
                    if (y <= 64) { setUstGizli(false); son = y; }
                    else if (fark > 8) { setUstGizli(true); son = y; }
                    else if (fark < -8) { setUstGizli(false); son = y; }
                    if (okumaModu === 'webtoon') {
                        const maks = document.documentElement.scrollHeight - window.innerHeight;
                        setKaydirmaOrani(maks > 0 ? Math.min(1, y / maks) : 0);
                    }
                };
                const kaydir = () => {
                    tetikleYuzenSayfa();
                    if (!bekliyor) { bekliyor = true; requestAnimationFrame(hesapla); }
                };
                window.addEventListener('scroll', kaydir, { passive: true });
                window.addEventListener('resize', kaydir);
                document.addEventListener('load', kaydir, true); // görseller yüklenince yükseklik değişir
                kaydir();
                return () => {
                    window.removeEventListener('scroll', kaydir);
                    window.removeEventListener('resize', kaydir);
                    document.removeEventListener('load', kaydir, true);
                };
            }, [okumaModu, durum]);

            // Mobilde sayfaya dokununca üst çubuk açılıp kapanır (immersive okuma)
            const dokunCubuk = () => {
                if (window.matchMedia('(max-width: 768px)').matches) setUstGizli(g => !g);
            };

            // --- Bölüm geçişi ---
            const bolumeGit = (id) => {
                if (id == null) return;
                const url = new URL(window.location.href);
                url.searchParams.set('chapter', id);
                url.searchParams.delete('id');
                try { history.pushState({}, '', url); } catch (e) {}
                setBolumId(id);
                window.scrollTo({ top: 0 });
            };
            React.useEffect(() => {
                const pop = () => {
                    const c = parseInt(new URLSearchParams(window.location.search).get('chapter') || '', 10);
                    if (Number.isFinite(c)) setBolumId(c);
                };
                window.addEventListener('popstate', pop);
                return () => window.removeEventListener('popstate', pop);
            }, []);

            // --- Sayfa kontrolleri (klasik ve çift sayfa) ---
            const sayfaAdimi = okumaModu === 'cift' ? 2 : 1;
            const sonrakiSayfa = React.useCallback(() => {
                if (sayfaIndex < sayfalar.length - 1) {
                    setSayfaIndex((p) => Math.min(sayfalar.length - 1, p + sayfaAdimi));
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            }, [sayfaIndex, sayfalar.length, sayfaAdimi]);
            const oncekiSayfa = React.useCallback(() => {
                if (sayfaIndex > 0) {
                    setSayfaIndex((p) => Math.max(0, p - sayfaAdimi));
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            }, [sayfaIndex, sayfaAdimi]);

            React.useEffect(() => {
                if (okumaModu !== 'klasik' && okumaModu !== 'cift') return;
                const k = (e) => {
                    const t = e.target.tagName;
                    if (t === 'TEXTAREA' || t === 'INPUT' || t === 'SELECT') return;
                    if (document.querySelector('.ayar-perde')) return; // Okuma Ayarları açıkken sayfa çevirme
                    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') sonrakiSayfa();
                    else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') oncekiSayfa();
                };
                window.addEventListener('keydown', k);
                return () => window.removeEventListener('keydown', k);
            }, [okumaModu, sonrakiSayfa, oncekiSayfa]);

            // Klasik / çift sayfa modunda sonraki sayfayı önceden yükle
            React.useEffect(() => {
                if ((okumaModu === 'klasik' || okumaModu === 'cift') && !yerTutucuMu && sayfalar[sayfaIndex + sayfaAdimi]) {
                    const im = new Image(); im.src = sayfalar[sayfaIndex + sayfaAdimi];
                }
            }, [okumaModu, sayfaIndex, sayfalar, sayfaAdimi]);

            // --- Webtoon: görünür sayfayı izle, kayıtlı sayfaya kaydır ---
            const webtoonRef = React.useRef(null);
            const geriYuklendiRef = React.useRef(null);
            React.useEffect(() => {
                if (okumaModu !== 'webtoon' || durum !== 'hazir' || !veri) return;
                const kap = webtoonRef.current;
                if (!kap) return;
                if (geriYuklendiRef.current !== veri.bolumId) {
                    geriYuklendiRef.current = veri.bolumId;
                    const hedef = kap.querySelectorAll('img')[sayfaIndex];
                    if (hedef && sayfaIndex > 0) window.scrollTo({ top: hedef.getBoundingClientRect().top + window.scrollY - 8 });
                }
                let bekliyor = false;
                const hesapla = () => {
                    bekliyor = false;
                    const imgler = kap.querySelectorAll('img');
                    const esik = window.innerHeight * 0.4;
                    let bulunan = imgler.length - 1;
                    for (let i = 0; i < imgler.length; i++) {
                        if (imgler[i].getBoundingClientRect().bottom > esik) { bulunan = i; break; }
                    }
                    setSayfaIndex(bulunan);
                };
                const kaydir = () => { if (!bekliyor) { bekliyor = true; requestAnimationFrame(hesapla); } };
                window.addEventListener('scroll', kaydir, { passive: true });
                return () => window.removeEventListener('scroll', kaydir);
            }, [okumaModu, durum, veri && veri.bolumId]);

            // --- İlerleme kaydı: yerel + (girişliyse) API ---
            React.useEffect(() => {
                if (durum !== 'hazir' || !veri) return;
                lsSet('kage95_sayfa_bolum_' + veri.bolumId, String(sayfaIndex));
                // Seri sayfasindaki "Bolum X'ten devam et" icin: son acilan bolum listenin sonuna yazilir
                try {
                    const tumO = JSON.parse(lsGet('kage95_okunan') || '{}');
                    const lO = (tumO[veri.mangaId] || []).map(String).filter((x) => x !== String(veri.bolumId));
                    lO.push(String(veri.bolumId));
                    tumO[veri.mangaId] = lO;
                    lsSet('kage95_okunan', JSON.stringify(tumO));
                } catch (e) {}
                lsSet('kage95_son_okunan', JSON.stringify({
                    mangaId: veri.mangaId, mangaAdi: veri.mangaAdi, bolumId: veri.bolumId, bolumNo: veri.bolumNo,
                    sayfa: sayfaIndex + 1, toplam: (veri.sayfalar || []).length, zaman: Date.now()
                }));
                const token = tokenAl();
                if (!token) return;
                let t2 = null;
                const gonderIlerleme = () => fetch(API + '/user/progress', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ mangaId: veri.mangaId, bolumId: veri.bolumId, sayfaNo: sayfaIndex + 1 })
                })
                    .then((r) => (r.ok ? r.json() : null))
                    .then((g) => {
                        if (g && window.Kage95Liderlik) window.Kage95Liderlik.yanittan(g);
                        return g;
                    })
                    .catch(() => null);
                const t = setTimeout(() => {
                    gonderIlerleme().then((g) => {
                        const toplam = (veri.sayfalar || []).length;
                        if (toplam > 0 && sayfaIndex + 1 >= toplam && (!g || !g.puanKazanildi)) {
                            const bekleSn = Math.min(toplam * 4, 90);
                            t2 = setTimeout(gonderIlerleme, bekleSn * 1000 + 500);
                        }
                    });
                }, 1500);
                return () => { clearTimeout(t); if (t2) clearTimeout(t2); };
            }, [sayfaIndex, durum, veri && veri.bolumId]);

            // --- Tam ekran ---
            const tamEkranVar = !!document.documentElement.requestFullscreen;
            const toggleTamEkran = () => {
                if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
                else document.exitFullscreen().catch(() => {});
            };

            // --- ÖZEL: yalnızca webtoon modunda sayfa görseline tek dokunuşla %30 aşağı kaydır ---
            React.useEffect(() => {
                if (okumaModu !== 'webtoon') return;
                let zamanlayici = null;
                const tikla = (e) => {
                    if (e.button !== undefined && e.button !== 0) return;
                    if (!e.target.classList || !e.target.classList.contains('webtoon-sayfasi')) return;
                    if (e.detail > 1) { clearTimeout(zamanlayici); zamanlayici = null; return; } // çift tık
                    if (window.getSelection && window.getSelection().toString()) return;
                    clearTimeout(zamanlayici);
                    // Çift dokunuşu ayırt etmek için kısa bekleme
                    zamanlayici = setTimeout(() => {
                        zamanlayici = null;
                        if (window.getSelection && window.getSelection().toString()) return;
                        window.scrollBy({ top: window.innerHeight * KAYMA_ORANI, behavior: 'smooth' });
                    }, 280);
                };
                const ciftTik = () => { clearTimeout(zamanlayici); zamanlayici = null; };
                document.addEventListener('click', tikla);
                document.addEventListener('dblclick', ciftTik);
                return () => {
                    document.removeEventListener('click', tikla);
                    document.removeEventListener('dblclick', ciftTik);
                    clearTimeout(zamanlayici);
                };
            }, [okumaModu]);

            // --- Yorumlar --- (js/yorum.js ortak aracı çizer)
            const yorumBolumId = veri ? veri.bolumId : null;

            // --- Görünüm parçaları ---
            const onceki = veri ? veri.oncekiBolumId : null;
            const sonraki = veri ? veri.sonrakiBolumId : null;
            const gorselHata = (e, i) => {
                if (e.currentTarget.dataset.hata) return;
                e.currentTarget.dataset.hata = '1';
                e.currentTarget.src = yerTutucu(i + 1, sayfalar.length);
            };
            const baslik = veri ? veri.mangaAdi : (yerTutucuMu ? 'Örnek Seri (yer tutucu)' : 'Okuma Ekranı');
            const altBaslik = veri

                : (yerTutucuMu ? `Sayfa ${sayfaIndex + 1} / ${sayfalar.length}` : '');

            const ilerlemeOrani = okumaModu === 'webtoon'

            const bolumSecici = (
                <select

                >
                    {!bolumler.length && <option value="">{veri ? `Bölüm ${veri.bolumNo}` : 'Bölüm'}</option>}

                        <option key={b.id} value={b.id}>
                            Bölüm {b.bolumNo}{temizAd(b.bolumAdi, b.bolumNo) ? ': ' + temizAd(b.bolumAdi, b.bolumNo) : ''}
                        </option>
