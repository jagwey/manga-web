                </select>
            );

            // --- Dost ozellikler: kisayol yardimi, baglanti kopyala, yukari cik ---
            const [kisayolAcik, setKisayolAcik] = React.useState(false);
            const [yukariGoster, setYukariGoster] = React.useState(false);
            const [kopyaMesaj, setKopyaMesaj] = React.useState('');
            React.useEffect(() => {
                const f = () => setYukariGoster(window.scrollY > 600);
                f();
                window.addEventListener('scroll', f, { passive: true });
                return () => window.removeEventListener('scroll', f);
            }, []);
            React.useEffect(() => {
                const k = (e) => {
                    const t = e.target.tagName;
                    if (t === 'TEXTAREA' || t === 'INPUT' || t === 'SELECT') return;
                    if (document.querySelector('.ayar-perde')) return;
                    if (e.key === '?') { e.preventDefault(); setKisayolAcik((a) => !a); }
                    else if ((e.key === 'o' || e.key === 'O') && okumaModu === 'webtoon') { e.preventDefault(); setOtoKaydir((a) => !a); }
                    else if (e.key === 'Escape') { setKisayolAcik(false); setOtoKaydir(false); }
                };
                window.addEventListener('keydown', k);
                return () => window.removeEventListener('keydown', k);
            }, []);
            const baglantiKopyala = () => {
                const url = window.location.href;
                const bitti = (ok) => setKopyaMesaj(ok ? 'Bağlantı kopyalandı.' : 'Kopyalanamadı; adresi adres çubuğundan kopyalayın.');
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(url).then(() => bitti(true), () => bitti(false));
                    return;
                }
                try {
                    const t = document.createElement('textarea');
                    t.value = url; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
                    document.body.appendChild(t); t.select();
                    const ok = document.execCommand('copy');
                    document.body.removeChild(t);
                    bitti(ok);
                } catch (e) { bitti(false); }
            };

            const sonrakiBolumObj = React.useMemo(() => (bolumler || []).find((b) => b.id === sonraki), [bolumler, sonraki]);
            const oncekiBolumObj = React.useMemo(() => (bolumler || []).find((b) => b.id === onceki), [bolumler, onceki]);

            const bolumSonu = (
                <div className="bolum-sonu">
                    <div className="k95-bs-kart">
                        <div className="k95-bs-rozet" aria-hidden="true">完</div>
                        <div className="k95-bs-etiket">Bölüm Tamamlandı</div>
                        <h3 className="k95-bs-baslik">{veri ? veri.mangaAdi : (yerTutucuMu ? 'Örnek Seri' : 'Manga')}</h3>
                        <p className="k95-bs-aciklama">
                            {sonraki
                                ? (sonrakiBolumObj && sonrakiBolumObj.baslik
                                    ? `Sırada Bölüm ${sonrakiBolumObj.bolumNo}: "${sonrakiBolumObj.baslik}" seni bekliyor.`
                                    : 'Sıradaki bölüme geçerek maceraya kaldığın yerden devam edebilirsin.')
                                : 'Tebrikler, yayınlanmış en son bölüme ulaştın! Yeni bölümler eklendiğinde ilk okuyan sen ol.'}
                        </p>
                        <div className="k95-bs-aksiyonlar">
                            {sonraki && (
                                <button className="k95-bs-ana-btn" onClick={() => bolumeGit(sonraki)}>
                                    <span>Sonraki Bölüm {sonrakiBolumObj ? `(Bölüm ${sonrakiBolumObj.bolumNo})` : ''}</span>
                                    <span aria-hidden="true">→</span>
                                </button>
                            )}
                            <div className="k95-bs-ikincil-grup">
                                {onceki && (
                                    <button className="k95-bs-ikinci-btn" onClick={() => bolumeGit(onceki)}>
                                        ← Önceki {oncekiBolumObj ? `(Bölüm ${oncekiBolumObj.bolumNo})` : 'Bölüm'}
                                    </button>
                                )}
                                {mangaId && (
                                    <a href={`manga.html?id=${mangaId}`} className="k95-bs-ikinci-btn">
                                        <Ikon ad="kitap" /> Seri Detayı
                                    </a>
                                )}
                                <button className="k95-bs-ikinci-btn" onClick={() => {
                                    const y = document.querySelector('.yorumlar-bolumu');
                                    if (y) y.scrollIntoView({ behavior: 'smooth' });
                                }}>
                                    💬 Yorumlar
                                </button>
                                <button className="k95-bs-ikinci-btn" onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}>
                                    ↑ Başa Dön
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );

            return (
                <div>
                    <a href="#ana-icerik" className="atla-link" onClick={(e) => { e.preventDefault(); const m = document.getElementById('ana-icerik'); if (m) m.focus(); }}>Ana içeriğe atla</a>

                    <header className={'reader-header' + (ustGizli && !ayarAcik ? ' gizli' : '')} role="banner">
                        <div className="header-sol">
                            <a href="index.html" className="btn-geri" aria-label="Ana Sayfaya Geri Dön">Ana sayfa</a>
                            {bolumSecici}
                            <button className="btn-aksiyon" disabled={!onceki} onClick={() => bolumeGit(onceki)} aria-label="Önceki bölüm" title="Önceki bölüm"><Ikon ad="solOk" /></button>
                            <button className="btn-aksiyon" disabled={!sonraki} onClick={() => bolumeGit(sonraki)} aria-label="Sonraki bölüm" title="Sonraki bölüm"><Ikon ad="sagOk" /></button>
                        </div>

                        <div className="manga-baslik-alani">
                            <h1>{baslik}</h1>
                            <span>{altBaslik}</span>
                        </div>

                        <div className="header-sag">
                            {tamEkranVar && (
                                <button className="btn-aksiyon" onClick={toggleTamEkran} title="Tam Ekran" aria-label="Tam Ekran Aç/Kapat">Tam ekran</button>
                            )}
                            <button
                                ref={ayarDugmeRef}
                                type="button"
                                className={`btn-aksiyon btn-ayar ${ayarAcik ? 'aktif' : ''}`}
                                onClick={() => setAyarAcik(true)}
                                title="Okuma Ayarları"
                                aria-label="Okuma Ayarları"
                                aria-haspopup="dialog"
                            >Okuma Ayarları</button>
                        </div>
                    </header>

                    {ayarAcik && (
                        <div className="ayar-perde" onMouseDown={(e) => { if (e.target === e.currentTarget) setAyarAcik(false); }}>
                            <div className="ayar-modal" role="dialog" aria-modal="true" aria-labelledby="ayar-baslik">
                                <div className="ayar-modal-ust">
                                    <h2 id="ayar-baslik">Okuma Ayarları</h2>
                                    <button type="button" className="btn-aksiyon" onClick={() => setAyarAcik(false)} aria-label="Ayarları kapat" autoFocus>Kapat</button>
                                </div>
                                <div className="ayar-modal-govde">
                                    <section className="ayar-bolum">
                                        <span className="ayar-grup-etiket">Okuma yönü</span>
                                        <div className="ayar-buton-satir">
                                            {[['klasik', 'Yatay (tek sayfa)'], ['cift', 'Yatay (çift sayfa)'], ['webtoon', 'Dikey (webtoon)']].map(([k, ad]) => (
                                                <button key={k} type="button" className={`ayar-kucuk-btn ${okumaModu === k ? 'aktif' : ''}`} aria-pressed={okumaModu === k} onClick={() => modDegistir(k)}>{ad}</button>
                                            ))}
                                        </div>
                                    </section>

                                    {temaListe.length > 0 && (
                                        <section className="ayar-bolum">
                                            <span className="ayar-grup-etiket">Tema</span>
                                            <div className="ayar-buton-satir">
                                                {temaListe.map((t) => (
                                                    <button key={t.id} type="button" className={`ayar-kucuk-btn ayar-tema-btn ${tema === t.id ? 'aktif' : ''}`} aria-pressed={tema === t.id} onClick={() => temaSec(t.id)} title={t.not || t.ad}>
                                                        <i className="tema-nokta" style={{ background: t.zemin || t.renk, borderColor: t.renk }} aria-hidden="true"></i>{t.ad}
                                                    </button>
                                                ))}
                                            </div>
                                        </section>
                                    )}

                                    {okumaModu !== 'webtoon' && (
                                        <section className="ayar-bolum">
                                            <span className="ayar-grup-etiket">Sayfa geçiş efekti</span>
                                            <div className="ayar-buton-satir">
                                                {[['yok', 'Yok'], ['solma', 'Solma'], ['kayma', 'Kayma']].map(([k, ad]) => (
                                                    <button key={k} type="button" className={`ayar-kucuk-btn ${gecis === k ? 'aktif' : ''}`} aria-pressed={gecis === k} onClick={() => setGecis(k)}>{ad}</button>
                                                ))}
                                            </div>
                                        </section>
                                    )}

                                    <section className="ayar-bolum">
                                        <span className="ayar-grup-etiket">Sayfa genişliği</span>
                                        <div className="ayar-buton-satir">
                                            {[['dar', 'Dar'], ['normal', 'Normal'], ['genis', 'Geniş'], ['tam', 'Tam']].map(([k, ad]) => (
                                                <button key={k} type="button" className={`ayar-kucuk-btn ${genislik === k ? 'aktif' : ''}`} aria-pressed={genislik === k} onClick={() => setGenislik(k)}>{ad}</button>
                                            ))}
                                        </div>
                                    </section>

                                    <section className="ayar-bolum">
                                        <label className="ayar-grup-etiket" htmlFor="parlaklik-kaydirici">Parlaklık <b>%{parlaklik}</b></label>
                                        <input
                                            id="parlaklik-kaydirici"
                                            className="ayar-kaydirici"
                                            type="range"
                                            min="40"
                                            max="100"
                                            step="5"
                                            value={parlaklik}
                                            onChange={(e) => setParlaklik(parseInt(e.target.value, 10))}
                                        />
                                    </section>

                                    {okumaModu === 'webtoon' && (
                                        <section className="ayar-bolum">
                                            <span className="ayar-grup-etiket">Otomatik kaydırma (kısayol: O)</span>
                                            <div className="ayar-buton-satir">
                                                <button type="button" className={`ayar-kucuk-btn ${otoKaydir ? 'aktif' : ''}`} onClick={() => { setOtoKaydir((a) => !a); setAyarAcik(false); }}>{otoKaydir ? 'Durdur' : 'Başlat'}</button>
                                                {[1, 2, 3, 4].map((h) => (
                                                    <button key={h} type="button" className={`ayar-kucuk-btn ${otoHiz === h ? 'aktif' : ''}`} aria-pressed={otoHiz === h} onClick={() => setOtoHiz(h)}>{h}x</button>
                                                ))}
                                            </div>
                                        </section>
                                    )}

                                    <button type="button" className="ayar-sifirla" onClick={ayarlariSifirla}>Varsayılanlara dön</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <main className={`reader-alani ${okumaModu === 'cift' ? 'mod-cift' : ''} gecis-${gecis}`} role="main" id="ana-icerik" tabIndex={-1}>
                        {durum === 'yukleniyor' && (
                            <div className="durum-kutusu" role="status">
                                <div className="spinner"></div>
                                <h2>Bölüm yükleniyor...</h2>
                            </div>
                        )}

                        {durum === 'hata' && (
                            <div className="durum-kutusu" role="alert">
                                <div className="durum-ikon"><Ikon ad="uyari" /></div>
                                <h2>Bölüm açılamadı</h2>
                                <p>{hataMesaji}</p>
                                <div className="durum-aksiyonlar">
                                    <button className="nav-btn" onClick={() => setYenile((n) => n + 1)}>Tekrar dene</button>
                                    <a className="nav-btn" href="index.html">Ana sayfaya dön</a>
                                </div>
                            </div>
                        )}

                        {(durum === 'hazir' || durum === 'bos' || durum === 'demo') && (
                            <>
                                {durum === 'bos' && (
                                    <div className="uyari-serit">
                                        <Ikon ad="bos" />
                                        <span className="uyari-metin">Bu bölümde henüz sayfa yok; örnek yer tutucu sayfalar gösteriliyor.</span>
                                        <a className="btn-aksiyon" href="index.html">Ana sayfaya dön</a>
                                    </div>
                                )}
                                {durum === 'demo' && (
                                    <div className="uyari-serit">
                                        <Ikon ad="bos" />
                                        <span className="uyari-metin">Bölüm belirtilmedi (<code>?chapter=</code> veya <code>?id=</code>); örnek yer tutucu sayfalar gösteriliyor.</span>
                                        <a className="btn-aksiyon" href="index.html">Ana sayfaya dön</a>
                                    </div>
                                )}

                                {(okumaModu === 'klasik' || okumaModu === 'cift') ? (
                                    <div className="klasik-kapsayici">
                                        <div className="sayfa-gorsel-kapsayici" aria-label="Manga Sayfası">
                                            <div className="sayfa-tiklama-bolgesi tiklama-sol" onClick={oncekiSayfa} title="Önceki Sayfa (Sol Ok)"></div>
                                            <div className="sayfa-tiklama-bolgesi tiklama-sag" onClick={sonrakiSayfa} title="Sonraki Sayfa (Sağ Ok)"></div>
                                            {okumaModu === 'cift' && sayfalar[sayfaIndex + 1] ? (
                                                <div className="cift-sayfa-satir">
                                                    <img
                                                        key={sayfaIndex}
                                                        src={sayfalar[sayfaIndex]}
                                                        alt={`Sayfa ${sayfaIndex + 1}`}
                                                        className="manga-sayfasi"
                                                        decoding="async"
                                                        onError={(e) => gorselHata(e, sayfaIndex)}
                                                    />
                                                    <img
                                                        loading="lazy"
                                                        key={sayfaIndex + 1}
                                                        src={sayfalar[sayfaIndex + 1]}
                                                        alt={`Sayfa ${sayfaIndex + 2}`}
                                                        className="manga-sayfasi"
                                                        decoding="async"
                                                        onError={(e) => gorselHata(e, sayfaIndex + 1)}
                                                    />
                                                </div>
                                            ) : (
                                                <img
                                                    key={sayfaIndex}
                                                    src={sayfalar[sayfaIndex]}
                                                    alt={`Sayfa ${sayfaIndex + 1}`}
                                                    className="manga-sayfasi"
                                                    decoding="async"
                                                    onError={(e) => gorselHata(e, sayfaIndex)}
                                                />
                                            )}
                                        </div>

                                        <nav className="navigasyon-cubugu" aria-label="Sayfa Navigasyonu">
                                            <button className="nav-btn" onClick={oncekiSayfa} disabled={sayfaIndex === 0} aria-label="Önceki Sayfaya Git">Önceki</button>
                                            <div className="sayfa-gostergesi" aria-live="polite">
                                                {okumaModu === 'cift' && sayfalar[sayfaIndex + 1]
                                                    ? `${sayfaIndex + 1}-${sayfaIndex + 2} / ${sayfalar.length}`
                                                    : `${sayfaIndex + 1} / ${sayfalar.length}`}
                                            </div>
                                            <button className="nav-btn" onClick={sonrakiSayfa} disabled={sayfaIndex + sayfaAdimi > sayfalar.length - 1} aria-label="Sonraki Sayfaya Git">Sonraki</button>
                                        </nav>

                                        {sayfaIndex + sayfaAdimi > sayfalar.length - 1 && bolumSonu}

                                        <div className="kisayol-bilgi">
                                            <span>İpucu: Sayfayı değiştirmek için <kbd>←</kbd> <kbd>→</kbd> ok tuşlarını veya görselin sol/sağ yarısına tıklamayı kullanabilirsiniz.</span>
                                        </div>
                                    </div>
                                ) : (
                                    <>
                                        <div className="webtoon-kapsayici" ref={webtoonRef} onClick={dokunCubuk}>
                                            {sayfalar.map((sayfa, index) => (
                                                <img
                                                    key={veri ? veri.bolumId + '-' + index : index}
                                                    src={sayfa}
                                                    alt={`Sayfa ${index + 1}`}
                                                    className="webtoon-sayfasi"
                                                    loading="lazy"
                                                    decoding="async"
                                                    onLoad={(e) => e.currentTarget.classList.add('yuklendi')}
                                                    onError={(e) => { e.currentTarget.classList.add('yuklendi'); gorselHata(e, index); }}
                                                />
                                            ))}
                                        </div>
                                        {bolumSonu}
                                    </>
                                )}
                            </>
                        )}

                        <div className="okuma-ek-eylemler">
                            <button type="button" className="nav-btn" onClick={baglantiKopyala}>Bağlantıyı kopyala</button>
                            <button type="button" className="nav-btn" onClick={() => setKisayolAcik(true)}>Klavye kısayolları</button>
                            {kopyaMesaj && <span role="status" className="okuma-ek-mesaj">{kopyaMesaj}</span>}
                        </div>

                        {/* Yorumlar */}
                        <section className="yorumlar-bolumu" aria-label="Bölüm Yorumları">
                            {yorumBolumId != null && (
                                <div className="bolum-puan">
                                    <PuanKutu url={API + '/chapters/' + yorumBolumId + '/puan'} etiket="Bu bölümü puanla" />
                                </div>
                            )}
                            <window.Kage95Yorum.Yorumlar tur="bolum" id={yorumBolumId} api={API} tokenAl={tokenAl} sinir={1000}
                                placeholder="Bu bölüm hakkında ne düşünüyorsun? (Spoiler uyarısı yapmayı unutma)" />
                        </section>
                    </main>

                    {yukariGoster && (
                        <button type="button" className="yukari-btn" aria-label="Sayfanın başına çık" onClick={() => window.scrollTo({ top: 0, behavior: (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) ? 'auto' : 'smooth' })}>Yukarı çık</button>
                    )}

                    {sayfalar.length > 0 && (
                        <div 
                            className={`okuyucu-yuzen-sayfa ${yuzenSayfaGoster ? 'gorunur' : ''} ${(!ustGizli && veri) ? 'bar-acik' : ''}`}
                            aria-hidden="true"
                        >
                            <span className="oys-nokta"></span>
                            <span className="oys-mevcut">{sayfaIndex + 1}</span>
                            <span className="oys-bolu">/</span>
                            <span className="oys-toplam">{sayfalar.length}</span>
                        </div>
                    )}

                    {!ustGizli && veri && (
                        <nav className="okuyucu-hizli-alt-bar" aria-label="Hızlı Bölüm Geçişi">
                            <button 
                                type="button" 
                                className="nav-btn hizli-btn" 
                                disabled={!onceki} 
                                onClick={(e) => { e.stopPropagation(); bolumeGit(onceki); }} 
                                aria-label="Önceki bölüm"
                            >
                                ← Önceki
                            </button>
                            <span className="hizli-bolum-bilgi">
                                Bölüm {veri.bolumNo}
                            </span>
                            <button 
                                type="button" 
                                className="nav-btn btn-dolgu hizli-btn" 
                                disabled={!sonraki} 
                                onClick={(e) => { e.stopPropagation(); bolumeGit(sonraki); }} 
                                aria-label="Sonraki bölüm"
                            >
                                Sonraki →
                            </button>
                        </nav>
                    )}

                    {kisayolAcik && (
                        <div className="kisayol-arka" onClick={() => setKisayolAcik(false)}>
                            <div className="kisayol-pencere" role="dialog" aria-modal="true" aria-labelledby="kisayolBaslik" onClick={(e) => e.stopPropagation()}>
                                <h2 id="kisayolBaslik">Klavye kısayolları</h2>
                                <dl>
                                    <div><dt><kbd>←</kbd> <kbd>A</kbd></dt><dd>Önceki sayfa (klasik / çift mod)</dd></div>
                                    <div><dt><kbd>→</kbd> <kbd>D</kbd></dt><dd>Sonraki sayfa (klasik / çift mod)</dd></div>
                                    <div><dt><kbd>O</kbd></dt><dd>Otomatik kaydırmayı başlat / durdur (Webtoon)</dd></div>
                                    <div><dt><kbd>?</kbd></dt><dd>Bu yardımı aç / kapat</dd></div>
                                    <div><dt><kbd>Esc</kbd></dt><dd>Yardımı / otomatik kaydırmayı kapat</dd></div>
                                </dl>
                                <button type="button" className="nav-btn btn-dolgu" autoFocus onClick={() => setKisayolAcik(false)}>Kapat</button>
                            </div>
                        </div>
                    )}

                    {sayfalar.length > 0 && (
                        <div
                            className="okuma-ilerleme"
                            role="progressbar"
                            aria-label="Okuma ilerlemesi"
                            aria-valuemin={0}
                            aria-valuemax={100}
                            aria-valuenow={Math.round(ilerlemeOrani * 100)}
                        >
                            <span style={{ transform: `scaleX(${ilerlemeOrani})` }}></span>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<OkumaSayfasi />);
    </script>
</body>
</html>
