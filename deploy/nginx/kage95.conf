# Kage 95 - Nginx Yapılandırması (Reverse Proxy + Static Files + WebSocket)
# Bu dosyayı sunucuda /etc/nginx/sites-available/kage95.conf içine koyup
# /etc/nginx/sites-enabled/ içine sembolik link verin.

server {
    listen 80;
    listen [::]:80;
    server_name siteniz.com www.siteniz.com; # Kendi alan adınızla değiştirin

    # Maksimum yükleme boyutu (manga bölümleri ve görseller için)
    client_max_body_size 50M;

    # 1. Ön Yüz (Statik Dosyalar)
    root /var/www/kage95/frontend; # Ön yüz dosyalarının bulunduğu klasör
    index index.html;

    # Gzip sıkıştırma (Performans için)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2 image/svg+xml;

    # Statik varlıklar önbellek ayarları
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|webp|woff2?|ico)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # HTML sayfaları ve SPA yönlendirmeleri
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Arka Yüz (Backend REST API)
    location /api/ {
        proxy_pass http://127.0.0.1:5035;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    # 3. Yüklenen Görseller (Kapaklar ve Avatarlar)
    location /uploads/ {
        proxy_pass http://127.0.0.1:5035/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 4. Canlı Sohbet (SignalR WebSocket)
    location /hub/ {
        proxy_pass http://127.0.0.1:5035/hub/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 100s;
    }
}
