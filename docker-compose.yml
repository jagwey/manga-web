version: '3.8'

services:
  # 1. SQL Server Veritabanı
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: kage95_db
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "GucluSifreKage95*!"
      MSSQL_PID: "Express"
    volumes:
      - mssql_data:/var/opt/mssql
    ports:
      - "127.0.0.1:1433:1433"

  # 2. .NET 10 Web API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kage95_api
    restart: always
    depends_on:
      - db
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:5035"
      ConnectionStrings__DefaultConnection: "Server=db;Database=Kage95DB;User Id=sa;Password=GucluSifreKage95*!;TrustServerCertificate=True;MultipleActiveResultSets=true;"
      JwtSettings__Secret: "BURAYA_EN_AZ_32_KARAKTER_GUCLU_GIZLI_ANAHTAR_YAZINIZ_9876543210"
      JwtSettings__Issuer: "Kage95API"
      JwtSettings__Audience: "Kage95Client"
    volumes:
      - api_uploads:/app/uploads
    expose:
      - "5035"

  # 3. Nginx Web Sunucusu (Ön Yüz + Ters Vekil)
  web:
    image: nginx:alpine
    container_name: kage95_web
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Ön yüz statik dosyaları
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./read.html:/usr/share/nginx/html/read.html:ro
      - ./login.html:/usr/share/nginx/html/login.html:ro
      - ./admin.html:/usr/share/nginx/html/admin.html:ro
      - ./favicon.svg:/usr/share/nginx/html/favicon.svg:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
      # Yüklenen görseller
      - api_uploads:/usr/share/nginx/html/uploads:ro
      # Nginx ayarları
      - ./deploy/nginx/docker_nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mssql_data:
  api_uploads:
