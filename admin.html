<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Yönetim paneli - Kage 95</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#0e0c0c">
    <script src="js/tema.js"></script>

    <!-- Modern Tipografi -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif+JP:wght@700&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet">

    <!-- React ve Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --vurgu-rengi: #8e0e15;
            --vurgu-parlak: #e0343c;
            --bg-ana: #0e0c0c;
            --border-renk: #2a2323;
            --text-ana: #ede7e2;
            --text-ikincil: #a89f99;
            --bg-yuzey: #171313;
            --text-soluk: #7d746e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
        }

        html { overflow-x: hidden; }

        body {
            background-color: var(--bg-ana);
            color: var(--text-ana);
            min-height: 100vh;
            padding: 32px 16px 64px;
            font-weight: 400;
            line-height: 1.6;
            overflow-x: hidden;
            overflow-wrap: anywhere;
        }

        .admin-konteyner { max-width: 1080px; margin: 0 auto; }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 16px;
            border-bottom: 1px solid var(--border-renk);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .ust-sag { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: flex-end; }
        .kisi { font-size: 0.875rem; display: inline-flex; align-items: center; gap: 8px; }
        .rol-etiket { font-size: 0.875rem; color: var(--text-ikincil); border: 1px solid var(--border-renk); border-radius: 2px; padding: 1px 8px; font-weight: 400; }
        .admin-header { align-items: center; }
        .admin-header h1 {
            font-family: 'Noto Serif', Georgia, serif;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .btn-don, .metin-link {
            color: var(--text-ikincil);
            font-size: 0.875rem;
            text-decoration: none;
            white-space: nowrap;
            transition: color 0.15s;
            background: none;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            min-height: 44px;
        }
        @media (hover:hover) { .btn-don:hover, .metin-link:hover { color: var(--text-ana); } }

        h2 {
            font-family: 'Noto Serif', Georgia, serif;
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        h3 {
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 12px;
        }

        .ikincil { color: var(--text-ikincil); font-size: 0.875rem; }
        .not { color: var(--text-soluk); font-size: 0.875rem; margin-top: 12px; }

        .bolum-baslik {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        /* Düğmeler */
        .btn {
            min-height: 44px;
            min-width: 44px;
            padding: 0 16px;
            background: transparent;
            color: var(--text-ana);
            border: 1px solid var(--border-renk);
            border-radius: 2px;
            font-size: 0.875rem;
            font-weight: 400;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s, background-color 0.15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            white-space: nowrap;
        }
        @media (hover:hover) { .btn:hover:not(:disabled) { border-color: var(--text-ikincil); } }
        .btn:disabled { opacity: 0.5; cursor: default; }

        .btn-ana {
            background: var(--vurgu-rengi);
            border-color: var(--vurgu-rengi);
            color: #fff;
            font-weight: 500;
        }
        @media (hover:hover) { .btn-ana:hover:not(:disabled) { background: var(--vurgu-parlak); border-color: var(--vurgu-parlak); } }

        .btn-tehlike { border-color: var(--vurgu-rengi); }
        @media (hover:hover) { .btn-tehlike:hover:not(:disabled) { border-color: var(--vurgu-parlak); color: var(--vurgu-parlak); } }

        .eylemler { display: flex; gap: 8px; flex-wrap: wrap; }

        /* Form */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 24px;
        }
        .form-grubu {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 20px;
            min-width: 0;
        }
        .form-grubu.tam { grid-column: 1 / -1; }
        .form-grubu label, .etiket {
            font-size: 0.875rem;
            color: var(--text-ikincil);
        }

        .form-input, .form-textarea, .form-select {
            background: transparent;
            border: 1px solid var(--border-renk);
            color: var(--text-ana);
            padding: 0 14px;
            height: 44px;
            border-radius: 2px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.15s;
            width: 100%;
        }
        .form-select option { background: var(--bg-ana); color: var(--text-ana); }
        .form-input::placeholder, .form-textarea::placeholder { color: var(--text-soluk); }
        .form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--vurgu-parlak); }
        .form-textarea {
            height: auto;
            padding: 12px 14px;
            resize: vertical;
            min-height: 100px;
            line-height: 1.5;
        }

        .dosya-gizli { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

        /* Çipler */
        .cipler { display: flex; flex-wrap: wrap; gap: 8px; }
        .cip {
            min-height: 44px;
            padding: 0 14px;
            background: transparent;
            border: 1px solid var(--border-renk);
            border-radius: 2px;
            color: var(--text-ikincil);
            font-size: 0.875rem;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
        }
        @media (hover:hover) { .cip:hover { color: var(--text-ana); } }
        .cip[aria-pressed="true"] { color: var(--text-ana); border-color: var(--vurgu-parlak); }
        .satir-ekle { display: flex; gap: 8px; margin-top: 10px; }
        .satir-ekle .form-input { flex: 1; min-width: 0; }

        /* Kapak */
        .kapak-alan {
            display: flex;
            gap: 16px;
            align-items: flex-start;
            padding: 12px;
            border: 1px solid var(--border-renk);
            border-radius: 2px;
        }
        .kapak-onizleme {
            width: 84px;
            height: 118px;
            flex: none;
            border: 1px solid var(--border-renk);
            border-radius: 2px;
            background: var(--bg-yuzey);
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-soluk);
            font-size: 0.875rem;
            text-align: center;
        }
        .kapak-yan { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }

        /* Sekmeler */
        .tab-secici {
            display: flex;
            gap: 24px;
            border-bottom: 1px solid var(--border-renk);
            margin-bottom: 20px;
        }
        .tab-btn {
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            min-height: 44px;
            padding: 0;
            color: var(--text-ikincil);
            font-size: 0.9rem;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
        }
        @media (hover:hover) { .tab-btn:hover { color: var(--text-ana); } }
        .tab-btn.aktif { color: var(--text-ana); border-bottom-color: var(--vurgu-parlak); }

        /* Listeler */
        .liste { border-top: 1px solid var(--border-renk); }
        .satir {
            display: flex;
            gap: 14px;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-renk);
        }
        .satir-kucuk {
            width: 44px;
            height: 62px;
            flex: none;
            object-fit: cover;
            border: 1px solid var(--border-renk);
            border-radius: 2px;
            background: var(--bg-yuzey);
        }
        .satir-bilgi { flex: 1; min-width: 0; }
        .satir-ad { font-size: 0.95rem; font-weight: 500; }
        .satir-alt { font-size: 0.875rem; color: var(--text-ikincil); }
        .satir-no { width: 28px; flex: none; font-size: 0.875rem; color: var(--text-ikincil); text-align: right; }

        .onay-kutu {
            border: 1px solid var(--vurgu-rengi);
            border-radius: 2px;
            padding: 14px;
            margin: 0 0 0;
        }
        .onay-kutu p { font-size: 0.875rem; margin-bottom: 10px; }

        /* Yükleme alanı */
        .birak-alan {
            border: 1px dashed var(--border-renk);
            border-radius: 2px;
            padding: 24px 16px;
            text-align: center;
            transition: border-color 0.15s;
        }
        .birak-alan.uzerinde { border-color: var(--vurgu-parlak); }
        .birak-alan p { font-size: 0.875rem; color: var(--text-ikincil); margin-bottom: 12px; }

        .ilerleme {
            height: 4px;
            background: var(--border-renk);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 8px;
        }
        .ilerleme > div { height: 100%; background: var(--vurgu-parlak); transition: width 0.15s; }

        .bildirim {
            padding: 12px 14px;
            border-radius: 2px;
            font-size: 0.875rem;
            margin-bottom: 20px;
            border: 1px solid;
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        .bildirim.basarili { border-color: var(--text-ikincil); }
        .bildirim.hata { border-color: var(--vurgu-parlak); }

        .bos { padding: 32px 0; text-align: center; color: var(--text-ikincil); font-size: 0.9rem; }

        .yerlesim { display: grid; grid-template-columns: 188px minmax(0, 1fr); gap: 32px; align-items: start; }
        .menu { display: flex; flex-direction: column; border-top: 1px solid var(--border-renk); }
        .menu-btn {
            background: transparent; border: none; border-bottom: 1px solid var(--border-renk);
            border-left: 2px solid transparent; text-align: left;
            min-height: 44px; padding: 0 14px; color: var(--text-ikincil); font-size: 0.9rem;
            cursor: pointer; transition: color 0.15s, border-color 0.15s;
        }
        @media (hover:hover) { .menu-btn:hover { color: var(--text-ana); } }
        .menu-btn.aktif { color: var(--text-ana); border-left-color: var(--vurgu-parlak); }
        .icerik { min-width: 0; }

        .kartlar { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 28px; }
        .kart { border: 1px solid var(--border-renk); border-radius: 2px; padding: 14px; }
        .kart-sayi { font-size: 1.5rem; font-weight: 600; font-family: 'Noto Serif', Georgia, serif; }
        .kart-ad { font-size: 0.875rem; color: var(--text-ikincil); }

        .etiketler { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
        .etiket-kucuk { font-size: 0.875rem; color: var(--text-ikincil); border: 1px solid var(--border-renk); border-radius: 2px; padding: 1px 8px; }
        .etiket-kucuk.kirmizi { color: var(--vurgu-parlak); border-color: var(--vurgu-rengi); }

        .kutu { border: 1px solid var(--border-renk); border-radius: 2px; padding: 16px; margin-bottom: 20px; }
        .izin-liste { display: flex; flex-direction: column; margin: 8px 0 16px; border-top: 1px solid var(--border-renk); }
        .izin {
            display: flex; gap: 12px; align-items: flex-start; min-height: 44px; padding: 10px 0;
            border-bottom: 1px solid var(--border-renk); cursor: pointer;
        }
        .izin input { width: 18px; height: 18px; margin-top: 3px; flex: none; accent-color: var(--vurgu-rengi); cursor: pointer; }
        .izin-ad { font-size: 0.9rem; }
        .izin-acik { font-size: 0.875rem; color: var(--text-ikincil); }
        .yorum-metin { font-size: 0.9rem; margin: 4px 0; white-space: pre-wrap; }
        .erisim-kutu { max-width: 420px; margin: 64px auto 0; }
        .erisim-kutu p { margin: 8px 0 24px; color: var(--text-ikincil); }

        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
        .tab-secici { overflow-x: auto; scrollbar-width: none; }
        .tab-secici::-webkit-scrollbar { display: none; }
        .tab-btn { flex: none; white-space: nowrap; }
        .tab-btn .sayi { color: var(--text-soluk); margin-left: 6px; font-size: 0.875rem; }

        /* Sayfalama */
        .sayfalama { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; flex-wrap: wrap; }

        /* Tıklanabilir satır */
        .satir-tikla {
            width: 100%; text-align: left; background: transparent; color: inherit; cursor: pointer;
            border: none; border-bottom: 1px solid var(--border-renk); padding: 12px 0; min-height: 44px;
            display: block; transition: background-color 0.15s;
        }
        @media (hover:hover) { .satir-tikla:hover .satir-ad { color: var(--vurgu-parlak); } }
        .satir-ad { transition: color 0.15s; }

        /* Bilgi ızgarası */
        .bilgi-izgara { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 0 24px; margin-bottom: 24px; border-top: 1px solid var(--border-renk); }
        .bilgi { padding: 10px 0; border-bottom: 1px solid var(--border-renk); min-width: 0; }
        .bilgi dt { font-size: 0.875rem; color: var(--text-ikincil); }
        .bilgi dd { font-size: 0.9rem; }

        /* Eylem kartları */
        .eylem-izgara { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; align-items: start; }
        .eylem-kart { border: 1px solid var(--border-renk); border-radius: 2px; padding: 14px; min-width: 0; }
        .eylem-kart.acik { border-color: var(--text-ikincil); grid-column: 1 / -1; }
        .eylem-kart.kilitli { opacity: 0.6; }
        .eylem-kart h3 { margin-bottom: 4px; }
        .eylem-kart > p { font-size: 0.875rem; color: var(--text-ikincil); margin-bottom: 12px; }
        .eylem-kart .alt { margin-top: 14px; }
        .secenek { display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; font-size: 0.9rem; }
        .secenek input { width: 18px; height: 18px; accent-color: var(--vurgu-rengi); flex: none; }
        .gecici-kutu { border: 1px solid var(--vurgu-parlak); border-radius: 2px; padding: 14px; margin-top: 14px; }
        .gecici-kutu code { display: block; font-family: Consolas, 'Courier New', monospace; font-size: 1.05rem; padding: 10px 0; user-select: all; letter-spacing: 0.04em; }

        /* Anahtar */
        .anahtar-satir { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 56px; padding: 10px 0; border-bottom: 1px solid var(--border-renk); }
        .anahtar-satir .izin-ad { margin-bottom: 0; }
        .anahtar { flex: none; width: 48px; height: 44px; background: transparent; border: none; cursor: pointer; position: relative; }
        .anahtar::before { content: ''; position: absolute; left: 0; top: 12px; width: 48px; height: 20px; border: 1px solid var(--border-renk); border-radius: 2px; background: transparent; transition: border-color 0.15s, background-color 0.15s; }
        .anahtar::after { content: ''; position: absolute; left: 4px; top: 16px; width: 12px; height: 12px; border-radius: 1px; background: var(--text-soluk); transition: background-color 0.15s; }
        .anahtar[aria-checked="true"]::before { border-color: var(--vurgu-parlak); }
        .anahtar[aria-checked="true"]::after { left: 32px; background: var(--vurgu-parlak); }
        .sayac { font-size: 0.875rem; color: var(--text-soluk); text-align: right; }

        /* Grafik */
        .grafik { display: flex; align-items: flex-end; gap: 4px; height: 140px; border-bottom: 1px solid var(--border-renk); padding-top: 18px; list-style: none; }
        .grafik li { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
        .grafik .cubuk { width: 100%; max-width: 28px; background: var(--vurgu-rengi); min-height: 0; border-radius: 1px 1px 0 0; }
        .grafik .cubuk.sifir { background: var(--border-renk); height: 2px !important; }
        .grafik .deger { font-size: 0.875rem; color: var(--text-ikincil); height: 16px; line-height: 16px; }
        .grafik-etiket { display: flex; gap: 4px; list-style: none; margin-bottom: 8px; }
        .grafik-etiket li { flex: 1; min-width: 0; text-align: center; font-size: 0.875rem; color: var(--text-soluk); padding-top: 4px; }

        /* Sayfa yöneticisi */
        .sayfa-izgara { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; list-style: none; }
        .sayfa-kart { border: 1px solid var(--border-renk); border-radius: 2px; padding: 8px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
        .sayfa-kart img, .sayfa-kart .onizleme-bos { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; background: var(--bg-yuzey); border: 1px solid var(--border-renk); border-radius: 2px; display: flex; align-items: center; justify-content: center; font-size: 0.875rem; color: var(--text-soluk); }
        .sayfa-kart .sira { font-size: 0.875rem; color: var(--text-ikincil); }
        .sayfa-kart .eylemler { gap: 6px; }
        .sayfa-kart .eylemler .btn { flex: 1; padding: 0 8px; }
        .sayfa-kart .tam-btn { width: 100%; }

        /* Kayıt tablosu */
        .tablo { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
        .tablo th { text-align: left; font-weight: 500; font-size: 0.875rem; color: var(--text-ikincil); padding: 8px 10px 8px 0; border-bottom: 1px solid var(--border-renk); }
        .tablo td { padding: 10px 10px 10px 0; border-bottom: 1px solid var(--border-renk); vertical-align: top; }
        .tablo .mono { font-family: Consolas, 'Courier New', monospace; font-size: 0.875rem; }
        .filtre-satir { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: end; }
        .grup-baslik { font-size: 0.875rem; color: var(--text-ikincil); margin: 18px 0 0; letter-spacing: 0.04em; }
        .grup-baslik:first-child { margin-top: 0; }
        .arac-satir { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
        .kilit-not { font-size: 0.875rem; color: var(--text-ikincil); border: 1px solid var(--border-renk); border-radius: 2px; padding: 10px 12px; margin-bottom: 16px; }

        a:focus-visible, button:focus-visible, input:focus-visible + span, .secenek input:focus-visible { outline: 1px solid var(--vurgu-parlak); outline-offset: 2px; }
        .dosya-gizli:focus-visible + label { outline: 1px solid var(--vurgu-parlak); outline-offset: 2px; }

        @media (max-width: 760px) {
            .yerlesim { grid-template-columns: minmax(0, 1fr); gap: 20px; }
            .menu { flex-direction: row; overflow-x: auto; border-top: none; border-bottom: 1px solid var(--border-renk); scrollbar-width: none; }
            .menu::-webkit-scrollbar { display: none; }
            .menu-btn { flex: none; white-space: nowrap; border-bottom: 2px solid transparent; border-left: none; margin-bottom: -1px; padding: 0 16px; }
            .menu-btn.aktif { border-bottom-color: var(--vurgu-parlak); }
            .admin-header { flex-direction: column; align-items: flex-start; }
            .ust-sag { justify-content: flex-start; gap: 4px 16px; }
        }
        @media (max-width: 640px) {
            body { padding: 24px 16px 56px; }
            .form-grid { grid-template-columns: 1fr; }
            .satir { flex-wrap: wrap; }
            .satir-bilgi { flex-basis: calc(100% - 70px); }
            .satir .eylemler { width: 100%; }
            .satir .eylemler .btn { flex: 1; }
            .sayfa-satir .satir-bilgi { flex: 1 1 0; min-width: 100px; }
            .sayfa-satir .eylemler { width: 100%; padding-left: 42px; }
            .sayfa-satir .eylemler .btn { flex: 1; padding: 0 10px; }
            .kapak-alan { flex-direction: column; }
            .filtre-satir { grid-template-columns: 1fr; }
            .sayfa-izgara { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .eylem-izgara { grid-template-columns: minmax(0, 1fr); }
            .bilgi-izgara { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .tablo thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
            .tablo, .tablo tbody, .tablo tr, .tablo td { display: block; width: 100%; }
            .tablo tr { border-bottom: 1px solid var(--border-renk); padding: 8px 0; }
            .tablo td { border: none; padding: 2px 0; }
            .tablo td::before { content: attr(data-label) ': '; color: var(--text-soluk); font-size: 0.875rem; }
        }


        /* --- MOBİL / DOKUNMATİK --- */
        html { -webkit-text-size-adjust: 100%; }
        body {
            padding-left: max(16px, env(safe-area-inset-left));
            padding-right: max(16px, env(safe-area-inset-right));
            padding-bottom: max(64px, calc(48px + env(safe-area-inset-bottom)));
            padding-top: max(32px, calc(16px + env(safe-area-inset-top)));
        }
        .form-input, .form-textarea, .form-select { font-size: 1rem; scroll-margin-block: 96px; }
        .form-select { text-overflow: ellipsis; }
        .izin input, .secenek input { width: 22px; height: 22px; }
        .tab-btn { padding: 0 2px; min-width: 44px; }
        .btn { max-width: 100%; }
        .btn-tehlike, .btn-ana { white-space: normal; }
        .satir-ad, .satir-alt, .yorum-metin { overflow-wrap: anywhere; }
        .kisi { flex-wrap: wrap; }
        @media (max-width: 760px) {
            .menu { position: sticky; top: 0; z-index: 20; background: var(--bg-ana); margin-left: -16px; margin-right: -16px; padding-left: 16px; padding-right: 16px; -webkit-overflow-scrolling: touch; }
            .menu-btn { min-width: 44px; }
        }
        @media (max-width: 640px) {
            body { padding-bottom: max(56px, calc(48px + env(safe-area-inset-bottom))); }
            .ust-sag { width: 100%; }
            .bolum-baslik > .btn, .bolum-baslik > .eylemler { flex: 1 1 100%; }
            .bolum-baslik > .btn { width: 100%; }
            .eylemler .btn { flex: 1 1 auto; }
            .satir .eylemler .btn { flex: 1 1 calc(50% - 8px); }
            .sayfa-kart .eylemler .btn { min-width: 0; padding: 0 4px; }
            .kapak-onizleme { width: 100%; max-width: 160px; height: auto; aspect-ratio: 5 / 7; }
            .grafik { gap: 2px; }
            .grafik-etiket { gap: 2px; }
            .grafik .deger { font-size: 0.875rem; }
            .sayfalama { justify-content: center; }
            .sayfalama .ikincil { order: -1; flex: 1 1 100%; text-align: center; }
            .sayfalama .btn { flex: 1; }
            .gecici-kutu code { overflow-wrap: anywhere; }
            .onay-kutu .eylemler .btn { flex: 1 1 100%; }
            .erisim-kutu { margin-top: 32px; }
            .erisim-kutu .eylemler .btn { flex: 1 1 100%; }
        }
        @media (max-height: 500px) { .erisim-kutu { margin-top: 16px; } }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }

        ::selection { background: var(--vurgu-rengi); color: #fff; }
        html { scrollbar-color: var(--kaydirma, #4a1014) var(--bg-ana); scrollbar-width: thin; }
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-ana); }
        ::-webkit-scrollbar-thumb { background: var(--kaydirma, #4a1014); border-radius: 5px; border: 2px solid var(--bg-ana); }
        ::-webkit-scrollbar-thumb:hover { background: var(--vurgu-rengi); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="js/config.js"></script>
    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        /* ---------- Yardımcılar ---------- */
        const tokenAl = () => { try { return localStorage.getItem('kage95_token'); } catch (e) { return null; } };
        const kullaniciAl = () => { try { return JSON.parse(localStorage.getItem('kage95_user')); } catch (e) { return null; } };
        const yetkiOlayi = (tur) => window.dispatchEvent(new CustomEvent('kage95-yetki', { detail: tur }));
        const metinCoz = (t) => String(t == null ? '' : t).replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&');

        async function istek(yol, { method = 'GET', json } = {}) {
            const basliklar = { Authorization: 'Bearer ' + tokenAl() };
            let body;
            if (json !== undefined) { basliklar['Content-Type'] = 'application/json'; body = JSON.stringify(json); }
            let yanit;
            try {
                yanit = await fetch(window.KAGE95_API_URL + yol, { method, headers: basliklar, body });
            } catch (e) {
                throw { ag: true, message: 'Sunucuya ulaşılamadı. Bağlantınızı kontrol edin.' };
            }
            const veri = await yanit.json().catch(() => null);
            if (!yanit.ok) {
                if (yanit.status === 401) yetkiOlayi('401');
                if (yanit.status === 403) yetkiOlayi('403');
                throw { durum: yanit.status, message: yanit.status === 403 ? ((veri && veri.message) || 'Bu işlem için yetkiniz yok.') : (veri && veri.message) || ('İşlem başarısız (' + yanit.status + ').') };
            }
            return { veri, yanit };
        }

        const IZINLI_UZANTI = ['jpg', 'jpeg', 'png', 'webp', 'gif'];
        const MAX_BOYUT = 15 * 1024 * 1024;
        const MAX_DOSYA = 200;
        const GRUP = 20;

        function dosyaDogrula(f) {
            const uz = (f.name.split('.').pop() || '').toLowerCase();
            if (!IZINLI_UZANTI.includes(uz)) return `"${f.name}" desteklenmiyor (yalnızca jpg, png, webp, gif).`;
            if (f.size > MAX_BOYUT) return `"${f.name}" 15 MB sınırını aşıyor.`;
            return null;
        }

        const dogalSirala = (a, b) => a.name.localeCompare(b.name, 'tr', { numeric: true, sensitivity: 'base' });

        function grupYukle(dosyalar, ilerle) {
            return new Promise((coz, red) => {
                const x = new XMLHttpRequest();
                x.open('POST', window.KAGE95_API_URL + '/upload');
                x.setRequestHeader('Authorization', 'Bearer ' + tokenAl());
                x.upload.onprogress = (e) => { if (e.lengthComputable && e.total > 0) ilerle(e.loaded / e.total); };
                x.onload = () => {
                    let v = null;
                    try { v = JSON.parse(x.responseText); } catch (e) {}
                    if (x.status >= 200 && x.status < 300 && v && Array.isArray(v.urls)) { coz(v.urls); return; }
                    if (x.status === 401) yetkiOlayi('401');
                    if (x.status === 403) yetkiOlayi('403');
                    red({ durum: x.status, message: (v && v.message) || ('Yükleme başarısız (' + x.status + ').') });
                };
                x.onerror = () => red({ ag: true, message: 'Sunucuya ulaşılamadı. Bağlantınızı kontrol edin.' });
                const fd = new FormData();
                dosyalar.forEach(f => fd.append('files', f));
                x.send(fd);
            });
        }

        // 20'şerli gruplar hâlinde sırayla yükler. grupBitti(baslangic, urls) her grup sonrası çağrılır.
        async function yukle(dosyalar, ilerle, grupBitti) {
            const toplam = dosyalar.reduce((a, f) => a + f.size, 0) || 1;
            let biten = 0;
            for (let i = 0; i < dosyalar.length; i += GRUP) {
                const g = dosyalar.slice(i, i + GRUP);
                const gb = g.reduce((a, f) => a + f.size, 0);
                const urls = await grupYukle(g, (oran) => ilerle(Math.min(1, (biten + gb * oran) / toplam)));
                if (urls.length !== g.length) throw { message: 'Sunucu beklenen sayıda adres döndürmedi.' };
                biten += gb;
                ilerle(Math.min(1, biten / toplam));
                grupBitti(i, urls);
            }
        }

        // Sunucu UTC saat dilimi eki olmadan gönderirse UTC kabul et
        const tarihCoz = (t) => {
            if (!t) return null;
            let s = String(t);
            if (/^\d{4}-\d{2}-\d{2}T[\d:.]+$/.test(s)) s += 'Z';
            const d = new Date(s);
            return isNaN(d.getTime()) ? null : d;
        };
        const tarihYaz = (t) => { const d = tarihCoz(t); return d ? d.toLocaleDateString('tr-TR') : ''; };
        const tarihSaat = (t) => { const d = tarihCoz(t); return d ? d.toLocaleString('tr-TR', { dateStyle: 'medium', timeStyle: 'short' }) : '—'; };
        // /uploads/... gibi göreli adresleri API sunucusuna bağlar
        const gorselUrl = (u) => {
            if (!u) return '';
            if (u.startsWith('/')) { try { return new URL(window.KAGE95_API_URL).origin + u; } catch (e) { return u; } }
            return u;
        };
        const noYaz = (n) => String(n);

        /* ---------- Ortak bileşenler ---------- */
        const Bildirim = ({ b, kapat }) => {
            if (!b) return null;
            return (
                <div className={`bildirim ${b.tur}`} role="alert">
                    <span>{b.mesaj}</span>
                    <span className="eylemler">
                        {b.tekrar && <button type="button" className="btn" onClick={b.tekrar}>Tekrar dene</button>}
                        {kapat && <button type="button" className="btn" onClick={kapat}>Kapat</button>}
                    </span>
                </div>
            );
        };

        const Ilerleme = ({ oran, etiket }) => (
            <div>
                <div className="ikincil" style={{ marginTop: 8 }}>{etiket} %{Math.round(oran * 100)}</div>
                <div className="ilerleme"><div style={{ width: Math.round(oran * 100) + '%' }}></div></div>
            </div>
        );

        const hataBildirimi = (err, tekrar) => ({
            tur: 'hata',
            mesaj: err && err.message ? err.message : 'Beklenmeyen bir hata oluştu.',
            tekrar: err && err.ag ? tekrar : null
        });

        /* ---------- Sayfalı liste (sayfa sayfa gezinme) ---------- */
        function useListe(yol, ekParam, BOYUT = 20) {
            const [sayfa, setSayfa] = useState(1);
            const [liste, setListe] = useState([]);
            const [toplam, setToplam] = useState(0);
            const [yukleniyor, setYukleniyor] = useState(true);
            const [bildirim, setBildirim] = useState(null);
            const [yenile, setYenile] = useState(0);
            // Süzgeç değişince ilk sayfaya dön
            useEffect(() => { setSayfa(1); }, [yol, ekParam]);
            useEffect(() => {
                let iptal = false;
                setYukleniyor(true);
                (async () => {
                    try {
                        const { veri, yanit } = await istek(`${yol}?${ekParam}page=${sayfa}&pageSize=${BOYUT}`);
                        if (iptal) return;
                        const l = Array.isArray(veri) ? veri : [];
                        setListe(l);
                        const tc = parseInt(yanit.headers.get('X-Total-Count'), 10);
                        setToplam(Number.isFinite(tc) ? tc : l.length);
                        setBildirim(null);
                    } catch (err) {
                        if (!iptal) setBildirim(hataBildirimi(err, () => setYenile(y => y + 1)));
                    } finally { if (!iptal) setYukleniyor(false); }
                })();
                return () => { iptal = true; };
            }, [yol, ekParam, sayfa, yenile, BOYUT]);
            const sayfaSayisi = Math.max(1, Math.ceil(toplam / BOYUT));
            return { sayfa, setSayfa, liste, setListe, toplam, setToplam, yukleniyor, bildirim, setBildirim, sayfaSayisi, yenile: () => setYenile(y => y + 1) };
        }

        const Sayfalama = ({ s }) => (s.toplam > 0 && s.sayfaSayisi > 1) ? (
            <nav className="sayfalama" aria-label="Sayfalama">
                <button type="button" className="btn" disabled={s.yukleniyor || s.sayfa <= 1} onClick={() => s.setSayfa(s.sayfa - 1)}>Önceki</button>
                <span className="ikincil" aria-live="polite">Sayfa {s.sayfa} / {s.sayfaSayisi}</span>
                <button type="button" className="btn" disabled={s.yukleniyor || s.sayfa >= s.sayfaSayisi} onClick={() => s.setSayfa(s.sayfa + 1)}>Sonraki</button>
            </nav>
        ) : null;

        /* ---------- Seri listesi ---------- */
        const SeriListesi = ({ git, mesaj, setMesaj, can }) => {
            const [arama, setArama] = useState('');
            const [aranan, setAranan] = useState('');
            const s = useListe('/admin/mangalar', `search=${encodeURIComponent(aranan)}&`);
            const [bildirim, setBildirim] = useState(null);
            const [silId, setSilId] = useState(null);
            const [silAd, setSilAd] = useState('');
            const [mesgul, setMesgul] = useState(false);

            useEffect(() => {
                const t = setTimeout(() => setAranan(arama.trim()), 300);
                return () => clearTimeout(t);
            }, [arama]);

            const sil = async (m) => {
                setMesgul(true); setBildirim(null);
                try {
                    await istek(`/mangas/${m.id}`, { method: 'DELETE' });
                    setSilId(null); setSilAd('');
                    setMesaj({ tur: 'basarili', mesaj: `"${m.mangaAdi}" serisi silindi.` });
                    s.yenile();
                } catch (err) {
                    setBildirim(hataBildirimi(err, () => sil(m)));
                } finally { setMesgul(false); }
            };

            // Hızlı aç/kapa: tam gövde ile PUT (kısmi güncellemeye bağımlı olmamak için)
            const hizli = async (m, alan) => {
                setMesgul(true); setBildirim(null);
                try {
                    const { veri: d } = await istek(`/mangas/${m.id}`);
                    const yeni = !m[alan];
                    const govde = {
                        mangaAdi: d.mangaAdi, aciklama: d.aciklama || null, kapakResmiURL: d.kapakResmiURL || null,
                        yazar: d.yazar || null, cizer: d.cizer || null, durum: d.durum === 'Tamamlandi' ? 'Tamamlandi' : 'DevamEdiyor',
                        kategoriler: d.kategoriler || [],
                        yayinda: alan === 'yayinda' ? yeni : m.yayinda, oneCikan: alan === 'oneCikan' ? yeni : m.oneCikan
                    };
                    await istek(`/mangas/${m.id}`, { method: 'PUT', json: govde });
                    s.setListe(l => l.map(x => x.id === m.id ? { ...x, [alan]: yeni } : x));
                    setMesaj({ tur: 'basarili', mesaj: alan === 'yayinda' ? `"${m.mangaAdi}" ${yeni ? 'yayına alındı' : 'taslağa çekildi'}.` : `"${m.mangaAdi}" ${yeni ? 'öne çıkarıldı' : 'öne çıkanlardan kaldırıldı'}.` });
                } catch (err) {
                    setBildirim(hataBildirimi(err));
                } finally { setMesgul(false); }
            };

            const bolumGorur = ['bolum.yaz', 'bolum.sil', 'bolum.duzenle'].some(can);

            return (
                <div>
                    <div className="bolum-baslik">
                        <div>
                            <h2>Seriler</h2>
                            <div className="ikincil">{s.toplam} seri</div>
                        </div>
                        {can('manga.yaz') && <button className="btn btn-ana" onClick={() => git({ ekran: 'form', id: null })}>Yeni seri</button>}
                    </div>

                    <Bildirim b={mesaj} kapat={() => setMesaj(null)} />
                    <Bildirim b={bildirim} kapat={() => setBildirim(null)} />
                    <Bildirim b={s.bildirim} kapat={() => s.setBildirim(null)} />

                    <div className="form-grubu">
                        <label htmlFor="arama">Seri ara</label>
                        <input id="arama" type="search" className="form-input" placeholder="Seri adı, yazar veya açıklama"
                            value={arama} onChange={(e) => setArama(e.target.value)} />
                    </div>

                    <div className="liste">
                        {s.liste.map(m => (
                            <div key={m.id}>
                                <div className="satir">
                                    {m.kapakResmiURL
                                        ? <img className="satir-kucuk" src={gorselUrl(m.kapakResmiURL)} alt="" onError={(e) => { e.target.style.visibility = 'hidden'; }} />
                                        : <div className="satir-kucuk"></div>}
                                    <div className="satir-bilgi">
                                        <div className="satir-ad">{m.mangaAdi}</div>
                                        <div className="satir-alt">
                                            {m.durum === 'Tamamlandi' ? 'Tamamlandı' : 'Devam ediyor'} · {m.bolumSayisi} bölüm
                                        </div>
                                        <div className="etiketler">
                                            <span className={`etiket-kucuk ${m.yayinda === false ? 'kirmizi' : ''}`}>{m.yayinda === false ? 'Taslak' : 'Yayında'}</span>
                                            {m.oneCikan && <span className="etiket-kucuk kirmizi">Öne çıkan</span>}
                                        </div>
                                    </div>
                                    <div className="eylemler">
                                        {can('manga.yaz') && <button className="btn" disabled={mesgul} onClick={() => hizli(m, 'yayinda')}>{m.yayinda === false ? 'Yayına al' : 'Taslağa çek'}</button>}
                                        {can('manga.yaz') && <button className="btn" disabled={mesgul} onClick={() => hizli(m, 'oneCikan')}>{m.oneCikan ? 'Öne çıkarmayı kaldır' : 'Öne çıkar'}</button>}
                                        {can('manga.yaz') && <button className="btn" disabled={mesgul} onClick={() => git({ ekran: 'form', id: m.id })}>Düzenle</button>}
                                        {bolumGorur && <button className="btn" disabled={mesgul} onClick={() => git({ ekran: 'bolumler', id: m.id })}>Bölümler</button>}
                                        {can('manga.sil') && <button className="btn btn-tehlike" disabled={mesgul}
                                            onClick={() => { setSilId(silId === m.id ? null : m.id); setSilAd(''); }}>Sil</button>}
                                    </div>
                                </div>
                                {can('manga.sil') && silId === m.id && (
                                    <div className="onay-kutu" style={{ margin: '12px 0' }}>
                                        <p>Bu seri, tüm bölümleri ve sayfalarıyla birlikte kalıcı olarak silinecek. Onaylamak için serinin adını yazın: <strong>{m.mangaAdi}</strong></p>
                                        <input className="form-input" aria-label="Serinin adını yazın" value={silAd}
                                            onChange={(e) => setSilAd(e.target.value)} placeholder={m.mangaAdi} />
                                        <div className="eylemler" style={{ marginTop: 10 }}>
                                            <button className="btn btn-tehlike" disabled={mesgul || silAd.trim() !== m.mangaAdi.trim()}
                                                onClick={() => sil(m)}>{mesgul ? 'Siliniyor...' : 'Kalıcı olarak sil'}</button>
                                            <button className="btn" disabled={mesgul} onClick={() => { setSilId(null); setSilAd(''); }}>Vazgeç</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>

                    {s.yukleniyor && <div className="bos">Yükleniyor...</div>}
                    {!s.yukleniyor && s.liste.length === 0 && !s.bildirim && (
                        <div className="bos">{aranan ? 'Aramanızla eşleşen seri yok.' : 'Henüz seri eklenmemiş.'}</div>
                    )}
                    <Sayfalama s={s} />
                </div>
            );
        };

        /* ---------- Seri formu ---------- */
        const SeriFormu = ({ id, git, setMesaj }) => {
            const [yuklendi, setYuklendi] = useState(!id);
            const [ad, setAd] = useState('');
            const [aciklama, setAciklama] = useState('');
            const [yazar, setYazar] = useState('');
            const [cizer, setCizer] = useState('');
            const [durum, setDurum] = useState('DevamEdiyor');
            const [kapak, setKapak] = useState('');
            const [secili, setSecili] = useState([]);
            const [kategoriler, setKategoriler] = useState([]);
            const [yeniKat, setYeniKat] = useState('');
            const [bildirim, setBildirim] = useState(null);
            const [mesgul, setMesgul] = useState(false);
            const [kapakOran, setKapakOran] = useState(null);
            const [kapakHata, setKapakHata] = useState(false);
            const [yayinda, setYayinda] = useState(true);
            const [oneCikan, setOneCikan] = useState(false);

            const baslangic = useCallback(async () => {
                setBildirim(null);
                try {
                    const { veri: kats } = await istek('/categories');
                    setKategoriler((kats || []).map(k => k.kategoriAdi));
                    if (id) {
                        const { veri: m } = await istek(`/mangas/${id}`);
                        setAd(m.mangaAdi || ''); setAciklama(m.aciklama || ''); setYazar(m.yazar || ''); setCizer(m.cizer || '');
                        setDurum(m.durum === 'Tamamlandi' ? 'Tamamlandi' : 'DevamEdiyor');
                        setKapak(m.kapakResmiURL || ''); setSecili(m.kategoriler || []);
                        setYayinda(m.yayinda !== false); setOneCikan(!!m.oneCikan);
                        setYuklendi(true);
                    }
                } catch (err) {
                    setBildirim(hataBildirimi(err, baslangic));
                }
            }, [id]);

            useEffect(() => { baslangic(); }, [baslangic]);
            useEffect(() => { setKapakHata(false); }, [kapak]);

            const kategoriSec = (k) => setSecili(s => s.includes(k) ? s.filter(x => x !== k) : s.concat(k));
            const kategoriEkle = () => {
                const k = yeniKat.trim();
                if (!k) return;
                const var_ = kategoriler.find(x => x.toLowerCase() === k.toLowerCase());
                const ad_ = var_ || k;
                if (!var_) setKategoriler(l => l.concat(k));
                setSecili(s => s.some(x => x.toLowerCase() === ad_.toLowerCase()) ? s : s.concat(ad_));
                setYeniKat('');
            };

            const kapakYukle = async (e) => {
                const f = e.target.files && e.target.files[0];
                e.target.value = '';
                if (!f) return;
                const h = dosyaDogrula(f);
                if (h) { setBildirim({ tur: 'hata', mesaj: h }); return; }
                setBildirim(null);
                setMesgul(true); setKapakOran(0);
                try {
                    await yukle([f], setKapakOran, (_, urls) => setKapak(urls[0]));
                } catch (err) {
                    setBildirim(hataBildirimi(err, () => kapakYukle({ target: { files: [f], value: '' } })));
                } finally {
                    setMesgul(false); setKapakOran(null);
                }
            };

            const kaydet = async (e) => {
                if (e) e.preventDefault();
                if (!ad.trim()) { setBildirim({ tur: 'hata', mesaj: 'Seri adı zorunludur.' }); return; }
                setMesgul(true); setBildirim(null);
                const govde = {
                    mangaAdi: ad.trim(), aciklama: aciklama.trim() || null, kapakResmiURL: kapak.trim() || null,
                    yazar: yazar.trim() || null, cizer: cizer.trim() || null, durum, kategoriler: secili, yayinda, oneCikan
                };
                try {
                    await (id ? istek(`/mangas/${id}`, { method: 'PUT', json: govde }) : istek('/mangas', { method: 'POST', json: govde }));
                    setMesaj({ tur: 'basarili', mesaj: id ? `"${govde.mangaAdi}" güncellendi.` : `"${govde.mangaAdi}" serisi eklendi.` });
                    git({ ekran: 'liste' });
                } catch (err) {
                    setBildirim(hataBildirimi(err, () => kaydet()));
                    setMesgul(false);
                }
            };

            return (
                <div>
                    <button className="metin-link" onClick={() => git({ ekran: 'liste' })} disabled={mesgul}>Seriler listesine dön</button>
                    <div className="bolum-baslik"><h2>{id ? 'Seriyi düzenle' : 'Yeni seri'}</h2></div>
                    <Bildirim b={bildirim} kapat={() => setBildirim(null)} />

                    {yuklendi && (
                    <form onSubmit={kaydet} className="form-grid">
                        <div className="form-grubu tam">
                            <label htmlFor="ad">Seri adı *</label>
                            <input id="ad" className="form-input" value={ad} onChange={(e) => setAd(e.target.value)} placeholder="Örn: Wind Breaker" required />
                        </div>

                        <div className="form-grubu">
                            <label htmlFor="yazar">Yazar</label>
                            <input id="yazar" className="form-input" value={yazar} onChange={(e) => setYazar(e.target.value)} />
                        </div>
                        <div className="form-grubu">
                            <label htmlFor="cizer">Çizer</label>
                            <input id="cizer" className="form-input" value={cizer} onChange={(e) => setCizer(e.target.value)} />
                        </div>

                        <div className="form-grubu">
                            <label htmlFor="durum">Durum</label>
                            <select id="durum" className="form-select" value={durum} onChange={(e) => setDurum(e.target.value)}>
                                <option value="DevamEdiyor">Devam ediyor</option>
                                <option value="Tamamlandi">Tamamlandı</option>
                            </select>
                        </div>
                        <div className="form-grubu">
                            <span className="etiket">Görünürlük</span>
                            <label className="secenek"><input type="checkbox" checked={yayinda} onChange={(e) => setYayinda(e.target.checked)} /> Yayında (kapalıysa taslak, ziyaretçiler görmez)</label>
                            <label className="secenek"><input type="checkbox" checked={oneCikan} onChange={(e) => setOneCikan(e.target.checked)} /> Öne çıkan</label>
                        </div>

                        <div className="form-grubu tam">
                            <label htmlFor="aciklama">Açıklama</label>
                            <textarea id="aciklama" className="form-textarea" value={aciklama} onChange={(e) => setAciklama(e.target.value)} placeholder="Serinin konusu"></textarea>
                        </div>

                        <div className="form-grubu tam">
                            <span className="etiket">Kategoriler</span>
                            <div className="cipler">
                                {kategoriler.map(k => (
                                    <button type="button" key={k} className="cip" aria-pressed={secili.includes(k)} onClick={() => kategoriSec(k)}>{k}</button>
                                ))}
                                {secili.filter(k => !kategoriler.includes(k)).map(k => (
                                    <button type="button" key={k} className="cip" aria-pressed="true" onClick={() => kategoriSec(k)}>{k}</button>
                                ))}
                            </div>
                            <div className="satir-ekle">
                                <input className="form-input" aria-label="Yeni kategori" placeholder="Yeni kategori yazın" value={yeniKat}
                                    onChange={(e) => setYeniKat(e.target.value)}
                                    onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); kategoriEkle(); } }} />
                                <button type="button" className="btn" onClick={kategoriEkle}>Ekle</button>
                            </div>
                        </div>

                        <div className="form-grubu tam">
                            <span className="etiket">Kapak görseli</span>
                            <div className="kapak-alan">
                                {kapak && !kapakHata
                                    ? <img className="kapak-onizleme" src={gorselUrl(kapak)} alt="Kapak önizlemesi" onError={() => setKapakHata(true)} />
                                    : <div className="kapak-onizleme">{kapak ? 'Görsel açılamadı' : 'Kapak yok'}</div>}
                                <div className="kapak-yan">
                                    <div>
                                        <input id="kapakDosya" type="file" className="dosya-gizli" accept=".jpg,.jpeg,.png,.webp,.gif,image/*" onChange={kapakYukle} disabled={mesgul} />
                                        <label htmlFor="kapakDosya" className="btn" style={{ cursor: mesgul ? 'default' : 'pointer', opacity: mesgul ? 0.5 : 1 }}>Dosyadan yükle</label>
                                    </div>
                                    <input className="form-input" aria-label="Kapak görseli adresi" type="url" placeholder="veya görsel adresini yapıştırın (https://...)"
                                        value={kapak} onChange={(e) => setKapak(e.target.value)} />
                                    {kapakOran !== null && <Ilerleme oran={kapakOran} etiket="Kapak yükleniyor" />}
                                </div>
                            </div>
                        </div>

                        <div className="tam" style={{ gridColumn: '1 / -1' }}>
                            <div className="eylemler">
                                <button type="submit" className="btn btn-ana" disabled={mesgul}>{mesgul ? 'Lütfen bekleyin...' : (id ? 'Değişiklikleri kaydet' : 'Seriyi ekle')}</button>
                                <button type="button" className="btn" disabled={mesgul} onClick={() => git({ ekran: 'liste' })}>Vazgeç</button>
                            </div>
                            <div className="not">Yalnızca kullanım hakkına sahip olduğunuz görselleri yükleyin.</div>
                        </div>
                    </form>
                    )}
                </div>
            );
        };

        /* ---------- Bölümler ---------- */
        const Bolumler = ({ id, git, can }) => {
            const [manga, setManga] = useState(null);
            const [bildirim, setBildirim] = useState(null);
            const [yukleniyor, setYukleniyor] = useState(true);
            const [silId, setSilId] = useState(null);
            const [mesgul, setMesgul] = useState(false);
            const [duzenId, setDuzenId] = useState(null);
            const [dNo, setDNo] = useState('');
            const [dAd, setDAd] = useState('');

            const [yeniAcik, setYeniAcik] = useState(false);
            const [sekme, setSekme] = useState('dosya');
            const [no, setNo] = useState('');
            const [bAd, setBAd] = useState('');
            const [sayfalar, setSayfalar] = useState([]); // {key, file, name, onizleme, url}
            const [urlMetin, setUrlMetin] = useState('');
            const [uzerinde, setUzerinde] = useState(false);
            const [oran, setOran] = useState(null);
            const sayac = useRef(0);
            const sayfalarRef = useRef([]);
            sayfalarRef.current = sayfalar;

            useEffect(() => () => sayfalarRef.current.forEach(s => s.onizleme && URL.revokeObjectURL(s.onizleme)), []);

            const getir = useCallback(async () => {
                setYukleniyor(true);
                try {
                    const { veri } = await istek(`/mangas/${id}`);
                    setManga(veri);
                    setBildirim(null);
                } catch (err) {
                    setBildirim(hataBildirimi(err, getir));
                } finally {
                    setYukleniyor(false);
                }
            }, [id]);

            useEffect(() => { getir(); }, [getir]);

            const sonrakiNo = () => {
                const nolar = (manga && manga.bolumler || []).map(b => b.bolumNo);
                return nolar.length ? Math.floor(Math.max(...nolar)) + 1 : 1;
            };

            const yeniAc = () => { setYeniAcik(true); if (!no) setNo(String(sonrakiNo())); };

            const bolumSil = async (b) => {
                setMesgul(true); setBildirim(null);
                try {
                    await istek(`/chapters/${b.id}`, { method: 'DELETE' });
                    setSilId(null);
                    setBildirim({ tur: 'basarili', mesaj: `Bölüm ${noYaz(b.bolumNo)} silindi.` });
                    await getir();
                    setBildirim({ tur: 'basarili', mesaj: `Bölüm ${noYaz(b.bolumNo)} silindi.` });
                } catch (err) {
                    setBildirim(hataBildirimi(err, () => bolumSil(b)));
                } finally {
                    setMesgul(false);
                }
            };

            const duzenAc = (b) => {
                setDuzenId(duzenId === b.id ? null : b.id); setSilId(null);
                setDNo(String(b.bolumNo));
                setDAd(b.bolumAdi && b.bolumAdi !== `Bölüm ${noYaz(b.bolumNo)}` ? b.bolumAdi : '');
            };
            const duzenKaydet = async (b) => {
                const n = parseFloat(String(dNo).replace(',', '.'));
                if (!Number.isFinite(n) || n <= 0) { setBildirim({ tur: 'hata', mesaj: 'Geçerli bir bölüm numarası girin (örn: 12 veya 12.5).' }); return; }
                setMesgul(true); setBildirim(null);
                try {
                    await istek(`/chapters/${b.id}`, { method: 'PUT', json: { bolumNo: n, bolumAdi: dAd.trim() || null } });
                    setDuzenId(null);
                    await getir();
                    setBildirim({ tur: 'basarili', mesaj: `Bölüm ${noYaz(n)} güncellendi.` });
                } catch (err) {
                    setBildirim(hataBildirimi(err, () => duzenKaydet(b)));
                } finally { setMesgul(false); }
            };

            const dosyaEkle = (liste) => {
                const dosyalar = Array.from(liste || []);
                if (!dosyalar.length) return;
                const hatalar = [];
                const gecerli = [];
                dosyalar.forEach(f => { const h = dosyaDogrula(f); if (h) hatalar.push(h); else gecerli.push(f); });
                gecerli.sort(dogalSirala);
                let kabul = gecerli;
                const yer = MAX_DOSYA - sayfalarRef.current.length;
                if (gecerli.length > yer) {
                    hatalar.push(`Bir bölümde en fazla ${MAX_DOSYA} sayfa olabilir; fazla dosyalar eklenmedi.`);
                    kabul = gecerli.slice(0, Math.max(0, yer));
                }
                const yeni = kabul.map(f => ({ key: ++sayac.current, file: f, name: f.name, onizleme: URL.createObjectURL(f), url: null }));
                setSayfalar(s => s.concat(yeni));
                setBildirim(hatalar.length ? { tur: 'hata', mesaj: hatalar.join(' ') } : null);
            };

            const tasi = (i, yon) => setSayfalar(s => {
                const j = i + yon;
                if (j < 0 || j >= s.length) return s;
                const k = s.slice(); const t = k[i]; k[i] = k[j]; k[j] = t; return k;
            });
            const kaldir = (key) => setSayfalar(s => {
                const x = s.find(p => p.key === key);
                if (x && x.onizleme) URL.revokeObjectURL(x.onizleme);
                return s.filter(p => p.key !== key);
            });
            const adaGoreSirala = () => setSayfalar(s => s.slice().sort(dogalSirala));

            const formuTemizle = () => {
                sayfalarRef.current.forEach(s => s.onizleme && URL.revokeObjectURL(s.onizleme));
                setSayfalar([]); setUrlMetin(''); setBAd(''); setNo(''); setYeniAcik(false); setOran(null); setSekme('dosya');
            };

            const kaydet = async () => {
                const bolumNo = parseFloat(String(no).replace(',', '.'));
                if (!Number.isFinite(bolumNo) || bolumNo <= 0) { setBildirim({ tur: 'hata', mesaj: 'Geçerli bir bölüm numarası girin (örn: 12 veya 12.5).' }); return; }
                let urller = [];
                if (sekme === 'url') {
                    urller = urlMetin.split('\n').map(s => s.trim()).filter(Boolean);
                    const kotu = urller.find(u => !/^https?:\/\//i.test(u));
                    if (kotu) { setBildirim({ tur: 'hata', mesaj: `Geçersiz adres: ${kotu}` }); return; }
                } else if (!sayfalarRef.current.length) {
                    setBildirim({ tur: 'hata', mesaj: 'En az bir sayfa görseli ekleyin.' }); return;
                }
                if (sekme === 'url' && !urller.length) { setBildirim({ tur: 'hata', mesaj: 'En az bir sayfa adresi girin.' }); return; }

                setMesgul(true); setBildirim(null);
                try {
                    if (sekme === 'dosya') {
                        const bekleyen = sayfalarRef.current.filter(p => !p.url);
                        if (bekleyen.length) {
                            setOran(0);
                            await yukle(bekleyen.map(p => p.file), setOran, (bas, urls) => {
                                const anahtarlar = bekleyen.slice(bas, bas + urls.length).map(p => p.key);
                                setSayfalar(s => s.map(p => { const k = anahtarlar.indexOf(p.key); return k >= 0 ? { ...p, url: urls[k] } : p; }));
                                anahtarlar.forEach((key, k) => { const p = sayfalarRef.current.find(x => x.key === key); if (p) p.url = urls[k]; });
                            });
                        }
                        urller = sayfalarRef.current.map(p => p.url);
                    }
                    await istek('/chapters', { method: 'POST', json: { mangaId: Number(id), bolumNo, bolumAdi: bAd.trim() || null, sayfalar: urller } });
                    formuTemizle();
                    await getir();
                    setBildirim({ tur: 'basarili', mesaj: `Bölüm ${noYaz(bolumNo)} kaydedildi (${urller.length} sayfa).` });
                } catch (err) {
                    setBildirim(hataBildirimi(err, kaydet));
                } finally {
                    setMesgul(false); setOran(null);
                }
            };

            const bolumler = manga ? manga.bolumler || [] : [];
            const noVar = bolumler.some(b => b.bolumNo === parseFloat(String(no).replace(',', '.')));

            return (
                <div>
                    <button className="metin-link" onClick={() => git({ ekran: 'liste' })} disabled={mesgul}>Seriler listesine dön</button>
                    <div className="bolum-baslik">
                        <div>
                            <h2>{manga ? manga.mangaAdi : 'Bölümler'}</h2>
                            <div className="ikincil">{manga ? `${bolumler.length} bölüm` : ''}</div>
                        </div>
                        {manga && !yeniAcik && can('bolum.yaz') && <button className="btn btn-ana" onClick={yeniAc}>Yeni bölüm</button>}
                    </div>

                    <Bildirim b={bildirim} kapat={() => setBildirim(null)} />
                    {yukleniyor && !manga && <div className="bos">Yükleniyor...</div>}

                    {manga && yeniAcik && can('bolum.yaz') && (
                        <div style={{ border: '1px solid var(--border-renk)', borderRadius: 2, padding: 16, marginBottom: 28 }}>
                            <h3>Yeni bölüm</h3>
                            <div className="form-grid">
                                <div className="form-grubu">
                                    <label htmlFor="bno">Bölüm numarası *</label>
                                    <input id="bno" className="form-input" inputMode="decimal" value={no} onChange={(e) => setNo(e.target.value)} placeholder="12 veya 12.5" disabled={mesgul} />
                                </div>
                                <div className="form-grubu">
                                    <label htmlFor="bad">Bölüm adı</label>
                                    <input id="bad" className="form-input" value={bAd} onChange={(e) => setBAd(e.target.value)} placeholder="İsteğe bağlı" disabled={mesgul} />
                                </div>
                            </div>
                            {noVar && <div className="ikincil" style={{ marginBottom: 16 }}>Bu numarada bir bölüm zaten var; sayfalar mevcut bölümün sonuna eklenir.</div>}

                            <div className="tab-secici" role="tablist">
                                <button type="button" role="tab" aria-selected={sekme === 'dosya'} className={`tab-btn ${sekme === 'dosya' ? 'aktif' : ''}`} onClick={() => setSekme('dosya')} disabled={mesgul}>Dosyadan yükle</button>
                                <button type="button" role="tab" aria-selected={sekme === 'url'} className={`tab-btn ${sekme === 'url' ? 'aktif' : ''}`} onClick={() => setSekme('url')} disabled={mesgul}>URL ile ekle</button>
                            </div>

                            {sekme === 'dosya' ? (
                                <div>
                                    <div className={`birak-alan ${uzerinde ? 'uzerinde' : ''}`}
                                        onDragOver={(e) => { e.preventDefault(); setUzerinde(true); }}
                                        onDragLeave={() => setUzerinde(false)}
                                        onDrop={(e) => { e.preventDefault(); setUzerinde(false); if (!mesgul) dosyaEkle(e.dataTransfer.files); }}>
                                        <p>Sayfa görsellerini buraya sürükleyin veya seçin. Dosyalar ada göre otomatik sıralanır.</p>
                                        <input id="sayfaDosya" type="file" multiple className="dosya-gizli" accept=".jpg,.jpeg,.png,.webp,.gif,image/*"
                                            onChange={(e) => { dosyaEkle(e.target.files); e.target.value = ''; }} disabled={mesgul} />
                                        <label htmlFor="sayfaDosya" className="btn" style={{ cursor: mesgul ? 'default' : 'pointer', opacity: mesgul ? 0.5 : 1 }}>Dosya seç</label>
                                    </div>

                                    {sayfalar.length > 0 && (
                                        <div style={{ marginTop: 16 }}>
                                            <div className="bolum-baslik" style={{ marginBottom: 8 }}>
                                                <span className="ikincil">{sayfalar.length} sayfa</span>
                                                <button type="button" className="btn" onClick={adaGoreSirala} disabled={mesgul}>Ada göre sırala</button>
                                            </div>
                                            <div className="liste">
                                                {sayfalar.map((p, i) => (
                                                    <div className="satir sayfa-satir" key={p.key}>
                                                        <span className="satir-no">{i + 1}</span>
                                                        <img className="satir-kucuk" src={p.onizleme} alt="" />
                                                        <div className="satir-bilgi">
                                                            <div className="satir-ad" style={{ fontSize: '0.85rem', fontWeight: 400 }}>{p.name}</div>
                                                            {p.url && <div className="satir-alt">Yüklendi</div>}
                                                        </div>
                                                        <div className="eylemler">
                                                            <button type="button" className="btn" aria-label="Yukarı taşı" onClick={() => tasi(i, -1)} disabled={mesgul || i === 0}>Yukarı</button>
                                                            <button type="button" className="btn" aria-label="Aşağı taşı" onClick={() => tasi(i, 1)} disabled={mesgul || i === sayfalar.length - 1}>Aşağı</button>
                                                            <button type="button" className="btn btn-tehlike" aria-label="Kaldır" onClick={() => kaldir(p.key)} disabled={mesgul}>Kaldır</button>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            ) : (
                                <div className="form-grubu">
                                    <label htmlFor="urlMetin">Sayfa adresleri (her satıra bir adres, sırasıyla)</label>
                                    <textarea id="urlMetin" className="form-textarea" rows="6" value={urlMetin} onChange={(e) => setUrlMetin(e.target.value)} disabled={mesgul}
                                        placeholder={'https://ornek.com/bolum1/001.jpg\nhttps://ornek.com/bolum1/002.jpg'}></textarea>
                                </div>
                            )}

                            {oran !== null && <Ilerleme oran={oran} etiket="Görseller yükleniyor" />}

                            <div className="eylemler" style={{ marginTop: 20 }}>
                                <button type="button" className="btn btn-ana" onClick={kaydet} disabled={mesgul}>{mesgul ? 'Kaydediliyor...' : 'Bölümü kaydet'}</button>
                                <button type="button" className="btn" onClick={formuTemizle} disabled={mesgul}>Vazgeç</button>
                            </div>
                            <div className="not">Yalnızca kullanım hakkına sahip olduğunuz görselleri yükleyin.</div>
                        </div>
                    )}

                    {manga && (
                        <div>
                            <h3>Mevcut bölümler</h3>
                            <div className="liste">
                                {bolumler.map(b => (
                                    <div key={b.id}>
                                        <div className="satir">
                                            <div className="satir-bilgi">
                                                <div className="satir-ad">Bölüm {noYaz(b.bolumNo)}{b.bolumAdi && b.bolumAdi !== `Bölüm ${noYaz(b.bolumNo)}` ? ` - ${b.bolumAdi}` : ''}</div>
                                                <div className="satir-alt">{b.sayfaSayisi} sayfa · {tarihYaz(b.yayinTarihi)}</div>
                                            </div>
                                            <div className="eylemler">
                                                {can('bolum.duzenle') && <button className="btn" disabled={mesgul} onClick={() => duzenAc(b)}>Düzenle</button>}
                                                {(can('bolum.duzenle') || can('bolum.yaz')) && <button className="btn" disabled={mesgul} onClick={() => git({ ekran: 'sayfalar', id: b.id, mangaId: id })}>Sayfalar</button>}
                                                {can('bolum.sil') && <button className="btn btn-tehlike" disabled={mesgul} onClick={() => { setSilId(silId === b.id ? null : b.id); setDuzenId(null); }}>Sil</button>}
                                            </div>
                                        </div>
                                        {can('bolum.duzenle') && duzenId === b.id && (
                                            <div className="kutu" style={{ margin: '12px 0' }}>
                                                <div className="form-grid">
                                                    <div className="form-grubu">
                                                        <label htmlFor={`dno${b.id}`}>Bölüm numarası</label>
                                                        <input id={`dno${b.id}`} className="form-input" inputMode="decimal" value={dNo} onChange={(e) => setDNo(e.target.value)} disabled={mesgul} />
                                                    </div>
                                                    <div className="form-grubu">
                                                        <label htmlFor={`dad${b.id}`}>Bölüm adı</label>
                                                        <input id={`dad${b.id}`} className="form-input" value={dAd} onChange={(e) => setDAd(e.target.value)} placeholder="İsteğe bağlı" disabled={mesgul} />
                                                    </div>
                                                </div>
                                                <div className="eylemler">
                                                    <button className="btn btn-ana" disabled={mesgul} onClick={() => duzenKaydet(b)}>{mesgul ? 'Kaydediliyor...' : 'Kaydet'}</button>
                                                    <button className="btn" disabled={mesgul} onClick={() => setDuzenId(null)}>Vazgeç</button>
                                                </div>
                                            </div>
                                        )}
                                        {can('bolum.sil') && silId === b.id && (
                                            <div className="onay-kutu" style={{ margin: '12px 0' }}>
                                                <p>Bölüm {noYaz(b.bolumNo)} ve sayfaları kalıcı olarak silinecek. Emin misiniz?</p>
                                                <div className="eylemler">
                                                    <button className="btn btn-tehlike" disabled={mesgul} onClick={() => bolumSil(b)}>{mesgul ? 'Siliniyor...' : 'Evet, sil'}</button>
                                                    <button className="btn" disabled={mesgul} onClick={() => setSilId(null)}>Vazgeç</button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                            {bolumler.length === 0 && <div className="bos">Bu seride henüz bölüm yok.</div>}
                        </div>
                    )}
                </div>
            );
        };

        /* ---------- Sayfa sıra numarası girişi ---------- */
        const SiraGirdisi = ({ mevcut, toplam, kilit, tasi }) => {
            const [deger, setDeger] = useState(String(mevcut));
            const uygula = () => {
                const n = parseInt(deger, 10);
                if (!Number.isFinite(n)) { setDeger(String(mevcut)); return; }
                const h = Math.min(Math.max(n, 1), toplam);
                setDeger(String(h));
                if (h !== mevcut) tasi(h);
            };
            return (
                <div className="form-grubu" style={{ margin: '6px 0' }}>
                    <label htmlFor={`sira${mevcut}`} className="ikincil">Sıra numarası (1-{toplam})</label>
                    <input id={`sira${mevcut}`} type="number" className="form-input" min="1" max={toplam} value={deger} disabled={kilit}
                        onChange={(e) => setDeger(e.target.value)} onBlur={uygula}
                        onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); uygula(); } }} />
                </div>
            );
        };

        /* ---------- Sayfa yöneticisi ---------- */
        const SayfaYoneticisi = ({ bolumId, mangaId, git, can }) => {
            const [veri, setVeri] = useState(null);
            const [sira, setSira] = useState([]);
            const [kirli, setKirli] = useState(false);
            const [bildirim, setBildirim] = useState(null);
            const [mesgul, setMesgul] = useState(false);
            const [silId, setSilId] = useState(null);
            const [oran, setOran] = useState(null);
            const [ekleAcik, setEkleAcik] = useState(false);
            const [sekme, setSekme] = useState('dosya');
            const [urlMetin, setUrlMetin] = useState('');
            const duzenleyebilir = can('bolum.duzenle');

            const getir = useCallback(async () => {
                try {
                    const { veri: v } = await istek(`/admin/chapters/${bolumId}/sayfalar`);
                    setVeri(v);
                    setSira((v.sayfalar || []).slice().sort((a, b) => a.sayfaNo - b.sayfaNo));
                    setKirli(false);
                } catch (err) {
                    setBildirim(hataBildirimi(err, getir));
                }
            }, [bolumId]);
            useEffect(() => { getir(); }, [getir]);

            useEffect(() => {
                if (!kirli) return;
                const f = (e) => { e.preventDefault(); e.returnValue = ''; };
                window.addEventListener('beforeunload', f);
                return () => window.removeEventListener('beforeunload', f);
            }, [kirli]);

            const geri = () => {
                if (kirli && !window.confirm('Kaydedilmemiş sıra değişikliği var. Yine de çıkılsın mı?')) return;
                git({ ekran: 'bolumler', id: mangaId });
            };

            const tasi = (i, yon) => setSira(s => {
                const j = i + yon;
                if (j < 0 || j >= s.length) return s;
                const k = s.slice(); const t = k[i]; k[i] = k[j]; k[j] = t; return k;
            });
            // Bir sayfayı doğrudan hedef sıraya taşır (sürükle-bırak ve sıra numarası girişi ortak kullanır)
            const hedefeTasi = (i, j) => setSira(s => {
                if (j < 0 || j >= s.length || i === j) return s;
                const k = s.slice(); const [oge] = k.splice(i, 1); k.splice(j, 0, oge); return k;
            });
            const [surukle, setSurukle] = useState(null);
            const [uzerinde, setUzerinde] = useState(null);
            // Taşıma sonrası kirli durumu: sıra, sunucudaki sıradan farklı mı
            useEffect(() => {
                if (!veri) return;
                const orijinal = (veri.sayfalar || []).slice().sort((a, b) => a.sayfaNo - b.sayfaNo).map(p => p.id).join(',');
                setKirli(sira.map(p => p.id).join(',') !== orijinal);
            }, [sira, veri]);

            const calistir = async (is, basari) => {
                setMesgul(true); setBildirim(null);
                try { await is(); await getir(); setBildirim({ tur: 'basarili', mesaj: basari }); return true; }
                catch (err) { setBildirim(hataBildirimi(err)); return false; }
                finally { setMesgul(false); setOran(null); }
            };

            const siraKaydet = () => calistir(
                () => istek(`/admin/chapters/${bolumId}/sayfalar/siralama`, { method: 'PUT', json: { idler: sira.map(p => p.id) } }),
                'Sayfa sırası kaydedildi.');

            const degistir = async (p, e) => {
                const f = e.target.files && e.target.files[0];
                e.target.value = '';
                if (!f) return;
                const h = dosyaDogrula(f);
                if (h) { setBildirim({ tur: 'hata', mesaj: h }); return; }
                await calistir(async () => {
                    setOran(0);
                    let url = null;
                    await yukle([f], setOran, (_, urls) => { url = urls[0]; });
                    await istek(`/admin/sayfalar/${p.id}`, { method: 'PUT', json: { resimURL: url } });
                }, `Sayfa ${p.sayfaNo} görseli değiştirildi.`);
            };

            const sil = async (p) => {
                if (await calistir(() => istek(`/admin/sayfalar/${p.id}`, { method: 'DELETE' }), `Sayfa ${p.sayfaNo} silindi; sonraki sayfalar yeniden numaralandı.`)) setSilId(null);
            };

            const dosyaEkle = async (e) => {
                const dosyalar = Array.from(e.target.files || []);
                e.target.value = '';
                if (!dosyalar.length) return;
                const hatalar = dosyalar.map(dosyaDogrula).filter(Boolean);
                if (hatalar.length) { setBildirim({ tur: 'hata', mesaj: hatalar.join(' ') }); return; }
                dosyalar.sort(dogalSirala);
                if (await calistir(async () => {
                    setOran(0);
                    const hepsi = [];
                    await yukle(dosyalar, setOran, (_, urls) => hepsi.push(...urls));
                    await istek(`/admin/chapters/${bolumId}/sayfalar`, { method: 'POST', json: { urller: hepsi } });
                }, `${dosyalar.length} sayfa eklendi.`)) setEkleAcik(false);
            };

            const urlEkle = async () => {
                const urller = urlMetin.split('\n').map(s => s.trim()).filter(Boolean);
                if (!urller.length) { setBildirim({ tur: 'hata', mesaj: 'En az bir sayfa adresi girin.' }); return; }
