                const kotu = urller.find(u => !(/^https?:\/\//i.test(u) || u.startsWith('/uploads/')) || u.length > 500);
                if (kotu) { setBildirim({ tur: 'hata', mesaj: `Geçersiz adres: ${kotu}` }); return; }
                if (await calistir(() => istek(`/admin/chapters/${bolumId}/sayfalar`, { method: 'POST', json: { urller } }), `${urller.length} sayfa eklendi.`)) { setUrlMetin(''); setEkleAcik(false); }
            };

            const eklenebilir = can('bolum.duzenle') || can('bolum.yaz');
            const kilit = mesgul || kirli;

            return (
                <div>
                    <button className="metin-link" onClick={geri} disabled={mesgul}>Bölümler listesine dön</button>
                    <div className="bolum-baslik">
                        <div>
                            <h2>{veri ? `${veri.mangaAdi} · Bölüm ${noYaz(veri.bolumNo)}` : 'Sayfalar'}</h2>
                            <div className="ikincil">{veri ? `${sira.length} sayfa${veri.bolumAdi ? ' · ' + veri.bolumAdi : ''}` : ''}</div>
                        </div>
                        <div className="eylemler">
                            {duzenleyebilir && kirli && <button className="btn btn-ana" disabled={mesgul} onClick={siraKaydet}>Sırayı kaydet</button>}
                            {duzenleyebilir && kirli && <button className="btn" disabled={mesgul} onClick={() => getir()}>Sırayı sıfırla</button>}
                            {eklenebilir && !ekleAcik && <button className="btn" disabled={kilit} onClick={() => setEkleAcik(true)}>Sayfa ekle</button>}
                        </div>
                    </div>

                    <Bildirim b={bildirim} kapat={() => setBildirim(null)} />
                    {kirli && <div className="kilit-not">Sıra değişti ve henüz kaydedilmedi. Kaydedene kadar sayfa değiştirme, silme ve ekleme kapalıdır.</div>}
                    {oran !== null && <Ilerleme oran={oran} etiket="Görsel yükleniyor" />}

                    {ekleAcik && eklenebilir && (
                        <div className="kutu" style={{ marginTop: 16 }}>
                            <h3>Sayfa ekle (bölümün sonuna)</h3>
                            <div className="tab-secici" role="tablist">
                                <button type="button" role="tab" aria-selected={sekme === 'dosya'} className={`tab-btn ${sekme === 'dosya' ? 'aktif' : ''}`} onClick={() => setSekme('dosya')}>Dosyadan yükle</button>
                                <button type="button" role="tab" aria-selected={sekme === 'url'} className={`tab-btn ${sekme === 'url' ? 'aktif' : ''}`} onClick={() => setSekme('url')}>URL ile ekle</button>
                            </div>
                            {sekme === 'dosya' ? (
                                <div>
                                    <input id="ekleDosya" type="file" multiple className="dosya-gizli" accept=".jpg,.jpeg,.png,.webp,.gif,image/*" onChange={dosyaEkle} disabled={mesgul} />
                                    <label htmlFor="ekleDosya" className="btn" style={{ cursor: mesgul ? 'default' : 'pointer', opacity: mesgul ? 0.5 : 1 }}>Dosya seç</label>
                                    <div className="not">Dosyalar ada göre sıralanarak eklenir.</div>
                                </div>
                            ) : (
                                <div>
                                    <div className="form-grubu">
                                        <label htmlFor="ekleUrl">Sayfa adresleri (her satıra bir adres, sırasıyla)</label>
                                        <textarea id="ekleUrl" className="form-textarea" rows="5" value={urlMetin} onChange={(e) => setUrlMetin(e.target.value)} disabled={mesgul}
                                            placeholder={'https://ornek.com/001.jpg\nhttps://ornek.com/002.jpg'}></textarea>
                                    </div>
                                    <button type="button" className="btn btn-ana" disabled={mesgul} onClick={urlEkle}>{mesgul ? 'Ekleniyor...' : 'Sayfaları ekle'}</button>
                                </div>
                            )}
                            <div className="eylemler" style={{ marginTop: 14 }}>
                                <button type="button" className="btn" disabled={mesgul} onClick={() => setEkleAcik(false)}>Kapat</button>
                            </div>
                        </div>
                    )}

                    {!veri && !bildirim && <div className="bos">Yükleniyor...</div>}
                    {veri && sira.length === 0 && <div className="bos">Bu bölümde henüz sayfa yok.</div>}
                    <ul className="sayfa-izgara" style={{ marginTop: 20 }}>
                        {sira.map((p, i) => (
                            <li className="sayfa-kart" key={p.id}
                                draggable={duzenleyebilir && !mesgul}
                                onDragStart={(e) => { setSurukle(i); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(i)); }}
                                onDragOver={(e) => { if (surukle !== null) { e.preventDefault(); setUzerinde(i); } }}
                                onDrop={(e) => { e.preventDefault(); if (surukle !== null) hedefeTasi(surukle, i); setSurukle(null); setUzerinde(null); }}
                                onDragEnd={() => { setSurukle(null); setUzerinde(null); }}
                                style={{ opacity: surukle === i ? 0.4 : 1, outline: uzerinde === i && surukle !== null && surukle !== i ? '2px solid #c0392b' : undefined, cursor: duzenleyebilir ? 'grab' : undefined }}>
                                <img src={gorselUrl(p.resimURL)} alt={`Sayfa ${i + 1} önizlemesi`} draggable="false" loading="lazy" onError={(e) => { e.target.style.visibility = 'hidden'; }} />
                                <div className="sira">Sayfa {i + 1}{kirli && p.sayfaNo !== i + 1 ? ` (şu an ${p.sayfaNo})` : ''}</div>
                                {duzenleyebilir && (
                                    <React.Fragment>
                                        <div className="eylemler">
                                            <button type="button" className="btn" aria-label={`Sayfa ${i + 1} yukarı taşı`} disabled={mesgul || i === 0} onClick={() => tasi(i, -1)}>Yukarı</button>
                                            <button type="button" className="btn" aria-label={`Sayfa ${i + 1} aşağı taşı`} disabled={mesgul || i === sira.length - 1} onClick={() => tasi(i, 1)}>Aşağı</button>
                                        </div>
                                        <SiraGirdisi key={`${p.id}-${i}`} mevcut={i + 1} toplam={sira.length} kilit={mesgul} tasi={(h) => hedefeTasi(i, h - 1)} />
                                        <input id={`deg${p.id}`} type="file" className="dosya-gizli" accept=".jpg,.jpeg,.png,.webp,.gif,image/*" onChange={(e) => degistir(p, e)} disabled={kilit} />
                                        <label htmlFor={`deg${p.id}`} className="btn tam-btn" style={{ cursor: kilit ? 'default' : 'pointer', opacity: kilit ? 0.5 : 1 }}>Değiştir</label>
                                        <button type="button" className="btn btn-tehlike tam-btn" disabled={kilit} onClick={() => setSilId(silId === p.id ? null : p.id)}>Sil</button>
                                        {silId === p.id && (
                                            <div className="onay-kutu">
                                                <p>Sayfa {i + 1} kalıcı olarak silinecek. Emin misiniz?</p>
                                                <div className="eylemler">
                                                    <button type="button" className="btn btn-tehlike" disabled={mesgul} onClick={() => sil(p)}>Evet, sil</button>
                                                    <button type="button" className="btn" disabled={mesgul} onClick={() => setSilId(null)}>Vazgeç</button>
                                                </div>
                                            </div>
                                        )}
                                    </React.Fragment>
                                )}
                            </li>
                        ))}
                    </ul>
                </div>
            );
        };

        /* ---------- İzin onay kutuları (gruplu) ---------- */
        const izinGrubu = (anahtar) => /^(manga|bolum|kategori|yorum)\./.test(anahtar) ? 'İçerik' : /^kullanici\./.test(anahtar) ? 'Kullanıcılar' : 'Site';
        const IzinSecici = ({ tum, secili, setSecili, kilit }) => {
            const gruplar = ['İçerik', 'Kullanıcılar', 'Site'].map(g => [g, tum.filter(y => izinGrubu(y.anahtar) === g)]).filter(([, l]) => l.length);
            const degis = (a) => setSecili(secili.includes(a) ? secili.filter(x => x !== a) : secili.concat(a));
            return (
                <div>
                    <div className="eylemler" style={{ margin: '4px 0 8px' }}>
                        <button type="button" className="btn" disabled={kilit} onClick={() => setSecili(tum.map(y => y.anahtar))}>Hepsini seç</button>
                        <button type="button" className="btn" disabled={kilit} onClick={() => setSecili([])}>Temizle</button>
                        <span className="ikincil" style={{ alignSelf: 'center' }}>{secili.length} / {tum.length} izin seçili</span>
                    </div>
                    {gruplar.map(([g, l]) => (
                        <div key={g}>
                            <div className="grup-baslik">{g.toLocaleUpperCase('tr-TR')}</div>
                            <div className="izin-liste" style={{ marginTop: 6 }}>
                                {l.map(y => (
                                    <label className="izin" key={y.anahtar}>
                                        <input type="checkbox" checked={secili.includes(y.anahtar)} disabled={kilit} onChange={() => degis(y.anahtar)} />
                                        <span>
                                            <span className="izin-ad" style={{ display: 'block' }}>{y.ad}</span>
                                            {y.aciklama && <span className="izin-acik" style={{ display: 'block' }}>{y.aciklama}</span>}
                                        </span>
                                    </label>
                                ))}
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        /* ---------- Sayfalı liste kancası (daha fazla göster) ---------- */
        function useSayfali(yol, ekParam, BOYUT = 20) {
            const [liste, setListe] = useState([]);
            const [toplam, setToplam] = useState(0);
            const [yukleniyor, setYukleniyor] = useState(true);
            const [bildirim, setBildirim] = useState(null);
            const getir = useCallback(async (sayfa, ekle) => {
                setYukleniyor(true); setBildirim(null);
                try {
                    const { veri, yanit } = await istek(`${yol}?${ekParam}page=${sayfa}&pageSize=${BOYUT}`);
                    const l = Array.isArray(veri) ? veri : [];
                    setListe(o => ekle ? o.concat(l) : l);
                    const tc = parseInt(yanit.headers.get('X-Total-Count'), 10);
                    setToplam(Number.isFinite(tc) ? tc : l.length);
                } catch (err) {
                    setBildirim(hataBildirimi(err, () => getir(sayfa, ekle)));
                } finally { setYukleniyor(false); }
            }, [yol, ekParam]);
            useEffect(() => { getir(1, false); }, [getir]);
            const dahaFazla = () => getir(Math.floor(liste.length / BOYUT) + 1, true);
            return { liste, setListe, toplam, setToplam, yukleniyor, bildirim, setBildirim, yenile: () => getir(1, false), dahaFazla };
        }

        const DahaFazla = ({ s }) => (!s.yukleniyor && s.liste.length < s.toplam) ? (
            <div style={{ marginTop: 16 }}><button className="btn" onClick={s.dahaFazla}>Daha fazla göster</button></div>
        ) : null;

        /* ---------- Özet ---------- */
        const GRAFIK_TURLERI = [
            ['yeniKullanici', 'Yeni kayıt', 'yeni kayıt'],
            ['yeniYorum', 'Yeni yorum', 'yeni yorum'],
            ['yeniBolum', 'Yeni bölüm', 'yeni bölüm']
        ];
        const gunYaz = (s) => {
            const p = String(s).split('-').map(Number);
            const d = new Date(p[0], (p[1] || 1) - 1, p[2] || 1);
            return isNaN(d.getTime()) ? String(s) : d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long' });
        };

        const Grafik = ({ ist }) => {
            const [tur, setTur] = useState('yeniKullanici');
            const t = GRAFIK_TURLERI.find(x => x[0] === tur);
            const gunler = ist.gunler || [];
            const en = Math.max(1, ...gunler.map(g => g[tur] || 0));
            return (
                <div>
                    <div className="tab-secici" role="tablist" aria-label="Grafik türü">
                        {GRAFIK_TURLERI.map(([k, ad]) => (
                            <button type="button" key={k} role="tab" aria-selected={tur === k} className={`tab-btn ${tur === k ? 'aktif' : ''}`} onClick={() => setTur(k)}>
                                {ad}<span className="sayi">{ist.toplam ? ist.toplam[k] : ''}</span>
                            </button>
                        ))}
                    </div>
                    {gunler.length === 0 ? <div className="bos">Bu aralık için veri yok.</div> : (
                        <div>
                            <ul className="grafik" aria-label={`Son ${gunler.length} gün: ${t[1].toLowerCase()}`}>
                                {gunler.map(g => {
                                    const n = g[tur] || 0;
                                    const etiket = `${gunYaz(g.tarih)}: ${n} ${t[2]}`;
                                    return (
                                        <li key={g.tarih} title={etiket} aria-label={etiket}>
                                            <span className="deger" aria-hidden="true">{n > 0 ? n : ''}</span>
                                            <div className={`cubuk ${n === 0 ? 'sifir' : ''}`} style={{ height: `calc((100% - 16px) * ${n / en})` }}></div>
                                        </li>
                                    );
                                })}
                            </ul>
                            <ul className="grafik-etiket" aria-hidden="true">
                                {gunler.map(g => <li key={g.tarih}>{Number(String(g.tarih).split('-')[2])}</li>)}
                            </ul>
                            <div className="ikincil">{gunYaz(gunler[0].tarih)} - {gunYaz(gunler[gunler.length - 1].tarih)} arası günlük sayılar</div>
                        </div>
                    )}
                </div>
            );
        };

        const Ozet = () => {
            const [o, setO] = useState(null);
            const [ist, setIst] = useState(null);
            const [istHata, setIstHata] = useState(false);
            const [bildirim, setBildirim] = useState(null);
            const getir = useCallback(async () => {
                try { const { veri } = await istek('/admin/ozet'); setO(veri); setBildirim(null); }
                catch (err) { setBildirim(hataBildirimi(err, getir)); }
                try { const { veri } = await istek('/admin/istatistik?gun=14'); setIst(veri); setIstHata(false); }
                catch (err) { setIstHata(true); }
            }, []);
            useEffect(() => { getir(); }, [getir]);
            const kartlar = o ? [['Seri', o.mangaSayisi], ['Bölüm', o.bolumSayisi], ['Sayfa', o.sayfaSayisi], ['Kullanıcı', o.kullaniciSayisi], ['Yorum', o.yorumSayisi]] : [];
            return (
                <div>
                    <div className="bolum-baslik"><h2>Özet</h2></div>
                    <Bildirim b={bildirim} kapat={() => setBildirim(null)} />
                    {!o && !bildirim && <div className="bos">Yükleniyor...</div>}
                    {o && (
                        <div>
                            <div className="kartlar">
                                {kartlar.map(([ad, sayi]) => (
                                    <div className="kart" key={ad}><div className="kart-sayi">{sayi}</div><div className="kart-ad">{ad}</div></div>
                                ))}
                            </div>
                            <h3>Son 14 gün</h3>
                            <div className="kutu">
                                {ist ? <Grafik ist={ist} /> : <div className="bos">{istHata ? 'İstatistikler yüklenemedi.' : 'Yükleniyor...'}</div>}
                            </div>
                            <h3>Son eklenen seriler</h3>
                            <div className="liste">
                                {(o.sonMangalar || []).map(m => (
                                    <div className="satir" key={m.id}>
                                        <div className="satir-bilgi"><div className="satir-ad">{m.mangaAdi}</div></div>
                                        <div className="satir-alt">{tarihYaz(m.eklenmeTarihi)}</div>
                                    </div>
                                ))}
                            </div>
                            {(!o.sonMangalar || o.sonMangalar.length === 0) && <div className="bos">Henüz seri eklenmemiş.</div>}
                        </div>
                    )}
                </div>
            );
        };

        /* ---------- Kategoriler ---------- */
        const Kategoriler = () => {
            const [liste, setListe] = useState(null);
            const [bildirim, setBildirim] = useState(null);
            const [yeni, setYeni] = useState('');
            const [duzenId, setDuzenId] = useState(null);
            const [duzenAd, setDuzenAd] = useState('');
            const [silId, setSilId] = useState(null);
            const [mesgul, setMesgul] = useState(false);
            const getir = useCallback(async () => {
                try { const { veri } = await istek('/categories'); setListe(Array.isArray(veri) ? veri : []); }
                catch (err) { setListe(l => l || []); setBildirim(hataBildirimi(err, getir)); }
            }, []);
            useEffect(() => { getir(); }, [getir]);
            const calistir = async (is, basari) => {
                setMesgul(true); setBildirim(null);
                try { await is(); await getir(); setBildirim({ tur: 'basarili', mesaj: basari }); return true; }
                catch (err) { setBildirim(hataBildirimi(err)); return false; }
                finally { setMesgul(false); }
            };
            const ekle = async (e) => {
                e.preventDefault();
                const ad = yeni.trim();
                if (!ad) return;
                if (await calistir(() => istek('/categories', { method: 'POST', json: { kategoriAdi: ad } }), `"${ad}" eklendi.`)) setYeni('');
            };
            const kaydet = async (k) => {
                const ad = duzenAd.trim();
                if (!ad) return;
                if (await calistir(() => istek(`/categories/${k.id}`, { method: 'PUT', json: { kategoriAdi: ad } }), 'Kategori güncellendi.')) setDuzenId(null);
            };
            const sil = async (k) => {
                if (await calistir(() => istek(`/categories/${k.id}`, { method: 'DELETE' }), `"${k.kategoriAdi}" silindi.`)) setSilId(null);
            };
            return (
                <div>
                    <div className="bolum-baslik"><h2>Kategoriler</h2></div>
                    <Bildirim b={bildirim} kapat={() => setBildirim(null)} />
                    <form className="satir-ekle" style={{ marginTop: 0, marginBottom: 20 }} onSubmit={ekle}>
                        <input className="form-input" aria-label="Yeni kategori adı" placeholder="Yeni kategori adı" value={yeni} onChange={(e) => setYeni(e.target.value)} />
                        <button type="submit" className="btn btn-ana" disabled={mesgul || !yeni.trim()}>Ekle</button>
                    </form>
                    {liste === null && <div className="bos">Yükleniyor...</div>}
                    <div className="liste">
                        {(liste || []).map(k => (
                            <div key={k.id}>
                                <div className="satir">
                                    {duzenId === k.id ? (
                                        <input className="form-input" aria-label="Kategori adı" value={duzenAd} onChange={(e) => setDuzenAd(e.target.value)} style={{ flex: 1, minWidth: 0 }} />
                                    ) : (
                                        <div className="satir-bilgi">
                                            <div className="satir-ad">{k.kategoriAdi}</div>
                                            <div className="satir-alt">{k.mangaSayisi} seri</div>
                                        </div>
                                    )}
                                    <div className="eylemler">
                                        {duzenId === k.id ? (
                                            <React.Fragment>
                                                <button className="btn btn-ana" disabled={mesgul || !duzenAd.trim()} onClick={() => kaydet(k)}>Kaydet</button>
                                                <button className="btn" disabled={mesgul} onClick={() => setDuzenId(null)}>Vazgeç</button>
                                            </React.Fragment>
                                        ) : (
                                            <React.Fragment>
                                                <button className="btn" disabled={mesgul} onClick={() => { setDuzenId(k.id); setDuzenAd(k.kategoriAdi); setSilId(null); }}>Adı değiştir</button>
                                                <button className="btn btn-tehlike" disabled={mesgul} onClick={() => setSilId(silId === k.id ? null : k.id)}>Sil</button>
                                            </React.Fragment>
                                        )}
                                    </div>
                                </div>
                                {silId === k.id && (
                                    <div className="onay-kutu" style={{ margin: '12px 0' }}>
                                        <p>"{k.kategoriAdi}" kategorisi silinecek{k.mangaSayisi ? `; ${k.mangaSayisi} seriden kaldırılır` : ''}. Emin misiniz?</p>
                                        <div className="eylemler">
                                            <button className="btn btn-tehlike" disabled={mesgul} onClick={() => sil(k)}>Evet, sil</button>
                                            <button className="btn" disabled={mesgul} onClick={() => setSilId(null)}>Vazgeç</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                    {liste && liste.length === 0 && <div className="bos">Henüz kategori yok.</div>}
                </div>
            );
        };

        /* ---------- Duyurular ---------- */
        const DUYURU_ETIKET = { bilgi: 'Bilgi', etkinlik: 'Etkinlik', yeni: 'Yeni', uyari: 'Uyarı' };
        const DUYURU_BOS = { baslik: '', etiket: 'bilgi', baglanti: '', sira: 0, bitis: '', aktif: true };
        const duyuruTarihi = (iso) => new Date(/([zZ]|[+-]\d\d:?\d\d)$/.test(String(iso)) ? iso : `${iso}Z`);
        const yerelTarih = (iso) => {
            if (!iso) return '';
            const d = duyuruTarihi(iso);
            if (isNaN(d)) return '';
            const p = (n) => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
        };
        const Duyurular = () => {
            const [liste, setListe] = useState(null);
            const [bildirim, setBildirim] = useState(null);
            const [form, setForm] = useState(DUYURU_BOS);
            const [duzenId, setDuzenId] = useState(null);
            const [silId, setSilId] = useState(null);
            const [mesgul, setMesgul] = useState(false);
            const getir = useCallback(async () => {
                try { const { veri } = await istek('/admin/duyurular'); setListe(Array.isArray(veri) ? veri : []); }
                catch (err) { setListe(l => l || []); setBildirim(hataBildirimi(err, getir)); }
            }, []);
            useEffect(() => { getir(); }, [getir]);
            const calistir = async (is, basari) => {
                setMesgul(true); setBildirim(null);
                try { await is(); await getir(); setBildirim({ tur: 'basarili', mesaj: basari }); return true; }
                catch (err) { setBildirim(hataBildirimi(err)); return false; }
                finally { setMesgul(false); }
            };
            const ayarla = (alan) => (v) => setForm(o => ({ ...o, [alan]: v }));
            const govde = () => {
                const j = { baslik: form.baslik.trim(), etiket: form.etiket, baglanti: form.baglanti.trim(), sira: parseInt(form.sira, 10) || 0, aktif: form.aktif };
                if (form.bitis) j.bitisTarihi = new Date(form.bitis).toISOString();
                else if (duzenId) j.bitisiKaldir = true;
                return j;
            };
            const kaydet = async (e) => {
                e.preventDefault();
                if (!form.baslik.trim()) return;
                const duz = duzenId;
                const ok = await calistir(
                    () => duz ? istek(`/admin/duyurular/${duz}`, { method: 'PUT', json: govde() }) : istek('/admin/duyurular', { method: 'POST', json: govde() }),
                    duz ? 'Duyuru güncellendi.' : 'Duyuru eklendi.');
                if (ok) { setForm(DUYURU_BOS); setDuzenId(null); }
            };
            const duzenle = (d) => {
                setDuzenId(d.id); setSilId(null);
                setForm({ baslik: d.baslik, etiket: d.etiket, baglanti: d.baglanti || '', sira: d.sira || 0, bitis: yerelTarih(d.bitisTarihi), aktif: d.aktif });
                window.scrollTo(0, 0);
            };
            const simdi = Date.now();
            const bitti = (d) => d.bitisTarihi && duyuruTarihi(d.bitisTarihi).getTime() < simdi;
            return (
                <div>
                    <div className="bolum-baslik"><div><h2>Duyurular</h2><div className="ikincil">Ana sayfadaki kayan duyuru şeridi</div></div></div>
                    <Bildirim b={bildirim} kapat={() => setBildirim(null)} />
                    <form onSubmit={kaydet} style={{ display: 'grid', gap: 12, marginBottom: 24 }}>
                        <div>
                            <label htmlFor="dBaslik">{duzenId ? 'Duyuruyu düzenle' : 'Yeni duyuru'}</label>
                            <input id="dBaslik" className="form-input" maxLength={150} placeholder="Duyuru başlığı" value={form.baslik} onChange={(e) => ayarla('baslik')(e.target.value)} disabled={mesgul} />
                            <div className="sayac">{form.baslik.length} / 150</div>
                        </div>
                        <div style={{ display: 'grid', gap: 12, gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))' }}>
                            <div>
                                <label htmlFor="dEtiket">Etiket</label>
                                <select id="dEtiket" className="form-select" value={form.etiket} onChange={(e) => ayarla('etiket')(e.target.value)} disabled={mesgul}>
                                    {Object.entries(DUYURU_ETIKET).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
                                </select>
                            </div>
                            <div>
                                <label htmlFor="dBag">Bağlantı (isteğe bağlı)</label>
                                <input id="dBag" className="form-input" maxLength={300} placeholder="https://… ya da #/manga/1" value={form.baglanti} onChange={(e) => ayarla('baglanti')(e.target.value)} disabled={mesgul} />
                            </div>
                            <div>
                                <label htmlFor="dSira">Sıra (küçük önce)</label>
                                <input id="dSira" className="form-input" type="number" min="-10000" max="10000" value={form.sira} onChange={(e) => ayarla('sira')(e.target.value)} disabled={mesgul} />
                            </div>
                            <div>
                                <label htmlFor="dBitis">Bitiş (isteğe bağlı)</label>
                                <input id="dBitis" className="form-input" type="datetime-local" value={form.bitis} onChange={(e) => ayarla('bitis')(e.target.value)} disabled={mesgul} />
                            </div>
                        </div>
                        <Anahtar id="dAktif" ad="Yayında" aciklama="Kapalıysa şeritte görünmez." deger={form.aktif} degis={ayarla('aktif')} kilit={mesgul} />
                        <div className="eylemler">
                            <button type="submit" className="btn btn-ana" disabled={mesgul || !form.baslik.trim()}>{duzenId ? 'Kaydet' : 'Duyuru ekle'}</button>
                            {duzenId && <button type="button" className="btn" disabled={mesgul} onClick={() => { setDuzenId(null); setForm(DUYURU_BOS); }}>Vazgeç</button>}
                        </div>
                    </form>
                    {liste === null && <div className="bos">Yükleniyor...</div>}
                    <div className="liste">
                        {(liste || []).map(d => (
                            <div key={d.id}>
                                <div className="satir">
                                    <div className="satir-bilgi">
                                        <div className="satir-ad">{d.baslik}</div>
                                        <div className="satir-alt">
                                            <span className="etiket-kucuk">{DUYURU_ETIKET[d.etiket] || d.etiket}</span>{' '}
                                            {!d.aktif ? 'Kapalı' : bitti(d) ? 'Süresi doldu' : 'Yayında'}
                                            {d.baglanti ? ` · ${d.baglanti}` : ''}
                                        </div>
                                    </div>
                                    <div className="eylemler">
                                        <button className="btn" disabled={mesgul} onClick={() => calistir(() => istek(`/admin/duyurular/${d.id}`, { method: 'PUT', json: { aktif: !d.aktif } }), d.aktif ? 'Duyuru kapatıldı.' : 'Duyuru yayına alındı.')}>{d.aktif ? 'Kapat' : 'Yayına al'}</button>
                                        <button className="btn" disabled={mesgul} onClick={() => duzenle(d)}>Düzenle</button>
                                        <button className="btn btn-tehlike" disabled={mesgul} onClick={() => setSilId(silId === d.id ? null : d.id)}>Sil</button>
                                    </div>
                                </div>
                                {silId === d.id && (
                                    <div className="onay-kutu" style={{ margin: '12px 0' }}>
                                        <p>Bu duyuru silinecek. Emin misiniz?</p>
                                        <div className="eylemler">
                                            <button className="btn btn-tehlike" disabled={mesgul} onClick={async () => { if (await calistir(() => istek(`/admin/duyurular/${d.id}`, { method: 'DELETE' }), 'Duyuru silindi.')) setSilId(null); }}>Evet, sil</button>
                                            <button className="btn" disabled={mesgul} onClick={() => setSilId(null)}>Vazgeç</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                    {liste && liste.length === 0 && <div className="bos">Henüz duyuru yok.</div>}
                </div>
            );
        };

        /* ---------- Öne çıkanlar ---------- */
        const OC_BOS = { baslik: '', ozet: '', etiket: '', gorselUrl: '', baglanti: '', sira: 0, bitis: '', aktif: true };
        const ocUrlGecerli = (u) => !u || /^(\/|https?:\/\/)/i.test(u);
        const OneCikanlar = () => {
            const [liste, setListe] = useState(null);
            const [bildirim, setBildirim] = useState(null);
            const [form, setForm] = useState(OC_BOS);
            const [duzenId, setDuzenId] = useState(null);
            const [silId, setSilId] = useState(null);
            const [mesgul, setMesgul] = useState(false);
            const [oran, setOran] = useState(null);
            const [gorselHata, setGorselHata] = useState(false);
            const getir = useCallback(async () => {
                try { const { veri } = await istek('/admin/one-cikanlar'); setListe(Array.isArray(veri) ? veri : []); }
                catch (err) { setListe(l => l || []); setBildirim(hataBildirimi(err, getir)); }
            }, []);
            useEffect(() => { getir(); }, [getir]);
            const calistir = async (is, basari) => {
                setMesgul(true); setBildirim(null);
                try { await is(); await getir(); setBildirim({ tur: 'basarili', mesaj: basari }); return true; }
                catch (err) { setBildirim(hataBildirimi(err)); return false; }
                finally { setMesgul(false); }
            };
            const ayarla = (alan) => (v) => { if (alan === 'gorselUrl') setGorselHata(false); setForm(o => ({ ...o, [alan]: v })); };
            const baglantiOk = ocUrlGecerli(form.baglanti.trim());
            const gorselOk = ocUrlGecerli(form.gorselUrl.trim());
            const govde = () => {
                const j = { baslik: form.baslik.trim(), ozet: form.ozet.trim(), etiket: form.etiket.trim(), gorselUrl: form.gorselUrl.trim(), baglanti: form.baglanti.trim(), sira: parseInt(form.sira, 10) || 0, aktif: form.aktif };
                if (form.bitis) j.bitisTarihi = new Date(form.bitis).toISOString();
                else if (duzenId) j.bitisiKaldir = true;
                return j;
            };
            const kaydet = async (e) => {
                e.preventDefault();
                if (!form.baslik.trim() || !baglantiOk || !gorselOk) return;
                const duz = duzenId;
                const ok = await calistir(
                    () => duz ? istek(`/admin/one-cikanlar/${duz}`, { method: 'PUT', json: govde() }) : istek('/admin/one-cikanlar', { method: 'POST', json: govde() }),
                    duz ? 'Öne çıkan güncellendi.' : 'Öne çıkan eklendi.');
                if (ok) { setForm(OC_BOS); setDuzenId(null); }
            };
            const duzenle = (d) => {
                setDuzenId(d.id); setSilId(null); setGorselHata(false);
                setForm({ baslik: d.baslik || '', ozet: d.ozet || '', etiket: d.etiket || '', gorselUrl: d.gorselUrl || '', baglanti: d.baglanti || '', sira: d.sira || 0, bitis: yerelTarih(d.bitisTarihi), aktif: d.aktif });
                window.scrollTo(0, 0);
            };
            const gorselYukle = async (e) => {
                const f = e.target.files && e.target.files[0];
                e.target.value = '';
                if (!f) return;
                const h = dosyaDogrula(f);
                if (h) { setBildirim({ tur: 'hata', mesaj: h }); return; }
                setBildirim(null); setMesgul(true); setOran(0);
                try { await yukle([f], setOran, (_, urls) => ayarla('gorselUrl')(urls[0])); }
                catch (err) { setBildirim(hataBildirimi(err)); }
                finally { setMesgul(false); setOran(null); }
            };
            const simdi = Date.now();
            const bitti = (d) => d.bitisTarihi && duyuruTarihi(d.bitisTarihi).getTime() < simdi;
            return (
                <div>
                    <div className="bolum-baslik"><div><h2>Öne çıkanlar</h2><div className="ikincil">Ana sayfadaki büyük kapak kaydırıcısı</div></div></div>
                    <Bildirim b={bildirim} kapat={() => setBildirim(null)} />
                    <form onSubmit={kaydet} style={{ display: 'grid', gap: 12, marginBottom: 24 }}>
                        <div>
                            <label htmlFor="ocBaslik">{duzenId ? 'Öne çıkanı düzenle' : 'Yeni öne çıkan'}</label>
                            <input id="ocBaslik" className="form-input" maxLength={150} placeholder="Başlık" value={form.baslik} onChange={(e) => ayarla('baslik')(e.target.value)} disabled={mesgul} />
                            <div className="sayac">{form.baslik.length} / 150</div>
                        </div>
                        <div>
                            <label htmlFor="ocOzet">Özet (isteğe bağlı)</label>
                            <textarea id="ocOzet" className="form-textarea" maxLength={300} style={{ minHeight: 70 }} value={form.ozet} onChange={(e) => ayarla('ozet')(e.target.value)} disabled={mesgul}></textarea>
                            <div className="sayac">{form.ozet.length} / 300</div>
                        </div>
                        <div style={{ display: 'grid', gap: 12, gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))' }}>
                            <div>
                                <label htmlFor="ocEtiket">Etiket (isteğe bağlı)</label>
                                <input id="ocEtiket" className="form-input" maxLength={30} placeholder="Yeni bölüm, Seri…" value={form.etiket} onChange={(e) => ayarla('etiket')(e.target.value)} disabled={mesgul} />
                            </div>
                            <div>
                                <label htmlFor="ocBag">Bağlantı (isteğe bağlı)</label>
                                <input id="ocBag" className="form-input" maxLength={300} placeholder="https://… ya da /manga/1" value={form.baglanti} onChange={(e) => ayarla('baglanti')(e.target.value)} disabled={mesgul} />
                                {!baglantiOk && <div className="sayac" role="alert">Yalnız /, http:// veya https:// ile başlayabilir.</div>}
                            </div>
                            <div>
                                <label htmlFor="ocSira">Sıra (küçük önce)</label>
                                <input id="ocSira" className="form-input" type="number" min="-10000" max="10000" value={form.sira} onChange={(e) => ayarla('sira')(e.target.value)} disabled={mesgul} />
                            </div>
                            <div>
                                <label htmlFor="ocBitis">Bitiş (isteğe bağlı)</label>
                                <input id="ocBitis" className="form-input" type="datetime-local" value={form.bitis} onChange={(e) => ayarla('bitis')(e.target.value)} disabled={mesgul} />
                            </div>
                        </div>
                        <div>
                            <span className="etiket">Kapak görseli</span>
                            <div className="kapak-alan">
                                {form.gorselUrl && gorselOk && !gorselHata
                                    ? <img className="kapak-onizleme" src={gorselUrl(form.gorselUrl)} alt="Görsel önizlemesi" onError={() => setGorselHata(true)} />
                                    : <div className="kapak-onizleme">{form.gorselUrl ? 'Görsel açılamadı' : 'Görsel yok'}</div>}
                                <div className="kapak-yan">
                                    <div>
                                        <input id="ocDosya" type="file" className="dosya-gizli" accept=".jpg,.jpeg,.png,.webp,.gif,image/*" onChange={gorselYukle} disabled={mesgul} />
                                        <label htmlFor="ocDosya" className="btn" style={{ cursor: mesgul ? 'default' : 'pointer', opacity: mesgul ? 0.5 : 1 }}>Dosyadan yükle</label>
                                    </div>
                                    <input className="form-input" aria-label="Görsel adresi" placeholder="veya görsel adresini yapıştırın (https://...)" value={form.gorselUrl} onChange={(e) => ayarla('gorselUrl')(e.target.value)} disabled={mesgul} />
                                    {!gorselOk && <div className="sayac" role="alert">Yalnız /, http:// veya https:// ile başlayabilir.</div>}
                                    {oran !== null && <Ilerleme oran={oran} etiket="Görsel yükleniyor" />}
                                </div>
                            </div>
                        </div>
                        <Anahtar id="ocAktif" ad="Yayında" aciklama="Kapalıysa ana sayfada görünmez." deger={form.aktif} degis={ayarla('aktif')} kilit={mesgul} />
                        <div className="eylemler">
                            <button type="submit" className="btn btn-ana" disabled={mesgul || !form.baslik.trim() || !baglantiOk || !gorselOk}>{duzenId ? 'Kaydet' : 'Ekle'}</button>
                            {duzenId && <button type="button" className="btn" disabled={mesgul} onClick={() => { setDuzenId(null); setForm(OC_BOS); setGorselHata(false); }}>Vazgeç</button>}
                        </div>
                    </form>
                    {liste === null && <div className="bos">Yükleniyor...</div>}
                    <div className="liste">
                        {(liste || []).map(d => (
                            <div key={d.id}>
                                <div className="satir">
                                    <div className="satir-bilgi">
                                        <div className="satir-ad">{d.baslik}</div>
                                        <div className="satir-alt">
                                            {d.etiket && <span className="etiket-kucuk">{d.etiket}</span>}{d.etiket ? ' ' : ''}
                                            {!d.aktif ? 'Kapalı' : bitti(d) ? 'Süresi doldu' : 'Yayında'} · sıra {d.sira || 0}
                                            {d.baglanti ? ` · ${d.baglanti}` : ''}
                                        </div>
                                    </div>
                                    <div className="eylemler">
                                        <button className="btn" disabled={mesgul} onClick={() => calistir(() => istek(`/admin/one-cikanlar/${d.id}`, { method: 'PUT', json: { aktif: !d.aktif } }), d.aktif ? 'Kapatıldı.' : 'Yayına alındı.')}>{d.aktif ? 'Kapat' : 'Yayına al'}</button>
                                        <button className="btn" disabled={mesgul} onClick={() => duzenle(d)}>Düzenle</button>
                                        <button className="btn btn-tehlike" disabled={mesgul} onClick={() => setSilId(silId === d.id ? null : d.id)}>Sil</button>
                                    </div>
                                </div>
                                {silId === d.id && (
                                    <div className="onay-kutu" style={{ margin: '12px 0' }}>
                                        <p>Bu öne çıkan silinecek. Emin misiniz?</p>
                                        <div className="eylemler">
                                            <button className="btn btn-tehlike" disabled={mesgul} onClick={async () => { if (await calistir(() => istek(`/admin/one-cikanlar/${d.id}`, { method: 'DELETE' }), 'Öne çıkan silindi.')) setSilId(null); }}>Evet, sil</button>
                                            <button className="btn" disabled={mesgul} onClick={() => setSilId(null)}>Vazgeç</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                    {liste && liste.length === 0 && <div className="bos">Henüz öne çıkan yok.</div>}
                </div>
            );
        };

        /* ---------- Yorumlar ---------- */
        const Yorumlar = () => {
            const [tur, setTur] = useState('bolum');
            const s = useSayfali('/admin/yorumlar', `tur=${tur}&`);
            const [silId, setSilId] = useState(null);
            const [mesgul, setMesgul] = useState(false);
            const [mesaj, setMesaj] = useState(null);
            const sil = async (y) => {
                setMesgul(true); setMesaj(null);
                try {
                    await istek(`/admin/yorumlar/${y.id}?tur=${y.tur || tur}`, { method: 'DELETE' });
                    s.setListe(l => l.filter(x => x.id !== y.id)); s.setToplam(t => Math.max(0, t - 1));
                    setSilId(null); setMesaj({ tur: 'basarili', mesaj: 'Yorum silindi.' });
                } catch (err) { setMesaj(hataBildirimi(err)); }
                finally { setMesgul(false); }
            };
            return (
                <div>
                    <div className="bolum-baslik"><div><h2>Yorumlar</h2><div className="ikincil">{s.toplam} {tur === 'manga' ? 'seri yorumu' : 'bölüm yorumu'}</div></div></div>
                    <div className="tab-secici" role="tablist" aria-label="Yorum türü">
                        {[['bolum', 'Bölüm yorumları'], ['manga', 'Seri yorumları']].map(([k, ad]) => (
                            <button type="button" key={k} role="tab" aria-selected={tur === k} className={`tab-btn ${tur === k ? 'aktif' : ''}`}
                                onClick={() => { if (tur !== k) { setTur(k); setSilId(null); setMesaj(null); } }}>{ad}</button>
                        ))}
                    </div>
                    <Bildirim b={mesaj} kapat={() => setMesaj(null)} />
                    <Bildirim b={s.bildirim} kapat={() => s.setBildirim(null)} />
                    <div className="liste">
                        {s.liste.map(y => (
                            <div key={y.id}>
                                <div className="satir">
                                    <div className="satir-bilgi">
                                        <div className="satir-alt">
                                            <strong>{(y.tur || tur) === 'manga' ? 'Seri yorumu' : 'Bölüm yorumu'}</strong> · {y.kullaniciAdi} · {y.mangaAdi}{(y.tur || tur) !== 'manga' && y.bolumNo != null ? `, Bölüm ${noYaz(y.bolumNo)}` : ''} · {tarihYaz(y.tarih)}
                                        </div>
                                        <div className="yorum-metin">{metinCoz(y.metin)}</div>
                                    </div>
                                    <div className="eylemler">
                                        <button className="btn btn-tehlike" disabled={mesgul} onClick={() => setSilId(silId === y.id ? null : y.id)}>Sil</button>
                                    </div>
                                </div>
                                {silId === y.id && (
                                    <div className="onay-kutu" style={{ margin: '12px 0' }}>
                                        <p>Bu yorum kalıcı olarak silinecek. Emin misiniz?</p>
                                        <div className="eylemler">
                                            <button className="btn btn-tehlike" disabled={mesgul} onClick={() => sil(y)}>Evet, sil</button>
                                            <button className="btn" disabled={mesgul} onClick={() => setSilId(null)}>Vazgeç</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                    {s.yukleniyor && <div className="bos">Yükleniyor...</div>}
                    {!s.yukleniyor && s.liste.length === 0 && !s.bildirim && <div className="bos">{tur === 'manga' ? 'Henüz seri yorumu yok.' : 'Henüz bölüm yorumu yok.'}</div>}
                    <DahaFazla s={s} />
                </div>
            );
        };

        /* ---------- Yorum şikayetleri ---------- */
        const Sikayetler = () => {
            const [durum, setDurum] = useState('acik');
            const s = useSayfali('/admin/sikayetler', `durum=${durum}&`);
            const [silId, setSilId] = useState(null);
            const [mesgul, setMesgul] = useState(false);
            const [mesaj, setMesaj] = useState(null);
            const anahtar = (y) => y.tur + ':' + y.yorumId;
            const kapat = async (y) => {
                setMesgul(true); setMesaj(null);
                try {
                    await istek(`/admin/sikayetler/${encodeURIComponent(y.tur)}/${y.yorumId}/kapat`, { method: 'POST' });
                    setMesaj({ tur: 'basarili', mesaj: 'Şikayetler kapatıldı.' });
                    s.yenile();
                } catch (err) { setMesaj(hataBildirimi(err)); }
                finally { setMesgul(false); }
            };
            const sil = async (y) => {
                setMesgul(true); setMesaj(null);
                try {
                    await istek(`/admin/yorumlar/${y.yorumId}?tur=${encodeURIComponent(y.tur)}`, { method: 'DELETE' });
                    setSilId(null); setMesaj({ tur: 'basarili', mesaj: 'Yorum silindi.' });
                    s.yenile();
                } catch (err) { setMesaj(hataBildirimi(err)); }
                finally { setMesgul(false); }
            };
            return (
                <div>
                    <div className="bolum-baslik"><div><h2>Şikayetler</h2><div className="ikincil">{s.toplam} şikayet edilen yorum</div></div></div>
                    <div className="tab-secici" role="tablist" aria-label="Şikayet durumu">
                        {[['acik', 'Açık'], ['kapali', 'Kapatılmış']].map(([k, ad]) => (
                            <button type="button" key={k} role="tab" aria-selected={durum === k} className={`tab-btn ${durum === k ? 'aktif' : ''}`}
                                onClick={() => { if (durum !== k) { setDurum(k); setSilId(null); setMesaj(null); } }}>{ad}</button>
                        ))}
                    </div>
                    <Bildirim b={mesaj} kapat={() => setMesaj(null)} />
                    <Bildirim b={s.bildirim} kapat={() => s.setBildirim(null)} />
                    <div className="liste">
                        {s.liste.map(y => (
                            <div key={anahtar(y)}>
                                <div className="satir">
                                    <div className="satir-bilgi">
                                        <div className="satir-alt">
                                            <strong>{y.tur === 'manga' ? 'Seri yorumu' : 'Bölüm yorumu'}</strong> · {y.yazarAdi} · {y.mangaAdi}{y.tur !== 'manga' && y.bolumNo != null ? `, Bölüm ${noYaz(y.bolumNo)}` : ''} · {tarihYaz(y.tarih)}
                                        </div>
                                        <div className="yorum-metin">{metinCoz(y.metin)}</div>
                                        <div className="etiketler">
                                            <span className="etiket-kucuk kirmizi">{y.sikayetSayisi} şikayet</span>
                                            <span className="etiket-kucuk">Son: {tarihSaat(y.sonSikayet)}</span>
                                        </div>
                                        {Array.isArray(y.nedenler) && y.nedenler.length > 0 && (
                                            <div className="satir-alt" style={{ marginTop: 6 }}>Nedenler: {y.nedenler.map(metinCoz).join(' · ')}</div>
                                        )}
                                    </div>
                                    <div className="eylemler">
                                        {durum === 'acik' && <button className="btn" disabled={mesgul} onClick={() => kapat(y)}>Şikayeti kapat</button>}
                                        <button className="btn btn-tehlike" disabled={mesgul} onClick={() => setSilId(silId === anahtar(y) ? null : anahtar(y))}>Yorumu sil</button>
                                    </div>
                                </div>
                                {silId === anahtar(y) && (
                                    <div className="onay-kutu" style={{ margin: '12px 0' }}>
                                        <p>Bu yorum ve yanıtları kalıcı olarak silinecek. Emin misiniz?</p>
                                        <div className="eylemler">
                                            <button className="btn btn-tehlike" disabled={mesgul} onClick={() => sil(y)}>Evet, sil</button>
                                            <button className="btn" disabled={mesgul} onClick={() => setSilId(null)}>Vazgeç</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                    {s.yukleniyor && <div className="bos">Yükleniyor...</div>}
                    {!s.yukleniyor && s.liste.length === 0 && !s.bildirim && <div className="bos">{durum === 'acik' ? 'Açık şikayet yok.' : 'Kapatılmış şikayet yok.'}</div>}
                    <DahaFazla s={s} />
                </div>
            );
        };

        /* ---------- Sohbet moderasyonu ---------- */
        const SUSTUR_SURELERI = [[10, '10 dakika'], [60, '1 saat'], [360, '6 saat'], [1440, '1 gün'], [10080, '7 gün']];
        const Sohbet = () => {
            const [arama, setArama] = useState('');
            const [aranan, setAranan] = useState('');
            const s = useSayfali('/admin/sohbet/mesajlar', `arama=${encodeURIComponent(aranan)}&`, 30);
            const [silId, setSilId] = useState(null);
            const [sustId, setSustId] = useState(null);
            const [dakika, setDakika] = useState(60);
            const [neden, setNeden] = useState('');
            const [mesgul, setMesgul] = useState(false);
            const [mesaj, setMesaj] = useState(null);
            const [susturmalar, setSusturmalar] = useState([]);
            const [susBildirim, setSusBildirim] = useState(null);
            const susturmalariGetir = useCallback(async () => {
                try {
                    const { veri } = await istek('/admin/sohbet/susturmalar');
                    setSusturmalar(Array.isArray(veri) ? veri : []); setSusBildirim(null);
                } catch (err) { setSusBildirim(hataBildirimi(err, susturmalariGetir)); }
            }, []);
            useEffect(() => { susturmalariGetir(); }, [susturmalariGetir]);

            const ara = (e) => { e.preventDefault(); setAranan(arama.trim()); setSilId(null); setSustId(null); };
            const sil = async (m) => {
                setMesgul(true); setMesaj(null);
                try {
                    await istek(`/admin/sohbet/mesajlar/${m.id}`, { method: 'DELETE' });
                    s.setListe(l => l.map(x => x.id === m.id ? { ...x, silindi: true } : x));
                    setSilId(null); setMesaj({ tur: 'basarili', mesaj: 'Mesaj silindi.' });
                } catch (err) { setMesaj(hataBildirimi(err)); }
                finally { setMesgul(false); }
            };
            const sustur = async (m) => {
                setMesgul(true); setMesaj(null);
                try {
                    await istek('/admin/sohbet/sustur', { method: 'POST', json: { kullaniciId: m.kullaniciId, dakika: Number(dakika), neden: neden.trim() || null } });
                    setSustId(null); setNeden('');
                    setMesaj({ tur: 'basarili', mesaj: `${m.kullaniciAdi} sohbette susturuldu.` });
                    s.setListe(l => l.map(x => x.kullaniciId === m.kullaniciId ? { ...x, susturulmus: true } : x));
                    susturmalariGetir();
                } catch (err) { setMesaj(hataBildirimi(err)); }
                finally { setMesgul(false); }
            };
            const kaldir = async (k) => {
                setMesgul(true); setMesaj(null);
                try {
                    await istek(`/admin/sohbet/sustur/${k.kullaniciId}`, { method: 'DELETE' });
                    setSusturmalar(l => l.filter(x => x.kullaniciId !== k.kullaniciId));
                    s.setListe(l => l.map(x => x.kullaniciId === k.kullaniciId ? { ...x, susturulmus: false } : x));
                    setMesaj({ tur: 'basarili', mesaj: 'Susturma kaldırıldı.' });
                } catch (err) { setMesaj(hataBildirimi(err)); }
                finally { setMesgul(false); }
            };

            return (
                <div>
                    <div className="bolum-baslik"><div><h2>Sohbet</h2><div className="ikincil">{s.toplam} mesaj</div></div></div>
                    <Bildirim b={mesaj} kapat={() => setMesaj(null)} />
                    <Bildirim b={susBildirim} kapat={() => setSusBildirim(null)} />

                    <h3 style={{ margin: '16px 0 8px' }}>Susturulanlar</h3>
                    <div className="liste">
                        {susturmalar.map(k => (
                            <div className="satir" key={k.kullaniciId}>
                                <div className="satir-bilgi">
                                    <div className="satir-ad">{k.kullaniciAdi}</div>
                                    <div className="satir-alt">{tarihSaat(k.bitis)} tarihine kadar{k.neden ? ` · ${metinCoz(k.neden)}` : ''}</div>
                                </div>
                                <div className="eylemler"><button className="btn" disabled={mesgul} onClick={() => kaldir(k)}>Susturmayı kaldır</button></div>
                            </div>
                        ))}
                    </div>
                    {susturmalar.length === 0 && !susBildirim && <div className="bos">Susturulmuş kullanıcı yok.</div>}

                    <h3 style={{ margin: '24px 0 8px' }}>Mesajlar</h3>
                    <form className="form-grubu" onSubmit={ara}>
                        <label htmlFor="sohbetArama">Mesaj veya kullanıcı ara</label>
                        <div className="arac-satir">
                            <input id="sohbetArama" type="search" className="form-input" maxLength={100} placeholder="Mesaj metni ya da kullanıcı adı"
                                value={arama} onChange={(e) => setArama(e.target.value)} style={{ flex: 1, minWidth: 0 }} />
                            <button type="submit" className="btn">Ara</button>
                        </div>
                    </form>
                    <Bildirim b={s.bildirim} kapat={() => s.setBildirim(null)} />
                    <div className="liste">
                        {s.liste.map(m => (
                            <div key={m.id}>
                                <div className="satir">
                                    <div className="satir-bilgi">
                                        <div className="satir-alt">
                                            <strong>{m.kullaniciAdi}</strong> · {tarihSaat(m.tarih)}
                                        </div>
                                        <div className="yorum-metin">{m.metin ? metinCoz(m.metin) : (m.stickerId ? `Sticker: ${m.stickerId}` : '')}</div>
                                        <div className="etiketler">
                                            {m.silindi && <span className="etiket-kucuk kirmizi">Silindi</span>}
                                            {m.susturulmus && <span className="etiket-kucuk kirmizi">Susturulmuş</span>}
                                        </div>
                                    </div>
                                    <div className="eylemler">
                                        {!m.silindi && <button className="btn btn-tehlike" disabled={mesgul} onClick={() => { setSilId(silId === m.id ? null : m.id); setSustId(null); }}>Sil</button>}
                                        {!m.susturulmus && <button className="btn" disabled={mesgul} onClick={() => { setSustId(sustId === m.id ? null : m.id); setSilId(null); }}>Sustur</button>}
                                    </div>
                                </div>
                                {silId === m.id && (
                                    <div className="onay-kutu" style={{ margin: '12px 0' }}>
                                        <p>Bu mesaj sohbetten kaldırılacak. Emin misiniz?</p>
                                        <div className="eylemler">
                                            <button className="btn btn-tehlike" disabled={mesgul} onClick={() => sil(m)}>Evet, sil</button>
                                            <button className="btn" disabled={mesgul} onClick={() => setSilId(null)}>Vazgeç</button>
                                        </div>
                                    </div>
                                )}
                                {sustId === m.id && (
                                    <div className="onay-kutu" style={{ margin: '12px 0' }}>
                                        <p>{m.kullaniciAdi} kullanıcısı sohbette susturulsun mu?</p>
                                        <div className="form-grubu">
                                            <label htmlFor={'sDakika' + m.id}>Süre</label>
                                            <select id={'sDakika' + m.id} className="form-select" value={dakika} onChange={(e) => setDakika(e.target.value)} disabled={mesgul}>
                                                {SUSTUR_SURELERI.map(([d, ad]) => <option key={d} value={d}>{ad}</option>)}
                                            </select>
                                        </div>
                                        <div className="form-grubu">
                                            <label htmlFor={'sNeden' + m.id}>Neden (isteğe bağlı)</label>
                                            <input id={'sNeden' + m.id} className="form-input" maxLength={200} value={neden} onChange={(e) => setNeden(e.target.value)} disabled={mesgul} />
                                        </div>
                                        <div className="eylemler">
                                            <button className="btn btn-tehlike" disabled={mesgul} onClick={() => sustur(m)}>Sustur</button>
                                            <button className="btn" disabled={mesgul} onClick={() => setSustId(null)}>Vazgeç</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                    {s.yukleniyor && <div className="bos">Yükleniyor...</div>}
                    {!s.yukleniyor && s.liste.length === 0 && !s.bildirim && <div className="bos">{aranan ? 'Eşleşen mesaj yok.' : 'Henüz sohbet mesajı yok.'}</div>}
                    <DahaFazla s={s} />
                </div>
            );
        };

        /* ---------- Kullanıcılar ---------- */
        const rolAdi = (r) => r === 'Owner' ? 'Site sahibi' : r === 'Admin' ? 'Yönetici' : 'Kullanıcı';

        const banYaz = (bitis) => bitis ? `${tarihSaat(bitis)} tarihine kadar` : 'süresiz';

        const KullaniciListesi = ({ sekme, setSekme, arama, setArama, ac, mesaj, setMesaj }) => {
            const [aranan, setAranan] = useState(arama.trim());
            useEffect(() => { const t = setTimeout(() => setAranan(arama.trim()), 300); return () => clearTimeout(t); }, [arama]);
            const s = useListe('/admin/kullanicilar', `search=${encodeURIComponent(aranan)}&durum=${sekme}&`);
            const sekmeler = [['hepsi', 'Hepsi'], ['banli', 'Banlılar'], ['yonetici', 'Yöneticiler']];
            return (
                <div>
                    <div className="bolum-baslik"><div><h2>Kullanıcılar</h2><div className="ikincil">{s.toplam} kullanıcı</div></div></div>
                    <Bildirim b={mesaj} kapat={() => setMesaj(null)} />
                    <Bildirim b={s.bildirim} kapat={() => s.setBildirim(null)} />
                    <div className="form-grubu">
                        <label htmlFor="kArama">Kullanıcı ara</label>
                        <input id="kArama" type="search" className="form-input" placeholder="Kullanıcı adı veya e-posta" value={arama} onChange={(e) => setArama(e.target.value)} />
                    </div>
                    <div className="tab-secici" role="tablist" aria-label="Kullanıcı süzgeci">
                        {sekmeler.map(([k, ad]) => (
                            <button type="button" key={k} role="tab" aria-selected={sekme === k} className={`tab-btn ${sekme === k ? 'aktif' : ''}`} onClick={() => setSekme(k)}>{ad}</button>
                        ))}
                    </div>
                    <div className="liste">
                        {s.liste.map(k => (
                            <button type="button" key={k.id} className="satir-tikla" onClick={() => ac(k.id)} aria-label={`${k.kullaniciAdi} ayrıntıları`}>
                                <div className="satir-ad">{k.kullaniciAdi}</div>
                                <div className="satir-alt">{k.email}</div>
                                <div className="etiketler">
                                    <span className="etiket-kucuk">{rolAdi(k.rol)}</span>
                                    {k.aktif
                                        ? <span className="etiket-kucuk">Aktif</span>
                                        : <span className="etiket-kucuk kirmizi">Banlı · {k.banBitis ? 'bitiş ' + tarihSaat(k.banBitis) : 'süresiz'}</span>}
                                </div>
                                <div className="satir-alt" style={{ marginTop: 6 }}>
                                    Son giriş: {k.sonGirisTarihi ? tarihSaat(k.sonGirisTarihi) : 'hiç girmedi'} · {k.yorumSayisi} yorum
                                </div>
                            </button>
                        ))}
                    </div>
                    {s.yukleniyor && <div className="bos">Yükleniyor...</div>}
                    {!s.yukleniyor && s.liste.length === 0 && !s.bildirim && <div className="bos">{aranan || sekme !== 'hepsi' ? 'Eşleşen kullanıcı yok.' : 'Henüz kullanıcı yok.'}</div>}
                    <Sayfalama s={s} />
                </div>
            );
        };

        const Kullanicilar = ({ ben, can }) => {
            const [detay, setDetay] = useState(null);
            const [sekme, setSekme] = useState('hepsi');
            const [arama, setArama] = useState('');
            const [mesaj, setMesaj] = useState(null);
            if (detay !== null) {
                return <KullaniciDetay key={detay} id={detay} ben={ben} can={can} geri={(m) => { setDetay(null); setMesaj(m || null); window.scrollTo(0, 0); }} />;
            }
            return <KullaniciListesi sekme={sekme} setSekme={setSekme} arama={arama} setArama={setArama} mesaj={mesaj} setMesaj={setMesaj}
                ac={(id) => { setMesaj(null); setDetay(id); window.scrollTo(0, 0); }} />;
        };

        /* Eylem kartı iskeleti */
        const EylemKart = ({ id, baslik, aciklama, acik, setAcik, buton, tehlike, children }) => {
            const a = acik === id;
            return (
                <section className={`eylem-kart ${a ? 'acik' : ''}`} aria-label={baslik}>
                    <h3>{baslik}</h3>
                    <p>{aciklama}</p>
                    {!a && <button type="button" className={`btn ${tehlike ? 'btn-tehlike' : ''}`} onClick={() => setAcik(id)}>{buton}</button>}
                    {a && children}
                </section>
            );
        };

        const HataSatiri = ({ b }) => b ? <div className="bildirim hata" role="alert" style={{ marginTop: 12, marginBottom: 0 }}><span>{b.mesaj}</span></div> : null;

        /* Ad / e-posta değiştir */
        const DuzenleKart = ({ k, calistir, mesgul, kapat }) => {
            const [ad, setAd] = useState(k.kullaniciAdi);
            const [eposta, setEposta] = useState(k.email);
            const [hata, setHata] = useState(null);
            const kaydet = async (e) => {
                e.preventDefault();
                const govde = {};
                if (ad.trim() && ad.trim() !== k.kullaniciAdi) govde.kullaniciAdi = ad.trim();
                if (eposta.trim() && eposta.trim() !== k.email) govde.email = eposta.trim();
                if (!Object.keys(govde).length) { setHata({ mesaj: 'Değişiklik yapılmadı.' }); return; }
                const s = await calistir(() => istek(`/admin/kullanicilar/${k.id}`, { method: 'PUT', json: govde }), 'Kullanıcı bilgileri güncellendi.');
                if (s.tamam) kapat(); else setHata(s.hata);
            };
            return (
                <form onSubmit={kaydet}>
                    <div className="form-grubu"><label htmlFor="dzAd">Kullanıcı adı</label><input id="dzAd" className="form-input" value={ad} onChange={(e) => setAd(e.target.value)} disabled={mesgul} /></div>
                    <div className="form-grubu"><label htmlFor="dzMail">E-posta</label><input id="dzMail" type="email" className="form-input" value={eposta} onChange={(e) => setEposta(e.target.value)} disabled={mesgul} /></div>
                    <div className="eylemler">
                        <button type="submit" className="btn btn-ana" disabled={mesgul}>{mesgul ? 'Kaydediliyor...' : 'Kaydet'}</button>
                        <button type="button" className="btn" disabled={mesgul} onClick={kapat}>Vazgeç</button>
                    </div>
                    <HataSatiri b={hata} />
                </form>
            );
        };

        /* Şifre sıfırlama: geçici şifre YALNIZCA bir kez gösterilir, yalnızca bellekte tutulur */
        const SifreKart = ({ k, calistir, mesgul, kapat }) => {
            const [mod, setMod] = useState('uret');
            const [sifre, setSifre] = useState('');
            const [onay, setOnay] = useState(false);
            const [hata, setHata] = useState(null);
            const [gecici, setGecici] = useState(null);
            const [kopyalandi, setKopyalandi] = useState(false);

            const devam = () => {
                if (mod === 'belirle' && sifre.length < 8) { setHata({ mesaj: 'Şifre en az 8 karakter olmalı.' }); return; }
                if (mod === 'belirle' && sifre === k.kullaniciAdi) { setHata({ mesaj: 'Şifre kullanıcı adından farklı olmalı.' }); return; }
                setHata(null); setOnay(true);
            };
            const uygula = async () => {
                const s = await calistir(async () => {
                    const { veri } = await istek(`/admin/kullanicilar/${k.id}/sifre`, { method: 'POST', json: mod === 'belirle' ? { yeniSifre: sifre } : {} });
                    return veri;
                }, null);
                setOnay(false);
                if (!s.tamam) { setHata(s.hata); return; }
                setSifre('');
                if (s.sonuc && s.sonuc.geciciSifre) setGecici(s.sonuc.geciciSifre);
                else { setHata(null); kapat('Şifre güncellendi; kullanıcının tüm oturumları kapatıldı.'); }
            };
            const kopyala = async () => {
                try { await navigator.clipboard.writeText(gecici); setKopyalandi(true); }
                catch (e) {
                    const ta = document.createElement('textarea'); ta.value = gecici; document.body.appendChild(ta); ta.select();
                    try { document.execCommand('copy'); setKopyalandi(true); } catch (e2) { setKopyalandi(false); }
                    document.body.removeChild(ta);
                }
            };
            const bitir = () => { setGecici(null); kapat('Geçici şifre oluşturuldu; kullanıcının tüm oturumları kapatıldı.'); };

            if (gecici) {
                return (
                    <div className="gecici-kutu" role="status">
                        <strong>Geçici şifre</strong>
                        <code data-testid="gecici-sifre">{gecici}</code>
                        <p className="ikincil">Bu şifre yalnızca bir kez gösterilir. Bu pencereyi kapattıktan sonra bir daha görüntülenemez; kullanıcıya güvenli bir yolla iletin.</p>
                        <div className="eylemler" style={{ marginTop: 12 }}>
                            <button type="button" className="btn btn-ana" onClick={kopyala}>{kopyalandi ? 'Kopyalandı' : 'Kopyala'}</button>
                            <button type="button" className="btn" onClick={bitir}>Kapat</button>
                        </div>
                    </div>
                );
            }
            return (
                <div>
                    <label className="secenek"><input type="radio" name="sifreMod" checked={mod === 'uret'} onChange={() => { setMod('uret'); setOnay(false); }} /> Geçici şifre üret</label>
                    <label className="secenek"><input type="radio" name="sifreMod" checked={mod === 'belirle'} onChange={() => { setMod('belirle'); setOnay(false); }} /> Şifreyi kendim belirleyeyim</label>
                    {mod === 'belirle' && (
                        <div className="form-grubu" style={{ marginTop: 8 }}>
                            <label htmlFor="yeniSifre">Yeni şifre (en az 8 karakter)</label>
                            <input id="yeniSifre" type="text" autoComplete="off" className="form-input" value={sifre} onChange={(e) => { setSifre(e.target.value); setOnay(false); }} disabled={mesgul} />
                        </div>
                    )}
                    {!onay && (
                        <div className="eylemler alt">
                            <button type="button" className="btn btn-ana" onClick={devam}>Devam</button>
                            <button type="button" className="btn" onClick={kapat}>Vazgeç</button>
                        </div>
                    )}
                    {onay && (
                        <div className="onay-kutu alt">
                            <p>{k.kullaniciAdi} için şifre sıfırlanacak ve tüm oturumları kapanacak. Emin misiniz?</p>
                            <div className="eylemler">
                                <button type="button" className="btn btn-tehlike" disabled={mesgul} onClick={uygula}>{mesgul ? 'Uygulanıyor...' : 'Evet, sıfırla'}</button>
                                <button type="button" className="btn" disabled={mesgul} onClick={() => setOnay(false)}>Vazgeç</button>
                            </div>
                        </div>
                    )}
                    <HataSatiri b={hata} />
                </div>
            );
        };

        /* Ban */
        const SURELER = [['1s', '1 saat', 3600e3], ['1g', '1 gün', 864e5], ['7g', '7 gün', 7 * 864e5], ['30g', '30 gün', 30 * 864e5], ['surasiz', 'Süresiz', null], ['ozel', 'Özel tarih ve saat', null]];
        const BanKart = ({ k, calistir, mesgul, kapat }) => {
            const [neden, setNeden] = useState('');
            const [sure, setSure] = useState('1g');
            const [ozel, setOzel] = useState('');
            const [onay, setOnay] = useState(false);
            const [hata, setHata] = useState(null);
            const bitisHesapla = () => {
                if (sure === 'surasiz') return { bitis: null };
                if (sure === 'ozel') {
                    const d = new Date(ozel);
                    if (!ozel || isNaN(d.getTime()) || d.getTime() <= Date.now()) return { hata: 'Gelecekte geçerli bir tarih ve saat seçin.' };
                    return { bitis: d.toISOString() };
                }
                return { bitis: new Date(Date.now() + SURELER.find(x => x[0] === sure)[2]).toISOString() };
            };
            const devam = () => {
                if (!neden.trim()) { setHata({ mesaj: 'Ban nedeni zorunludur.' }); return; }
                const b = bitisHesapla();
                if (b.hata) { setHata({ mesaj: b.hata }); return; }
                setHata(null); setOnay(true);
            };
            const uygula = async () => {
                const b = bitisHesapla();
                if (b.hata) { setHata({ mesaj: b.hata }); setOnay(false); return; }
                const s = await calistir(() => istek(`/admin/kullanicilar/${k.id}/ban`, { method: 'POST', json: { neden: neden.trim(), bitis: b.bitis } }), `${k.kullaniciAdi} banlandı.`);
                if (s.tamam) kapat(); else { setHata(s.hata); setOnay(false); }
            };
            const sureAdi = (SURELER.find(x => x[0] === sure) || [])[1];
            return (
                <div>
                    <div className="form-grubu">
                        <label htmlFor="banNeden">Neden (zorunlu)</label>
                        <textarea id="banNeden" className="form-textarea" maxLength={500} value={neden} onChange={(e) => { setNeden(e.target.value); setOnay(false); }} disabled={mesgul} style={{ minHeight: 80 }}></textarea>
                        <div className="sayac">{neden.length} / 500</div>
                    </div>
                    <div className="form-grubu">
                        <label htmlFor="banSure">Süre</label>
                        <select id="banSure" className="form-select" value={sure} onChange={(e) => { setSure(e.target.value); setOnay(false); }} disabled={mesgul}>
                            {SURELER.map(([v, ad]) => <option key={v} value={v}>{ad}</option>)}
                        </select>
                    </div>
                    {sure === 'ozel' && (
                        <div className="form-grubu">
                            <label htmlFor="banOzel">Ban bitişi (yerel saat)</label>
                            <input id="banOzel" type="datetime-local" className="form-input" value={ozel} onChange={(e) => { setOzel(e.target.value); setOnay(false); }} disabled={mesgul} />
                        </div>
                    )}
                    {!onay && (
                        <div className="eylemler">
                            <button type="button" className="btn btn-tehlike" onClick={devam}>Devam</button>
                            <button type="button" className="btn" onClick={kapat}>Vazgeç</button>
                        </div>
                    )}
                    {onay && (
                        <div className="onay-kutu">
                            <p>{k.kullaniciAdi} kullanıcısı {sure === 'surasiz' ? 'süresiz' : sure === 'ozel' ? tarihSaat(ozel) + ' tarihine kadar' : sureAdi + ' süreyle'} banlanacak ve tüm oturumları kapanacak. Emin misiniz?</p>
                            <div className="eylemler">
                                <button type="button" className="btn btn-tehlike" disabled={mesgul} onClick={uygula}>{mesgul ? 'Uygulanıyor...' : 'Evet, banla'}</button>
                                <button type="button" className="btn" disabled={mesgul} onClick={() => setOnay(false)}>Vazgeç</button>
                            </div>
                        </div>
                    )}
                    <HataSatiri b={hata} />
                </div>
            );
        };

        /* Tek adımlı onaylı eylem (ban kaldır, oturum kapat) */
        const OnayKart = ({ soru, evet, istekFn, basari, calistir, mesgul, kapat, tehlike = true }) => {
            const [hata, setHata] = useState(null);
            const uygula = async () => {
                const s = await calistir(istekFn, basari);
                if (s.tamam) kapat(); else setHata(s.hata);
            };
            return (
                <div>
                    <div className="onay-kutu">
                        <p>{soru}</p>
                        <div className="eylemler">
