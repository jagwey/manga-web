                            <button type="button" className={`btn ${tehlike ? 'btn-tehlike' : 'btn-ana'}`} disabled={mesgul} onClick={uygula}>{mesgul ? 'Uygulanıyor...' : evet}</button>
                            <button type="button" className="btn" disabled={mesgul} onClick={kapat}>Vazgeç</button>
                        </div>
                    </div>
                    <HataSatiri b={hata} />
                </div>
            );
        };

        /* Hesabı sil: kullanıcı adı yazdırılarak onay */
        const SilKart = ({ k, geri, kapat }) => {
            const [yaz, setYaz] = useState('');
            const [mesgul, setMesgul] = useState(false);
            const [hata, setHata] = useState(null);
            const sil = async () => {
                setMesgul(true); setHata(null);
                try {
                    await istek(`/admin/kullanicilar/${k.id}`, { method: 'DELETE' });
                    geri({ tur: 'basarili', mesaj: `${k.kullaniciAdi} hesabı ve bağlı verileri silindi.` });
                } catch (err) { setHata(hataBildirimi(err)); setMesgul(false); }
            };
            return (
                <div>
                    <div className="onay-kutu">
                        <p>Hesap; yorumları, favorileri ve okuma geçmişiyle birlikte kalıcı olarak silinecek. Geri alınamaz. Onaylamak için kullanıcı adını yazın: <strong>{k.kullaniciAdi}</strong></p>
                        <input className="form-input" aria-label="Kullanıcı adını yazın" value={yaz} onChange={(e) => setYaz(e.target.value)} placeholder={k.kullaniciAdi} disabled={mesgul} autoComplete="off" />
                        <div className="eylemler" style={{ marginTop: 10 }}>
                            <button type="button" className="btn btn-tehlike" disabled={mesgul || yaz.trim() !== k.kullaniciAdi} onClick={sil}>{mesgul ? 'Siliniyor...' : 'Hesabı kalıcı olarak sil'}</button>
                            <button type="button" className="btn" disabled={mesgul} onClick={kapat}>Vazgeç</button>
                        </div>
                    </div>
                    <HataSatiri b={hata} />
                </div>
            );
        };

        /* Kullanıcının yorumları */
        const KullaniciYorumlari = ({ k, can, kapat }) => {
            const s = useListe(`/admin/kullanicilar/${k.id}/yorumlar`, '', 10);
            const [silId, setSilId] = useState(null);
            const [mesgul, setMesgul] = useState(false);
            const [mesaj, setMesaj] = useState(null);
            const sil = async (y) => {
                setMesgul(true); setMesaj(null);
                try {
                    await istek(`/admin/yorumlar/${y.id}?tur=${y.tur || 'bolum'}`, { method: 'DELETE' });
                    s.setListe(l => l.filter(x => x.id !== y.id)); s.setToplam(t => Math.max(0, t - 1));
                    setSilId(null); setMesaj({ tur: 'basarili', mesaj: 'Yorum silindi.' });
                } catch (err) { setMesaj(hataBildirimi(err)); }
                finally { setMesgul(false); }
            };
            return (
                <div>
                    <Bildirim b={mesaj} kapat={() => setMesaj(null)} />
                    <Bildirim b={s.bildirim} kapat={() => s.setBildirim(null)} />
                    <div className="liste">
                        {s.liste.map(y => (
                            <div key={y.id}>
                                <div className="satir">
                                    <div className="satir-bilgi">
                                        <div className="satir-alt">{y.mangaAdi}{y.bolumNo != null ? `, Bölüm ${noYaz(y.bolumNo)}` : ''} · {tarihSaat(y.tarih)}</div>
                                        <div className="yorum-metin">{metinCoz(y.metin)}</div>
                                    </div>
                                    {can('yorum.sil') && <div className="eylemler"><button type="button" className="btn btn-tehlike" disabled={mesgul} onClick={() => setSilId(silId === y.id ? null : y.id)}>Sil</button></div>}
                                </div>
                                {can('yorum.sil') && silId === y.id && (
                                    <div className="onay-kutu" style={{ margin: '12px 0' }}>
                                        <p>Bu yorum kalıcı olarak silinecek. Emin misiniz?</p>
                                        <div className="eylemler">
                                            <button type="button" className="btn btn-tehlike" disabled={mesgul} onClick={() => sil(y)}>Evet, sil</button>
                                            <button type="button" className="btn" disabled={mesgul} onClick={() => setSilId(null)}>Vazgeç</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                    {s.yukleniyor && <div className="bos">Yükleniyor...</div>}
                    {!s.yukleniyor && s.liste.length === 0 && !s.bildirim && <div className="bos">Bu kullanıcının yorumu yok.</div>}
                    <Sayfalama s={s} />
                    <div className="eylemler alt"><button type="button" className="btn" onClick={kapat}>Kapat</button></div>
                </div>
            );
        };

        const KullaniciDetay = ({ id, ben, can, geri }) => {
            const [k, setK] = useState(null);
            const [bildirim, setBildirim] = useState(null);
            const [mesaj, setMesaj] = useState(null);
            const [acik, setAcik] = useState(null);
            const [mesgul, setMesgul] = useState(false);

            const getir = useCallback(async () => {
                try { const { veri } = await istek(`/admin/kullanicilar/${id}`); setK(veri); setBildirim(null); }
                catch (err) { setBildirim(hataBildirimi(err, getir)); }
            }, [id]);
            useEffect(() => { getir(); }, [getir]);

            // Başarı ya da hata sonucunu çağırana döndürür; kartın kendi hata alanı gösterir
            const calistir = async (is, basari) => {
                setMesgul(true); setMesaj(null);
                try {
                    const sonuc = await is();
                    await getir();
                    if (basari) setMesaj({ tur: 'basarili', mesaj: basari });
                    return { tamam: true, sonuc };
                } catch (err) { return { tamam: false, hata: hataBildirimi(err) }; }
                finally { setMesgul(false); }
            };
            const kapat = (m) => { setAcik(null); if (typeof m === 'string') setMesaj({ tur: 'basarili', mesaj: m }); };

            const ust = (
                <div>
                    <button type="button" className="metin-link" onClick={() => geri()}>Kullanıcı listesine dön</button>
                    <Bildirim b={bildirim} kapat={() => setBildirim(null)} />
                </div>
            );
            if (!k) return <div>{ust}{!bildirim && <div className="bos">Yükleniyor...</div>}</div>;

            const sahip = k.rol === 'Owner';
            const baskaYonetici = k.rol === 'Admin' && ben.rol !== 'Owner';
            const kendi = k.id === ben.id;
            const genelKilit = sahip ? 'Site sahibi hesabına yönetim ekranından müdahale edilemez.' : baskaYonetici ? 'Yönetici hesaplarına yalnızca site sahibi müdahale edebilir.' : null;
            const kendiNotu = kendi ? 'Kendi hesabınıza buradan bu işlemi uygulayamazsınız.' : null;
            const banli = !k.aktif;
            const kp = { calistir, mesgul, kapat };
            const ortak = { acik, setAcik };

            const kartlar = [];
            if (!genelKilit) {
                if (can('kullanici.duzenle')) kartlar.push(
                    <EylemKart key="duzenle" id="duzenle" baslik="Kullanıcı adı / e-posta" aciklama="Hesabın görünen adını ya da e-posta adresini değiştirin." buton="Düzenle" {...ortak}>
                        <DuzenleKart k={k} {...kp} />
                    </EylemKart>);
                if (can('kullanici.sifre')) kartlar.push(
                    <EylemKart key="sifre" id="sifre" baslik="Şifreyi sıfırla" aciklama="Kendiniz belirleyin ya da geçici şifre üretin. Tüm oturumlar kapanır." buton="Şifreyi sıfırla" tehlike {...ortak}>
                        <SifreKart k={k} {...kp} />
                    </EylemKart>);
                if (can('kullanici.engelle')) {
                    if (kendi) {
                        kartlar.push(<section className="eylem-kart kilitli" key="banK" aria-label="Ban ve oturum"><h3>Ban ve oturum işlemleri</h3><p>{kendiNotu}</p></section>);
                    } else {
                        kartlar.push(banli
                            ? (
                                <EylemKart key="banKaldir" id="banKaldir" baslik="Banı kaldır" aciklama="Kullanıcı yeniden giriş yapabilir hâle gelir." buton="Banı kaldır" {...ortak}>
                                    <OnayKart soru={`${k.kullaniciAdi} kullanıcısının banı kaldırılacak.`} evet="Evet, banı kaldır" tehlike={false}
                                        istekFn={() => istek(`/admin/kullanicilar/${k.id}/ban-kaldir`, { method: 'POST' })} basari={`${k.kullaniciAdi} kullanıcısının banı kaldırıldı.`} {...kp} />
                                </EylemKart>)
                            : (
                                <EylemKart key="ban" id="ban" baslik="Banla" aciklama="Nedenini ve süresini seçin. Kullanıcı giriş yapamaz, açık oturumları kapanır." buton="Banla" tehlike {...ortak}>
                                    <BanKart k={k} {...kp} />
                                </EylemKart>));
                        kartlar.push(
                            <EylemKart key="oturum" id="oturum" baslik="Tüm oturumlarını kapat" aciklama="Kullanıcı tüm cihazlarda yeniden giriş yapmak zorunda kalır." buton="Oturumları kapat" tehlike {...ortak}>
                                <OnayKart soru={`${k.kullaniciAdi} kullanıcısının tüm oturumları kapatılacak.`} evet="Evet, kapat"
                                    istekFn={() => istek(`/admin/kullanicilar/${k.id}/oturumlari-kapat`, { method: 'POST' })} basari={`${k.kullaniciAdi} kullanıcısının oturumları kapatıldı.`} {...kp} />
                            </EylemKart>);
                        kartlar.push(
                            <EylemKart key="puanlar" id="puanlar" baslik="Puanları sıfırla" aciklama="Suistimal durumunda kullanıcının kazandığı tüm puanlar silinir; liderlik tablosundan da düşer." buton="Puanları sıfırla" tehlike {...ortak}>
                                <OnayKart soru={`${k.kullaniciAdi} kullanıcısının ${Number(k.toplamPuan || 0).toLocaleString('tr-TR')} puanının tamamı silinecek. Bu işlem geri alınamaz. Emin misiniz?`} evet="Evet, puanları sıfırla"
                                    istekFn={() => istek(`/admin/kullanicilar/${k.id}/puanlar`, { method: 'DELETE' })} basari={`${k.kullaniciAdi} kullanıcısının puanları sıfırlandı.`} {...kp} />
                            </EylemKart>);
                    }
                }
                if (can('kullanici.sil')) {
                    kartlar.push(kendi
                        ? <section className="eylem-kart kilitli" key="silK" aria-label="Hesabı sil"><h3>Hesabı sil</h3><p>{kendiNotu}</p></section>
                        : (
                            <EylemKart key="sil" id="sil" baslik="Hesabı sil" aciklama="Hesap ve bağlı tüm veriler kalıcı olarak silinir." buton="Hesabı sil" tehlike {...ortak}>
                                <SilKart k={k} geri={geri} kapat={() => setAcik(null)} />
                            </EylemKart>));
                }
            }
            kartlar.push(
                <EylemKart key="yorum" id="yorum" baslik="Yorumları" aciklama={`Kullanıcının yaptığı ${k.yorumSayisi} yorumu görün${can('yorum.sil') ? ' ve tek tek silin' : ''}.`} buton="Yorumlarını gör" {...ortak}>
                    <KullaniciYorumlari k={k} can={can} kapat={() => setAcik(null)} />
                </EylemKart>);

            const bilgiler = [
                ['Kullanıcı adı', k.kullaniciAdi], ['E-posta', k.email], ['Rol', rolAdi(k.rol)],
                ['Durum', k.aktif ? 'Aktif' : 'Banlı'], ['Kayıt tarihi', tarihSaat(k.kayitTarihi)],
                ['Son giriş', k.sonGirisTarihi ? tarihSaat(k.sonGirisTarihi) : 'Hiç giriş yapmadı'],
                ['Yorum', k.yorumSayisi], ['Favori', k.favoriSayisi], ['Okuma kaydı', k.okumaKaydiSayisi],
                ['Toplam puan', Number(k.toplamPuan || 0).toLocaleString('tr-TR')]
            ];
            return (
                <div>
                    {ust}
                    <div className="bolum-baslik">
                        <div>
                            <h2>{k.kullaniciAdi}</h2>
                            <div className="etiketler">
                                <span className="etiket-kucuk">{rolAdi(k.rol)}</span>
                                {banli ? <span className="etiket-kucuk kirmizi">Banlı</span> : <span className="etiket-kucuk">Aktif</span>}
                            </div>
                        </div>
                    </div>
                    <Bildirim b={mesaj} kapat={() => setMesaj(null)} />

                    <dl className="bilgi-izgara">
                        {bilgiler.map(([ad, d]) => <div className="bilgi" key={ad}><dt>{ad}</dt><dd>{d}</dd></div>)}
                    </dl>

                    {k.ban && (
                        <div className="kutu">
                            <h3>Ban bilgisi</h3>
                            <dl className="bilgi-izgara" style={{ marginBottom: 0 }}>
                                <div className="bilgi"><dt>Neden</dt><dd>{k.ban.neden}</dd></div>
                                <div className="bilgi"><dt>Başlangıç</dt><dd>{tarihSaat(k.ban.tarih)}</dd></div>
                                <div className="bilgi"><dt>Bitiş</dt><dd>{k.ban.bitis ? tarihSaat(k.ban.bitis) : 'Süresiz'}</dd></div>
                                <div className="bilgi"><dt>Banlayan</dt><dd>{k.ban.yapanAdi || '—'}</dd></div>
                            </dl>
                        </div>
                    )}

                    {genelKilit && <div className="kilit-not">{genelKilit} Yalnızca bilgileri görüntüleyebilirsiniz.</div>}
                    <div className="eylem-izgara">{kartlar}</div>
                </div>
            );
        };

        /* ---------- Yöneticiler (yalnız Owner) ---------- */
        const Yoneticiler = () => {
            const [tum, setTum] = useState([]);
            const [liste, setListe] = useState(null);
            const [bildirim, setBildirim] = useState(null);
            const [mesgul, setMesgul] = useState(false);
            const [ekleAcik, setEkleAcik] = useState(false);
            const [kim, setKim] = useState('');
            const [yeniIzin, setYeniIzin] = useState([]);
            const [duzenId, setDuzenId] = useState(null);
            const [duzenIzin, setDuzenIzin] = useState([]);
            const [cikarId, setCikarId] = useState(null);

            const getir = useCallback(async () => {
                try {
                    const [a, b] = await Promise.all([istek('/admin/yetkiler'), istek('/admin/yoneticiler')]);
                    setTum(Array.isArray(a.veri) ? a.veri : []);
                    setListe(Array.isArray(b.veri) ? b.veri : []);
                } catch (err) { setListe(l => l || []); setBildirim(hataBildirimi(err, getir)); }
            }, []);
            useEffect(() => { getir(); }, [getir]);

            const adlar = (anahtarlar) => anahtarlar.map(a => (tum.find(t => t.anahtar === a) || { ad: a }).ad);
            const calistir = async (is, basari) => {
                setMesgul(true); setBildirim(null);
                try { await is(); await getir(); setBildirim({ tur: 'basarili', mesaj: basari }); return true; }
                catch (err) { setBildirim(hataBildirimi(err)); return false; }
                finally { setMesgul(false); }
            };
            const ekle = async (e) => {
                e.preventDefault();
                if (!kim.trim()) { setBildirim({ tur: 'hata', mesaj: 'Kullanıcı adı veya e-posta girin.' }); return; }
                if (!yeniIzin.length) { setBildirim({ tur: 'hata', mesaj: 'En az bir izin seçin.' }); return; }
                const ad = kim.trim();
                if (await calistir(() => istek('/admin/yoneticiler', { method: 'POST', json: { kullaniciAdiOrEmail: ad, yetkiler: yeniIzin } }), `${ad} yönetici yapıldı.`)) {
                    setKim(''); setYeniIzin([]); setEkleAcik(false);
                }
            };
            const kaydet = async (y) => {
                if (await calistir(() => istek(`/admin/yoneticiler/${y.id}`, { method: 'PUT', json: { yetkiler: duzenIzin } }), `${y.kullaniciAdi} izinleri kaydedildi.`)) setDuzenId(null);
            };
            const cikar = async (y) => {
                if (await calistir(() => istek(`/admin/yoneticiler/${y.id}`, { method: 'DELETE' }), `${y.kullaniciAdi} yöneticilikten çıkarıldı.`)) setCikarId(null);
            };

            return (
                <div>
                    <div className="bolum-baslik">
                        <div><h2>Yöneticiler</h2><div className="ikincil">Her yöneticiye hangi işlemleri yapabileceğini siz seçersiniz.</div></div>
                        {!ekleAcik && <button className="btn btn-ana" onClick={() => { setEkleAcik(true); setDuzenId(null); }}>Yönetici ekle</button>}
                    </div>
                    <Bildirim b={bildirim} kapat={() => setBildirim(null)} />

                    {ekleAcik && (
                        <form className="kutu" onSubmit={ekle}>
                            <h3>Yönetici ekle</h3>
                            <div className="form-grubu">
                                <label htmlFor="yKim">Kayıtlı kullanıcının adı veya e-postası</label>
                                <input id="yKim" className="form-input" value={kim} onChange={(e) => setKim(e.target.value)} disabled={mesgul} />
                            </div>
                            <span className="etiket">İzinler</span>
                            <IzinSecici tum={tum} secili={yeniIzin} setSecili={setYeniIzin} kilit={mesgul} />
                            <div className="eylemler">
                                <button type="submit" className="btn btn-ana" disabled={mesgul}>{mesgul ? 'Lütfen bekleyin...' : 'Yönetici yap'}</button>
                                <button type="button" className="btn" disabled={mesgul} onClick={() => { setEkleAcik(false); setKim(''); setYeniIzin([]); }}>Vazgeç</button>
                            </div>
                        </form>
                    )}

                    {liste === null && <div className="bos">Yükleniyor...</div>}
                    <div className="liste">
                        {(liste || []).map(y => {
                            const sahip = y.rol === 'Owner';
                            return (
                                <div key={y.id}>
                                    <div className="satir" style={{ alignItems: 'flex-start' }}>
                                        <div className="satir-bilgi">
                                            <div className="satir-ad">{y.kullaniciAdi} <span className="rol-etiket">{rolAdi(y.rol)}</span></div>
                                            <div className="satir-alt">{y.email}{y.aktif ? '' : ' · Hesap kapalı'}</div>
                                            <div className="etiketler">
                                                {sahip
                                                    ? <span className="etiket-kucuk">Tüm izinler (değiştirilemez)</span>
                                                    : (y.yetkiler.length ? adlar(y.yetkiler).map(a => <span className="etiket-kucuk" key={a}>{a}</span>) : <span className="etiket-kucuk">İzin yok</span>)}
                                            </div>
                                        </div>
                                        {!sahip && (
                                            <div className="eylemler">
                                                <button className="btn" disabled={mesgul} onClick={() => { setDuzenId(duzenId === y.id ? null : y.id); setDuzenIzin(y.yetkiler.slice()); setCikarId(null); setEkleAcik(false); }}>İzinleri düzenle</button>
                                                <button className="btn btn-tehlike" disabled={mesgul} onClick={() => { setCikarId(cikarId === y.id ? null : y.id); setDuzenId(null); }}>Yöneticilikten çıkar</button>
                                            </div>
                                        )}
                                    </div>
                                    {duzenId === y.id && (
                                        <div className="kutu" style={{ margin: '12px 0' }}>
                                            <IzinSecici tum={tum} secili={duzenIzin} setSecili={setDuzenIzin} kilit={mesgul} />
                                            <div className="eylemler">
                                                <button className="btn btn-ana" disabled={mesgul} onClick={() => kaydet(y)}>Kaydet</button>
                                                <button className="btn" disabled={mesgul} onClick={() => setDuzenId(null)}>Vazgeç</button>
                                            </div>
                                        </div>
                                    )}
                                    {cikarId === y.id && (
                                        <div className="onay-kutu" style={{ margin: '12px 0' }}>
                                            <p>{y.kullaniciAdi} yöneticilikten çıkarılacak ve tüm izinlerini kaybedecek. Emin misiniz?</p>
                                            <div className="eylemler">
                                                <button className="btn btn-tehlike" disabled={mesgul} onClick={() => cikar(y)}>Evet, çıkar</button>
                                                <button className="btn" disabled={mesgul} onClick={() => setCikarId(null)}>Vazgeç</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                    {liste && liste.length === 0 && <div className="bos">Henüz yönetici yok.</div>}
                </div>
            );
        };

        /* ---------- Kayıtlar (denetim) ---------- */
        const EYLEM_ONERILERI = ['manga', 'bolum', 'sayfa', 'kategori', 'yukleme', 'kullanici', 'yonetici', 'ayar'];
        const Kayitlar = () => {
            const [arama, setArama] = useState('');
            const [aranan, setAranan] = useState('');
            const [eylem, setEylem] = useState('');
            const [eylemSuz, setEylemSuz] = useState('');
            useEffect(() => { const t = setTimeout(() => setAranan(arama.trim()), 300); return () => clearTimeout(t); }, [arama]);
            useEffect(() => { const t = setTimeout(() => setEylemSuz(eylem.trim()), 300); return () => clearTimeout(t); }, [eylem]);
            const s = useListe('/admin/kayitlar', `arama=${encodeURIComponent(aranan)}&eylem=${encodeURIComponent(eylemSuz)}&`, 25);
            return (
                <div>
                    <div className="bolum-baslik"><div><h2>Kayıtlar</h2><div className="ikincil">Yönetim işlemlerinin denetim kaydı · {s.toplam} kayıt</div></div></div>
                    <Bildirim b={s.bildirim} kapat={() => s.setBildirim(null)} />
                    <div className="filtre-satir" style={{ marginBottom: 12 }}>
                        <div className="form-grubu" style={{ marginBottom: 0 }}>
                            <label htmlFor="kyAra">Ara (kim, eylem, hedef)</label>
                            <input id="kyAra" type="search" className="form-input" value={arama} onChange={(e) => setArama(e.target.value)} />
                        </div>
                        <div className="form-grubu" style={{ marginBottom: 0 }}>
                            <label htmlFor="kyEylem">Eylem süzgeci</label>
                            <input id="kyEylem" className="form-input" list="eylemOnerileri" placeholder="Örn: manga, kullanici.ban" value={eylem} onChange={(e) => setEylem(e.target.value)} />
                            <datalist id="eylemOnerileri">{EYLEM_ONERILERI.map(x => <option key={x} value={x} />)}</datalist>
                        </div>
                        <button type="button" className="btn" disabled={!arama && !eylem} onClick={() => { setArama(''); setEylem(''); }}>Süzgeçleri temizle</button>
                    </div>
                    {s.liste.length > 0 && (
                        <table className="tablo">
                            <thead><tr><th scope="col">Tarih</th><th scope="col">Kim</th><th scope="col">Eylem</th><th scope="col">Hedef</th><th scope="col">Detay</th></tr></thead>
                            <tbody>
                                {s.liste.map(r => (
                                    <tr key={r.id}>
                                        <td data-label="Tarih">{tarihSaat(r.tarih)}</td>
                                        <td data-label="Kim">{r.yapanAdi || '—'}</td>
                                        <td data-label="Eylem" className="mono">{r.eylem}</td>
                                        <td data-label="Hedef">{r.hedef || '—'}</td>
                                        <td data-label="Detay" className="ikincil">{r.detay || '—'}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    )}
                    {s.yukleniyor && <div className="bos">Yükleniyor...</div>}
                    {!s.yukleniyor && s.liste.length === 0 && !s.bildirim && <div className="bos">{aranan || eylemSuz ? 'Süzgeçle eşleşen kayıt yok.' : 'Henüz kayıt yok.'}</div>}
                    <Sayfalama s={s} />
                </div>
            );
        };

        /* ---------- Ayarlar ---------- */
        const AYAR_BOS = { kayitAcik: true, yorumAcik: true, bakimModu: false, bakimMesaji: '', duyuruAcik: false, duyuruMetni: '', sohbetAcik: true };
        const Anahtar = ({ id, ad, aciklama, deger, degis, kilit }) => (
            <div className="anahtar-satir">
                <div>
                    <div className="izin-ad" id={id + 'Ad'}>{ad}</div>
                    <div className="izin-acik">{aciklama}</div>
                </div>
                <button type="button" role="switch" id={id} className="anahtar" aria-checked={deger} aria-labelledby={id + 'Ad'} disabled={kilit} onClick={() => degis(!deger)}></button>
            </div>
        );

        const Ayarlar = ({ kirliBildir }) => {
            const [asil, setAsil] = useState(null);
            const [f, setF] = useState(null);
            const [bildirim, setBildirim] = useState(null);
            const [mesgul, setMesgul] = useState(false);
            const getir = useCallback(async () => {
                try {
                    const { veri } = await istek('/admin/ayarlar');
                    const a = { ...AYAR_BOS, ...veri, bakimMesaji: (veri && veri.bakimMesaji) || '', duyuruMetni: (veri && veri.duyuruMetni) || '' };
                    setAsil(a); setF(a); setBildirim(null);
                } catch (err) { setBildirim(hataBildirimi(err, getir)); }
            }, []);
            useEffect(() => { getir(); }, [getir]);

            const kirli = !!(asil && f && JSON.stringify(asil) !== JSON.stringify(f));
            useEffect(() => { kirliBildir(kirli); return () => kirliBildir(false); }, [kirli]);
            useEffect(() => {
                if (!kirli) return;
                const h = (e) => { e.preventDefault(); e.returnValue = ''; };
                window.addEventListener('beforeunload', h);
                return () => window.removeEventListener('beforeunload', h);
            }, [kirli]);

            const kaydet = async () => {
                setMesgul(true); setBildirim(null);
                try {
                    const { veri } = await istek('/admin/ayarlar', { method: 'PUT', json: f });
                    const a = { ...f, ...(veri && typeof veri === 'object' && 'kayitAcik' in veri ? veri : {}) };
                    a.bakimMesaji = a.bakimMesaji || ''; a.duyuruMetni = a.duyuruMetni || '';
                    setAsil(a); setF(a);
                    setBildirim({ tur: 'basarili', mesaj: 'Ayarlar kaydedildi.' });
                } catch (err) { setBildirim(hataBildirimi(err, kaydet)); }
                finally { setMesgul(false); }
            };
            const ayarla = (alan) => (v) => setF(o => ({ ...o, [alan]: v }));

            return (
                <div>
                    <div className="bolum-baslik"><div><h2>Ayarlar</h2><div className="ikincil">Site genelindeki davranışlar</div></div></div>
                    <Bildirim b={bildirim} kapat={() => setBildirim(null)} />
                    {!f && !bildirim && <div className="bos">Yükleniyor...</div>}
                    {f && (
                        <div>
                            <div className="liste">
                                <Anahtar id="aKayit" ad="Yeni kayıtlara izin ver" aciklama="Kapalıyken yeni üyelik oluşturulamaz." deger={f.kayitAcik} degis={ayarla('kayitAcik')} kilit={mesgul} />
                                <Anahtar id="aYorum" ad="Yorumlara izin ver" aciklama="Kapalıyken yeni yorum yazılamaz." deger={f.yorumAcik} degis={ayarla('yorumAcik')} kilit={mesgul} />
                                <Anahtar id="aSohbet" ad="Sohbete izin ver" aciklama="Kapalıyken sohbete yeni mesaj yazılamaz; mesajlar okunabilir." deger={f.sohbetAcik} degis={ayarla('sohbetAcik')} kilit={mesgul} />
                                <Anahtar id="aBakim" ad="Bakım modu" aciklama="Açıkken site ziyaretçilere bakım mesajı gösterir." deger={f.bakimModu} degis={ayarla('bakimModu')} kilit={mesgul} />
                            </div>
                            <div className="form-grubu" style={{ marginTop: 16 }}>
                                <label htmlFor="bakimMesaji">Bakım mesajı</label>
                                <textarea id="bakimMesaji" className="form-textarea" maxLength={300} value={f.bakimMesaji} onChange={(e) => ayarla('bakimMesaji')(e.target.value)} disabled={mesgul} style={{ minHeight: 80 }}></textarea>
                                <div className="sayac">{f.bakimMesaji.length} / 300</div>
                            </div>
                            <div className="liste" style={{ borderTop: 'none' }}>
                                <Anahtar id="aDuyuru" ad="Duyuru" aciklama="Açıkken duyuru metni sitenin üstünde gösterilir." deger={f.duyuruAcik} degis={ayarla('duyuruAcik')} kilit={mesgul} />
                            </div>
                            <div className="form-grubu" style={{ marginTop: 16 }}>
                                <label htmlFor="duyuruMetni">Duyuru metni</label>
                                <textarea id="duyuruMetni" className="form-textarea" maxLength={500} value={f.duyuruMetni} onChange={(e) => ayarla('duyuruMetni')(e.target.value)} disabled={mesgul} style={{ minHeight: 100 }}></textarea>
                                <div className="sayac">{f.duyuruMetni.length} / 500</div>
                            </div>
                            <div className="arac-satir">
                                <div className="eylemler">
                                    <button type="button" className="btn btn-ana" disabled={mesgul || !kirli} onClick={kaydet}>{mesgul ? 'Kaydediliyor...' : 'Kaydet'}</button>
                                    {kirli && <button type="button" className="btn" disabled={mesgul} onClick={() => setF(asil)}>Değişiklikleri geri al</button>}
                                </div>
                                {kirli && <span className="ikincil" role="status">Kaydedilmemiş değişiklikleriniz var.</span>}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        /* ---------- Kök ---------- */
        const cikisYap = () => {
            try { localStorage.removeItem('kage95_token'); localStorage.removeItem('kage95_user'); } catch (e) {}
            window.location.href = 'login.html';
        };

        const Kilit = ({ baslik, metin, giris }) => (
            <div className="erisim-kutu">
                <h2>{baslik}</h2>
                <p>{metin}</p>
                <div className="eylemler">
                    {giris && <a className="btn btn-ana" href="login.html">Giriş yap</a>}
                    <a className="btn" href="index.html">Siteye dön</a>
                </div>
            </div>
        );

        const AdminPaneli = () => {
            const [ben, setBen] = useState(null);
            const [durum, setDurum] = useState(tokenAl() ? 'yukleniyor' : 'girissiz'); // yukleniyor | hazir | girissiz | oturum | yetkisiz | ag
            const [gorunum, setGorunum] = useState({ ekran: 'liste' });
            const [bolum, setBolum] = useState('ozet');
            const [mesaj, setMesaj] = useState(null);
            const kirliRef = useRef(false);
            const kullanici = kullaniciAl();

            const yukle_ = useCallback(async () => {
                setDurum('yukleniyor');
                try {
                    const { veri } = await istek('/admin/ben');
                    setBen(veri);
                    const yetkili = veri && (veri.rol === 'Owner' || (veri.rol === 'Admin' && veri.yetkiler && veri.yetkiler.length > 0));
                    setDurum(yetkili ? 'hazir' : 'yetkisiz');
                } catch (err) {
                    if (err.durum === 401) setDurum('oturum');
                    else if (err.durum === 403) setDurum('yetkisiz');
                    else setDurum('ag');
                }
            }, []);

            useEffect(() => { if (tokenAl()) yukle_(); }, [yukle_]);

            useEffect(() => {
                const f = (e) => { if (e.detail === '401') setDurum('oturum'); };
                window.addEventListener('kage95-yetki', f);
                return () => window.removeEventListener('kage95-yetki', f);
            }, []);

            if (durum === 'girissiz') return <Kilit giris baslik="Bu sayfa yalnızca yöneticilere açıktır" metin="Yönetici hesabıyla giriş yapmanız gerekiyor." />;
            if (durum === 'oturum') return <Kilit giris baslik="Oturum süresi doldu" metin="Devam etmek için yeniden giriş yapın." />;
            if (durum === 'yetkisiz') return <Kilit baslik="Bu hesabın yönetim yetkisi yok" metin="Bu panele yalnızca site sahibi ve izin verilen yöneticiler girebilir." />;
            if (durum === 'ag') return (
                <div className="erisim-kutu">
                    <h2>Sunucuya ulaşılamadı</h2>
                    <p>Bağlantınızı kontrol edip tekrar deneyin.</p>
                    <div className="eylemler"><button className="btn btn-ana" onClick={yukle_}>Tekrar dene</button><a className="btn" href="index.html">Siteye dön</a></div>
                </div>
            );
            if (durum === 'yukleniyor' || !ben) return <div className="bos">Yükleniyor...</div>;

            const sahip = ben.rol === 'Owner';
            const can = (k) => sahip || (ben.yetkiler || []).includes(k);
            const bolumler = [
                { id: 'ozet', ad: 'Özet', goster: true },
                { id: 'seriler', ad: 'Seriler', goster: ['manga.yaz', 'manga.sil', 'bolum.yaz', 'bolum.sil', 'bolum.duzenle'].some(can) },
                { id: 'kategoriler', ad: 'Kategoriler', goster: can('kategori.yonet') },
                { id: 'yorumlar', ad: 'Yorumlar', goster: can('yorum.sil') },
                { id: 'sikayetler', ad: 'Şikayetler', goster: can('yorum.sil') },
                { id: 'sohbet', ad: 'Sohbet', goster: can('sohbet.yonet') },
                { id: 'kullanicilar', ad: 'Kullanıcılar', goster: can('kullanici.gor') },
                { id: 'yoneticiler', ad: 'Yöneticiler', goster: sahip },
                { id: 'duyurular', ad: 'Duyurular', goster: can('duyuru.yonet') },
                { id: 'onecikanlar', ad: 'Öne çıkanlar', goster: can('duyuru.yonet') },
                { id: 'kayitlar', ad: 'Kayıtlar', goster: can('kayit.gor') },
                { id: 'ayarlar', ad: 'Ayarlar', goster: can('ayar.yonet') }
            ].filter(b => b.goster);

            const kirliOnay = () => !kirliRef.current || window.confirm('Kaydedilmemiş değişiklikleriniz var. Yine de ayrılmak istiyor musunuz?');
            const sec = (id) => {
                if (id !== bolum && !kirliOnay()) return;
                setBolum(id); setGorunum({ ekran: 'liste' }); setMesaj(null); window.scrollTo(0, 0);
            };
            const git = (g) => { setGorunum(g); window.scrollTo(0, 0); };
            const ad = ben.kullaniciAdi || (kullanici && kullanici.kullaniciAdi) || '';

            return (
                <div className="admin-konteyner">
                    <div className="admin-header">
                        <h1>Yönetim paneli</h1>
                        <div className="ust-sag">
                            <span className="kisi">{ad} <span className="rol-etiket">{sahip ? 'Site sahibi' : 'Yönetici'}</span></span>
                            <a href="index.html" className="btn-don">Siteye dön</a>
                            <button type="button" className="btn-don" onClick={cikisYap}>Çıkış yap</button>
                        </div>
                    </div>
                    <div className="yerlesim">
                        <nav className="menu" aria-label="Bölümler">
                            {bolumler.map(b => (
                                <button key={b.id} type="button" className={`menu-btn ${bolum === b.id ? 'aktif' : ''}`} aria-current={bolum === b.id ? 'page' : undefined} onClick={() => sec(b.id)}>{b.ad}</button>
                            ))}
                        </nav>
                        <main className="icerik">
                            {bolum === 'ozet' && <Ozet />}
                            {bolum === 'seriler' && gorunum.ekran === 'liste' && <SeriListesi git={git} mesaj={mesaj} setMesaj={setMesaj} can={can} />}
                            {bolum === 'seriler' && gorunum.ekran === 'form' && can('manga.yaz') && <SeriFormu key={gorunum.id || 'yeni'} id={gorunum.id} git={git} setMesaj={setMesaj} />}
                            {bolum === 'seriler' && gorunum.ekran === 'bolumler' && <Bolumler key={gorunum.id} id={gorunum.id} git={git} can={can} />}
                            {bolum === 'seriler' && gorunum.ekran === 'sayfalar' && <SayfaYoneticisi key={gorunum.id} bolumId={gorunum.id} mangaId={gorunum.mangaId} git={git} can={can} />}
                            {bolum === 'kategoriler' && <Kategoriler />}
                            {bolum === 'yorumlar' && <Yorumlar />}
                            {bolum === 'sikayetler' && can('yorum.sil') && <Sikayetler />}
                            {bolum === 'sohbet' && can('sohbet.yonet') && <Sohbet />}
                            {bolum === 'kullanicilar' && <Kullanicilar ben={ben} can={can} />}
                            {bolum === 'yoneticiler' && sahip && <Yoneticiler />}
                            {bolum === 'duyurular' && <Duyurular />}
                            {bolum === 'onecikanlar' && <OneCikanlar />}
                            {bolum === 'kayitlar' && <Kayitlar />}
                            {bolum === 'ayarlar' && <Ayarlar kirliBildir={(v) => { kirliRef.current = v; }} />}
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminPaneli />);
    </script>
</body>
</html>
