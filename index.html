                <div className={`${sinif} arama-kutu`} ref={kapRef}>
                    {ikon && <span className="arama-ikon" aria-hidden="true"><Ikon ad="ara" boyut={18} /></span>}
                    <input
                        ref={girdiRef}
                        type="search"
                        id={id}
                        placeholder="Manga ara…"
                        value={deger}
                        onChange={(e) => { degistir(e.target.value); setAcik(true); }}
                        onFocus={() => setAcik(true)}
                        onKeyDown={tus}
                        role="combobox"
                        aria-expanded={!!listeGoster}
                        aria-controls={listeId}
                        aria-autocomplete="list"
                        aria-activedescendant={listeGoster && aktif >= 0 ? `${listeId}-${aktif}` : undefined}
                        aria-label="Manga kütüphanesinde ara"
                        autoComplete="off"
                    />
                    {listeGoster && (
                        <div className="arama-oneri">
                            <ul role="listbox" id={listeId} aria-label="Arama önerileri">
                                {oneriler.map((m, i) => (
                                    <li key={m.id} id={`${listeId}-${i}`} role="option" aria-selected={i === aktif}
                                        className={i === aktif ? 'aktif' : ''}
                                        onPointerDown={(e) => e.preventDefault()}
                                        onClick={() => git(m)}
                                        onMouseEnter={() => setAktif(i)}>
                                        <span className={`arama-oneri-kapak desen-${(m.id || 0) % 5}`}>
                                            <img src={m.kapakResmiURL || YER_TUTUCU} alt="" loading="lazy" decoding="async" onError={gorselHata} />
                                        </span>
                                        <span className="arama-oneri-metin">
                                            <span className="arama-oneri-ad">{eslesmeVurgula(m.mangaAdi, q)}</span>
                                            <span className="arama-oneri-alt">
                                                {[m.yazar, durumMetni(m.durum), `${m.bolumSayisi || 0} bölüm`].filter(Boolean).join(' · ')}
                                                {m.eslesme === 'aciklama' && <em> · açıklamada geçiyor</em>}
                                                {m.eslesme === 'yazar' && <em> · yazar eşleşmesi</em>}
                                            </span>
                                        </span>
                                    </li>
                                ))}
                            </ul>
                            <div className="arama-oneri-durum" role="status" aria-live="polite">
                                {durum === 'yukleniyor' && oneriler.length === 0 && 'Aranıyor…'}
                                {durum === 'hata' && 'Öneriler yüklenemedi.'}
                                {durum === 'hazir' && oneriler.length === 0 && (
                                    <span className="arama-oneri-bos">
                                        <strong>Sonuç bulunamadı.</strong>
                                        {!aciklama && <button type="button" onPointerDown={(e) => e.preventDefault()} onClick={() => setAciklama(true)}>Açıklamalarda da ara</button>}
                                    </span>
                                )}
                                {durum === 'hazir' && toplam > oneriler.length && (
                                    <button type="button" className="arama-oneri-tumu" onPointerDown={(e) => e.preventDefault()} onClick={tumunuGor}>Tüm {toplam} sonucu gör</button>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const AnaSayfa = ({ aramaMetni, setAramaMetni, aramaAciklama = false, setAramaAciklama, kayitAcik = true }) => {
            const [arama, setArama] = React.useState('');
            const [secilenKategoriler, setSecilenKategoriler] = React.useState([]);
            const kategori = secilenKategoriler.join(',');
            const [durumFiltre, setDurumFiltre] = React.useState('');
            const [rastgeleBusy, setRastgeleBusy] = React.useState(false);
            const [kategoriler, setKategoriler] = React.useState([]);
            const [mangalar, setMangalar] = React.useState([]);
            const [toplam, setToplam] = React.useState(0);
            const [sayfa, setSayfa] = React.useState(1);
            const [yukleniyor, setYukleniyor] = React.useState(true);
            const [hata, setHata] = React.useState(null);
            const istekNo = React.useRef(0);
            const [sirala, setSirala] = React.useState('puan');
            const [devam] = React.useState(() => {
                try {
                    const v = JSON.parse(localStorage.getItem('kage95_son_okunan') || 'null');
                    return v && v.bolumId && v.mangaAdi ? v : null;
                } catch (e) { return null; }
            });

            React.useEffect(() => {
                fetch(`${API_URL}/categories`)
                    .then(r => { if (!r.ok) throw new Error(); return r.json(); })
                    .then(v => setKategoriler(Array.isArray(v) ? v.map(k => k.kategoriAdi) : []))
                    .catch(() => setKategoriler([]));
            }, []);

            const kategoriDegistir = (k) => {
                if (!k) { setSecilenKategoriler([]); return; }
                setSecilenKategoriler(onceki => onceki.includes(k) ? onceki.filter(x => x !== k) : [...onceki, k]);
            };
            const rastgeleGit = () => {
                if (rastgeleBusy) return;
                setRastgeleBusy(true);
                fetch(`${API_URL}/mangas/rastgele`)
                    .then(r => r.ok ? r.json() : null)
                    .then(v => {
                        if (v && (v.slug || v.id)) { window.location.hash = mangaLink(v); return; }
                        if (mangalar.length > 0) {
                            const m = mangalar[Math.floor(Math.random() * mangalar.length)];
                            window.location.hash = mangaLink(m);
                        }
                    })
                    .catch(() => {
                        if (mangalar.length > 0) {
                            const m = mangalar[Math.floor(Math.random() * mangalar.length)];
                            window.location.hash = mangaLink(m);
                        }
                    })
                    .finally(() => setRastgeleBusy(false));
            };

            // Arama kutusunu gecikmeli uygula
            React.useEffect(() => {
                const t = setTimeout(() => setArama(aramaMetni.trim()), 350);
                return () => clearTimeout(t);
            }, [aramaMetni]);

            const yukle = React.useCallback((hedefSayfa) => {
                const no = ++istekNo.current;
                setYukleniyor(true);
                setHata(null);
                const p = new URLSearchParams({ page: hedefSayfa, pageSize: SAYFA_BOYUTU });
                if (arama) { p.set('search', arama); p.set('aciklama', aramaAciklama ? 'true' : 'false'); }
                if (kategori) p.set('category', kategori);
                if (durumFiltre) p.set('durum', durumFiltre);
                if (sirala !== 'yeni') p.set('sirala', sirala);
                fetch(`${API_URL}/mangas?${p.toString()}`)
                    .then(r => {
                        if (!r.ok) throw new Error(`HTTP ${r.status}`);
                        const t = parseInt(r.headers.get('X-Total-Count') || '0', 10);
                        return r.json().then(v => ({ v, t }));
                    })
                    .then(({ v, t }) => {
                        if (no !== istekNo.current) return;
                        const liste = Array.isArray(v) ? v : [];
                        setToplam(t || liste.length);
                        setMangalar(onceki => hedefSayfa === 1 ? liste : [...onceki, ...liste]);
                        setSayfa(hedefSayfa);
                    })
                    .catch(() => { if (no === istekNo.current) setHata('Manga listesi yüklenemedi. Sunucu çalışmıyor olabilir; biraz sonra tekrar deneyin.'); })
                    .finally(() => { if (no === istekNo.current) setYukleniyor(false); });
            }, [arama, aramaAciklama, kategori, durumFiltre, sirala]);

            React.useEffect(() => { yukle(1); }, [yukle]);

            const dahaVar = mangalar.length < toplam;
            const ilkYukleme = yukleniyor && mangalar.length === 0;
            const tumKategoriler = ['', ...kategoriler];
            // Sohbet, ilk manga şeritlerinin altına iner ki mangalar önce görünsün.
            const sohbetSeridi = <div className="ana-icerik sohbet-ust"><SohbetKap mod="serit" /></div>;

            return (
                <>
                    <OneCikanlar />
                    <h1 className="sr-only">Kage 95 · Türkçe manga arşivi</h1>

                    <DuyuruSeridi />
                    <SeriSeridi baslik="Son güncellenenler" sirala="guncel" />
                    <PopulerSeriler />
                    {sohbetSeridi}
                    <SeriSeridi baslik="Yeni eklenen seriler" sirala="yeni" />

                    <section id="turler" className="tur-bolum" aria-label="Türlere göre filtrele">
                        <span className="tur-etiket">Türler</span>
                        {tumKategoriler.map(kat => {
                            const secili = kat ? secilenKategoriler.includes(kat) : secilenKategoriler.length === 0;
                            return (
                                <button
                                    key={kat || 'tumu'}
                                    aria-pressed={secili}
                                    className={`kategori-btn ${secili ? 'aktif' : ''}`}
                                    onClick={() => kategoriDegistir(kat)}
                                >
                                    {kat || 'Tümü'}
                                </button>
                            );
                        })}
                    </section>

                    <section id="seriler" className="ana-icerik" aria-label="Manga Listesi">
                        {devam && !arama && !kategori && !durumFiltre && (
                            <div className="devam-serit">
                                <div>
                                    <small>Okumaya devam et</small>
                                    <strong>{devam.mangaAdi}</strong>
                                    <span className="devam-alt">Bölüm {devam.bolumNo}{devam.toplam ? ` · Sayfa ${devam.sayfa}/${devam.toplam}` : ''}</span>
                                </div>
                                <a className="btn-ana" href={`read.html?chapter=${devam.bolumId}`}>Devam et</a>
                            </div>
                        )}
                        <div className="bolum-baslik-satir">
                            <h2>{secilenKategoriler.length ? `${secilenKategoriler.join(' + ')} serileri` : 'Seriler'}</h2>
                            {arama && (
                                <button type="button" className="arama-filtre-cip" onClick={() => setAramaMetni('')} aria-label={`“${arama}” aramasını temizle`}>
                                    “{arama}” araması <span aria-hidden="true">✕</span>
                                </button>
                            )}
                            <div className="baslik-sag" style={{ flexWrap: 'wrap' }}>
                                <button type="button" className="siralama" style={{ cursor: 'pointer', padding: '0 12px' }} onClick={rastgeleGit} disabled={rastgeleBusy}>
                                    {rastgeleBusy ? 'Seçiliyor…' : 'Rastgele seri'}
                                </button>
                                <label className="sr-only" htmlFor="durumSec">Durum</label>
                                <select id="durumSec" className="siralama" value={durumFiltre} onChange={(e) => setDurumFiltre(e.target.value)}>
                                    <option value="">Tüm durumlar</option>
                                    <option value="DevamEdiyor">Devam ediyor</option>
                                    <option value="Tamamlandi">Tamamlandı</option>
                                    <option value="Ara">Ara verdi</option>
                                </select>
                                <label className="sr-only" htmlFor="siralamaSec">Sırala</label>
                                <select id="siralamaSec" className="siralama" value={sirala} onChange={(e) => setSirala(e.target.value)}>
                                    <option value="yeni">En yeni</option>
                                    <option value="puan">En yüksek puan</option>
                                    <option value="ad">A-Z</option>
                                </select>
                                <span className="sonuc-sayisi" aria-live="polite">{toplam} seri</span>
                            </div>
                        </div>

                        {ilkYukleme && <IskeletGrid adet={SAYFA_BOYUTU} />}

                        {!yukleniyor && hata && mangalar.length === 0 && (
                            <DurumKutu ikon="hata" rol="alert" baslik="Bağlantı kurulamadı" metin={hata}>
                                <button className="btn-ikincil" onClick={() => yukle(1)}>Tekrar dene</button>
                            </DurumKutu>
                        )}

                        {mangalar.length > 0 && (
                            <div className="manga-grid">
                                {mangalar.map(m => <MangaKart key={m.id} m={m} yeniGoster={!(mangalar.length > 1 && mangalar.every(x => yeniMi(x.eklenmeTarihi)))} />)}
                            </div>
                        )}

                        {!yukleniyor && !hata && mangalar.length === 0 && (
                            <DurumKutu ikon="ara" baslik="Eşleşen manga bulunamadı"
                                metin={arama ? `“${arama}” için sonuç bulunamadı.` : (kategori || durumFiltre ? 'Tür veya durum filtresiyle eşleşen kayıt yok.' : 'Arşivde henüz manga yok.')}>
                                {arama && !aramaAciklama && setAramaAciklama && (
                                    <button className="btn-ikincil" onClick={() => setAramaAciklama(true)}>Açıklamalarda da ara</button>
                                )}
                                {(arama || kategori || durumFiltre) && (
                                    <button className="btn-ikincil" onClick={() => { setAramaMetni(''); setSecilenKategoriler([]); setDurumFiltre(''); }}>Filtreleri temizle</button>
                                )}
                            </DurumKutu>
                        )}

                        {mangalar.length > 0 && hata && (
                            <p className="hata-satir" role="alert">{hata}</p>
                        )}

                        {mangalar.length > 0 && (dahaVar || hata) && (
                            <div className="daha-fazla">
                                <button className="btn-ikincil" disabled={yukleniyor} onClick={() => yukle(sayfa + 1)}>
                                    {yukleniyor ? 'Yükleniyor…' : 'Daha fazla yükle'}
                                </button>
                            </div>
                        )}
                    </section>
                </>
            );
        };

        /* ------------------------- MANGA DETAY ------------------------- */
        const MangaDetay = ({ id }) => {
            const [manga, setManga] = React.useState(null);
            const [yukleniyor, setYukleniyor] = React.useState(true);
            const [hata, setHata] = React.useState(null);
            const [yeniFirst, setYeniFirst] = React.useState(true);
            const [okunan, setOkunan] = React.useState(() => okunanlariAl(id));
            const [kayitli, setKayitli] = React.useState(false);
            const [kutuphaneMesaj, setKutuphaneMesaj] = React.useState('');
            const [kutuphaneBusy, setKutuphaneBusy] = React.useState(false);
            const [dene, setDene] = React.useState(0);
            const [kopyaMesaj, setKopyaMesaj] = React.useState('');
            const [bolumArama, setBolumArama] = React.useState('');
            const [gorunumModu, setGorunumModu] = React.useState('liste');
            const [okumaDurumu, setOkumaDurumu] = React.useState(() => kutuphaneDurumuAl(id));
            React.useEffect(() => {
                if (manga && manga.mangaAdi) document.title = manga.mangaAdi + ' | Kage 95';
            }, [manga]);
            const baglantiKopyala = () => {
                const url = window.location.href;
                const bitti = (ok) => setKopyaMesaj(ok ? 'Bağlantı kopyalandı.' : 'Kopyalanamadı; adresi adres çubuğundan kopyalayın.');
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(url).then(() => bitti(true), () => bitti(false));
                    return;
                }
                try {
                    const t = document.createElement('textarea');
                    t.value = url; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
                    document.body.appendChild(t); t.select();
                    const ok = document.execCommand('copy');
                    document.body.removeChild(t);
                    bitti(ok);
                } catch (e) { bitti(false); }
            };

            React.useEffect(() => {
                let iptal = false;
                setYukleniyor(true); setHata(null); setManga(null);
                fetch(`${API_URL}/mangas/${encodeURIComponent(id)}`)
                    .then(r => {
                        if (r.status === 404) throw new Error('404');
                        if (!r.ok) throw new Error('HTTP');
                        return r.json();
                    })
                    .then(v => {
                        if (!iptal && v) {
                            setManga(v);
                            setOkunan(okunanlariAl(v.id));
                            setOkumaDurumu(kutuphaneDurumuAl(v.id));

                            // Adres çubuğu optimizasyonu: slug varsa /manga/chainsaw-man olarak göster
                            const hedefSlug = v.slug || slugOlustur(v.mangaAdi);
                            if (hedefSlug) {
                                const beklenenYol = '/manga/' + hedefSlug;
                                if (window.location.pathname !== beklenenYol) {
                                    try {
                                        history.replaceState(history.state, '', beklenenYol + (window.location.search || ''));
                                    } catch (e) {}
                                }
                            }

                            const token = tokenAl();
                            if (token) {
                                fetch(`${API_URL}/user/library/check/${v.id}`, { headers: { Authorization: `Bearer ${token}` } })
                                    .then(r => r.ok ? r.json() : null)
                                    .then(res => { if (!iptal && res) setKayitli(!!res.isSaved); })
                                    .catch(() => {});
                            }
                        }
                    })
                    .catch(e => { if (!iptal) setHata(e.message === '404' ? 'Bu manga bulunamadı.' : 'Manga yüklenemedi. Sunucu çalışmıyor olabilir.'); })
                    .finally(() => { if (!iptal) setYukleniyor(false); });

                return () => { iptal = true; };
            }, [id, dene]);

            const kutuphaneDegistir = () => {
                const token = tokenAl();
                if (!token) { setKutuphaneMesaj('GIRIS'); return; }
                const gercekId = manga ? manga.id : id;
                setKutuphaneBusy(true);
                fetch(`${API_URL}/user/library/toggle`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
                    body: JSON.stringify({ mangaId: gercekId })
                })
                    .then(r => {
                        if (r.status === 401) { setKutuphaneMesaj('GIRIS'); return null; }
                        if (!r.ok) throw new Error();
                        return r.json();
                    })
                    .then(v => {
                        if (v) {
                            setKayitli(!!v.isSaved); setKutuphaneMesaj(v.message || '');
                            if (window.Kage95Liderlik) window.Kage95Liderlik.yanittan(v);
                        }
                    })
                    .catch(() => setKutuphaneMesaj('İşlem başarısız oldu. Daha sonra tekrar deneyin.'))
                    .finally(() => setKutuphaneBusy(false));
            };

            if (yukleniyor) return (
                <div className="ana-icerik detay" role="status" aria-label="Yükleniyor" aria-busy="true">
                    <div className="detay-ust" aria-hidden="true">
                        <div className="detay-kapak iskelet-blok"></div>
                        <div className="detay-bilgi">
                            <div className="iskelet-blok" style={{ height: 36, width: '70%' }}></div>
                            <div className="iskelet-blok iskelet-satir ilk"></div>
                            <div className="iskelet-blok iskelet-satir"></div>
                            <div className="iskelet-blok iskelet-satir kisa"></div>
                        </div>
                    </div>
                </div>
            );
            if (hata || !manga) return (
                <div className="ana-icerik">
                    <a className="geri-link" href="#/">Tüm seriler</a>
                    <DurumKutu ikon="hata" rol="alert" baslik="Açılamadı" metin={hata}>
                        <button className="btn-ikincil" onClick={() => setDene(dene + 1)}>Tekrar dene</button>
                        <a className="btn-ikincil" href="#/">Ana sayfaya dön</a>
                    </DurumKutu>
                </div>
            );

            const bolumler = [...(manga.bolumler || [])].sort((a, b) => yeniFirst ? b.bolumNo - a.bolumNo : a.bolumNo - b.bolumNo);
            const ilkBolum = [...(manga.bolumler || [])].sort((a, b) => a.bolumNo - b.bolumNo)[0];
            // Kaldığı bölüm: okunan listesinde en son açılan, bu seride hâlâ var olan bölüm
            const devamBolum = (() => {
                const l = Array.from(okunan);
                for (let i = l.length - 1; i >= 0; i--) {
                    const b = (manga.bolumler || []).find(x => String(x.id) === l[i]);
                    if (b) return b;
                }
                return null;
            })();
            const filtreliBolumler = bolumler.filter(b => {
                if (!bolumArama.trim()) return true;
                const q = bolumArama.trim().toLowerCase();
                const noStr = String(b.bolumNo || '');
                const adStr = String(b.bolumAdi || '').toLowerCase();
                return noStr.includes(q) || adStr.includes(q);
            });

            return (
                <div className="ana-icerik detay">
                    <a className="detay-geri-buton" href="#/">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                        <span>Tüm Serilere Dön</span>
                    </a>

                    <section className="detay-ust" aria-label="Manga bilgileri" style={manga.kapakResmiURL ? { '--detay-kapak': `url("${manga.kapakResmiURL.replace(/["\\\n]/g, '')}")` } : undefined}>
                        <div className={`detay-kapak desen-${(manga.id || 0) % 5} ${manga.kapakResmiURL ? '' : 'kapak-yok'}`}>
                            <img src={manga.kapakResmiURL || YER_TUTUCU} alt={`${manga.mangaAdi} kapak görseli`} decoding="async" onError={gorselHata} />
                        </div>
                        <div className="detay-bilgi">
                            <div className="detay-rozet-serit">
                                {manga.durum === 'Tamamlandi' ? (
                                    <span className="detay-rozet yesil">● Tamamlandı</span>
                                ) : (manga.durum === 'Ara' || manga.durum === 'AraVerdi') ? (
                                    <span className="detay-rozet altin">⏳ Ara Verildi</span>
                                ) : (
                                    <span className="detay-rozet kizil">● Devam Ediyor</span>
                                )}
                                <span className="detay-rozet notr">📚 {bolumler.length > 0 ? `${bolumler.length} Bölüm` : 'Yakında'}</span>
                                {manga.puan > 0 && <span className="detay-rozet altin">★ {manga.puan.toFixed(1)}</span>}
                            </div>

                            <h1 className="detay-baslik">{manga.mangaAdi}</h1>

                            {manga.kategoriler && manga.kategoriler.length > 0 && (
                                <ul className="detay-turler" aria-label="Türler">
                                    {manga.kategoriler.map(k => <li key={k} className="detay-tur-oge">{k}</li>)}
                                </ul>
                            )}

                            <div className="detay-meta-izgara">
                                <div className="detay-meta-kart">
                                    <span className="dmk-etiket">Yazar</span>
                                    <span className="dmk-deger" title={manga.yazar || 'Bilinmiyor'}>{manga.yazar || 'Bilinmiyor'}</span>
                                </div>
                                <div className="detay-meta-kart">
                                    <span className="dmk-etiket">Çizer</span>
                                    <span className="dmk-deger" title={manga.cizer || 'Bilinmiyor'}>{manga.cizer || 'Bilinmiyor'}</span>
                                </div>
                                <div className="detay-meta-kart">
                                    <span className="dmk-etiket">Durum</span>
                                    <span className="dmk-deger">{durumMetni(manga.durum)}</span>
                                </div>
                            </div>

                            <div className="detay-puan"><PuanKutu url={`${API_URL}/mangas/${manga.id}/puan`} etiket="Bu seriyi puanla" /></div>

                            <div className="detay-aciklama-panel">
                                <span className="detay-aciklama-baslik">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
                                    </svg>
                                    Özet
                                </span>
                                <KisaMetin metin={manga.aciklama || 'Bu seri için henüz bir açıklama eklenmemiş.'} />
                            </div>

                            <div className="detay-eylemler">
                                {devamBolum ? (
                                    <a className="detay-ana-btn" href={`read.html?chapter=${devamBolum.id}`} onClick={() => okunduIsaretle(manga.id, devamBolum.id)}>
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
                                        <span>Bölüm {bolumNoYaz(devamBolum.bolumNo)}'ten Devam Et</span>
                                    </a>
                                ) : ilkBolum ? (
                                    <a className="detay-ana-btn" href={`read.html?chapter=${ilkBolum.id}`} onClick={() => okunduIsaretle(manga.id, ilkBolum.id)}>
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
                                        <span>İlk Bölümü Oku</span>
                                    </a>
                                ) : (
                                    <span className="detay-ana-btn pasif" aria-disabled="true">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                        <span>Henüz Bölüm Eklenmedi</span>
                                    </span>
                                )}
                                {devamBolum && ilkBolum && devamBolum.id !== ilkBolum.id && (
                                    <a className="detay-ikincil-btn" href={`read.html?chapter=${ilkBolum.id}`} onClick={() => okunduIsaretle(manga.id, ilkBolum.id)}>
                                        <span>1. Bölüm</span>
                                    </a>
                                )}
                                <button type="button" className={`detay-ikincil-btn ${kayitli ? 'aktif' : ''}`} onClick={kutuphaneDegistir} disabled={kutuphaneBusy}>
                                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.1 5.2 3 1.6-1.9 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z" fill={kayitli ? 'currentColor' : 'none'} stroke="currentColor" strokeWidth="2" strokeLinejoin="round" /></svg>
                                    <span>{kayitli ? 'Favorilerde' : 'Favorilere Ekle'}</span>
                                </button>
                                <button type="button" className="detay-ikincil-btn" onClick={baglantiKopyala} title="Bağlantıyı kopyala">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" /><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" /></svg>
                                    <span>Paylaş</span>
                                </button>
                            </div>
                            {kopyaMesaj && <p className="bilgi-satir" role="status">{kopyaMesaj}</p>}
                            {kayitli && (
                                <div className="durum-secici">
                                    <label htmlFor="okumaDurumu">Okuma durumu</label>
                                    <select id="okumaDurumu" value={okumaDurumu} onChange={(e) => { setOkumaDurumu(e.target.value); kutuphaneDurumuYaz(manga.id, e.target.value); }}>
                                        {KUTUPHANE_DURUMLARI.map(([k, ad]) => <option key={k} value={k}>{ad}</option>)}
                                    </select>
                                </div>
                            )}
                            {kutuphaneMesaj === 'GIRIS' ? (
                                <p className="bilgi-satir" role="status">Favorilere eklemek için <a href="login.html">giriş yapın</a>.</p>
                            ) : kutuphaneMesaj ? (
                                <p className="bilgi-satir" role="status">{kutuphaneMesaj}</p>
                            ) : null}
                        </div>
                    </section>

                    <section aria-label="Bölümler" className="detay-bolumler-alani">
                        <div className="bolum-baslik-satir">
                            <div className="bolum-baslik-sol">
                                <h2>Bölümler</h2>
                                <span className="bolum-sayisi-rozet">{bolumler.length}</span>
                            </div>
                            <div className="bolum-filtre-bar">
                                {bolumler.length > 5 && (
                                    <div className="bolum-arama-kapsayici">
                                        <input
                                            type="search"
                                            className="bolum-arama-input"
                                            placeholder="Bölüm ara (örn. 12)..."
                                            value={bolumArama}
                                            onChange={e => setBolumArama(e.target.value)}
                                            aria-label="Bölüm ara"
                                        />
                                        {bolumArama && (
                                            <button type="button" className="bolum-arama-temizle" onClick={() => setBolumArama('')} aria-label="Aramayı temizle">✕</button>
                                        )}
                                    </div>
                                )}
                                {bolumler.length > 1 && (
                                    <>
                                        <button type="button" className="link-btn mod-toggle-btn" onClick={() => setGorunumModu(gorunumModu === 'liste' ? 'izgara' : 'liste')} title="Görünüm Değiştir">
                                            {gorunumModu === 'liste' ? '☵ Izgara' : '☰ Liste'}
                                        </button>
                                        <button type="button" className="link-btn toplu-okundu-btn" onClick={() => {
                                            const hepsiOkundu = bolumler.every(b => okunan.has(String(b.id)));
                                            if (hepsiOkundu) {
                                                if (!window.confirm('Bu serideki tüm bölümlerin okundu işareti kaldırılsın mı?')) return;
                                                topluOkunduYaz(manga.id, []);
                                            } else {
                                                const sirali = bolumler.slice().sort((a, b) => (Number(a.bolumNo) || 0) - (Number(b.bolumNo) || 0));
                                                topluOkunduYaz(manga.id, sirali.map(b => b.id));
                                            }
                                            setOkunan(okunanlariAl(manga.id));
                                        }}>
                                            {bolumler.every(b => okunan.has(String(b.id))) ? '✕ Okundu işaretlerini kaldır' : '✓ Tümünü okundu say'}
                                        </button>
                                        <button className="link-btn siralama-btn" onClick={() => setYeniFirst(!yeniFirst)} aria-label="Bölüm sıralamasını değiştir">
                                            {yeniFirst ? '↓ Yeniden eskiye' : '↑ Eskiden yeniye'}
                                        </button>
                                    </>
                                )}
                            </div>
                        </div>
                        {bolumler.length === 0 ? (
                            <DurumKutu ikon="kitap" baslik="Henüz bölüm eklenmemiş" metin={kayitli ? 'Favorilerinde. Yeni bölüm eklenince kütüphanende görünecek.' : 'Favorilere ekle, yeni bölüm eklenince kütüphanende gör.'}>
                                {kayitli
                                    ? <a className="btn-ikincil" href="#/">Diğer serilere göz at</a>
                                    : <button type="button" className="btn-ikincil" onClick={kutuphaneDegistir} disabled={kutuphaneBusy}>Favorilere ekle</button>}
                            </DurumKutu>
                        ) : filtreliBolumler.length === 0 ? (
                            <div className="arama-bos-kutu">
                                <p>"{bolumArama}" ile eşleşen bölüm bulunamadı.</p>
                                <button type="button" className="btn-ikincil" onClick={() => setBolumArama('')}>Tüm bölümleri göster</button>
                            </div>
                        ) : gorunumModu === 'izgara' ? (
                            <ul className="bolum-izgara">
                                {filtreliBolumler.map(b => {
                                    const okundu = okunan.has(String(b.id));
                                    let kayitliSayfa = 0;
                                    try { kayitliSayfa = parseInt(localStorage.getItem('kage95_sayfa_bolum_' + b.id) || '0', 10) || 0; } catch (e) {}
                                    return (
                                        <li key={b.id}>
                                            <a className={`bolum-cip ${okundu ? 'okundu' : ''}`}
                                               href={`read.html?chapter=${b.id}`}
                                               onClick={() => { okunduIsaretle(manga.id, b.id); }}
                                               title={`Bölüm ${bolumNoYaz(b.bolumNo)}${b.bolumAdi ? ' · ' + b.bolumAdi : ''}`}>
                                                <span>Bl. {bolumNoYaz(b.bolumNo)}</span>
                                                {okundu && <span className="cip-nokta" aria-hidden="true"></span>}
                                            </a>
                                        </li>
                                    );
                                })}
                            </ul>
                        ) : (
                            <ul className="bolum-listesi">
                                {filtreliBolumler.map(b => {
                                    const okundu = okunan.has(String(b.id));
                                    return (
                                        <li key={b.id}>
                                            <a className={`bolum-satir ${okundu ? 'okundu' : ''}`}
                                               href={`read.html?chapter=${b.id}`}
                                               onClick={() => { okunduIsaretle(manga.id, b.id); }}>
                                                <span className="bolum-ad">
                                                    <strong>Bölüm {bolumNoYaz(b.bolumNo)}</strong>
                                                    {b.bolumAdi ? <span> · {b.bolumAdi}</span> : null}
                                                </span>
                                                <span className="bolum-sag">
                                                    {okundu && <span className="okundu-rozet">Okundu</span>}
                                                    {kayitliSayfa > 0 && <span className="okundu-rozet">Sayfa {kayitliSayfa}</span>}
                                                    <span className="bolum-tarih">{tarihYaz(b.yayinTarihi)}</span>
                                                </span>
                                            </a>
                                        </li>
                                    );
                                })}
                            </ul>
                        )}
                    </section>

                    <MangaYorumlari mangaId={manga.id} />
                </div>
            );
        };

        /* ------------------------- HERKESE AÇIK KULLANICI PROFİLİ ------------------------- */
        const KullaniciProfilSayfasi = ({ ad }) => {
            const [durum, setDurum] = React.useState('yukleniyor'); // yukleniyor | hazir | yok | hata
            const [veri, setVeri] = React.useState(null);
            const [dene, setDene] = React.useState(0);

            React.useEffect(() => {
                let iptal = false;
                setDurum('yukleniyor');
                fetch(`${API_URL}/kullanicilar/${encodeURIComponent(ad || '')}/profil`)
                    .then(r => {
                        if (r.status === 404) throw new Error('404');
                        if (!r.ok) throw new Error('HTTP');
                        return r.json();
                    })
                    .then(v => { if (!iptal) { setVeri(v); setDurum('hazir'); } })
                    .catch(e => { if (!iptal) setDurum(e.message === '404' ? 'yok' : 'hata'); });
                return () => { iptal = true; };
            }, [ad, dene]);

            if (durum === 'yukleniyor') {
                return <div className="ana-icerik detay"><IskeletGrid adet={4} /></div>;
            }
            if (durum === 'yok' || durum === 'hata' || !veri) {
                return (
                    <div className="ana-icerik detay">
                        <a className="geri-link" href="#/">Ana sayfaya dön</a>
                        <DurumKutu ikon="hata" rol="alert"
                            baslik={durum === 'yok' ? 'Kullanıcı bulunamadı' : 'Profil yüklenemedi'}
                            metin={durum === 'yok' ? 'Aradığınız kullanıcı mevcut değil veya hesabı kapatılmış.' : 'Sunucuya ulaşılamadı. Lütfen tekrar deneyin.'}>
                            {durum === 'hata' && <button className="btn-ikincil" onClick={() => setDene(dene + 1)}>Tekrar dene</button>}
                            <a className="btn-ikincil" href="#/">Ana sayfaya dön</a>
                        </DurumKutu>
                    </div>
                );
            }

            const AS = window.Kage95AdStili;
            const kutuphane = Array.isArray(veri.kutuphane) ? veri.kutuphane : [];
            const sonYorumlar = Array.isArray(veri.sonYorumlar) ? veri.sonYorumlar : [];

            return (
                <div className="ana-icerik detay">
                    <a className="geri-link" href="#/">Ana sayfaya dön</a>
                    <section className="kprof-ust" aria-label="Kullanıcı bilgileri">
                        <span className="kprof-avatar" aria-hidden="true">
                            {veri.profilResmiURL
                                ? <img src={veri.profilResmiURL} alt="" onError={(e) => { e.currentTarget.style.display = 'none'; }} />
                                : String(veri.kullaniciAdi || '?').charAt(0).toUpperCase()}
                        </span>
                        <div className="kprof-bilgi">
                            <h1 className="kprof-ad">
                                <span className={AS ? AS.sinif(veri.adStili) : ''} style={AS ? AS.stil(veri.adStili) : undefined}>{veri.kullaniciAdi}</span>
                                {AS && AS.unvan(veri.adStili) && <span className="as-unvan">{AS.unvan(veri.adStili)}</span>}
                            </h1>
                            <div className="kprof-rozetler">
                                <span className="kprof-rozet">Seviye {veri.seviye || 1} · {veri.rutbe || 'Çırak'}</span>
                                <span className="kprof-rozet">{sayiYaz(veri.toplamPuan || 0)} puan</span>
                                <span>{rolEtiketi(veri)}</span>
                                {veri.kayitTarihi && <span>Katılım: {tarihYaz(veri.kayitTarihi)}</span>}
                            </div>
                        </div>
                    </section>

                    <section aria-label="Kütüphanesi" style={{ marginBottom: 'var(--bosluk-4)' }}>
                        <div className="bolum-baslik-satir">
                            <h2>Kütüphanesi</h2>
                            <span className="sonuc-sayisi">{kutuphane.length} seri</span>
                        </div>
                        {kutuphane.length === 0 ? (

        /* ------------------------- BİLDİRİM MENÜSÜ ------------------------- */
        const BildirimMenusu = () => {
            const [kullanici, setKullanici] = React.useState(kullaniciAl);
            const [acik, setAcik] = React.useState(false);
            const [liste, setListe] = React.useState([]);
            const [okunmamis, setOkunmamis] = React.useState(0);
            const kap = React.useRef(null);

            React.useEffect(() => {
                const f = () => setKullanici(kullaniciAl());
                window.addEventListener('kage95-kullanici', f);
                return () => window.removeEventListener('kage95-kullanici', f);
            }, []);

            const yukle = React.useCallback(() => {
                const t = tokenAl();
                if (!t) return;
                fetch(`${API_URL}/bildirimler?limit=20`, { headers: { Authorization: `Bearer ${t}` } })
                    .then(r => r.ok ? r.json() : null)
                    .then(v => {
                        if (v) {
                            setListe(Array.isArray(v.liste) ? v.liste : []);
                            setOkunmamis(Number(v.okunmamisSayisi || 0));
                        }
                    })
                    .catch(() => {});
            }, []);

            React.useEffect(() => {
                if (!kullanici) { setListe([]); setOkunmamis(0); return undefined; }
                yukle();
                const id = setInterval(yukle, 45000);
                return () => clearInterval(id);
            }, [kullanici, yukle]);

            React.useEffect(() => {
                if (!acik) return undefined;
                const disTik = (e) => { if (kap.current && !kap.current.contains(e.target)) setAcik(false); };
                const tus = (e) => { if (e.key === 'Escape') setAcik(false); };
                document.addEventListener('mousedown', disTik);
                document.addEventListener('keydown', tus);
                return () => {
                    document.removeEventListener('mousedown', disTik);
                    document.removeEventListener('keydown', tus);
                };
            }, [acik]);

            if (!kullanici) return null;

            const tumunuOkunduYap = () => {
                const t = tokenAl();
                if (!t) return;
                fetch(`${API_URL}/bildirimler/okundu`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${t}` },
                    body: JSON.stringify({})
                }).then(() => {
                    setOkunmamis(0);
                    setListe(l => l.map(b => ({ ...b, okundu: true })));
                }).catch(() => {});
            };

            const temizle = () => {
                const t = tokenAl();
                if (!t) return;
                fetch(`${API_URL}/bildirimler`, {
                    method: 'DELETE',
                    headers: { Authorization: `Bearer ${t}` }
                }).then(() => {
                    setOkunmamis(0);
                    setListe([]);
                }).catch(() => {});
            };

            const bildirimTikla = (b) => {
                const t = tokenAl();
                if (t && !b.okundu) {
                    fetch(`${API_URL}/bildirimler/okundu`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${t}` },
                        body: JSON.stringify({ id: b.id })
                    }).catch(() => {});
                    setOkunmamis(n => Math.max(0, n - 1));
                    setListe(l => l.map(x => x.id === b.id ? { ...x, okundu: true } : x));
                }
                setAcik(false);
            };

            return (
                <div className="bildirim-kap" ref={kap}>
                    <button
                        type="button"
                        className="btn-ikon bildirim-btn"
                        onClick={() => { const yeni = !acik; setAcik(yeni); if (yeni) yukle(); }}
                        aria-haspopup="menu"
                        aria-expanded={acik}
                        aria-label={okunmamis > 0 ? `Bildirimler (${okunmamis} okunmamış)` : 'Bildirimler'}
                        title="Bildirimler"

                        <Ikon ad="zil" boyut={20} />
                        {okunmamis > 0 && <span className="bildirim-rozet" aria-hidden="true">{okunmamis > 99 ? '99+' : okunmamis}</span>}
                    </button>
                    {acik && (
                        <div className="bildirim-panel" role="menu" aria-label="Bildirimler">
                            <div className="bildirim-ust">
                                <strong>Bildirimler</strong>
                                {liste.length > 0 && (
                                    <div className="bildirim-ust-eylemler">
                                        {okunmamis > 0 && <button type="button" className="bildirim-ust-btn" onClick={tumunuOkunduYap}>Okundu işaretle</button>}

                                    </div>
                                )}
                            </div>
                            {liste.length === 0 ? (
                                <p className="bildirim-bos">Henüz bildirimin yok.</p>
                            ) : (
                                <ul className="bildirim-liste">
                                    {liste.map(b => (
                                        <li key={b.id}>
                                            <a
                                                href={b.baglanti || '#/'}

                                                onClick={() => bildirimTikla(b)}
                                            >
                                                <span>{b.baslik}</span>
                                                <time className="bildirim-tarih" dateTime={b.tarih}>{yorumTarihYaz(b.tarih)}</time>
                                            </a>
                                        </li>
                                    ))}
                                </ul>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        // Doğrulanmamış e-posta uyarısı: girişi engellemez, sadece hatırlatır ve linki yeniden gönderir.
        const EpostaDogrulamaBandi = () => {
            const [kullanici, setKullanici] = React.useState(kullaniciAl);
            const [kapali, setKapali] = React.useState(() => { try { return sessionStorage.getItem('kage95_dogrulama_kapali') === '1'; } catch (e) { return false; } });
            const [durum, setDurum] = React.useState(null);
            React.useEffect(() => {
                const f = () => setKullanici(kullaniciAl());
                window.addEventListener('kage95-kullanici', f);
                return () => window.removeEventListener('kage95-kullanici', f);
            }, []);
            if (!kullanici || kullanici.emailDogrulandi !== false || kapali) return null;

            const gonder = async () => {
                setDurum({ mesgul: true });
                try {
                    const yanit = await fetch(API_URL + '/auth/resend-verification', { method: 'POST', headers: { 'Authorization': 'Bearer ' + tokenAl() } });
                    const veri = await yanit.json().catch(() => ({}));
                    if (yanit.status === 429) { setDurum({ metin: 'Çok fazla istek. Biraz sonra tekrar dene.' }); return; }
                    if (veri.dogrulandi) {
                        localStorage.setItem('kage95_user', JSON.stringify({ ...kullanici, emailDogrulandi: true }));
                        window.dispatchEvent(new Event('kage95-kullanici'));
                        return;
                    }
                    setDurum({ metin: veri.message || (yanit.ok ? 'Bağlantı gönderildi.' : 'Gönderilemedi.'), gonderildi: yanit.ok });
                } catch (e) {
                    setDurum({ metin: 'Sunucuya ulaşılamadı.' });
                }
            };
            const kapat = () => { setKapali(true); try { sessionStorage.setItem('kage95_dogrulama_kapali', '1'); } catch (e) {} };

            return (
                <div className="duyuru-bandi" role="status">
                    <span>{durum && durum.metin ? durum.metin : `E-posta adresin (${kullanici.email}) henüz doğrulanmadı. Gelen kutundaki bağlantıya tıkla.`}</span>
                    {!(durum && durum.gonderildi) && (
                        <button onClick={gonder} disabled={durum && durum.mesgul}>{durum && durum.mesgul ? 'Gönderiliyor…' : 'Tekrar gönder'}</button>
                    )}
                    <button onClick={kapat} aria-label="Uyarıyı kapat">Kapat</button>
                </div>
            );
        };

        /* ------------------------- KÖK ------------------------- */
        // Üst çubuk menüsü: girişliyse profil rozeti, girişsizse üç çizgi; ikisi de aynı açılır menüyü kullanır.

            }, []);
            // Rol sunucuda değiştiyse (ör. site sahibi atandı) eski oturum bilgisi kalmasın; yeniden girişe zorla.

                const t = tokenAl();
                if (!t) return;
                fetch(API_URL + '/auth/me', { headers: { 'Authorization': 'Bearer ' + t } })

                    .then(v => {
                        const k = kullaniciAl();

                        // E-posta doğrulama durumunu sunucuyla eşitle (banner bunu okur).
                        if (v && k && k.emailDogrulandi !== v.emailDogrulandi) {
                            try {
                                localStorage.setItem('kage95_user', JSON.stringify({ ...k, emailDogrulandi: v.emailDogrulandi === true }));
                                window.dispatchEvent(new Event('kage95-kullanici'));
                            } catch (e) {}
                        }
                    })
                    .catch(() => {});
            }, []);
            const [acik, setAcik] = React.useState(false);
            const kap = React.useRef(null);

            React.useEffect(() => {
                if (!acik) return;
                const disTik = (e) => { if (kap.current && !kap.current.contains(e.target)) setAcik(false); };
                const tus = (e) => { if (e.key === 'Escape') setAcik(false); };
                document.addEventListener('mousedown', disTik);
                document.addEventListener('keydown', tus);
                return () => {
                    document.removeEventListener('mousedown', disTik);
                    document.removeEventListener('keydown', tus);
                };
            }, [acik]);

            const resim = kullanici && kullanici.profilResmiURL;
            const gorunum = () => { setAcik(false); onGorunum(); };

            return (
                <div className="hesap-alani" ref={kap}>
                    {!kullanici && (
                        <>
                            <a href="login.html" className="btn-ikincil">Giriş yap</a>

                    {kullanici ? (

                            </span>
                            <span className="profil-ad">{kullanici.kullaniciAdi}</span>
                        </button>
                    ) : (
                        <button
                            className="btn-ikon"
                            onClick={() => setAcik(!acik)}
                            aria-haspopup="menu"
                            aria-expanded={acik}
                            aria-label="Menü"
                        >
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" aria-hidden="true">
                                <path d="M3 5.5h14M3 10h14M3 14.5h14" />
                            </svg>
                        </button>
                    )}
                    {acik && (
                        <div className="profil-menu" role="menu">

                            {kullanici
                                ? <button role="menuitem" className="menu-ayrac" onClick={cikisYap}>Çıkış yap</button>
                                : <a href="login.html" role="menuitem" className="menu-ayrac">Giriş yap</a>}
                            {!kullanici && kayitAcik && <a href="login.html?kayit=1" role="menuitem">Kayıt ol</a>}
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [rota, setRota] = React.useState(rotaOku());
            const [menuAcik, setMenuAcik] = React.useState(false);

            // "Açıklamaları da dahil et" tercihi tarayıcıda hatırlanır.

            const aramayaGit = () => {

            const [yukariGoster, setYukariGoster] = React.useState(false);
            React.useEffect(() => {

            // Sayfa başlığı rotaya göre güncellenir (seri adı MangaDetay yüklenince yazılır)

                const baslik = rota.sayfa === 'manga' ? 'Seri' : (rota.sayfa === 'kullanici' ? (rota.ad || 'Kullanıcı') : (BASLIKLAR[rota.sayfa] || 'Ana Sayfa'));

            const duyuruyuKapat = () => {

                setAramaAcik(a => !a);

            React.useEffect(() => {
                if (aramaAcik && mobilAramaRef.current) mobilAramaRef.current.focus();
            }, [aramaAcik]);

            const [temaRengi, setTemaRengi] = React.useState(localStorage.getItem('kage95_v2_temaRengi') || VARSAYILAN_RENK);
            const [bgGorsel, setBgGorsel] = React.useState(localStorage.getItem('kage95_v2_bgGorsel') || null);

                        <div className="duyuru-bandi" role="status">

                            <button onClick={duyuruyuKapat} aria-label="Duyuruyu kapat">Kapat</button>

                                    <a className={`menu-link ${(rota.sayfa === 'forum' || rota.sayfa === 'sohbet') ? 'aktif' : ''}`} href="#/forum" aria-current={(rota.sayfa === 'forum' || rota.sayfa === 'sohbet') ? 'page' : undefined}>
                                        <span>Topluluk</span>

                                            <div>
                                                <strong>Forum</strong>
                                                <small>Tartışmalar, teoriler ve incelemeler</small>
                                            </div>
                                        </a>
                                        <a href="#/sohbet" className="menu-dropdown-oge">
                                            <Ikon ad="sohbet" boyut={18} />
                                            <div>
                                                <strong>Canlı Sohbet</strong>
                                                <small>Anlık sohbet odası ve etkinlikler</small>
                                            </div>
                                        </a>
                                    </div>
                                </div>
                                <a className={`menu-link ${rota.sayfa === 'liderlik' ? 'aktif' : ''}`} href="#/liderlik" aria-current={rota.sayfa === 'liderlik' ? 'page' : undefined}>Liderlik</a>
                                <a className={`menu-link ${rota.sayfa === 'iletisim' ? 'aktif' : ''}`} href="#/iletisim" aria-current={rota.sayfa === 'iletisim' ? 'page' : undefined}>İletişim</a>
                            </nav>

                            <div className="header-sag">
                                <SosyalBaglantilar sinif="sosyal-ust" />
                                <form className="ust-arama" role="search" onSubmit={(e) => { e.preventDefault(); aramayaGit(); }}>
                                    <AramaKutusu deger={aramaMetni} degistir={setAramaMetni} id="mangaAramaInput"
                                        sinif="arama-kapsayici ust-arama-kutu" ikon
                                        aciklama={aramaAciklama} setAciklama={setAramaAciklama} onAra={aramayaGit} />
                                </form>
                                <button
                                    className="btn-ikon arama-ac-btn"
                                    onClick={aramaDegistir}
                                    title="Ara"
                                    aria-label="Aramayı aç veya kapat"
                                    aria-expanded={aramaAcik}
                                    aria-controls="mobilAramaAlani"
                                >
                                    <Ikon ad="ara" boyut={20} />
                                </button>
                                <BildirimMenusu />
                                <HesapMenusu onGorunum={() => setMenuAcik(true)} kayitAcik={ayarlar.kayitAcik !== false} />
                            </div>
                        </div>
                        {aramaAcik && (
                            <div className="mobil-arama" id="mobilAramaAlani">
                                <AramaKutusu deger={aramaMetni} degistir={setAramaMetni} girdiRef={mobilAramaRef}
                                    aciklama={aramaAciklama} setAciklama={setAramaAciklama} onAra={aramayaGit} />
                            </div>
                        )}
                    </header>

                    <div
                        className={`arka-plan-karartici ${menuAcik ? 'acik' : ''}`}
                        onClick={() => setMenuAcik(false)}
                        aria-hidden="true"
                    ></div>

                    <aside
                        className={`yan-menu ${menuAcik ? 'acik' : ''}`}
                        role="dialog"
                        aria-modal="true"
                        aria-label="Görünüm ve Tema Ayarları"
                        aria-hidden={!menuAcik}
                    >
                        <div className="yan-menu-header">
                            <h2>Kişiselleştirme</h2>
                            <button className="kapat-btn" onClick={() => setMenuAcik(false)} aria-label="Menüyü Kapat">Kapat</button>
                        </div>

                        <div className="yan-menu-icerik">
                            <div className="ayar-kutu">
                                <div className="ayar-kutu-baslik">Tema</div>
                                <div className="tema-listesi" role="radiogroup" aria-label="Tema seç">
                                    {(window.Kage95Tema ? window.Kage95Tema.liste : []).map(t => (
                                        <button key={t.id} type="button" role="radio" aria-checked={aktifTema === t.id}
                                            className={`tema-kart ${aktifTema === t.id ? 'aktif' : ''}`} onClick={() => temaSec(t.id)}>
                                            <span className="tema-onizleme" style={{ background: t.zemin }}><i style={{ background: t.renk }}></i></span>
                                            <span className="tema-ad">{t.ad}</span>
                                            <span className="tema-not">{t.not}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="ayar-kutu">
                                <div className="ayar-kutu-baslik">Vurgu rengi</div>
                                <div className="ayar-grubu">
                                    <label htmlFor="renkSecici">Buton ve başlık vurgusu</label>
                                    <input id="renkSecici" type="color" value={temaRengi} onChange={(e) => setTemaRengi(e.target.value)} />
                                </div>
                                    <div className="renk-cipler" role="group" aria-label="Hazır vurgu renkleri">
                                        {[['Kan Kızılı', '#8e0e15'], ['Gece Mavisi', '#1f5f8b'], ['Zümrüt', '#146c43'], ['Kehribar', '#b45309'], ['Sahura', '#9d174d'], ['Mor Gölge', '#5b21b6']].map(([ad, renk]) => (
                                            <button key={renk} type="button" className={`renk-cipi ${temaRengi.toLowerCase() === renk ? 'aktif' : ''}`} style={{ background: renk }} title={ad} aria-label={ad} aria-pressed={temaRengi.toLowerCase() === renk} onClick={() => setTemaRengi(renk)}></button>
                                        ))}
                                    </div>
                            </div>

                            <div className="ayar-kutu">
                                <div className="ayar-kutu-baslik">Arka plan görseli</div>
                                <div className="ayar-grubu">
                                    <label htmlFor="arkaplanYukle">Cihazınızdan özel görsel seçin</label>
                                    <input id="arkaplanYukle" type="file" accept="image/png, image/jpeg, image/webp" onChange={gorselYukle} />
                                </div>

                                {bgGorsel && (
                                    <div className="ayar-grubu">
                                        <label htmlFor="gorselMod">Yerleşim modu</label>
                                        <select id="gorselMod" value={bgMod} onChange={(e) => setBgMod(e.target.value)}>
                                            <option value="kapla">Ekrana yay</option>
                                            <option value="desen">Tekrarla</option>
                                        </select>
                                    </div>
                                )}
                            </div>

                            <div className="ayar-kutu">
                                <div className="ayar-kutu-baslik">Topluluk</div>
                                <a href={SOSYAL.discord} target="_blank" rel="noopener noreferrer" className="btn-ana" style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, textDecoration: 'none', minHeight: 42, width: '100%' }}>
                                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d={DISCORD_YOLU} /></svg>
                                    <span>Discord Topluluğuna Katıl</span>
                                </a>
                            </div>

                            <button className="sifirla-btn" onClick={temayiSifirla}>Varsayılan temayı geri yükle</button>
                        </div>
                    </aside>

                    <main role="main" id="ana-icerik" tabIndex={-1}>
                        {rota.sayfa === 'manga' ? <MangaDetay key={rota.id} id={rota.id} />
                            : rota.sayfa === 'kullanici' ? <KullaniciProfilSayfasi key={rota.ad} ad={rota.ad} />
                            : rota.sayfa === 'kutuphane' ? <Kutuphane />
                            : rota.sayfa === 'profil' ? <ProfilSayfasi />
                            : rota.sayfa === 'liderlik' ? <LiderlikSayfasi />
                            : rota.sayfa === 'forum' ? (
                                <div className="topluluk-sayfa-sarma">
                                    <ToplulukSekmeler aktif="forum" />
                                    {window.Kage95Forum
                                        ? <window.Kage95Forum.Sayfa yol={rota.yol} api={API_URL} tokenAl={tokenAl} kullanici={kullaniciAl()} />
                                        : <div className="ana-icerik"><DurumKutu ikon="bos" baslik="Forum yüklenemedi" metin="Sayfayı yenilemeyi dene." /></div>}
                                </div>
                            )
                            : rota.sayfa === 'sohbet' ? (
                                <div className="topluluk-sayfa-sarma">
                                    <ToplulukSekmeler aktif="sohbet" />
                                    <SohbetSayfasi />
                                </div>
                            )
                            : rota.sayfa === 'iletisim' ? <IletisimSayfasi />
                            : rota.sayfa === 'bulunamadi' ? (
                                <div className="ana-icerik">
                                    <DurumKutu ikon="bos" baslik="Sayfa bulunamadı" metin="Aradığın sayfa taşınmış ya da hiç var olmamış olabilir.">
                                        <a className="btn-ikincil" href="#/">Ana sayfaya dön</a>
                                    </DurumKutu>
                                </div>
                            )
                            : <AnaSayfa aramaMetni={aramaMetni} setAramaMetni={setAramaMetni} aramaAciklama={aramaAciklama} setAramaAciklama={setAramaAciklama} kayitAcik={ayarlar.kayitAcik !== false} />}
                    </main>

                    <footer className="site-footer">
                        <div className="footer-ic">
                            <span>© 2026 KAGE 95 · Tüm hakları saklıdır.</span>
                            <SosyalBaglantilar sinif="sosyal-alt" />
                            <nav aria-label="Alt menü">
                                <a href="#/">Ana Sayfa</a>
                                <a href="#/iletisim">İletişim</a>
                                <a href={SOSYAL.discord} target="_blank" rel="noopener noreferrer">Discord</a>
                                {!kullaniciAl() && <a href="login.html">Giriş</a>}
                            </nav>
                        </div>
                    </footer>

                    {yukariGoster && (
                        <button type="button" className="yukari-btn" aria-label="Sayfanın başına çık" onClick={() => window.scrollTo({ top: 0, behavior: (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) ? 'auto' : 'smooth' })}>↑</button>
                    )}
                    <nav className="alt-gezinme" aria-label="Mobil gezinme">
                        <a href="#/" className={rota.sayfa === 'ana' || rota.sayfa === 'manga' ? 'aktif' : ''}
                           aria-current={rota.sayfa === 'ana' ? 'page' : undefined}>
                            <Ikon ad="ev" /><span>Ana Sayfa</span>
                        </a>
                        <a href="#/kutuphane" className={rota.sayfa === 'kutuphane' ? 'aktif' : ''}
                           aria-current={rota.sayfa === 'kutuphane' ? 'page' : undefined}>
                            <Ikon ad="kitap" /><span>Kütüphane</span>
                        </a>
                        <a href="#/forum" className={(rota.sayfa === 'forum' || rota.sayfa === 'sohbet') ? 'aktif' : ''}
                           aria-current={(rota.sayfa === 'forum' || rota.sayfa === 'sohbet') ? 'page' : undefined}>
                            <Ikon ad="forum" /><span>Topluluk</span>
                        </a>
                        <a href="#/liderlik" className={rota.sayfa === 'liderlik' ? 'aktif' : ''}
                           aria-current={rota.sayfa === 'liderlik' ? 'page' : undefined}>
                            <Ikon ad="liderlik" /><span>Liderlik</span>
                        </a>
                        <a href={girisli ? '#/profil' : 'login.html'} className={rota.sayfa === 'profil' ? 'aktif' : ''}
                           aria-current={rota.sayfa === 'profil' ? 'page' : undefined}>
                            <Ikon ad="kisi" /><span>Profil</span>
                        </a>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script src="js/yardim.js?v=20261025e" defer></script>
</body>
</html>
