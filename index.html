    <style>
        :root {
            --vurgu-rengi: #8e0e15;          /* kan kırmızısı (dolgu) */
            --vurgu-parlak: #e0343c;         /* koyu zeminde metin/çizgi vurgusu */
            --bg-ana: #0e0c0c;
            --bg-kart: #141111;
            --border-renk: #2a2323;
            --border-belirgin: #3a3030;
            --text-ana: #ede7e2;
            --text-ikincil: #a89f99;
            --font-baslik: 'Noto Serif', Georgia, serif;
            --font-kanji: 'Noto Serif JP', 'Noto Serif', serif;
            /* Boşluk ölçeği: 8 / 16 / 24 / 32 */
            --bosluk-1: 8px;
            --bosluk-2: 16px;
            --bosluk-3: 24px;
            --bosluk-4: 32px;
            /* Başlık ölçeği */
            --yazi-h1: clamp(2rem, 1.4rem + 2.6vw, 3.2rem);
            --yazi-h2: 1.35rem;
            --yazi-h3: 1.1rem;
            --alt-gezinme-yuksekligi: 56px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-ana);
            color: var(--text-ana);
            font-family: 'Noto Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
            min-height: 100vh; min-height: 100dvh;
            overflow-x: hidden;
            line-height: 1.5;
        }

        a { color: inherit; text-decoration: none; }
        button { font-family: inherit; }

        a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
            outline: 1px solid var(--vurgu-parlak);
            outline-offset: 3px;
        }

        /* --- ÜST ÇUBUK --- */
        .site-header {
            border-bottom: 1px solid var(--border-renk);
            background: var(--bg-ana);
        }

        .header-ic {
            max-width: 1600px;
            margin: 0 auto;
            padding: var(--bosluk-2) var(--bosluk-3);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: var(--bosluk-1) var(--bosluk-4);
        }

        .site-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-baslik);
            font-size: 1.15rem;
            font-weight: 600;
        }

        .logo-muhur {
            width: 38px;
            height: 38px;
            background: transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .logo-muhur img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            transition: transform .4s cubic-bezier(.2,.8,.2,1);
        }
        .site-logo:hover .logo-muhur img { transform: rotate(-8deg) scale(1.06); }

        /* Yazı logosu: KAGE + kırmızı mühür 95, altında 影 · Gölge Arşivi */
        .logo-yazi { display: flex; flex-direction: column; line-height: 1; gap: 4px; }
        .logo-ust { display: flex; align-items: center; gap: 7px; }
        .logo-kage {
            position: relative;
            font-family: var(--font-baslik);
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: .2em;
            margin-right: -.2em;
            background: linear-gradient(100deg, var(--text-ana) 0%, var(--text-ana) 40%, #fff 50%, var(--text-ana) 60%, var(--text-ana) 100%);
            background-size: 250% 100%;
            background-position: 100% 0;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            transition: background-position .8s ease;
        }
        .logo-kage::after {
            content: '';
            position: absolute;
            left: 0;
            right: .2em;
            bottom: -3px;
            height: 2px;
            background: linear-gradient(90deg, var(--vurgu-parlak), transparent);
            transform: scaleX(.35);
            transform-origin: left;
            transition: transform .45s cubic-bezier(.2,.8,.2,1);
        }
        .site-logo:hover .logo-kage { background-position: 0 0; }
        .site-logo:hover .logo-kage::after { transform: scaleX(1); }
        .logo-95 {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 3px 5px 2px;
            font-family: var(--font-baslik);
            font-size: .8rem;
            font-weight: 700;
            color: #fff;
            background: var(--vurgu-rengi);
            border-radius: 3px;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.15), 0 0 0 1px var(--vurgu-rengi);
            transform: rotate(-6deg);
            transition: transform .3s ease;
        }
        .site-logo:hover .logo-95 { transform: rotate(0) scale(1.08); }
        .logo-alt {
            display: flex;
            align-items: center;
            gap: 5px;
            font-family: var(--font-govde, inherit);
            font-size: .62rem;
            font-weight: 500;
            letter-spacing: .28em;
            text-transform: uppercase;
            color: var(--text-ikincil);
        }
        .logo-alt b { font-family: var(--font-kanji); font-weight: 700; letter-spacing: 0; color: var(--vurgu-parlak); font-size: .8rem; }
        @media (max-width: 380px) { .logo-alt { display: none; } }
        @media (prefers-reduced-motion: reduce) {
            .logo-kage, .logo-kage::after, .logo-95, .logo-muhur img { transition: none; }
        }

        .ana-menu { display: flex; flex-wrap: wrap; gap: var(--bosluk-3); align-items: center; }

        .menu-link {
            padding: 8px 0;
            font-size: .9rem;
            color: var(--text-ikincil);
            border-bottom: 2px solid transparent;
            transition: color .15s ease, border-color .15s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }

        @media (hover: hover) { .menu-link:hover { color: var(--text-ana); border-bottom-color: var(--vurgu-parlak); } }
        .menu-link.aktif { color: var(--vurgu-parlak); border-bottom-color: var(--vurgu-parlak); font-weight: 600; }

        /* Masaüstü Topluluk Açılır Menüsü */
        .menu-dropdown-kap { position: relative; display: inline-flex; align-items: center; }
        .menu-dropdown-menu {
            position: absolute; top: calc(100% + 4px); left: 0; min-width: 250px;
            background: rgba(18, 14, 14, 0.98); border: 1px solid var(--border-belirgin, #3a3030);
            border-radius: 8px; box-shadow: 0 14px 32px rgba(0,0,0,.7), 0 0 16px rgba(224,52,60,.14);
            padding: 6px; display: flex; flex-direction: column; gap: 4px; z-index: 250;
            opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(-6px);
            transition: opacity .22s cubic-bezier(.22,1,.36,1), transform .3s cubic-bezier(.22,1,.36,1), visibility 0s linear .28s;
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        }
        /* Görünmez köprü: imleç düğmeden menüye inerken boşluğa düşüp menüyü kapatmasın */
        .menu-dropdown-menu::before { content: ""; position: absolute; left: 0; right: 0; top: -24px; height: 24px; }
        .menu-dropdown-kap::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 24px; }
        .menu-dropdown-kap:hover .menu-dropdown-menu,
        .menu-dropdown-kap:has(:focus-visible) .menu-dropdown-menu { opacity: 1; visibility: visible; pointer-events: auto; transform: none; transition-delay: 0s; }
        .menu-dropdown-oge {
            display: flex; align-items: center; gap: 12px; padding: 10px 14px;
            border-radius: 6px; color: var(--text-ana); text-decoration: none;
            transition: background .15s ease, color .15s ease;
        }
        .menu-dropdown-oge:hover { background: rgba(224, 52, 60, 0.12); color: var(--vurgu-parlak); }
        .menu-dropdown-oge div { display: flex; flex-direction: column; }
        .menu-dropdown-oge strong { font-size: .88rem; font-weight: 600; }
        .menu-dropdown-oge small { font-size: .74rem; color: var(--text-ikincil); margin-top: 2px; }

        .header-sag {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: var(--bosluk-1);
        }

        /* --- DÜĞMELER: düz, 1px kenarlık, 2px köşe --- */
        .btn-ana, .btn-ikincil, .btn-ikinci {
            min-height: 40px;
            padding: 0 var(--bosluk-2);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: .9rem;
            font-weight: 500;
            border: 1px solid var(--border-belirgin);
            border-radius: 2px;
            cursor: pointer;
            transition: border-color .15s ease, color .15s ease, background-color .15s ease;
        }

        .btn-ana {
            background: var(--vurgu-rengi);
            border-color: var(--vurgu-rengi);
            color: #fff;
        }
        @media (hover: hover) { .btn-ana:hover { background: var(--vurgu-parlak); border-color: var(--vurgu-parlak); } }

        .btn-ikincil, .btn-ikinci {
            background: transparent;
            color: var(--text-ana);
        }
        @media (hover: hover) { .btn-ikincil:hover, .btn-ikinci:hover { border-color: var(--vurgu-parlak); } }

        .btn-ikon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 1px solid var(--border-belirgin);
            border-radius: 8px;
            color: var(--text-ana);
            cursor: pointer;
            transition: border-color .2s ease, color .2s ease, background .2s ease, transform .2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-ikon svg {
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .btn-ikon[aria-expanded="true"] {
            border-color: var(--vurgu-parlak);
            background: rgba(224, 52, 60, 0.12);
            color: var(--vurgu-parlak);
        }
        .btn-ikon[aria-expanded="true"] svg {
            transform: rotate(90deg);
        }
        @media (hover: hover) {
            .btn-ikon:hover {
                border-color: var(--vurgu-parlak);
                background: rgba(224, 52, 60, 0.08);
            }
        }
        .btn-ikon:active {
            transform: scale(0.92);
        }

        /* --- HESAP ALANI --- */
        .hesap-alani { position: relative; display: flex; align-items: center; gap: var(--bosluk-1); }
        .profil-alani { position: relative; }
        .profil-chip {
            min-height: 38px;
            padding: 3px 12px 3px 5px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-ana);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            font: inherit;
            font-size: .88rem;
            font-weight: 500;
            cursor: pointer;
            transition: border-color .2s ease, background .2s ease, color .2s ease, transform .2s ease, box-shadow .2s ease;
        }
        .profil-chip:hover, .profil-chip[aria-expanded="true"] {
            background: rgba(224, 52, 60, 0.14);
            border-color: rgba(224, 52, 60, 0.45);
            color: #ffffff;
            box-shadow: 0 0 16px rgba(224, 52, 60, 0.22);
        }
        .profil-chip[aria-expanded="true"] {
            border-color: var(--vurgu-parlak);
        }
        .profil-chip:active {
            transform: scale(0.96);
        }
        .profil-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--vurgu-rengi);
            border: 1px solid rgba(224, 52, 60, 0.45);
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: .82rem;
            font-weight: 600;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 0 8px rgba(224, 52, 60, 0.3);
        }
        .profil-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profil-ad { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .profil-menu {
            position: absolute;
            right: 0;
            top: calc(100% + 8px);
            min-width: 220px;
            background: linear-gradient(175deg, rgba(24, 18, 19, 0.98) 0%, rgba(14, 12, 12, 0.99) 100%);
            border: 1px solid rgba(224, 52, 60, 0.28);
            border-top: 2px solid var(--vurgu-parlak, #e0343c);
            border-radius: 12px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.75), 0 0 24px rgba(224, 52, 60, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 6px;
            z-index: 250;
            display: flex;
            flex-direction: column;
            gap: 2px;
            transform-origin: top right;
            animation: k95-menu-acilis 0.24s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes k95-menu-acilis {
            0% {
                opacity: 0;
                transform: translateY(-8px) scale(0.94);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .profil-menu a, .profil-menu button {
            min-height: 38px;
            padding: 8px 14px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            background: transparent;
            border: 0;
            color: var(--text-ana, #ede7e2);
            font: inherit;
            font-size: .88rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            white-space: nowrap;
            position: relative;
            transition: background 0.18s ease, color 0.18s ease, transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), padding-left 0.18s ease;
        }
        .profil-menu a::before, .profil-menu button::before {
            content: '';
            position: absolute;
            left: 0;
            top: 20%;
            bottom: 20%;
            width: 3px;
            border-radius: 0 3px 3px 0;
            background: var(--vurgu-parlak, #e0343c);
            opacity: 0;
            transform: scaleY(0);
            transition: opacity 0.18s ease, transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @media (hover: hover) {
            .profil-menu a:hover, .profil-menu button:hover {
                background: rgba(224, 52, 60, 0.12);
                color: #ffffff;
                transform: translateX(4px);
                padding-left: 18px;
            }
            .profil-menu a:hover::before, .profil-menu button:hover::before {
                opacity: 1;
                transform: scaleY(1);
            }
        }
        .profil-menu .menu-ayrac {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            margin-top: 4px;
            padding-top: 4px;
        }
        @media (max-width: 480px) { .hesap-alani > .btn-ikincil { display: none; } }
        @media (max-width: 768px) { .profil-menu a, .profil-menu button { min-height: 44px; } }

        .arama-kapsayici { margin-top: var(--bosluk-4); max-width: 480px; position: relative; }

        .arama-kapsayici input {
            width: 100%;
            height: 44px;
            padding: 0 var(--bosluk-2) 0 44px;
            background: transparent;
            border: 1px solid var(--border-belirgin);
            border-radius: 2px;
            color: var(--text-ana);
            font: inherit;
            font-size: .95rem;
            transition: border-color .15s ease;
        }

        .arama-kapsayici input::placeholder { color: var(--text-ikincil); opacity: .7; }
        .arama-kapsayici input:focus { border-color: var(--vurgu-parlak); outline: none; }

        .arama-ikon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-ikincil);
            pointer-events: none;
            display: flex;
        }

        /* --- ANLIK ARAMA ÖNERİLERİ --- */
        .arama-kutu { position: relative; }
        .arama-kutu input::-webkit-search-cancel-button { display: none; }
        .arama-oneri {
            position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 400;
            background: linear-gradient(175deg, rgba(22, 16, 17, 0.98) 0%, rgba(12, 10, 10, 0.99) 100%);
            border: 1px solid rgba(224, 52, 60, 0.28);
            border-top: 2px solid var(--vurgu-parlak, #e0343c);
            border-radius: 12px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.75), 0 0 24px rgba(224, 52, 60, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            overflow: hidden; text-align: left;
            transform-origin: top center;
            animation: k95-menu-acilis 0.24s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .arama-oneri ul { list-style: none; margin: 0; padding: 4px 0; max-height: min(60vh, 440px); overflow-y: auto; overscroll-behavior: contain; }
        .arama-oneri ul:empty { display: none; }
        .arama-oneri li { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 12px; cursor: pointer; color: var(--text-ana); }
        .arama-oneri li.aktif { background: color-mix(in srgb, var(--vurgu-parlak) 14%, transparent); }
        .arama-oneri-kapak { flex: none; width: 34px; height: 48px; border-radius: 3px; overflow: hidden; background: var(--bg-ana); }
        .arama-oneri-kapak img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .arama-oneri-metin { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
        .arama-oneri-ad { font-weight: 600; font-size: .95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .arama-oneri-ad mark { background: none; color: var(--vurgu-parlak); font-weight: 700; }
        .arama-oneri-alt { font-size: .78rem; color: var(--text-ikincil); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .arama-oneri-alt em { font-style: normal; color: var(--vurgu-parlak); }
        .arama-oneri-durum:empty { display: none; }
        .arama-oneri-durum { padding: 10px 14px; font-size: .85rem; color: var(--text-ikincil); border-top: 1px solid var(--border-renk); }
        .arama-oneri ul:empty + .arama-oneri-durum { border-top: 0; }
        .arama-oneri-bos { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
        .arama-oneri-bos strong { color: var(--text-ana); font-weight: 600; }
        .arama-oneri-durum button {
            min-height: 36px; padding: 0 12px; font: inherit; font-size: .8rem; cursor: pointer;
            background: transparent; color: var(--vurgu-parlak); border: 1px solid var(--vurgu-parlak); border-radius: 4px;
        }
        .arama-oneri-tumu { width: 100%; margin-top: 2px; }
        .arama-filtre-cip {
            display: inline-flex; align-items: center; gap: 8px; min-height: 36px; max-width: 100%; padding: 0 12px; margin: 0 auto 0 14px;
            font: inherit; font-size: .82rem; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            background: color-mix(in srgb, var(--vurgu-parlak) 12%, transparent); color: var(--text-ana);
            border: 1px solid var(--vurgu-parlak); border-radius: 999px;
        }
        .arama-filtre-cip span { color: var(--vurgu-parlak); font-weight: 700; }
        .ust-arama-kutu { margin-top: 0; width: clamp(200px, 24vw, 300px); }
        .ust-arama-kutu input { height: 40px; }
        .ust-arama-kutu .arama-oneri { left: 0; right: 0; width: auto; min-width: 100%; }

        /* --- TÜR SEKMELERİ (altı çizgili metin) --- */
        .tur-bolum {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 var(--bosluk-3) var(--bosluk-3);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0 var(--bosluk-3);
        }

        .tur-etiket { margin-right: var(--bosluk-1); font-size: .9rem; color: var(--text-ikincil); }

        .kategori-btn {
            min-height: 40px;
            padding: 0;
            background: transparent;
            border: 0;
            border-bottom: 2px solid transparent;
            border-radius: 0;
            color: var(--text-ikincil);
            font-size: .9rem;
            cursor: pointer;
            transition: color .15s ease, border-color .15s ease;
        }

        @media (hover: hover) { .kategori-btn:hover { color: var(--text-ana); } }

        .kategori-btn.aktif {
            color: var(--text-ana);
            border-bottom-color: var(--vurgu-parlak);
        }

        /* --- LİSTE --- */
        .ana-icerik { max-width: none; margin: 0 auto; padding: 0 var(--bosluk-3) calc(var(--bosluk-4) * 2); }

        .bolum-baslik-satir {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: var(--bosluk-2);
            padding-bottom: var(--bosluk-2);
            margin-bottom: var(--bosluk-3);
            border-bottom: 1px solid var(--border-renk);
        }

        .bolum-baslik-satir h2 {
            font-family: var(--font-baslik);
            font-size: var(--yazi-h2);
            font-weight: 500;
        }

        .sonuc-sayisi { color: var(--text-ikincil); font-size: .9rem; }

        .manga-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: var(--bosluk-3) var(--bosluk-2);
        }

        .manga-kart {
            display: block;
            min-width: 0;
            position: relative;
            text-decoration: none;
            transition: transform .22s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .kart-kapak {
            position: relative;
            aspect-ratio: 2 / 3;
            overflow: hidden;
            background: var(--bg-yuzey, #1a1515);
            border: 1px solid var(--border-renk);
            border-radius: 6px;
            transition: border-color .22s ease, box-shadow .22s ease;
        }

        .kart-kapak img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform .35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .manga-kart:focus-visible .kart-kapak {
            border-color: var(--vurgu-parlak);
            box-shadow: 0 0 0 2px rgba(224, 52, 60, 0.4), 0 10px 24px rgba(224, 52, 60, 0.2);
        }
        @media (hover: hover) {
            .manga-kart:hover { transform: translateY(-4px); }
            .manga-kart:hover .kart-kapak {
                border-color: rgba(224, 52, 60, 0.6);
                box-shadow: 0 10px 24px -4px rgba(224, 52, 60, 0.22);
            }
            .manga-kart:hover .kart-kapak img { transform: scale(1.04); }
            .manga-kart:hover .manga-baslik { color: var(--vurgu-parlak); }
        }

        .kart-hizli-oku {
            position: absolute;
            left: 6px;
            right: 6px;
            bottom: 6px;
            z-index: 5;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 6px 8px;
            min-height: 28px;
            font-size: .74rem;
            font-weight: 700;
            color: #fff;
            background: rgba(14, 12, 12, 0.92);
            border: 1px solid rgba(224, 52, 60, 0.4);
            border-radius: 6px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: transform .25s ease, background .25s ease, border-color .25s ease, opacity .25s ease;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
        }
        .kart-hizli-oku .kho-ikon { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .kart-hizli-oku .kho-metin { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .kart-rozet {
            position: absolute;
            left: 0; bottom: 0;
            background: var(--bg-kaplama, rgba(14, 12, 12, .75));
            color: var(--text-ana);
            font-size: .75rem;
            padding: 3px var(--bosluk-1);
        }

        .kart-rozetler {
            position: absolute;
            left: 0; top: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .rozet-mini {
            padding: 3px var(--bosluk-1);
            font-size: .75rem;
            border-radius: 0;
            line-height: 1.4;
            background: var(--bg-kaplama, rgba(14, 12, 12, .75));
        }
        .rozet-yeni { color: var(--vurgu-parlak); }
        .rozet-tamam { color: var(--text-ikincil); }

        .manga-baslik {
            margin-top: var(--bosluk-1);
            font-weight: 500;
            font-size: .95rem;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            overflow-wrap: anywhere;
            transition: color .15s ease;
        }

        @media (hover: hover) { .manga-kart:hover .manga-baslik { color: var(--vurgu-parlak); } }

        .manga-meta { margin-top: 2px; font-size: .85rem; color: var(--text-ikincil); }

        /* Yükleniyor iskeleti: düz, sakin */
        .iskelet-blok {
            background: var(--bg-yuzey, #1a1515);
            animation: iskelet-nabiz 1.8s ease-in-out infinite;
            border-radius: 2px;
        }
        .iskelet-kapak { aspect-ratio: 2 / 3; border: 1px solid var(--border-renk); }
        .iskelet-satir { height: 14px; margin-top: var(--bosluk-1); }
        .iskelet-satir.ilk { margin-top: var(--bosluk-2); width: 90%; }
        .iskelet-satir.kisa { width: 45%; height: 12px; }
        @keyframes iskelet-nabiz { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
        @media (prefers-reduced-motion: reduce) {
            .iskelet-blok { animation: none; }
            * { transition: none !important; }
        }

        /* Boş / hata durumu */
        .durum-kutu {
            text-align: center;
            padding: calc(var(--bosluk-4) * 2) var(--bosluk-3);
            border: 1px solid var(--border-renk);
            border-radius: 2px;
            color: var(--text-ikincil);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .durum-kutu p { max-width: 55ch; }
        .durum-ikon { display: none; }
        .durum-kutu h3 { color: var(--text-ana); font-family: var(--font-baslik); font-weight: 500; font-size: var(--yazi-h3); margin-bottom: var(--bosluk-1); }
        .durum-eylemler { margin-top: var(--bosluk-3); display: flex; flex-wrap: wrap; justify-content: center; gap: var(--bosluk-1) var(--bosluk-2); }

        /* --- ALT BİLGİ --- */
        .site-footer { border-top: 1px solid var(--border-renk); padding: var(--bosluk-4) var(--bosluk-3); }

        .footer-ic {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: var(--bosluk-2);
            font-size: .85rem;
            color: var(--text-ikincil);
        }

        .footer-ic nav { display: flex; gap: var(--bosluk-3); }
        .footer-ic a { transition: color .15s ease; }
        @media (hover: hover) { .footer-ic a:hover { color: var(--text-ana); } }

        /* --- ÇEKMECE (GÖRÜNÜM AYARLARI) --- */
        .arka-plan-karartici {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, .75);
            z-index: 998;
            opacity: 0;
            pointer-events: none;
            transition: opacity .32s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .arka-plan-karartici.acik { opacity: 1; pointer-events: auto; }

        .yan-menu {
            position: fixed; top: 0; right: 0;
            width: 360px; max-width: 90vw; height: 100vh; height: 100dvh;
            background: linear-gradient(180deg, rgba(22, 16, 17, 0.98) 0%, rgba(12, 10, 10, 0.99) 100%);
            border-left: 1px solid rgba(224, 52, 60, 0.28);
            box-shadow: -14px 0 40px rgba(0, 0, 0, 0.8), 0 0 24px rgba(224, 52, 60, 0.12);
            z-index: 999;
            transform: translateX(100%);
            visibility: hidden;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            transition: transform .35s cubic-bezier(0.16, 1, 0.3, 1), visibility .35s linear;
        }

        .yan-menu.acik { transform: translateX(0); visibility: visible; }

        .yan-menu-header {
            padding: var(--bosluk-2) var(--bosluk-3);
            border-bottom: 1px solid var(--border-renk);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .yan-menu-header h2 { font-family: var(--font-baslik); font-size: 1.1rem; font-weight: 500; }

        .kapat-btn {
            min-height: 40px;
            padding: 0 var(--bosluk-1);
            background: none;
            border: none;
            color: var(--text-ikincil);
            font-size: .9rem;
            text-decoration: underline;
            text-underline-offset: 3px;
            cursor: pointer;
        }

        @media (hover: hover) { .kapat-btn:hover { color: var(--text-ana); } }

        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
        .tema-listesi { display: grid; grid-template-columns: 1fr 1fr; gap: var(--bosluk-1); }
        .tema-kart { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: var(--bosluk-1); background: transparent; border: 1px solid var(--border-renk); border-radius: 2px; color: var(--text-ana); text-align: left; cursor: pointer; transition: border-color .15s ease; }
        @media (hover: hover) { .tema-kart:hover { border-color: var(--border-belirgin); } }
        .tema-kart.aktif { border-color: var(--vurgu-parlak); }
        .tema-onizleme { display: flex; align-items: flex-end; width: 100%; height: 36px; border: 1px solid var(--border-belirgin); border-radius: 2px; padding: 4px; }
        .tema-onizleme i { display: block; width: 40%; height: 4px; }
        .tema-ad { font-size: .9rem; font-weight: 500; }
        .tema-not { font-size: .75rem; color: var(--text-ikincil); line-height: 1.3; }
        .devam-serit { display: flex; align-items: center; justify-content: space-between; gap: var(--bosluk-2); padding: var(--bosluk-2); margin-bottom: var(--bosluk-4); border: 1px solid var(--border-renk); border-left: 2px solid var(--vurgu-parlak); border-radius: 2px; }
        .devam-serit small { display: block; color: var(--text-ikincil); font-size: .8rem; margin-bottom: 2px; }
        .devam-serit strong { font-weight: 500; overflow-wrap: anywhere; }
        .devam-serit .devam-alt { display: block; color: var(--text-ikincil); font-size: .85rem; margin-top: 2px; }
        .siralama { min-height: 40px; padding: 0 var(--bosluk-1); background: var(--bg-ana); border: 1px solid var(--border-renk); border-radius: 2px; color: var(--text-ana); font: inherit; font-size: .85rem; }
        .siralama:focus { outline: none; border-color: var(--vurgu-parlak); }
        .baslik-sag { display: flex; align-items: center; gap: var(--bosluk-2); }
        .yan-menu-icerik { padding: var(--bosluk-3); display: flex; flex-direction: column; gap: var(--bosluk-3); }

        .ayar-kutu {
            border: 1px solid var(--border-renk);
            border-radius: 2px;
            padding: var(--bosluk-2);
        }

        .ayar-kutu-baslik { font-weight: 500; margin-bottom: var(--bosluk-1); }

        .ayar-grubu { display: flex; flex-direction: column; gap: var(--bosluk-1); margin-bottom: var(--bosluk-1); }
        .ayar-grubu label { font-size: .85rem; color: var(--text-ikincil); }

        .yan-menu input[type="color"] {
            width: 100%; height: 40px;
            border: 1px solid var(--border-belirgin);
            border-radius: 2px;
            background: none;
            cursor: pointer;
        }

        .yan-menu input[type="file"], .yan-menu select {
            width: 100%;
            background: transparent;
            border: 1px solid var(--border-belirgin);
            color: var(--text-ana);
            padding: 10px;
            border-radius: 2px;
            font-size: .9rem;
        }

        .sifirla-btn {
            min-height: 40px;
            background: transparent;
            color: var(--text-ana);
            border: 1px solid var(--border-belirgin);
            border-radius: 2px;
            font-size: .9rem;
            font-weight: 500;
            cursor: pointer;
            transition: border-color .15s ease;
        }

        @media (hover: hover) { .sifirla-btn:hover { border-color: var(--vurgu-parlak); } }

        /* --- ARAMA İKONU (yalnız mobil) + ALT GEZİNME --- */
        .arama-ac-btn, .mobil-arama, .alt-gezinme { display: none; }
        @media (max-width: 960px) {
            .arama-ac-btn { display: flex; }
            .ust-arama { display: none; }
            .mobil-arama { display: block; border-bottom: 1px solid var(--border-renk); background: var(--bg-ana); padding: var(--bosluk-1) var(--bosluk-2) var(--bosluk-2); }
            .mobil-arama .arama-kapsayici { margin-top: 0; max-width: none; }
        }
        .link-btn {
            min-height: 40px;
            padding: 0 var(--bosluk-1);
            background: none;
            border: 0;
            color: var(--text-ikincil);
            font: inherit;
            font-size: .9rem;
            text-decoration: underline;
            text-underline-offset: 3px;
            cursor: pointer;
            transition: color .15s ease;
        }
        @media (hover: hover) { .link-btn:hover { color: var(--vurgu-parlak); } }

        .profil-sayfa { max-width: 1080px; margin: 0 auto; padding-top: var(--bosluk-3); }

        /* --- DURUM / DETAY --- */
        .btn-ikincil:disabled, .btn-ikinci:disabled { opacity: .6; cursor: default; }
        .btn-ikincil.aktif { border-color: var(--vurgu-parlak); color: var(--vurgu-parlak); }
        .btn-favori { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-favori svg { flex: none; }
        .daha-fazla { display: flex; justify-content: center; margin-top: var(--bosluk-4); }
        .hata-satir { margin-top: var(--bosluk-3); text-align: center; color: var(--vurgu-parlak); }
        .bilgi-satir { margin-top: var(--bosluk-2); font-size: .9rem; color: var(--text-ikincil); }
        .bilgi-satir a { color: var(--vurgu-parlak); text-decoration: underline; text-underline-offset: 3px; }

        .geri-link { display: inline-flex; align-items: center; min-height: 40px; margin-bottom: var(--bosluk-1); font-size: .9rem; color: var(--text-ikincil); text-decoration: underline; text-underline-offset: 3px; transition: color .15s ease; }
        @media (hover: hover) { .geri-link:hover { color: var(--text-ana); } }

        .detay { padding-top: var(--bosluk-3); max-width: 1320px; margin-inline: auto; }
        /* Kapak bulanık arka plan olarak başlık alanını doldurur */
        .detay-ust {
            position: relative; isolation: isolate; overflow: hidden;
            display: flex; flex-wrap: wrap; gap: var(--bosluk-3) var(--bosluk-4); margin-bottom: var(--bosluk-4);
            padding: clamp(16px, 2.5vw, 40px); border: 1px solid var(--border-renk); border-radius: 8px; background: var(--bg-kart);
        }
        .detay-ust::before { content: ''; position: absolute; inset: -60px; z-index: -2; background: var(--detay-kapak, none) center / cover no-repeat; filter: blur(48px) saturate(1.3); opacity: .45; }
        .detay-ust::after { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(100deg, var(--bg-kart) 15%, color-mix(in srgb, var(--bg-kart) 55%, transparent) 100%); }
        .detay-kapak { flex: 0 0 clamp(180px, 16vw, 260px); box-shadow: 0 18px 40px rgba(0,0,0,.45); max-width: 100%; aspect-ratio: 2 / 3; background: var(--bg-yuzey, #1a1515); border: 1px solid var(--border-renk); border-radius: 2px; overflow: hidden; }
        .detay-kapak img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .detay-bilgi { flex: 1 1 300px; min-width: 0; }
        .detay-baslik { font-family: var(--font-baslik); font-weight: 500; font-size: clamp(1.5rem, 1.2rem + 1.6vw, 2rem); line-height: 1.2; overflow-wrap: anywhere; }
        .detay-meta { margin-top: var(--bosluk-2); display: flex; flex-wrap: wrap; gap: var(--bosluk-1) var(--bosluk-3); }
        .detay-meta dt { font-size: .8rem; color: var(--text-ikincil); }
        .detay-meta dd { font-weight: 400; }
        .etiketler { list-style: none; display: flex; flex-wrap: wrap; gap: 0 var(--bosluk-2); margin-top: var(--bosluk-2); }
        .etiketler li { font-size: .85rem; color: var(--text-ikincil); }
        .detay-aciklama { margin-top: var(--bosluk-2); max-width: 80ch; color: var(--text-ikincil); line-height: 1.7; overflow-wrap: anywhere; }
        .detay-eylemler { margin-top: var(--bosluk-3); display: flex; flex-wrap: wrap; gap: var(--bosluk-2); align-items: center; }
        .btn-ana.pasif { background: transparent; border-color: var(--border-renk); color: var(--text-ikincil); cursor: default; }

        /* --- BÖLÜM ARAMA VE DETAY GELİŞTİRMELERİ --- */
        .bolum-baslik-sol { display: flex; align-items: center; gap: 8px; }
        .bolum-sayisi-rozet {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 24px; height: 22px; padding: 0 6px; font-size: .75rem; font-weight: 700;
            color: var(--text-ikincil); background: var(--bg-kart); border: 1px solid var(--border-renk); border-radius: 999px;
        }
        .bolum-filtre-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .bolum-arama-kapsayici { position: relative; display: flex; align-items: center; }
        .bolum-arama-input {
            min-height: 36px; padding: 6px 28px 6px 12px; background: var(--bg-kart);
            border: 1px solid var(--border-renk); border-radius: 6px; color: var(--text-ana);
            font: inherit; font-size: .85rem; transition: border-color .15s ease; width: 170px;
        }
        .bolum-arama-input:focus { outline: none; border-color: var(--vurgu-parlak); }
        .bolum-arama-temizle {
            position: absolute; right: 6px; background: none; border: 0; color: var(--text-ikincil);
            cursor: pointer; font-size: .75rem; padding: 4px;
        }
        .siralama-btn, .mod-toggle-btn, .toplu-okundu-btn {
            font-size: .82rem; color: var(--text-ikincil); text-decoration: none; padding: 6px 10px;
            border: 1px solid var(--border-renk); border-radius: 6px; background: var(--bg-kart); cursor: pointer;
        }
        .siralama-btn:hover, .mod-toggle-btn:hover, .toplu-okundu-btn:hover { color: var(--vurgu-parlak); border-color: var(--vurgu-parlak); }
        .bolum-izgara {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
            gap: 8px;
            padding: var(--bosluk-2) 0;
            list-style: none;
        }
        .bolum-cip {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            min-height: 42px; padding: 6px 10px; background: var(--bg-kart);
            border: 1px solid var(--border-renk); border-radius: 6px; color: var(--text-ana);
            text-decoration: none; font-size: .85rem; font-weight: 600; transition: all .15s ease;
        }
        .bolum-cip:hover {
            border-color: var(--vurgu-parlak); color: var(--vurgu-parlak);
            background: rgba(224, 52, 60, 0.1); transform: translateY(-2px);
        }
        .bolum-cip.okundu { color: var(--text-ikincil); background: rgba(255, 255, 255, 0.02); }
        .cip-nokta { width: 5px; height: 5px; border-radius: 50%; background: var(--vurgu-parlak); }
        .arama-bos-kutu {
            padding: var(--bosluk-4) var(--bosluk-2); text-align: center; color: var(--text-ikincil);
            background: var(--bg-kart); border: 1px dashed var(--border-renk); border-radius: 8px; margin-top: var(--bosluk-2);
        }
        .arama-bos-kutu p { margin-bottom: var(--bosluk-2); }

        /* Topluluk Sekmeler (Forum & Canlı Sohbet Geçişi) */
        .topluluk-nav-bar { display: flex; justify-content: center; padding: var(--bosluk-3) var(--bosluk-2) var(--bosluk-1); max-width: var(--maks-genislik); margin: 0 auto; }
        .topluluk-sekmeler { display: inline-flex; background: var(--bg-kart); border: 1px solid var(--border-renk); border-radius: 999px; padding: 4px; gap: 4px; }
        .topluluk-sekme {
            display: inline-flex; align-items: center; gap: 8px; padding: 8px 20px; font-size: .88rem; font-weight: 500;
            color: var(--text-ikincil); border-radius: 999px; text-decoration: none; transition: all .18s ease;
        }
        .topluluk-sekme:hover { color: var(--text-ana); }
        .topluluk-sekme.aktif { background: var(--vurgu-rengi, #8e0e15); color: #fff; font-weight: 600; box-shadow: 0 2px 10px rgba(142, 14, 21, 0.4); }

        /* --- PUAN ve YORUMLAR (seri detay) --- */
        .detay-puan { margin-top: var(--bosluk-2); }
        .manga-puan { display: inline-flex; align-items: center; gap: 4px; margin-left: var(--bosluk-1); color: var(--text-ikincil); }
        .manga-puan svg { width: 12px; height: 12px; color: var(--vurgu-parlak); fill: currentColor; flex-shrink: 0; }
        .seri-yorumlar { margin-top: var(--bosluk-4); max-width: 720px; }

        .bolum-listesi { list-style: none; border-top: 1px solid var(--border-renk); }
        .bolum-listesi li { border-bottom: 1px solid var(--border-renk); }
        .bolum-satir {
            min-height: 52px; padding: var(--bosluk-1) 0; display: flex; align-items: center; justify-content: space-between; gap: var(--bosluk-2);
            transition: color .15s ease;
        }

        /* --- MOBİL --- */

            .btn-ana .yazi-uzun { display: none; }
            .detay-kapak { flex-basis: 150px; margin: 0 auto; }
            .detay-eylemler { display: flex; flex-wrap: wrap; gap: 8px; }

            .detay-eylemler > .btn-ikincil { flex: 1 1 calc(50% - 4px); justify-content: center; }
            .bolum-filtre-bar { width: 100%; justify-content: space-between; }
            .bolum-arama-input { width: 100%; max-width: none; }
            .bolum-arama-kapsayici { flex: 1; min-width: 140px; }
            .bolum-sag .bolum-tarih { display: none; }
            .profil-ad { display: none; }
        }

        @media (max-width: 768px) {
            body { padding-bottom: calc(var(--alt-gezinme-yuksekligi) + env(safe-area-inset-bottom, 0px)); }
            /* Yardım düğmesi footer'ın üstüne binmesin: boşluk sayfa zemininde değil footer içinde bırakılır. */
            .site-footer { padding-bottom: calc(var(--bosluk-4) + 64px); }
            .btn-ana, .btn-ikincil, .btn-ikinci, .sifirla-btn, .kategori-btn, .link-btn, .btn-ikon, .profil-chip { min-height: 44px; }
            .btn-ikon { width: 44px; height: 44px; }
            .ana-menu { display: none; }
            .footer-ic nav { display: flex; gap: var(--bosluk-2); justify-content: center; flex-wrap: wrap; margin-top: 4px; font-size: .85rem; }
            .arama-ac-btn { display: flex; }

            .mobil-arama {
                display: block;

            .alt-gezinme {

                padding-bottom: env(safe-area-inset-bottom, 0px);
            }
            .alt-gezinme a {
                flex: 1 1 0;
                min-width: 0;

                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;

            .alt-gezinme a:active { transform: scale(0.92); }
            .alt-gezinme a.aktif::after {
                content: '';
                position: absolute;
                bottom: 3px;
                width: 14px;
                height: 2px;
                border-radius: 999px;
                background: var(--vurgu-parlak, #e0343c);
                box-shadow: 0 0 8px var(--vurgu-parlak, #e0343c);
            }
        }


        /* --- HESABIM (profil sayfası) / DUYURU / BAKIM --- */
        .hp { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--bosluk-3); align-items: start; }
        .hp-yan { display: flex; flex-direction: column; gap: var(--bosluk-2); min-width: 0; }
        .hp-kahraman, .hp-kutu, .hp-stat { background: var(--bg-kart); border: 1px solid var(--border-renk); border-radius: 12px; }
        .hp-kahraman { padding: var(--bosluk-3) var(--bosluk-2) var(--bosluk-2); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }

        .hp-seviye-ust strong { color: var(--text-ana); font-weight: 600; font-variant-numeric: tabular-nums; }
        .hp-seviye small { font-size: .8rem; color: var(--text-ikincil); }
        .hp-hizli { width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 6px; padding-top: var(--bosluk-2); border-top: 1px solid var(--border-renk); }
        .hp-hizli a, .hp-hizli button {
            min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 8px;
            background: transparent; border: 1px solid var(--border-renk); border-radius: 8px; color: var(--text-ana);
            font: inherit; font-size: .85rem; cursor: pointer; text-decoration: none; transition: border-color .15s ease, color .15s ease;
        }
        @media (hover: hover) { .hp-hizli a:hover, .hp-hizli button:hover { border-color: var(--vurgu-parlak); color: var(--vurgu-parlak); } }
        .hp-sekmeler { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        .hp-sekmeler::-webkit-scrollbar { display: none; }
        .hp-sekme {
            flex: none; min-height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 14px;
            background: transparent; border: 1px solid var(--border-renk); border-radius: 8px; color: var(--text-ikincil);
            font: inherit; font-size: .9rem; cursor: pointer; white-space: nowrap; transition: color .15s ease, border-color .15s ease, background .15s ease;
        }
        .hp-sekme[aria-selected="true"] { color: #fff; background: var(--vurgu-rengi); border-color: var(--vurgu-rengi); }
        .hp-sekme:focus-visible { outline: 2px solid var(--vurgu-parlak); outline-offset: 2px; }
        @media (hover: hover) { .hp-sekme:not([aria-selected="true"]):hover { color: var(--text-ana); border-color: var(--vurgu-parlak); } }
        .hp-icerik { display: flex; flex-direction: column; gap: var(--bosluk-2); min-width: 0; }
        .hp-icerik:focus { outline: none; }
        .hp-kutu { padding: var(--bosluk-3); min-width: 0; }

        .hp-kutu p.aciklama { color: var(--text-ikincil); font-size: .9rem; margin-bottom: var(--bosluk-2); max-width: 60ch; }
        .hp-kutu .puanim-kalan { margin-bottom: 0; }
        .hp-tehlike { border-color: var(--vurgu-parlak); }
        .hp-tehlike h2 { color: var(--vurgu-parlak); }
        .hp-istatistik { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--bosluk-2); }
        .hp-stat { padding: var(--bosluk-2); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .hp-stat dt { font-size: .8rem; color: var(--text-ikincil); }
        .hp-stat dd { font-family: var(--font-baslik); font-weight: 500; font-size: 1.45rem; line-height: 1.2; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
        .hp-stat dd small { font-size: .8rem; color: var(--text-ikincil); font-family: inherit; }
        .hp-mini-cubuk { display: block; height: 4px; margin-top: 4px; background: var(--bg-yuzey, var(--bg-ana)); border-radius: 2px; overflow: hidden; }
        .hp-mini-cubuk > i { display: block; height: 100%; background: var(--vurgu-parlak); }
        .hp-ayarlar { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--bosluk-2); }
        @media (min-width: 900px) {
            .hp { grid-template-columns: 290px minmax(0, 1fr); gap: var(--bosluk-4); }
            .hp-yan { position: sticky; top: 88px; }
            .hp-sekmeler { flex-direction: column; overflow: visible; }
            .hp-sekme { width: 100%; }
            .hp-ayarlar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .hp-ayarlar > :first-child, .hp-ayarlar > .hp-tehlike { grid-column: 1 / -1; }
        }
        @media (max-width: 640px) {
            .hp-istatistik { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--bosluk-1); }
            .hp-kutu { padding: var(--bosluk-2); }
            .hp-stat dd { font-size: 1.25rem; }
        }
        .form-satir { display: flex; flex-direction: column; gap: 6px; margin-bottom: var(--bosluk-2); }
        .form-satir label { font-size: .85rem; color: var(--text-ikincil); }
        .form-satir input { min-height: 44px; padding: 0 12px; background: transparent; border: 1px solid var(--border-renk); border-radius: 2px; color: var(--text-ana); font: inherit; transition: border-color .15s ease; }
        .form-satir input:focus { outline: none; border-color: var(--vurgu-parlak); }
        .hesap-not { font-size: .9rem; margin: var(--bosluk-1) 0; overflow-wrap: anywhere; }

        .hesap-eylem-satiri { display: flex; flex-wrap: wrap; gap: var(--bosluk-1); align-items: center; }
        .btn-ikincil.tehlike { border-color: var(--vurgu-parlak); color: var(--vurgu-parlak); }
        .avatar-satiri { display: flex; align-items: center; gap: var(--bosluk-2); flex-wrap: wrap; }
        .avatar-satiri .profil-avatar { width: 64px; height: 64px; font-size: 1.6rem; }
        .duyuru-bandi { display: flex; align-items: center; justify-content: center; gap: var(--bosluk-2); padding: 10px var(--bosluk-2); border-bottom: 1px solid var(--border-renk); font-size: .9rem; text-align: center; overflow-wrap: anywhere; }
        .duyuru-bandi button { background: none; border: 0; color: var(--text-ikincil); font: inherit; font-size: .85rem; cursor: pointer; min-height: 44px; flex-shrink: 0; min-width: 44px; padding: 0 8px; }

        .bakim-ekrani { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--bosluk-2); padding: var(--bosluk-3); text-align: center; }
        .bakim-ekrani h1 { font-family: var(--font-baslik); font-weight: 500; font-size: var(--yazi-h1); }
        .bakim-ekrani p { color: var(--text-ikincil); max-width: 50ch; }

        /* --- LİDERLİK TABLOSU / PUANIM --- */
        .lider-sayfa { max-width: 820px; padding-top: var(--bosluk-4); }
        .lider-baslik h1 { font-family: var(--font-baslik); font-weight: 500; font-size: var(--yazi-h1); line-height: 1.15; overflow-wrap: anywhere; }
        .lider-baslik p { margin-top: var(--bosluk-1); max-width: 56ch; color: var(--text-ikincil); }
        .lider-sekmeler { display: flex; flex-wrap: wrap; gap: var(--bosluk-1); margin: var(--bosluk-3) 0 var(--bosluk-1); }
        .lider-sekme {
            min-height: 44px; padding: 0 var(--bosluk-2); background: transparent; color: var(--text-ikincil);
            border: 1px solid var(--border-belirgin); border-radius: 2px; font: inherit; font-size: .9rem; cursor: pointer;
            transition: color .15s ease, border-color .15s ease;
        }
        .lider-sekme[aria-selected="true"] { color: var(--text-ana); border-color: var(--vurgu-parlak); box-shadow: inset 0 -2px 0 var(--vurgu-parlak); }
        @media (hover: hover) { .lider-sekme:hover { color: var(--text-ana); border-color: var(--vurgu-parlak); } }
        .lider-guncelleme { margin: var(--bosluk-1) 0 var(--bosluk-2); font-size: .85rem; color: var(--text-ikincil); }

            display: grid; grid-template-columns: 40px 40px minmax(0, 1fr) auto; align-items: center; gap: 0 12px;
            min-height: 64px; padding: 8px 12px; border-bottom: 1px solid var(--border-renk); border-left: 3px solid transparent;
        }
        .lider-satir.ust { background: var(--bg-kart); border-left-color: var(--vurgu-parlak); }
        .lider-satir.t1 { box-shadow: inset 3px 0 0 var(--vurgu-parlak); min-height: 76px; }
        .lider-satir.ben { background: var(--bg-yuzey, var(--bg-kart)); outline: 1px solid var(--vurgu-parlak); outline-offset: -1px; }
        .lider-sira { font-family: var(--font-baslik); font-size: 1.1rem; text-align: center; color: var(--text-ikincil); font-variant-numeric: tabular-nums; }
        .lider-satir.ust .lider-sira {
            display: inline-flex; width: 36px; height: 36px; align-items: center; justify-content: center; justify-self: center;
            background: var(--vurgu-rengi); color: #fff; border-radius: 2px; font-weight: 600;
        }
        .lider-avatar {
            position: relative; width: 40px; height: 40px; border-radius: 2px; overflow: hidden; display: inline-flex; align-items: center; justify-content: center;
            background: var(--bg-yuzey, var(--bg-kart)); border: 1px solid var(--border-renk); color: var(--text-ikincil); font-weight: 600; font-size: 1rem;
        }
        .lider-avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; background: var(--bg-kart); }
        .lider-kimlik { min-width: 0; display: flex; flex-direction: column; }
        .lider-ad { display: inline-block; padding: 4px 0; min-height: 24px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .lider-sen { font-style: normal; font-weight: 400; color: var(--text-ikincil); }
        .lider-rutbe { display: block; font-size: .85rem; color: var(--text-ikincil); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .lider-puan { display: flex; flex-direction: column; align-items: flex-end; text-align: right; line-height: 1.2; }
        .lider-puan strong { font-size: 1.05rem; font-weight: 600; font-variant-numeric: tabular-nums; }
        .lider-puan small { font-size: .75rem; color: var(--text-ikincil); }

        .lider-ben, .lider-cagri {
            margin-top: var(--bosluk-3); padding: var(--bosluk-2); border: 1px solid var(--border-belirgin); border-left: 3px solid var(--vurgu-parlak);

        .lider-ben strong { flex: 1 1 100%; font-weight: 600; }
        .lider-ben span { color: var(--text-ikincil); font-size: .9rem; overflow-wrap: anywhere; }

        .lider-kurallar { margin-top: var(--bosluk-3); border: 1px solid var(--border-renk); border-radius: 2px; }

        .lider-kurallar-ic { padding: 0 var(--bosluk-2) var(--bosluk-2); }
        .kural-liste { list-style: none; }
        .kural-liste li { display: flex; justify-content: space-between; align-items: baseline; gap: var(--bosluk-2); padding: 12px 0; border-bottom: 1px solid var(--border-renk); }
        .kural-ad { min-width: 0; overflow-wrap: anywhere; }
        .kural-ad small { display: block; margin-top: 2px; font-size: .85rem; color: var(--text-ikincil); }
        .kural-puan { flex-shrink: 0; font-weight: 600; color: var(--vurgu-parlak); font-variant-numeric: tabular-nums; }
        .kural-not { margin-top: var(--bosluk-2); font-size: .9rem; color: var(--text-ikincil); }

        .ilerleme { height: 8px; background: var(--bg-yuzey, var(--bg-kart)); border: 1px solid var(--border-renk); border-radius: 2px; overflow: hidden; }
        .ilerleme > i { display: block; height: 100%; background: var(--vurgu-parlak); }
        .puanim-kalan { margin-top: var(--bosluk-1); }
        .puanim-alt { margin: var(--bosluk-3) 0 var(--bosluk-1); font-size: 1rem; font-weight: 500; }

        .puanim-gecmis li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px var(--bosluk-2); padding: 12px 0; border-bottom: 1px solid var(--border-renk); }

        @media (max-width: 480px) {

        /* --- HOŞ DOKUNUŞLAR --- */
        ::selection { background: var(--vurgu-rengi); color: #fff; }

        @media (pointer: coarse) {

            body { padding-bottom: calc(44px + env(safe-area-inset-bottom, 0px)); }

        /* iOS zoom önlemi: mobilde form alanları en az 16px */
        @media (max-width: 768px) {

<body class="sayfa-index">
    <div id="root"></div>

    <script src="js/config.js?v=20261025c"></script>
    <script src="js/liderlik.js"></script>
    <script src="js/puan.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
    <script src="js/adstili.js"></script>
    <script src="js/yorum.js"></script>
    <script src="js/forum.js?v=20261025b"></script>
    <script src="js/sohbet.js?v=20261027a"></script>
    <script type="text/babel">
        const VARSAYILAN_RENK = '#8e0e15';
        const API_URL = (window.KAGE95_API_URL || '').replace(/\/$/, '');
        const SAYFA_BOYUTU = 12;
        const OKUNAN_ANAHTAR = 'kage95_okunan';
        const TOKEN_ANAHTARLARI = ['kage95_token', 'token', 'jwt'];

        const tokenAl = () => {
            try {
                for (const k of TOKEN_ANAHTARLARI) {
                    const t = localStorage.getItem(k) || sessionStorage.getItem(k);
                    if (t) return t;
                }
            } catch (e) {}
            return null;
        };

        const okunanlariAl = (mangaId) => {
            try {
                const tum = JSON.parse(localStorage.getItem(OKUNAN_ANAHTAR) || '{}');
                return new Set((tum[mangaId] || []).map(String));
            } catch (e) { return new Set(); }
        };

        const okunduIsaretle = (mangaId, bolumId) => {
            try {
                const tum = JSON.parse(localStorage.getItem(OKUNAN_ANAHTAR) || '{}');
                const liste = new Set((tum[mangaId] || []).map(String));
                liste.delete(String(bolumId)); liste.add(String(bolumId));
                tum[mangaId] = Array.from(liste);
                localStorage.setItem(OKUNAN_ANAHTAR, JSON.stringify(tum));
            } catch (e) {}
        };

        // Toplu isaret: idler eskiden yeniye verilir, boylece "kaldigi bolum" en yeni isaretlenen olur. bos liste = hepsini temizle.
        const topluOkunduYaz = (mangaId, idler) => {
            try {
                const tum = JSON.parse(localStorage.getItem(OKUNAN_ANAHTAR) || '{}');
                if (!idler.length) { delete tum[mangaId]; }
                else {
                    const yeni = new Set(idler.map(String));
                    const eskiler = (tum[mangaId] || []).map(String).filter(x => !yeni.has(x));
                    tum[mangaId] = eskiler.concat(idler.map(String));
                }
                localStorage.setItem(OKUNAN_ANAHTAR, JSON.stringify(tum));
            } catch (e) {}
        };

        // Kutuphane okuma durumu: sunucuda alan yok, cihazda saklanir. Secilmediyse okunan bolumden turetilir.
        const KUTUPHANE_DURUM_ANAHTAR = 'kage95_kutuphane_durum';
        const KUTUPHANE_DURUMLARI = [['okuyorum', 'Okuyorum'], ['okunacak', 'Okunacak'], ['bitirdim', 'Bitirdim']];
        const kutuphaneDurumuAl = (mangaId) => {
            try {
                const d = JSON.parse(localStorage.getItem(KUTUPHANE_DURUM_ANAHTAR) || '{}')[mangaId];
                if (KUTUPHANE_DURUMLARI.some(x => x[0] === d)) return d;
            } catch (e) {}
            return okunanlariAl(mangaId).size > 0 ? 'okuyorum' : 'okunacak';
        };
        const kutuphaneDurumuYaz = (mangaId, durum) => {
            try {
                const tum = JSON.parse(localStorage.getItem(KUTUPHANE_DURUM_ANAHTAR) || '{}');
                tum[mangaId] = durum;
                localStorage.setItem(KUTUPHANE_DURUM_ANAHTAR, JSON.stringify(tum));
            } catch (e) {}
        };

        const YER_TUTUCU = "data:image/svg+xml;utf8," + encodeURIComponent(
            "<svg xmlns='http://www.w3.org/2000/svg' width='200' height='300' viewBox='0 0 200 300'><rect width='200' height='300' fill='#1a1515'/><text x='100' y='160' font-size='22' text-anchor='middle' fill='#6b625c' font-family='sans-serif'>Kapak yok</text></svg>"
        );
        const gorselHata = (e) => {
            if (e.target.dataset.hata) return;
            e.target.dataset.hata = '1';
            e.target.src = YER_TUTUCU;
            if (e.target.parentNode && e.target.parentNode.classList) e.target.parentNode.classList.add('kapak-yok');
        };

        const bolumeKaydir = (id) => {
            const el = document.getElementById(id);
            if (!el) return;
            const azalt = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            el.scrollIntoView({ behavior: azalt ? 'auto' : 'smooth', block: 'start' });
        };

        const DURUM_ADLARI = { DevamEdiyor: 'Devam ediyor', Tamamlandi: 'Tamamlandı', Ara: 'Ara verildi', AraVerdi: 'Ara verildi' };
        const durumMetni = (d) => DURUM_ADLARI[d] || d || 'Bilinmiyor';
        const bolumNoYaz = (n) => String(Number(n));
        const tarihYaz = (t) => {
            const d = new Date(t);
            return isNaN(d) ? '' : d.toLocaleDateString('tr-TR');
        };

        const slugOlustur = (metin) => {
            if (!metin) return '';
            return String(metin).trim()
                .replace(/İ/g, 'i').replace(/I/g, 'i').replace(/ı/g, 'i')
                .replace(/ğ/g, 'g').replace(/Ğ/g, 'g')
                .replace(/ü/g, 'u').replace(/Ü/g, 'u')
                .replace(/ş/g, 's').replace(/Ş/g, 's')
                .replace(/ö/g, 'o').replace(/Ö/g, 'o')
                .replace(/ç/g, 'c').replace(/Ç/g, 'c')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');
        };
        window.slugOlustur = slugOlustur;

        const mangaSlug = (m) => {
            if (!m) return '';
            if (typeof m === 'string') return slugOlustur(m);
            if (m.slug) return m.slug;
            if (m.mangaAdi) return slugOlustur(m.mangaAdi);
            return String(m.id || '');
        };
        window.mangaSlug = mangaSlug;

        const mangaLink = (m) => `#/manga/${mangaSlug(m)}`;
        window.mangaLink = mangaLink;

        const rotaOku = () => {
            const h = (window.K95Yol ? window.K95Yol.hash() : window.location.hash) || '';
            const m = h.match(/^#\/manga\/([^/?#]+)/);
            if (m) {
                const parca = decodeURIComponent(m[1]);
                const num = /^\d+$/.test(parca) ? parseInt(parca, 10) : null;
                return { sayfa: 'manga', id: num || parca, slug: parca };
            }
            const ku = h.match(/^#\/kullanici\/([^/?#]+)/);
            if (ku) {
                try { return { sayfa: 'kullanici', ad: decodeURIComponent(ku[1]) }; }
                catch (e) { return { sayfa: 'kullanici', ad: ku[1] }; }
            }
            if (/^#\/kutuphane/.test(h)) return { sayfa: 'kutuphane' };
            if (/^#\/(profil|hesabim)/.test(h)) return { sayfa: 'profil' };
            if (/^#\/liderlik/.test(h)) return { sayfa: 'liderlik' };
            if (/^#\/topluluk/.test(h)) return { sayfa: 'forum', yol: '#/forum' };
            if (/^#\/forum(\/|$|\?)/.test(h)) return { sayfa: 'forum', yol: h };
            if (/^#\/sohbet/.test(h)) return { sayfa: 'sohbet' };
            if (/^#\/iletisim/.test(h)) return { sayfa: 'iletisim' };
            // Bilinmeyen #/yol: sessizce ana sayfaya düşmek yerine bulunamadı göster
            if (/^#\/[^?#]/.test(h) && !/^#\/(seriler|ana)\b/.test(h)) return { sayfa: 'bulunamadi' };
            return { sayfa: 'ana' };
        };

        // EklenmeTarihi son 7 gün içindeyse "Yeni" (zaman dilimi yoksa UTC varsay)
        const yeniMi = (t) => {
            if (!t) return false;
            const s = /([zZ]|[+-]\d\d:?\d\d)$/.test(String(t)) ? String(t) : `${t}Z`;
            const d = new Date(s);
            if (isNaN(d)) return false;
            const fark = Date.now() - d.getTime();
            return fark <= 7 * 24 * 3600 * 1000;
        };

        // Yönetim paneli bağlantısı yalnızca site sahibi ya da en az bir izni olan yöneticide görünür.
        const panelYetkisiVar = (k) => !!k && (k.rol === 'Owner' || (k.rol === 'Admin' && Array.isArray(k.yetkiler) && k.yetkiler.length > 0));
        const rolEtiketi = (k) => k.rol === 'Owner' ? 'Site sahibi' : (k.rol === 'Admin' ? 'Yönetici' : 'Okur');

        const kullaniciAl = () => {
            try {
                if (!tokenAl()) return null;
                const k = JSON.parse(localStorage.getItem('kage95_user') || 'null');
                return k && k.kullaniciAdi ? k : null;
            } catch (e) { return null; }
        };

        const cikisYap = () => {
            try {
                localStorage.removeItem('kage95_token');
                localStorage.removeItem('kage95_user');
            } catch (e) {}
            window.location.hash = '#/';
            window.location.reload();
        };

        /* ------------------------- ORTAK BİLEŞENLER ------------------------- */
        const IKONLAR = {
            hata: <><path d="M12 3 2.5 20h19L12 3z" /><path d="M12 10v5" /><circle cx="12" cy="17.6" r=".6" fill="currentColor" /></>,
            bos: <><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5v-13z" /><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5v-13z" /></>,
            kilit: <><rect x="5" y="11" width="14" height="9" rx="1.5" /><path d="M8 11V8a4 4 0 0 1 8 0v3" /></>,
            ara: <><circle cx="11" cy="11" r="6.5" /><path d="m20 20-4.2-4.2" /></>,
            ev: <><path d="M3 11.5 12 4l9 7.5" /><path d="M5.5 10v10h13V10" /></>,
            kitap: <><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z" /><path d="M5 17a3 3 0 0 1 3-3h11" /></>,
            kisi: <><circle cx="12" cy="8" r="4" /><path d="M4 20c1-4 4-6 8-6s7 2 8 6" /></>,
            liderlik: <><path d="M4 20v-7h4.5v7" /><path d="M9.75 20V5h4.5v15" /><path d="M15.5 20v-10H20v10" /><path d="M3 20h18" /></>,
            forum: <><path d="M4 5h11v8H8l-4 3z" /><path d="M15 9h5v8l-3-2.5h-6V13" /></>,
            duyuru: <><path d="M4 10v4h3l7 4V6L7 10H4z" /><path d="M17.5 9.5a3.5 3.5 0 0 1 0 5" /></>,
            sohbet: <><path d="M4 5h16v11H9.5L5 20v-4H4V5z" /><path d="M8 9.5h8M8 12.5h5" /></>,
            zil: <><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.73 21a2 2 0 0 1-3.46 0" /></>,
            kamera: <><path d="M4 8h3l2-2.5h6L17 8h3v11H4V8z" /><circle cx="12" cy="13" r="3.5" /></>,
            odul: <><path d="M8 4h8v5a4 4 0 0 1-8 0V4z" /><path d="M8 6H5v1.5A3 3 0 0 0 8 10.5M16 6h3v1.5a3 3 0 0 1-3 3" /><path d="M12 13v4M8.5 20h7M10 17h4" /></>,
            boya: <><path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.8-.8 1.8-1.7 0-1.3-1-1.6-1-2.6 0-.9.7-1.7 1.7-1.7H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z" /><circle cx="7.5" cy="11" r="1" fill="currentColor" /><circle cx="10" cy="7" r="1" fill="currentColor" /><circle cx="15" cy="7.5" r="1" fill="currentColor" /></>,
            ayar: <><circle cx="12" cy="12" r="3" /><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" /></>,
            cikis: <><path d="M14 4h5v16h-5" /><path d="M10 8l-4 4 4 4M6 12h10" /></>,
            panel: <><rect x="4" y="4" width="7" height="7" /><rect x="13" y="4" width="7" height="4" /><rect x="13" y="10" width="7" height="10" /><rect x="4" y="13" width="7" height="7" /></>
        };
        const Ikon = ({ ad, sinif, boyut }) => (
            <svg className={sinif} width={boyut} height={boyut} viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" focusable="false">
                {IKONLAR[ad]}
            </svg>
        );

        const DurumKutu = ({ ikon, baslik, metin, rol, children }) => (
            <div className="durum-kutu" role={rol || 'status'}>
                <Ikon ad={ikon} sinif="durum-ikon" />
                <h3>{baslik}</h3>
                {metin && <p>{metin}</p>}
                {children && <div className="durum-eylemler">{children}</div>}
            </div>
        );

        const IskeletGrid = ({ adet = 8 }) => (
            <div className="manga-grid" role="status" aria-label="Yükleniyor" aria-busy="true">
                {Array.from({ length: adet }).map((_, i) => (
                    <div key={i} aria-hidden="true">
                        <div className="iskelet-blok iskelet-kapak"></div>
                        <div className="iskelet-blok iskelet-satir ilk"></div>
                        <div className="iskelet-blok iskelet-satir kisa"></div>
                    </div>
                ))}
            </div>
        );

        const yorumTarihYaz = (t) => {
            if (!t) return '';
            const d = new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(t) ? t : t + 'Z');
            return isNaN(d) ? '' : d.toLocaleString('tr-TR', { dateStyle: 'medium', timeStyle: 'short' });
        };

        // Bağımsız yıldız bileşeni (js/puan.js) için ince React sarmalayıcı.
        const KisaMetin = ({ metin }) => {
            const [acik, setAcik] = React.useState(false);
            const uzun = metin.length > 180;
            return (
                <>
                    <p className={'detay-aciklama-metin' + (uzun && !acik ? ' kisa' : '')}>{metin}</p>
                    {uzun && <button type="button" className="detay-devam" aria-expanded={acik} onClick={() => setAcik(!acik)}>{acik ? 'Daha az göster' : 'Devamını oku'}</button>}
                </>
            );
        };

        const PuanKutu = ({ url, etiket }) => {
            const ref = React.useRef(null);
            React.useEffect(() => {
                if (!ref.current || !window.Kage95Puan) return;
                const h = window.Kage95Puan.baslat(ref.current, { url, etiket, token: tokenAl });
                return () => h.yoksay();
            }, [url]);
            return <div ref={ref}></div>;
        };

        // Yorumlar js/yorum.js ortak aracıyla çizilir (düzenle/sil/yanıtla/beğen/şikayet, spoiler, sıralama, sayfalama).
        const MangaYorumlari = ({ mangaId }) => (<>
            {window.Kage95Forum && <window.Kage95Forum.SeriKutusu mangaId={mangaId} api={API_URL} />}
            <window.Kage95Yorum.Yorumlar tur="manga" id={mangaId} api={API_URL} tokenAl={tokenAl} sinir={500}
                placeholder="Bu seri hakkında ne düşünüyorsun? (Spoiler uyarısı yapmayı unutma)" />
        </>);

        // Kartlarda ortak okuma şeridi: Eğer okunuyorsa "Kaldığın Yerden", okunmuyorsa "İlk Bölüme Git"
        const hizliBolumBul = (m) => {
            if (!m) return null;
            try {
                const tumO = JSON.parse(localStorage.getItem(OKUNAN_ANAHTAR) || '{}');
                const okunanlar = (tumO[m.id] || []).map(String);
                if (okunanlar.length > 0) {
                    const sonId = okunanlar[okunanlar.length - 1];
                    return { id: sonId, devam: true, metin: 'Kaldığın Yerden' };
                }
                const v = JSON.parse(localStorage.getItem('kage95_son_okunan') || 'null');
                if (v && v.bolumId && String(v.mangaId) === String(m.id)) {
                    return { id: v.bolumId, no: v.bolumNo, devam: true, metin: 'Kaldığın Yerden' };
                }
            } catch (e) {}

            const ilkId = m.ilkBolumId || (m.bolumler && m.bolumler[0] && m.bolumler[0].id) || m.sonBolumId;
            if (ilkId) {
                return { id: ilkId, no: 1, devam: false, metin: 'İlk Bölüme Git' };
            }
            return null;
        };
        const HizliOku = ({ m }) => {
            const h = hizliBolumBul(m);
            if (!h) return null;
            const git = (e) => {
                e.preventDefault();
                e.stopPropagation();
                window.location.href = `read.html?chapter=${h.id}`;
            };
            return (
                <span
                    className={`kart-hizli-oku ${h.devam ? 'devam' : 'basla'}`}
                    role="button"
                    tabIndex={0}
                    title={h.devam ? 'Kaldığın yerden devam et' : 'İlk bölüme git'}
                    onClick={git}
                    onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') git(e); }}
                    aria-label={h.devam ? 'Kaldığın yerden devam et' : 'İlk bölüme git'}
                >
                    <span className="kho-ikon" aria-hidden="true">
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8 5v14l11-7z" />
                        </svg>
                    </span>
                    <span className="kho-metin">{h.metin}</span>
                </span>
            );
        };

        const MangaKart = ({ m, yeniGoster = true }) => {
            const yeni = yeniGoster && yeniMi(m.eklenmeTarihi);
            const tamam = m.durum === 'Tamamlandi';
            const ilkKategori = m.kategoriler && m.kategoriler[0] ? m.kategoriler[0] : '';
            const kartPuan = typeof m.ortalamaPuan === 'number' ? m.ortalamaPuan : (typeof m.puan === 'number' && m.puan > 0 && m.puan <= 5 ? m.puan : null);
            return (
                <a className="manga-kart" href={mangaLink(m)}
                   aria-label={`${m.mangaAdi}, ${m.bolumSayisi || 0} bölüm${yeni ? ', yeni' : ''}${tamam ? ', tamamlandı' : ''}`}>
                    <div className={`kart-kapak desen-${(m.id || 0) % 5} ${m.kapakResmiURL ? '' : 'kapak-yok'}`}>
                        <img src={m.kapakResmiURL || YER_TUTUCU} alt={`${m.mangaAdi} kapak görseli`} loading="lazy" decoding="async" onError={gorselHata} />
                        {yeni && (
                            <div className="kart-rozetler">
                                <span className="rozet-mini rozet-yeni">Yeni</span>
                            </div>
                        )}
                        <HizliOku m={m} />
                    </div>
                    <h3 className="manga-baslik">{m.mangaAdi}</h3>
                    <div className="manga-meta">
                        {m.bolumSayisi > 0 ? `${m.bolumSayisi} Bölüm` : 'Yakında'}{ilkKategori ? ` · ${ilkKategori}` : ''}
                        {kartPuan != null && (
                            <span className="manga-puan" aria-label={`Puan ${kartPuan.toFixed(1)}`}>

            if (!sonraki) return 100;
            const ust = Number(toplam || 0) + Number(kalan || 0);
            const alt = RUTBE_ESIKLERI.filter(e => e <= toplam && e < ust).pop() || 0;
