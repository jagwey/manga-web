<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kage 95 - Modern Manga Arşivi ve Kütüphanesi</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#0e0c0c">
    <script src="js/tema.js"></script>
    <link rel="stylesheet" href="css/vurgu.css">

    <!-- Tipografi: Noto Serif (başlık), Noto Serif JP (kanji), Noto Sans (metin) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&family=Noto+Serif+JP:wght@500;700&family=Noto+Serif:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- React 18 & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --vurgu-rengi: #8e0e15;          /* kan kırmızısı (dolgu) */
            --vurgu-parlak: #e0343c;         /* koyu zeminde metin/çizgi vurgusu */
            --bg-ana: #0e0c0c;
            --bg-kart: #141111;
            --border-renk: #2a2323;
            --border-belirgin: #3a3030;
            --text-ana: #ede7e2;
            --text-ikincil: #a89f99;
            --font-baslik: 'Noto Serif', Georgia, serif;
            --font-kanji: 'Noto Serif JP', 'Noto Serif', serif;
            /* Boşluk ölçeği: 8 / 16 / 24 / 32 */
            --bosluk-1: 8px;
            --bosluk-2: 16px;
            --bosluk-3: 24px;
            --bosluk-4: 32px;
            /* Başlık ölçeği */
            --yazi-h1: clamp(2rem, 1.4rem + 2.6vw, 3.2rem);
            --yazi-h2: 1.35rem;
            --yazi-h3: 1.1rem;
            --alt-gezinme-yuksekligi: 56px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-ana);
            color: var(--text-ana);
            font-family: 'Noto Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.5;
        }

        a { color: inherit; text-decoration: none; }
        button { font-family: inherit; }

        a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
            outline: 1px solid var(--vurgu-parlak);
            outline-offset: 3px;
        }

        /* --- ÜST ÇUBUK --- */
        .site-header {
            border-bottom: 1px solid var(--border-renk);
            background: var(--bg-ana);
        }

        .header-ic {
            max-width: none;
            margin: 0 auto;
            padding: var(--bosluk-2) var(--bosluk-3);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: var(--bosluk-1) var(--bosluk-4);
        }

        .site-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-baslik);
            font-size: 1.15rem;
            font-weight: 600;
        }

        .logo-muhur {
            width: 32px;
            height: 32px;
            background: var(--vurgu-rengi);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-kanji);
            font-weight: 500;
            font-size: 1.05rem;
            border-radius: 2px;
        }

        .ana-menu { display: flex; flex-wrap: wrap; gap: var(--bosluk-3); }

        .menu-link {
            padding: 8px 0;
            font-size: .9rem;
            color: var(--text-ikincil);
            border-bottom: 2px solid transparent;
            transition: color .15s ease, border-color .15s ease;
        }

        @media (hover: hover) { .menu-link:hover { color: var(--text-ana); border-bottom-color: var(--vurgu-parlak); } }

        .header-sag {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: var(--bosluk-1);
        }

        /* --- DÜĞMELER: düz, 1px kenarlık, 2px köşe --- */
        .btn-ana, .btn-ikincil, .btn-ikinci {
            min-height: 40px;
            padding: 0 var(--bosluk-2);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: .9rem;
            font-weight: 500;
            border: 1px solid var(--border-belirgin);
            border-radius: 2px;
            cursor: pointer;
            transition: border-color .15s ease, color .15s ease, background-color .15s ease;
        }

        .btn-ana {
            background: var(--vurgu-rengi);
            border-color: var(--vurgu-rengi);
            color: #fff;
        }
        @media (hover: hover) { .btn-ana:hover { background: var(--vurgu-parlak); border-color: var(--vurgu-parlak); } }

        .btn-ikincil, .btn-ikinci {
            background: transparent;
            color: var(--text-ana);
        }
        @media (hover: hover) { .btn-ikincil:hover, .btn-ikinci:hover { border-color: var(--vurgu-parlak); } }

        .btn-ikon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 1px solid var(--border-belirgin);
            border-radius: 2px;
            color: var(--text-ana);
            cursor: pointer;
            transition: border-color .15s ease, color .15s ease;
        }
        @media (hover: hover) { .btn-ikon:hover { border-color: var(--vurgu-parlak); } }

        /* --- HESAP ALANI --- */
        .hesap-alani { position: relative; display: flex; align-items: center; gap: var(--bosluk-1); }
        .profil-menu .menu-ayrac { border-top: 1px solid var(--border-renk); margin-top: 4px; }
        .profil-menu a, .profil-menu button { white-space: nowrap; }
        @media (max-width: 480px) { .hesap-alani > .btn-ikincil { display: none; } }
        @media (max-width: 768px) { .profil-menu a, .profil-menu button { min-height: 44px; } }

        .profil-alani { position: relative; }
        .profil-chip {
            min-height: 40px;
            padding: 0 var(--bosluk-1);
            display: inline-flex;
            align-items: center;
            gap: var(--bosluk-1);
            background: transparent;
            color: var(--text-ana);
            border: 0;
            border-radius: 2px;
            font: inherit;
            font-size: .9rem;
            cursor: pointer;
            transition: color .15s ease;
        }
        @media (hover: hover) { .profil-chip:hover { color: var(--vurgu-parlak); } }
        .profil-avatar {
            width: 28px;
            height: 28px;
            border-radius: 2px;
            background: var(--vurgu-rengi);
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: .85rem;
            font-weight: 500;
            overflow: hidden;
            flex-shrink: 0;
        }
        .profil-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profil-ad { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .profil-menu {
            position: absolute;
            right: 0;
            top: calc(100% + 6px);
            min-width: 210px;
            background: var(--bg-ana);
            border: 1px solid var(--border-renk);
            border-radius: 2px;
            z-index: 120;
            display: flex;
            flex-direction: column;
        }
        .profil-menu a, .profil-menu button {
            min-height: 40px;
            padding: 0 var(--bosluk-2);
            display: flex;
            align-items: center;
            background: transparent;
            border: 0;
            color: var(--text-ana);
            font: inherit;
            font-size: .9rem;
            text-align: left;
            cursor: pointer;
            transition: color .15s ease;
        }
        @media (hover: hover) { .profil-menu a:hover, .profil-menu button:hover { color: var(--vurgu-parlak); } }

        /* --- HERO --- */
        .hero {
            max-width: none;
            margin: 0 auto;
            padding: calc(var(--bosluk-4) * 2) var(--bosluk-3) var(--bosluk-4);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: var(--bosluk-4) calc(var(--bosluk-4) * 2);
        }

        .hero-metin { flex: 1 1 440px; min-width: 0; }

        .hero-etiket {
            font-size: .85rem;
            color: var(--text-ikincil);
        }

        .hero-baslik {
            margin-top: var(--bosluk-2);
            font-family: var(--font-baslik);
            font-weight: 500;
            font-size: var(--yazi-h1);
            line-height: 1.15;
        }

        .hero-baslik { min-height: 2.3em; }

        .hero-japonca {
            margin-top: var(--bosluk-1);
            min-height: 1.4em;
            font-family: var(--font-kanji);
            font-size: .75rem;
            letter-spacing: .05em;
            color: var(--text-ikincil);
        }

        .hero-yazar {
            min-height: 1.5em;
            font-size: .8rem;
            color: var(--text-ikincil);
        }

        .hero-aciklama {
            margin-top: var(--bosluk-3);
            max-width: min(55ch, 100%);
            color: var(--text-ikincil);
            font-size: 1rem;
            line-height: 1.7;
        }

        .arama-kapsayici { margin-top: var(--bosluk-4); max-width: 480px; position: relative; }

        .arama-kapsayici input {
            width: 100%;
            height: 44px;
            padding: 0 var(--bosluk-2) 0 44px;
            background: transparent;
            border: 1px solid var(--border-belirgin);
            border-radius: 2px;
            color: var(--text-ana);
            font: inherit;
            font-size: .95rem;
            transition: border-color .15s ease;
        }

        .arama-kapsayici input::placeholder { color: var(--text-ikincil); opacity: .7; }
        .arama-kapsayici input:focus { border-color: var(--vurgu-parlak); outline: none; }

        .arama-ikon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-ikincil);
            pointer-events: none;
            display: flex;
        }

        /* Torii + düz kırmızı güneş (sabit) */
        .hero-gorsel {
            flex: 1 1 320px;
            min-width: 0;
            max-width: 380px;
            margin: 0 auto;
            aspect-ratio: 1 / 1;
            position: relative;
        }

        .gunes {
            position: absolute;
            left: 20%; top: 14%;
            width: 60%;
            aspect-ratio: 1;
            border-radius: 50%;
            background: var(--vurgu-rengi);
        }

        .torii {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ufuk {
            position: absolute;
            left: 0; right: 0; bottom: 22%;
            height: 1px;
            background: var(--text-ana);
            opacity: .25;
            z-index: 1;
        }

        .dikey-yazi {
            position: absolute;
            right: 4%; top: 6%;
            writing-mode: vertical-rl;
            font-family: var(--font-kanji);
            font-weight: 500;
            font-size: 1.6rem;
            letter-spacing: .2em;
            z-index: 2;
        }

        /* --- TÜR SEKMELERİ (altı çizgili metin) --- */
        .tur-bolum {
            max-width: none;
            margin: 0 auto;
            padding: 0 var(--bosluk-3) var(--bosluk-3);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0 var(--bosluk-3);
        }

        .tur-etiket { margin-right: var(--bosluk-1); font-size: .9rem; color: var(--text-ikincil); }

        .kategori-btn {
            min-height: 40px;
            padding: 0;
            background: transparent;
            border: 0;
            border-bottom: 2px solid transparent;
            border-radius: 0;
            color: var(--text-ikincil);
            font-size: .9rem;
            cursor: pointer;
            transition: color .15s ease, border-color .15s ease;
        }

        @media (hover: hover) { .kategori-btn:hover { color: var(--text-ana); } }

        .kategori-btn.aktif {
            color: var(--text-ana);
            border-bottom-color: var(--vurgu-parlak);
        }

        /* --- LİSTE --- */
        .ana-icerik { max-width: none; margin: 0 auto; padding: 0 var(--bosluk-3) calc(var(--bosluk-4) * 2); }

        .bolum-baslik-satir {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: var(--bosluk-2);
            padding-bottom: var(--bosluk-2);
            margin-bottom: var(--bosluk-3);
            border-bottom: 1px solid var(--border-renk);
        }

        .bolum-baslik-satir h2 {
            font-family: var(--font-baslik);
            font-size: var(--yazi-h2);
            font-weight: 500;
        }

        .sonuc-sayisi { color: var(--text-ikincil); font-size: .9rem; }

        .manga-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: var(--bosluk-3) var(--bosluk-2);
        }

        .manga-kart { display: block; min-width: 0; }

        .kart-kapak {
            position: relative;
            aspect-ratio: 2 / 3;
            overflow: hidden;
            background: var(--bg-yuzey, #1a1515);
            border: 1px solid var(--border-renk);
            border-radius: 2px;
            transition: border-color .15s ease;
        }

        .kart-kapak img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .manga-kart:focus-visible .kart-kapak { border-color: var(--vurgu-parlak); }
        @media (hover: hover) { .manga-kart:hover .kart-kapak { border-color: var(--vurgu-parlak); } }

        .kart-rozet {
            position: absolute;
            left: 0; bottom: 0;
            background: var(--bg-kaplama, rgba(14, 12, 12, .75));
            color: var(--text-ana);
            font-size: .75rem;
            padding: 3px var(--bosluk-1);
        }

        .kart-rozetler {
            position: absolute;
            left: 0; top: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .rozet-mini {
            padding: 3px var(--bosluk-1);
            font-size: .75rem;
            border-radius: 0;
            line-height: 1.4;
            background: var(--bg-kaplama, rgba(14, 12, 12, .75));
        }
        .rozet-yeni { color: var(--vurgu-parlak); }
        .rozet-tamam { color: var(--text-ikincil); }

        .manga-baslik {
            margin-top: var(--bosluk-1);
            font-weight: 500;
            font-size: .95rem;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            overflow-wrap: anywhere;
            transition: color .15s ease;
        }

        @media (hover: hover) { .manga-kart:hover .manga-baslik { color: var(--vurgu-parlak); } }

        .manga-meta { margin-top: 2px; font-size: .85rem; color: var(--text-ikincil); }

        /* Yükleniyor iskeleti: düz, sakin */
        .iskelet-blok {
            background: var(--bg-yuzey, #1a1515);
            animation: iskelet-nabiz 1.8s ease-in-out infinite;
            border-radius: 2px;
        }
        .iskelet-kapak { aspect-ratio: 2 / 3; border: 1px solid var(--border-renk); }
        .iskelet-satir { height: 14px; margin-top: var(--bosluk-1); }
        .iskelet-satir.ilk { margin-top: var(--bosluk-2); width: 90%; }
        .iskelet-satir.kisa { width: 45%; height: 12px; }
        @keyframes iskelet-nabiz { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
        @media (prefers-reduced-motion: reduce) {
            .iskelet-blok { animation: none; }
            * { transition: none !important; }
        }

        /* Boş / hata durumu */
        .durum-kutu {
            text-align: center;
            padding: calc(var(--bosluk-4) * 2) var(--bosluk-3);
            border: 1px solid var(--border-renk);
            border-radius: 2px;
            color: var(--text-ikincil);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .durum-kutu p { max-width: 55ch; }
        .durum-ikon { display: none; }
        .durum-kutu h3 { color: var(--text-ana); font-family: var(--font-baslik); font-weight: 500; font-size: var(--yazi-h3); margin-bottom: var(--bosluk-1); }
        .durum-eylemler { margin-top: var(--bosluk-3); display: flex; flex-wrap: wrap; justify-content: center; gap: var(--bosluk-1) var(--bosluk-2); }

        /* --- ALT BİLGİ --- */
        .site-footer { border-top: 1px solid var(--border-renk); padding: var(--bosluk-4) var(--bosluk-3); }

        .footer-ic {
            max-width: none;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: var(--bosluk-2);
            font-size: .85rem;
            color: var(--text-ikincil);
        }

        .footer-ic nav { display: flex; gap: var(--bosluk-3); }
        .footer-ic a { transition: color .15s ease; }
        @media (hover: hover) { .footer-ic a:hover { color: var(--text-ana); } }

        /* --- ÇEKMECE (GÖRÜNÜM AYARLARI) --- */
        .arka-plan-karartici {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, .7);
            z-index: 998;
            opacity: 0;
            pointer-events: none;
        }

        .arka-plan-karartici.acik { opacity: 1; pointer-events: auto; }

        .yan-menu {
            position: fixed; top: 0; right: 0;
            width: 340px; max-width: 90vw; height: 100vh;
            background: var(--bg-ana);
            border-left: 1px solid var(--border-renk);
            z-index: 999;
            transform: translateX(100%);
            visibility: hidden;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .yan-menu.acik { transform: translateX(0); visibility: visible; }

        .yan-menu-header {
            padding: var(--bosluk-2) var(--bosluk-3);
            border-bottom: 1px solid var(--border-renk);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .yan-menu-header h2 { font-family: var(--font-baslik); font-size: 1.1rem; font-weight: 500; }

        .kapat-btn {
            min-height: 40px;
            padding: 0 var(--bosluk-1);
            background: none;
            border: none;
            color: var(--text-ikincil);
            font-size: .9rem;
            text-decoration: underline;
            text-underline-offset: 3px;
            cursor: pointer;
        }

        @media (hover: hover) { .kapat-btn:hover { color: var(--text-ana); } }

        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
        .tema-listesi { display: grid; grid-template-columns: 1fr 1fr; gap: var(--bosluk-1); }
        .tema-kart { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: var(--bosluk-1); background: transparent; border: 1px solid var(--border-renk); border-radius: 2px; color: var(--text-ana); text-align: left; cursor: pointer; transition: border-color .15s ease; }
        @media (hover: hover) { .tema-kart:hover { border-color: var(--border-belirgin); } }
        .tema-kart.aktif { border-color: var(--vurgu-parlak); }
        .tema-onizleme { display: flex; align-items: flex-end; width: 100%; height: 36px; border: 1px solid var(--border-belirgin); border-radius: 2px; padding: 4px; }
        .tema-onizleme i { display: block; width: 40%; height: 4px; }
        .tema-ad { font-size: .9rem; font-weight: 500; }
        .tema-not { font-size: .75rem; color: var(--text-ikincil); line-height: 1.3; }
        .devam-serit { display: flex; align-items: center; justify-content: space-between; gap: var(--bosluk-2); padding: var(--bosluk-2); margin-bottom: var(--bosluk-4); border: 1px solid var(--border-renk); border-left: 2px solid var(--vurgu-parlak); border-radius: 2px; }
        .devam-serit small { display: block; color: var(--text-ikincil); font-size: .8rem; margin-bottom: 2px; }
        .devam-serit strong { font-weight: 500; overflow-wrap: anywhere; }
        .devam-serit .devam-alt { display: block; color: var(--text-ikincil); font-size: .85rem; margin-top: 2px; }
        .siralama { min-height: 40px; padding: 0 var(--bosluk-1); background: var(--bg-ana); border: 1px solid var(--border-renk); border-radius: 2px; color: var(--text-ana); font: inherit; font-size: .85rem; }
        .siralama:focus { outline: none; border-color: var(--vurgu-parlak); }
        .baslik-sag { display: flex; align-items: center; gap: var(--bosluk-2); }
        .yan-menu-icerik { padding: var(--bosluk-3); display: flex; flex-direction: column; gap: var(--bosluk-3); }

        .ayar-kutu {
            border: 1px solid var(--border-renk);
            border-radius: 2px;
            padding: var(--bosluk-2);
        }

        .ayar-kutu-baslik { font-weight: 500; margin-bottom: var(--bosluk-1); }

        .ayar-grubu { display: flex; flex-direction: column; gap: var(--bosluk-1); margin-bottom: var(--bosluk-1); }
        .ayar-grubu label { font-size: .85rem; color: var(--text-ikincil); }

        .yan-menu input[type="color"] {
            width: 100%; height: 40px;
            border: 1px solid var(--border-belirgin);
            border-radius: 2px;
            background: none;
            cursor: pointer;
        }

        .yan-menu input[type="file"], .yan-menu select {
            width: 100%;
            background: transparent;
            border: 1px solid var(--border-belirgin);
            color: var(--text-ana);
            padding: 10px;
            border-radius: 2px;
            font-size: .9rem;
        }

        .sifirla-btn {
            min-height: 40px;
            background: transparent;
            color: var(--text-ana);
            border: 1px solid var(--border-belirgin);
            border-radius: 2px;
            font-size: .9rem;
            font-weight: 500;
            cursor: pointer;
            transition: border-color .15s ease;
        }

        @media (hover: hover) { .sifirla-btn:hover { border-color: var(--vurgu-parlak); } }

        /* --- ARAMA İKONU (yalnız mobil) + ALT GEZİNME --- */
        .arama-ac-btn, .mobil-arama, .alt-gezinme { display: none; }
        .link-btn {
            min-height: 40px;
            padding: 0 var(--bosluk-1);
            background: none;
            border: 0;
            color: var(--text-ikincil);
            font: inherit;
            font-size: .9rem;
            text-decoration: underline;
            text-underline-offset: 3px;
            cursor: pointer;
            transition: color .15s ease;
        }
        @media (hover: hover) { .link-btn:hover { color: var(--vurgu-parlak); } }

        .profil-sayfa { max-width: 480px; margin: 0 auto; padding-top: var(--bosluk-3); }
        .profil-kart {
            display: flex; align-items: center; gap: var(--bosluk-2);
            padding: var(--bosluk-3) 0; margin-bottom: var(--bosluk-2);

        }
        .profil-kart .profil-avatar { width: 48px; height: 48px; font-size: 1.2rem; }
        .profil-kart strong { display: block; font-family: var(--font-baslik); font-weight: 500; font-size: var(--yazi-h3); overflow-wrap: anywhere; }
        .profil-kart span.rol { font-size: .85rem; color: var(--text-ikincil); }
        .profil-eylemler { display: flex; flex-direction: column; gap: var(--bosluk-1); }
        .profil-eylemler > * { width: 100%; justify-content: flex-start; padding: 0 var(--bosluk-2); }

        /* --- DURUM / DETAY --- */
        .btn-ikincil:disabled, .btn-ikinci:disabled { opacity: .6; cursor: default; }
        .btn-ikincil.aktif { border-color: var(--vurgu-parlak); color: var(--vurgu-parlak); }
        .daha-fazla { display: flex; justify-content: center; margin-top: var(--bosluk-4); }
        .hata-satir { margin-top: var(--bosluk-3); text-align: center; color: var(--vurgu-parlak); }
        .bilgi-satir { margin-top: var(--bosluk-2); font-size: .9rem; color: var(--text-ikincil); }
        .bilgi-satir a { color: var(--vurgu-parlak); text-decoration: underline; text-underline-offset: 3px; }

        .geri-link { display: inline-flex; align-items: center; min-height: 40px; margin-bottom: var(--bosluk-1); font-size: .9rem; color: var(--text-ikincil); text-decoration: underline; text-underline-offset: 3px; transition: color .15s ease; }
        @media (hover: hover) { .geri-link:hover { color: var(--text-ana); } }

        .detay { padding-top: var(--bosluk-3); }
        .detay-ust { display: flex; flex-wrap: wrap; gap: var(--bosluk-3) var(--bosluk-4); margin-bottom: var(--bosluk-4); }
        .detay-kapak { flex: 0 0 220px; max-width: 100%; aspect-ratio: 2 / 3; background: var(--bg-yuzey, #1a1515); border: 1px solid var(--border-renk); border-radius: 2px; overflow: hidden; }
        .detay-kapak img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .detay-bilgi { flex: 1 1 300px; min-width: 0; }
        .detay-baslik { font-family: var(--font-baslik); font-weight: 500; font-size: clamp(1.5rem, 1.2rem + 1.6vw, 2rem); line-height: 1.2; overflow-wrap: anywhere; }
        .detay-meta { margin-top: var(--bosluk-2); display: flex; flex-wrap: wrap; gap: var(--bosluk-1) var(--bosluk-3); }
        .detay-meta dt { font-size: .8rem; color: var(--text-ikincil); }
        .detay-meta dd { font-weight: 400; }
        .etiketler { list-style: none; display: flex; flex-wrap: wrap; gap: 0 var(--bosluk-2); margin-top: var(--bosluk-2); }
        .etiketler li { font-size: .85rem; color: var(--text-ikincil); }
        .detay-aciklama { margin-top: var(--bosluk-2); max-width: 60ch; color: var(--text-ikincil); line-height: 1.7; overflow-wrap: anywhere; }
        .detay-eylemler { margin-top: var(--bosluk-3); display: flex; flex-wrap: wrap; gap: var(--bosluk-2); align-items: center; }
        .btn-ana.pasif { background: transparent; border-color: var(--border-renk); color: var(--text-ikincil); cursor: default; }


        /* --- PUAN ve YORUMLAR (seri detay) --- */
        .detay-puan { margin-top: var(--bosluk-2); }
        .manga-puan { display: inline-flex; align-items: center; gap: 4px; margin-left: var(--bosluk-1); color: var(--text-ikincil); }
        .manga-puan svg { width: 12px; height: 12px; color: var(--vurgu-parlak); fill: currentColor; flex-shrink: 0; }
        .seri-yorumlar { margin-top: var(--bosluk-4); max-width: 720px; }

        .bolum-listesi { list-style: none; border-top: 1px solid var(--border-renk); }
        .bolum-listesi li { border-bottom: 1px solid var(--border-renk); }
        .bolum-satir {
            min-height: 52px; padding: var(--bosluk-1) 0; display: flex; align-items: center; justify-content: space-between; gap: var(--bosluk-2);
            transition: color .15s ease;
        }
        @media (hover: hover) { .bolum-satir:hover { color: var(--vurgu-parlak); } }
        .bolum-satir.okundu .bolum-ad { color: var(--text-ikincil); }
        .bolum-ad { min-width: 0; overflow-wrap: anywhere; }
        .bolum-ad strong { font-weight: 500; }
        .bolum-sag { display: flex; align-items: center; gap: var(--bosluk-2); flex-shrink: 0; font-size: .82rem; color: var(--text-ikincil); }
        .okundu-rozet { font-size: .8rem; color: var(--text-ikincil); }

        /* --- MOBİL --- */
        @media (max-width: 640px) {
            .header-ic { padding: var(--bosluk-1) var(--bosluk-2); gap: var(--bosluk-1); }
            .hesap-alani > a.btn-ikincil { display: none; }
            .hero { padding: var(--bosluk-3) var(--bosluk-2) var(--bosluk-2); }
            .hero-baslik { min-height: 0; font-size: clamp(1.5rem, 6vw, 2rem); }
            .tur-bolum, .ana-icerik { padding-left: var(--bosluk-2); padding-right: var(--bosluk-2); }
            .manga-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--bosluk-3) var(--bosluk-2); }
            .manga-baslik { font-size: .92rem; margin-top: 8px; }
            .manga-meta { font-size: .8rem; margin-top: 2px; }
            .hero-aciklama { margin-top: var(--bosluk-1); font-size: .95rem; line-height: 1.5; }
            .tur-bolum { flex-wrap: nowrap; overflow-x: auto; gap: 0 var(--bosluk-2); padding-bottom: var(--bosluk-2); scrollbar-width: none; -webkit-overflow-scrolling: touch; }
            .tur-bolum::-webkit-scrollbar { display: none; }
            .tur-bolum > * { flex: none; white-space: nowrap; }
            .tur-etiket { display: none; }
            .bolum-baslik-satir { flex-wrap: wrap; gap: 10px; margin-bottom: var(--bosluk-2); }
            #seriler .bolum-baslik-satir .baslik-sag { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
            #seriler .bolum-baslik-satir .baslik-sag .sonuc-sayisi { grid-column: 1 / -1; text-align: right; font-size: .82rem; }
            .devam-serit { flex-wrap: wrap; padding: 12px; margin-bottom: var(--bosluk-3); }
            .devam-serit .btn-ana { width: 100%; }
            .site-footer { padding: var(--bosluk-4) var(--bosluk-2); }
            .btn-ana .yazi-uzun { display: none; }
            .hero-gorsel { display: none; }
            .detay-kapak { flex-basis: 150px; margin: 0 auto; }
            .detay-eylemler > * { flex: 1 1 100%; }
            .bolum-sag .bolum-tarih { display: none; }
            .profil-ad { display: none; }
        }

        @media (max-width: 768px) {
            body { padding-bottom: calc(var(--alt-gezinme-yuksekligi) + env(safe-area-inset-bottom, 0px)); }
            /* Yardım düğmesi footer'ın üstüne binmesin: boşluk sayfa zemininde değil footer içinde bırakılır. */
            .site-footer { padding-bottom: calc(var(--bosluk-4) + 64px); }
            .btn-ana, .btn-ikincil, .btn-ikinci, .sifirla-btn, .kategori-btn, .link-btn, .btn-ikon, .profil-chip { min-height: 44px; }
            .btn-ikon { width: 44px; height: 44px; }
            .ana-menu { display: none; }
            .footer-ic nav { display: none; }
            .arama-ac-btn { display: flex; }
            .arama-ac-btn[aria-expanded="true"] { border-color: var(--vurgu-parlak); color: var(--vurgu-parlak); }
            .hero .arama-kapsayici { display: none; }
            .hero-baslik { margin-top: var(--bosluk-1); }
            .mobil-arama {
                display: block;
                border-bottom: 1px solid var(--border-renk);
                background: var(--bg-ana);
                padding: var(--bosluk-1) var(--bosluk-2) var(--bosluk-2);
            }
            .mobil-arama .arama-kapsayici { margin-top: 0; max-width: none; }

            .alt-gezinme {
                display: flex;
                position: fixed;
                left: 0; right: 0; bottom: 0;
                z-index: 90;
                background: var(--bg-ana);
                border-top: 1px solid var(--border-renk);
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }
            .alt-gezinme a {
                flex: 1 1 0;
                min-width: 0;
                min-height: var(--alt-gezinme-yuksekligi);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 2px;
                font-size: .75rem;
                color: var(--text-ikincil);
            }
            .alt-gezinme a svg { width: 20px; height: 20px; }
            .alt-gezinme a.aktif { color: var(--vurgu-parlak); }
        }


        /* --- HESABIM (profil sayfası) / DUYURU / BAKIM --- */
        .profil-sayfa { max-width: 560px; }
        .hesap-bolum { margin-top: var(--bosluk-4); padding-top: var(--bosluk-3); border-top: 1px solid var(--border-renk); }
        .hesap-bolum h2 { font-family: var(--font-baslik); font-weight: 500; font-size: var(--yazi-h3); margin-bottom: var(--bosluk-2); }
        .hesap-bolum p.aciklama { color: var(--text-ikincil); font-size: .9rem; margin-bottom: var(--bosluk-2); max-width: 60ch; }
        .form-satir { display: flex; flex-direction: column; gap: 6px; margin-bottom: var(--bosluk-2); }
        .form-satir label { font-size: .85rem; color: var(--text-ikincil); }
        .form-satir input { min-height: 44px; padding: 0 12px; background: transparent; border: 1px solid var(--border-renk); border-radius: 2px; color: var(--text-ana); font: inherit; transition: border-color .15s ease; }
        .form-satir input:focus { outline: none; border-color: var(--vurgu-parlak); }
        .hesap-not { font-size: .9rem; margin: var(--bosluk-1) 0; overflow-wrap: anywhere; }
        .hesap-not.hata { color: var(--vurgu-parlak); }
        .hesap-eylem-satiri { display: flex; flex-wrap: wrap; gap: var(--bosluk-1); align-items: center; }
        .btn-ikincil.tehlike { border-color: var(--vurgu-parlak); color: var(--vurgu-parlak); }
        .avatar-satiri { display: flex; align-items: center; gap: var(--bosluk-2); flex-wrap: wrap; }
        .avatar-satiri .profil-avatar { width: 64px; height: 64px; font-size: 1.6rem; }
        .duyuru-bandi { display: flex; align-items: center; justify-content: center; gap: var(--bosluk-2); padding: 10px var(--bosluk-2); border-bottom: 1px solid var(--border-renk); font-size: .9rem; text-align: center; overflow-wrap: anywhere; }
        .duyuru-bandi button { background: none; border: 0; color: var(--text-ikincil); font: inherit; font-size: .85rem; cursor: pointer; min-height: 44px; }
        @media (hover: hover) { .duyuru-bandi button:hover { color: var(--vurgu-parlak); } }
        .bakim-ekrani { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--bosluk-2); padding: var(--bosluk-3); text-align: center; }
        .bakim-ekrani h1 { font-family: var(--font-baslik); font-weight: 500; font-size: var(--yazi-h1); }
        .bakim-ekrani p { color: var(--text-ikincil); max-width: 50ch; }

        /* --- LİDERLİK TABLOSU / PUANIM --- */
        .lider-sayfa { max-width: 820px; padding-top: var(--bosluk-4); }
        .lider-baslik h1 { font-family: var(--font-baslik); font-weight: 500; font-size: var(--yazi-h1); line-height: 1.15; overflow-wrap: anywhere; }
        .lider-baslik p { margin-top: var(--bosluk-1); max-width: 56ch; color: var(--text-ikincil); }
        .lider-sekmeler { display: flex; flex-wrap: wrap; gap: var(--bosluk-1); margin: var(--bosluk-3) 0 var(--bosluk-1); }
        .lider-sekme {
            min-height: 44px; padding: 0 var(--bosluk-2); background: transparent; color: var(--text-ikincil);
            border: 1px solid var(--border-belirgin); border-radius: 2px; font: inherit; font-size: .9rem; cursor: pointer;
            transition: color .15s ease, border-color .15s ease;
        }
        .lider-sekme[aria-selected="true"] { color: var(--text-ana); border-color: var(--vurgu-parlak); box-shadow: inset 0 -2px 0 var(--vurgu-parlak); }
        @media (hover: hover) { .lider-sekme:hover { color: var(--text-ana); border-color: var(--vurgu-parlak); } }
        .lider-guncelleme { margin: var(--bosluk-1) 0 var(--bosluk-2); font-size: .85rem; color: var(--text-ikincil); }
        #lider-panel { min-height: 120px; padding-top: var(--bosluk-1); }
        .lider-iskelet { display: flex; flex-direction: column; gap: var(--bosluk-1); }
        .lider-iskelet .iskelet-blok { height: 64px; }

        .lider-liste { list-style: none; border-top: 1px solid var(--border-renk); }
        .lider-satir {
            display: grid; grid-template-columns: 40px 40px minmax(0, 1fr) auto; align-items: center; gap: 0 12px;
            min-height: 64px; padding: 8px 12px; border-bottom: 1px solid var(--border-renk); border-left: 3px solid transparent;
        }
        .lider-satir.ust { background: var(--bg-kart); border-left-color: var(--vurgu-parlak); }
        .lider-satir.t1 { box-shadow: inset 3px 0 0 var(--vurgu-parlak); min-height: 76px; }
        .lider-satir.ben { background: var(--bg-yuzey, var(--bg-kart)); outline: 1px solid var(--vurgu-parlak); outline-offset: -1px; }
        .lider-sira { font-family: var(--font-baslik); font-size: 1.1rem; text-align: center; color: var(--text-ikincil); font-variant-numeric: tabular-nums; }
        .lider-satir.ust .lider-sira {
            display: inline-flex; width: 36px; height: 36px; align-items: center; justify-content: center; justify-self: center;
            background: var(--vurgu-rengi); color: #fff; border-radius: 2px; font-weight: 600;
        }
        .lider-avatar {
            position: relative; width: 40px; height: 40px; border-radius: 2px; overflow: hidden; display: inline-flex; align-items: center; justify-content: center;
            background: var(--bg-yuzey, var(--bg-kart)); border: 1px solid var(--border-renk); color: var(--text-ikincil); font-weight: 600; font-size: 1rem;
        }
        .lider-avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; background: var(--bg-kart); }
        .lider-kimlik { min-width: 0; display: flex; flex-direction: column; }
        .lider-ad { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .lider-sen { font-style: normal; font-weight: 400; color: var(--text-ikincil); }
        .lider-rutbe { display: block; font-size: .85rem; color: var(--text-ikincil); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .lider-puan { display: flex; flex-direction: column; align-items: flex-end; text-align: right; line-height: 1.2; }
        .lider-puan strong { font-size: 1.05rem; font-weight: 600; font-variant-numeric: tabular-nums; }
        .lider-puan small { font-size: .75rem; color: var(--text-ikincil); }

        .lider-ben, .lider-cagri {
            margin-top: var(--bosluk-3); padding: var(--bosluk-2); border: 1px solid var(--border-belirgin); border-left: 3px solid var(--vurgu-parlak);
            border-radius: 2px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px var(--bosluk-2);
        }
        .lider-ben strong { flex: 1 1 100%; font-weight: 600; }
        .lider-ben span { color: var(--text-ikincil); font-size: .9rem; overflow-wrap: anywhere; }
        .lider-cagri { justify-content: space-between; color: var(--text-ikincil); }

        .lider-kurallar { margin-top: var(--bosluk-3); border: 1px solid var(--border-renk); border-radius: 2px; }
        .lider-kurallar summary { min-height: 44px; display: flex; align-items: center; padding: 0 var(--bosluk-2); font-weight: 500; cursor: pointer; }
        .lider-kurallar summary:focus-visible { outline: 1px solid var(--vurgu-parlak); outline-offset: -3px; }
        .lider-kurallar[open] summary { border-bottom: 1px solid var(--border-renk); }
        .lider-kurallar-ic { padding: 0 var(--bosluk-2) var(--bosluk-2); }
        .kural-liste { list-style: none; }
        .kural-liste li { display: flex; justify-content: space-between; align-items: baseline; gap: var(--bosluk-2); padding: 12px 0; border-bottom: 1px solid var(--border-renk); }
        .kural-ad { min-width: 0; overflow-wrap: anywhere; }
        .kural-ad small { display: block; margin-top: 2px; font-size: .85rem; color: var(--text-ikincil); }
        .kural-puan { flex-shrink: 0; font-weight: 600; color: var(--vurgu-parlak); font-variant-numeric: tabular-nums; }
        .kural-not { margin-top: var(--bosluk-2); font-size: .9rem; color: var(--text-ikincil); }

        .puanim-ozet { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--bosluk-2); margin-bottom: var(--bosluk-2); }
        .puanim-ozet dt { font-size: .85rem; color: var(--text-ikincil); }
        .puanim-ozet dd { font-family: var(--font-baslik); font-weight: 500; font-size: 1.5rem; line-height: 1.2; overflow-wrap: anywhere; }
        .ilerleme { height: 8px; background: var(--bg-yuzey, var(--bg-kart)); border: 1px solid var(--border-renk); border-radius: 2px; overflow: hidden; }
        .ilerleme > i { display: block; height: 100%; background: var(--vurgu-parlak); }
        .puanim-kalan { margin-top: var(--bosluk-1); }
        .puanim-alt { margin: var(--bosluk-3) 0 var(--bosluk-1); font-size: 1rem; font-weight: 500; }
        .puanim-gecmis { list-style: none; border-top: 1px solid var(--border-renk); }
        .puanim-gecmis li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px var(--bosluk-2); padding: 12px 0; border-bottom: 1px solid var(--border-renk); }
        .pg-aciklama { overflow-wrap: anywhere; }
        .pg-puan { grid-column: 2; grid-row: 1 / 3; align-self: center; font-weight: 600; font-variant-numeric: tabular-nums; }
        .pg-tarih { font-size: .85rem; color: var(--text-ikincil); }
        .puanim-lider { margin-top: var(--bosluk-2); display: inline-flex; align-items: center; }
        .hesap-not a { text-decoration: underline; text-underline-offset: 3px; }
        .puanim .lider-kurallar { margin-top: var(--bosluk-3); }

        @media (max-width: 480px) {
            .lider-sayfa { padding-top: var(--bosluk-3); }
            .lider-sekmeler { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
            .lider-sekme { padding: 0 4px; font-size: .875rem; }
            .lider-satir { grid-template-columns: 32px 36px minmax(0, 1fr) auto; gap: 0 8px; padding: 8px 8px; }
            .lider-satir.ust .lider-sira { width: 32px; height: 32px; }
            .lider-avatar { width: 36px; height: 36px; }
            .lider-rutbe { font-size: .8125rem; }
            .lider-cagri .btn-ana { flex: 1 1 100%; }
            .puanim-ozet { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .puanim-ozet dd { font-size: 1.3rem; }
        }

        /* --- HOŞ DOKUNUŞLAR --- */
        ::selection { background: var(--vurgu-rengi); color: #fff; }
        html { scrollbar-color: var(--kaydirma, #4a1014) var(--bg-ana); scrollbar-width: thin; }
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-ana); }
        ::-webkit-scrollbar-thumb { background: var(--kaydirma, #4a1014); border-radius: 5px; border: 2px solid var(--bg-ana); }
        @media (hover: hover) { ::-webkit-scrollbar-thumb:hover { background: var(--vurgu-rengi); } }

        /* --- MOBİL İYİLEŞTİRMELER (dokunmatik, klavye, safe-area) --- */
        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; -webkit-tap-highlight-color: rgba(224, 52, 60, .22); scroll-padding-top: 12px; }
        a, button, select, summary, label, [role="button"], [role="menuitem"] { touch-action: manipulation; }
        .manga-baslik { overflow-wrap: anywhere; padding-bottom: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        @media (max-width: 768px) {
            input, select, textarea { font-size: 16px; scroll-margin-bottom: 140px; }
            .site-logo { min-height: 44px; }
            .kategori-btn { min-width: 44px; padding-left: 6px; padding-right: 6px; }
            .siralama { min-height: 44px; font-size: 16px; max-width: 100%; }
            .geri-link { min-height: 44px; font-size: .95rem; }
            .hero-japonca, .hero-yazar { font-size: .875rem; }
            .detay-bilgi dt, dl dt { font-size: .875rem; }
            .alt-gezinme a { font-size: .75rem; }
            .kart-rozet, .rozet-mini { font-size: .75rem; }
            .site-header .header-ic { padding-left: max(var(--bosluk-2), env(safe-area-inset-left, 0px)); padding-right: max(var(--bosluk-2), env(safe-area-inset-right, 0px)); }
            .alt-gezinme { padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
        }
        @media (pointer: coarse) {
            input, select, textarea, .siralama, .yorum-alan, .form-satir input, .arama-kapsayici input { font-size: 16px; }
            .site-logo, .menu-link, .profil-chip, .geri-link, .kategori-btn, .siralama, .btn-ana, .btn-ikincil, .btn-ikinci, .link-btn, .sifirla-btn { min-height: 44px; }
            .kategori-btn { min-width: 44px; }
            .menu-link { display: inline-flex; align-items: center; }
        }
        @media (max-height: 480px) and (orientation: landscape) {
            .alt-gezinme a { min-height: 44px; flex-direction: row; gap: 8px; }
            body { padding-bottom: calc(44px + env(safe-area-inset-bottom, 0px)); }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; } }
    </style>
</head>
<body class="sayfa-index">
    <div id="root"></div>

    <script src="js/config.js"></script>
    <script src="js/liderlik.js"></script>
    <script src="js/puan.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
    <script src="js/adstili.js"></script>
    <script src="js/yorum.js"></script>
    <script src="js/sohbet.js"></script>
    <script type="text/babel">
        const VARSAYILAN_RENK = '#8e0e15';
        const API_URL = (window.KAGE95_API_URL || '').replace(/\/$/, '');
        const SAYFA_BOYUTU = 12;
        const OKUNAN_ANAHTAR = 'kage95_okunan';
        const TOKEN_ANAHTARLARI = ['kage95_token', 'token', 'jwt'];

        const tokenAl = () => {
            try {
                for (const k of TOKEN_ANAHTARLARI) {
                    const t = localStorage.getItem(k) || sessionStorage.getItem(k);
                    if (t) return t;
                }
            } catch (e) {}
            return null;
        };

        const okunanlariAl = (mangaId) => {
            try {
                const tum = JSON.parse(localStorage.getItem(OKUNAN_ANAHTAR) || '{}');
                return new Set((tum[mangaId] || []).map(String));
            } catch (e) { return new Set(); }
        };

        const okunduIsaretle = (mangaId, bolumId) => {
            try {
                const tum = JSON.parse(localStorage.getItem(OKUNAN_ANAHTAR) || '{}');
                const liste = new Set((tum[mangaId] || []).map(String));
                liste.delete(String(bolumId)); liste.add(String(bolumId));
                tum[mangaId] = Array.from(liste);
                localStorage.setItem(OKUNAN_ANAHTAR, JSON.stringify(tum));
            } catch (e) {}
        };

        // Kutuphane okuma durumu: sunucuda alan yok, cihazda saklanir. Secilmediyse okunan bolumden turetilir.
        const KUTUPHANE_DURUM_ANAHTAR = 'kage95_kutuphane_durum';
        const KUTUPHANE_DURUMLARI = [['okuyorum', 'Okuyorum'], ['okunacak', 'Okunacak'], ['bitirdim', 'Bitirdim']];
        const kutuphaneDurumuAl = (mangaId) => {
            try {
                const d = JSON.parse(localStorage.getItem(KUTUPHANE_DURUM_ANAHTAR) || '{}')[mangaId];
                if (KUTUPHANE_DURUMLARI.some(x => x[0] === d)) return d;
            } catch (e) {}
            return okunanlariAl(mangaId).size > 0 ? 'okuyorum' : 'okunacak';
        };
        const kutuphaneDurumuYaz = (mangaId, durum) => {
            try {
                const tum = JSON.parse(localStorage.getItem(KUTUPHANE_DURUM_ANAHTAR) || '{}');
                tum[mangaId] = durum;
                localStorage.setItem(KUTUPHANE_DURUM_ANAHTAR, JSON.stringify(tum));
            } catch (e) {}
        };

        const YER_TUTUCU = "data:image/svg+xml;utf8," + encodeURIComponent(
            "<svg xmlns='http://www.w3.org/2000/svg' width='200' height='300' viewBox='0 0 200 300'><rect width='200' height='300' fill='#1a1515'/><text x='100' y='160' font-size='22' text-anchor='middle' fill='#6b625c' font-family='sans-serif'>Kapak yok</text></svg>"
        );
        const gorselHata = (e) => {
            if (e.target.dataset.hata) return;
            e.target.dataset.hata = '1';
            e.target.src = YER_TUTUCU;
            if (e.target.parentNode && e.target.parentNode.classList) e.target.parentNode.classList.add('kapak-yok');
        };

        // Yalnızca 'pop' temasında kullanılan yardımcılar (diğer temalarda hiçbir bölüm render edilmez).
        const usePopTema = () => {
            const [pop, setPop] = React.useState(() => !!window.Kage95Tema && window.Kage95Tema.al() === 'pop');
            React.useEffect(() => {
                const d = (e) => setPop(e.detail === 'pop');
                window.addEventListener('kage95-tema', d);
                return () => window.removeEventListener('kage95-tema', d);
            }, []);
            return pop;
        };
        const JA_SOZLUK = {
            aksiyon: 'アクション', macera: '冒険', romantizm: '恋愛', romantik: '恋愛', fantastik: 'ファンタジー',
            korku: 'ホラー', gerilim: 'スリラー', gizem: 'ミステリー', dram: 'ドラマ', shounen: '少年', spor: 'スポーツ'
        };
        const japoncaKarsilik = (k) => JA_SOZLUK[String(k).toLocaleLowerCase('tr')] || '';
        const bolumeKaydir = (id) => {
            const el = document.getElementById(id);
            if (!el) return;
            const azalt = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            el.scrollIntoView({ behavior: azalt ? 'auto' : 'smooth', block: 'start' });
        };

        const DURUM_ADLARI = { DevamEdiyor: 'Devam ediyor', Tamamlandi: 'Tamamlandı', Ara: 'Ara verildi' };
        const durumMetni = (d) => DURUM_ADLARI[d] || d || 'Bilinmiyor';
        const bolumNoYaz = (n) => String(Number(n));
        const tarihYaz = (t) => {
            const d = new Date(t);
            return isNaN(d) ? '' : d.toLocaleDateString('tr-TR');
        };

        const rotaOku = () => {
            const h = window.location.hash || '';
            const m = h.match(/^#\/manga\/(\d+)/);
            if (m) return { sayfa: 'manga', id: parseInt(m[1], 10) };
            const ku = h.match(/^#\/kullanici\/([^/?#]+)/);
            if (ku) {
                try { return { sayfa: 'kullanici', ad: decodeURIComponent(ku[1]) }; }
                catch (e) { return { sayfa: 'kullanici', ad: ku[1] }; }
            }
            if (/^#\/kutuphane/.test(h)) return { sayfa: 'kutuphane' };
            if (/^#\/profil/.test(h)) return { sayfa: 'profil' };
            if (/^#\/liderlik/.test(h)) return { sayfa: 'liderlik' };
            if (/^#\/sohbet/.test(h)) return { sayfa: 'sohbet' };
            return { sayfa: 'ana' };
        };

        // EklenmeTarihi son 7 gün içindeyse "Yeni" (zaman dilimi yoksa UTC varsay)
        const yeniMi = (t) => {
            if (!t) return false;
            const s = /([zZ]|[+-]\d\d:?\d\d)$/.test(String(t)) ? String(t) : `${t}Z`;
            const d = new Date(s);
            if (isNaN(d)) return false;
            const fark = Date.now() - d.getTime();
            return fark <= 7 * 24 * 3600 * 1000;
        };

        // Yönetim paneli bağlantısı yalnızca site sahibi ya da en az bir izni olan yöneticide görünür.
        const panelYetkisiVar = (k) => !!k && (k.rol === 'Owner' || (k.rol === 'Admin' && Array.isArray(k.yetkiler) && k.yetkiler.length > 0));
        const rolEtiketi = (k) => k.rol === 'Owner' ? 'Site sahibi' : (k.rol === 'Admin' ? 'Yönetici' : 'Okur');

        const kullaniciAl = () => {
            try {
                if (!tokenAl()) return null;
                const k = JSON.parse(localStorage.getItem('kage95_user') || 'null');
                return k && k.kullaniciAdi ? k : null;
            } catch (e) { return null; }
        };

        const cikisYap = () => {
            try {
                localStorage.removeItem('kage95_token');
                localStorage.removeItem('kage95_user');
            } catch (e) {}
            window.location.hash = '#/';
            window.location.reload();
        };

        /* ------------------------- ORTAK BİLEŞENLER ------------------------- */
        const IKONLAR = {
            hata: <><path d="M12 3 2.5 20h19L12 3z" /><path d="M12 10v5" /><circle cx="12" cy="17.6" r=".6" fill="currentColor" /></>,
            bos: <><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5v-13z" /><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5v-13z" /></>,
            kilit: <><rect x="5" y="11" width="14" height="9" rx="1.5" /><path d="M8 11V8a4 4 0 0 1 8 0v3" /></>,
            ara: <><circle cx="11" cy="11" r="6.5" /><path d="m20 20-4.2-4.2" /></>,
            ev: <><path d="M3 11.5 12 4l9 7.5" /><path d="M5.5 10v10h13V10" /></>,
            kitap: <><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z" /><path d="M5 17a3 3 0 0 1 3-3h11" /></>,
            kisi: <><circle cx="12" cy="8" r="4" /><path d="M4 20c1-4 4-6 8-6s7 2 8 6" /></>,
            liderlik: <><path d="M4 20v-7h4.5v7" /><path d="M9.75 20V5h4.5v15" /><path d="M15.5 20v-10H20v10" /><path d="M3 20h18" /></>,
            duyuru: <><path d="M4 10v4h3l7 4V6L7 10H4z" /><path d="M17.5 9.5a3.5 3.5 0 0 1 0 5" /></>,
            sohbet: <><path d="M4 5h16v11H9.5L5 20v-4H4V5z" /><path d="M8 9.5h8M8 12.5h5" /></>,
            zil: <><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.73 21a2 2 0 0 1-3.46 0" /></>
        };
        const Ikon = ({ ad, sinif, boyut }) => (
            <svg className={sinif} width={boyut} height={boyut} viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" focusable="false">
                {IKONLAR[ad]}
            </svg>
        );

        const DurumKutu = ({ ikon, baslik, metin, rol, children }) => (
            <div className="durum-kutu" role={rol || 'status'}>
                <Ikon ad={ikon} sinif="durum-ikon" />
                <h3>{baslik}</h3>
                {metin && <p>{metin}</p>}
                {children && <div className="durum-eylemler">{children}</div>}
            </div>
        );

        const IskeletGrid = ({ adet = 8 }) => (
            <div className="manga-grid" role="status" aria-label="Yükleniyor" aria-busy="true">
                {Array.from({ length: adet }).map((_, i) => (
                    <div key={i} aria-hidden="true">
                        <div className="iskelet-blok iskelet-kapak"></div>
                        <div className="iskelet-blok iskelet-satir ilk"></div>
                        <div className="iskelet-blok iskelet-satir kisa"></div>
                    </div>
                ))}
            </div>
        );

        const yorumTarihYaz = (t) => {
            if (!t) return '';
            const d = new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(t) ? t : t + 'Z');
            return isNaN(d) ? '' : d.toLocaleString('tr-TR', { dateStyle: 'medium', timeStyle: 'short' });
        };

        // Bağımsız yıldız bileşeni (js/puan.js) için ince React sarmalayıcı.
        const PuanKutu = ({ url, etiket }) => {
            const ref = React.useRef(null);
            React.useEffect(() => {
                if (!ref.current || !window.Kage95Puan) return;
                const h = window.Kage95Puan.baslat(ref.current, { url, etiket, token: tokenAl });
                return () => h.yoksay();
            }, [url]);
            return <div ref={ref}></div>;
        };

        // Yorumlar js/yorum.js ortak aracıyla çizilir (düzenle/sil/yanıtla/beğen/şikayet, spoiler, sıralama, sayfalama).
        const MangaYorumlari = ({ mangaId }) => (
            <window.Kage95Yorum.Yorumlar tur="manga" id={mangaId} api={API_URL} tokenAl={tokenAl} sinir={500}
                placeholder="Bu seri hakkında ne düşünüyorsun? (Spoiler uyarısı yapmayı unutma)" />
        );

        const MangaKart = ({ m, yeniGoster = true }) => {
            const yeni = yeniGoster && yeniMi(m.eklenmeTarihi);
            const tamam = m.durum === 'Tamamlandi';
            const ilkKategori = m.kategoriler && m.kategoriler[0] ? m.kategoriler[0] : '';
            const kartPuan = typeof m.ortalamaPuan === 'number' ? m.ortalamaPuan : (typeof m.puan === 'number' && m.puan > 0 && m.puan <= 5 ? m.puan : null);
            return (
                <a className="manga-kart" href={`#/manga/${m.id}`}
                   aria-label={`${m.mangaAdi}, ${m.bolumSayisi || 0} bölüm${yeni ? ', yeni' : ''}${tamam ? ', tamamlandı' : ''}`}>
                    <div className={`kart-kapak desen-${(m.id || 0) % 5} ${m.kapakResmiURL ? '' : 'kapak-yok'}`}>
                        <img src={m.kapakResmiURL || YER_TUTUCU} alt={`${m.mangaAdi} kapak görseli`} loading="lazy" decoding="async" onError={gorselHata} />
                        {yeni && (
                            <div className="kart-rozetler">
                                <span className="rozet-mini rozet-yeni">Yeni</span>
                            </div>
                        )}
                    </div>
                    <h3 className="manga-baslik">{m.mangaAdi}</h3>
                    <div className="manga-meta">
                        {m.bolumSayisi || 0} Bölüm{ilkKategori ? ` · ${ilkKategori}` : ''}
                        {kartPuan != null && (
                            <span className="manga-puan" aria-label={`Puan ${kartPuan.toFixed(1)}`}>
                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2 6.3 20.3l1.2-6.4L2.8 9.5l6.4-.8z" /></svg>
                                {kartPuan.toFixed(1).replace('.', ',')}
                            </span>
                        )}
                    </div>
                </a>
            );
        };

        /* ------------------------- KÜTÜPHANE ------------------------- */
        const Kutuphane = () => {
            const [giris] = React.useState(() => !!tokenAl());
            const [liste, setListe] = React.useState([]);
            const [yukleniyor, setYukleniyor] = React.useState(giris);
            const [hata, setHata] = React.useState(null);
            const [sayac, setSayac] = React.useState(0);
            const [durumSekme, setDurumSekme] = React.useState('tumu');

            React.useEffect(() => {
                if (!giris) return;
                let iptal = false;
                setYukleniyor(true); setHata(null);
                fetch(`${API_URL}/user/library`, { headers: { Authorization: `Bearer ${tokenAl()}` } })
                    .then(r => {
                        if (r.status === 401) throw new Error('401');
                        if (!r.ok) throw new Error('HTTP');
                        return r.json();
                    })
                    .then(v => { if (!iptal) setListe(Array.isArray(v) ? v : []); })
                    .catch(e => { if (!iptal) setHata(e.message === '401' ? 'OTURUM' : 'Kütüphane yüklenemedi. Sunucu çalışmıyor olabilir.'); })
                    .finally(() => { if (!iptal) setYukleniyor(false); });
                return () => { iptal = true; };
            }, [giris, sayac]);

            const girisGerekli = !giris || hata === 'OTURUM';
            const gorunen = durumSekme === 'tumu' ? liste : liste.filter(m => kutuphaneDurumuAl(m.id) === durumSekme);
            const sekmeSayisi = (k) => k === 'tumu' ? liste.length : liste.filter(m => kutuphaneDurumuAl(m.id) === k).length;

            return (
                <div className="ana-icerik detay">
                    <div className="bolum-baslik-satir">
                        <h2>Kütüphane</h2>
                        {giris && !girisGerekli && !yukleniyor && !hata && <span className="sonuc-sayisi">{liste.length} seri</span>}
                    </div>
                    {giris && !girisGerekli && !yukleniyor && !hata && liste.length > 0 && (
                        <div className="kutuphane-sekmeler" role="group" aria-label="Okuma durumu">
                            {[['tumu', 'Tümü'], ...KUTUPHANE_DURUMLARI].map(([k, ad]) => (
                                <button key={k} type="button" className={`kategori-btn ${durumSekme === k ? 'aktif' : ''}`} aria-pressed={durumSekme === k} onClick={() => setDurumSekme(k)}>{ad} ({sekmeSayisi(k)})</button>
                            ))}
                        </div>
                    )}
                    {girisGerekli ? (
                        <DurumKutu ikon="kilit" baslik="Kütüphaneni görmek için giriş yap"
                            metin={hata === 'OTURUM' ? 'Oturumun sona ermiş olabilir. Yeniden giriş yaparak kaldığın yerden devam et.' : 'Kaydettiğin seriler hesabına bağlı olarak burada listelenir.'}>
                            <a className="btn-ikincil" href="login.html">Giriş yap</a>
                            <a className="btn-ikincil" href="login.html?kayit=1">Kayıt ol</a>
                        </DurumKutu>
                    ) : yukleniyor ? (
                        <IskeletGrid adet={6} />
                    ) : hata ? (
                        <DurumKutu ikon="hata" rol="alert" baslik="Kütüphane açılamadı" metin={hata}>
                            <button className="btn-ikincil" onClick={() => setSayac(sayac + 1)}>Tekrar dene</button>
                            <a className="btn-ikincil" href="#/">Ana sayfaya dön</a>
                        </DurumKutu>
                    ) : liste.length === 0 ? (
                        <DurumKutu ikon="bos" baslik="Kütüphanen henüz boş" metin="Bir serinin sayfasında “Kütüphaneye ekle” diyerek burada takip edebilirsin.">
                            <a className="btn-ikincil" href="#/">Serilere göz at</a>
                        </DurumKutu>
                    ) : (
                        <div className="manga-grid">
                            {gorunen.length === 0 ? <p className="bilgi-satir" role="status">Bu durumda seri yok.</p> : gorunen.map(m => <MangaKart key={m.id} m={m} yeniGoster={false} />)}
                        </div>
                    )}
                </div>
            );
        };

        /* ------------------------- PROFİL (alt sayfa) ------------------------- */
        /* ------------------------- PUAN / LİDERLİK ------------------------- */
        const RUTBE_ESIKLERI = [0, 100, 500, 1500, 5000];
        const sayiYaz = (n) => Number(n || 0).toLocaleString('tr-TR');
        // Mevcut rütbe eşiğinden bir sonrakine kadar yüzde (sonraki rütbe yoksa dolu).
        const ilerlemeYuzdesi = (toplam, kalan, sonraki) => {
            if (!sonraki) return 100;
            const ust = Number(toplam || 0) + Number(kalan || 0);
            const alt = RUTBE_ESIKLERI.filter(e => e <= toplam && e < ust).pop() || 0;
            if (ust <= alt) return 100;
            return Math.max(0, Math.min(100, Math.round(((toplam - alt) / (ust - alt)) * 100)));
        };
        const puanApiGet = async (yol, tokenli) => {
            const t = tokenli ? tokenAl() : null;
            const basliklar = t ? { Authorization: `Bearer ${t}` } : {};
            let r = await fetch(API_URL + yol, { headers: basliklar });
            // Süresi dolmuş token anonim uçta bile 401 döndürebilir: tokensiz bir kez daha dene.
            if (r.status === 401 && t && tokenli === 'istege-bagli') r = await fetch(API_URL + yol);
            return r;
        };

        const IlerlemeCubugu = ({ toplam, kalan, sonraki }) => {
            const yuzde = ilerlemeYuzdesi(toplam, kalan, sonraki);
            return (
                <div className="ilerleme" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow={yuzde}
                     aria-label={sonraki ? `${sonraki} rütbesine ilerleme` : 'En yüksek rütbe'}>
                    <i style={{ width: `${yuzde}%` }}></i>
                </div>
            );
        };

        // "Nasıl puan kazanılır?" açılır kutusu: API'nin kural listesi yoksa yedek metin kullanılır.
        const KurallarKutusu = ({ kurallar, tavan }) => {
            const L = window.Kage95Liderlik;
            const liste = Array.isArray(kurallar) && kurallar.length ? kurallar : (L ? L.yedekKurallar : []);
            return (
                <details className="lider-kurallar">
                    <summary>Nasıl puan kazanılır?</summary>
                    <div className="lider-kurallar-ic">
                        <ul className="kural-liste">
                            {liste.map((k, i) => (
                                <li key={k.eylem || i}>
                                    <span className="kural-ad">{k.ad}{k.kural ? <small>{k.kural}</small> : null}</span>
                                    <strong className="kural-puan">+{k.puan}</strong>
                                </li>
                            ))}
                        </ul>
                        <p className="kural-not">Günlük genel üst sınır {tavan || 250} puandır.</p>
                    </div>
                </details>
            );
        };

        const Avatarcik = ({ ad, resim }) => {
            const [bozuk, setBozuk] = React.useState(false);
            return (
                <span className="lider-avatar" aria-hidden="true">
                    {String(ad || '?').charAt(0).toUpperCase()}
                    {resim && !bozuk && <img src={resim} alt="" loading="lazy" onError={() => setBozuk(true)} />}
                </span>
            );
        };

        const DONEMLER = [{ id: 'hafta', ad: 'Bu hafta' }, { id: 'ay', ad: 'Bu ay' }, { id: 'tum', ad: 'Tüm zamanlar' }];

        /* ------------------------- SOSYAL BAĞLANTILAR ------------------------- */
        const SOSYAL = window.KAGE95_SOSYAL || {};
        const DISCORD_YOLU = 'M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.74 19.74 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .078-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .079.009c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z';
        const SosyalBaglantilar = ({ sinif }) => {
            const liste = [
                { ad: 'Discord', url: SOSYAL.discord, ikon: <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d={DISCORD_YOLU} /></svg> },
                { ad: 'Instagram', url: SOSYAL.instagram, ikon: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" focusable="false"><rect x="3.5" y="3.5" width="17" height="17" rx="5" /><circle cx="12" cy="12" r="4" /><circle cx="17.2" cy="6.8" r=".8" fill="currentColor" /></svg> }
            ].filter(x => x.url);
            if (!liste.length) return null;
            return (
                <div className={`sosyal ${sinif || ''}`}>

                    ))}
                </div>

        };

        /* ------------------------- DUYURU ŞERİDİ ------------------------- */
        const DUYURU_ETIKETLERI = { bilgi: 'Bilgi', etkinlik: 'Etkinlik', yeni: 'Yeni', uyari: 'Uyarı' };
        const DuyuruSeridi = () => {
            const [liste, setListe] = React.useState([]);
            React.useEffect(() => {
                let iptal = false;
                fetch(`${API_URL}/duyurular`)
                    .then(r => (r.ok ? r.json() : []))
                    .then(v => { if (!iptal && Array.isArray(v)) setListe(v); })
                    .catch(() => {});
                return () => { iptal = true; };
            }, []);
            if (!liste.length) return null;
            const oge = (d, kopya) => {
                const icerik = (
                    <>
                        <span className={`duyuru-etiket duyuru-${DUYURU_ETIKETLERI[d.etiket] ? d.etiket : 'bilgi'}`}>{DUYURU_ETIKETLERI[d.etiket] || 'Bilgi'}</span>
                        <span className="duyuru-baslik">{d.baslik}</span>
                    </>
                );
                const anahtar = `${kopya}-${d.id}`;
                return d.baglanti
                    ? <a key={anahtar} className="duyuru-oge" href={d.baglanti} tabIndex={kopya ? -1 : undefined} {...(/^https?:/i.test(d.baglanti) ? { target: '_blank', rel: 'noopener noreferrer' } : {})}>{icerik}</a>
                    : <span key={anahtar} className="duyuru-oge">{icerik}</span>;

            return (
                <section className="duyuru-serit" aria-label="Duyurular">
                    <div className="duyuru-serit-ic">
                        <span className="duyuru-serit-baslik"><Ikon ad="duyuru" boyut={20} />Duyurular</span>
                        <div className="duyuru-kayan">
                            <div className="duyuru-iz">
                                <div className="duyuru-grup">{liste.map(d => oge(d, 0))}</div>
                                <div className="duyuru-grup" aria-hidden="true">{liste.map(d => oge(d, 1))}</div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        /* ------------------------- SOHBET ------------------------- */
        // Sohbet arayüzü js/sohbet.js içinde vanilla JS ile çizilir; React yalnızca bir kapsayıcı sağlar.
        const SohbetKap = ({ mod }) => {
            const ref = React.useRef(null);
            React.useEffect(() => {
                if (!ref.current || !window.Kage95Sohbet || !window.signalR) return undefined;
                const secenek = { apiUrl: API_URL, token: tokenAl, kullanici: kullaniciAl(), girisAdresi: 'login.html', sohbetAdresi: '#/sohbet' };
                const h = mod === 'serit' ? window.Kage95Sohbet.serit(ref.current, secenek) : window.Kage95Sohbet.sayfa(ref.current, secenek);
                return () => h.yoksay();
            }, [mod]);
            const yok = !window.Kage95Sohbet || !window.signalR;
            return (
                <div ref={ref}>
                    {yok && mod !== 'serit' && <DurumKutu ikon="hata" baslik="Sohbet yüklenemedi" metin="Sohbet bileşeni açılamadı. Sayfayı yenileyip tekrar dene." rol="alert" />}
                </div>
            );
        };

        const SohbetSayfasi = () => (
            <div className="ana-icerik" style={{ paddingTop: 'var(--bosluk-4)' }}>
                <SohbetKap mod="sayfa" />
            </div>
        );

        const LiderlikSayfasi = () => {
            const [donem, setDonem] = React.useState('hafta');
            const [durum, setDurum] = React.useState('yukleniyor'); // yukleniyor | hazir | hata
            const [veri, setVeri] = React.useState(null);
            const [dene, setDene] = React.useState(0);
            const [kuralVeri, setKuralVeri] = React.useState(null);
            const girisli = !!kullaniciAl();

            React.useEffect(() => {
                let iptal = false;
                setDurum('yukleniyor');
                puanApiGet(`/liderlik?donem=${donem}&limit=50`, girisli ? 'istege-bagli' : false)
                    .then(r => { if (!r.ok) throw new Error('HTTP'); return r.json(); })
                    .then(v => { if (!iptal) { setVeri(v || {}); setDurum('hazir'); } })
                    .catch(() => { if (!iptal) setDurum('hata'); });
                return () => { iptal = true; };
            }, [donem, dene]);

            // Girişliyse kurallar API'den gelir; olmazsa ya da giriş yoksa yedek metin gösterilir.
            React.useEffect(() => {
                if (!girisli) return;
                let iptal = false;
                puanApiGet('/hesap/puan', true)
                    .then(r => r.ok ? r.json() : null)
                    .then(v => { if (!iptal && v) setKuralVeri(v); })
                    .catch(() => {});
                return () => { iptal = true; };
            }, [girisli]);

            const sekmeTus = (e, i) => {
                let h = null;
                if (e.key === 'ArrowRight') h = (i + 1) % DONEMLER.length;
                else if (e.key === 'ArrowLeft') h = (i + DONEMLER.length - 1) % DONEMLER.length;
                if (h == null) return;
                e.preventDefault();
                setDonem(DONEMLER[h].id);
                const dugmeler = e.currentTarget.parentNode.querySelectorAll('[role="tab"]');
                if (dugmeler[h]) dugmeler[h].focus();
            };

            const liste = durum === 'hazir' && veri && Array.isArray(veri.liste) ? veri.liste : [];
            const ben = durum === 'hazir' && veri ? veri.ben : null;
            const listede = !!ben && liste.some(x => x.sira === ben.sira);
            const donemAd = (DONEMLER.find(d => d.id === donem) || {}).ad;

            return (
                <div className="ana-icerik lider-sayfa">
                    <div className="lider-baslik">
                        <h1>Liderlik tablosu</h1>
                        <p>En çok puan toplayan okurlar. Bölüm oku, yorum yaz, seri puanla; puan kazan ve rütbe atla.</p>
                    </div>

                    <div className="lider-sekmeler" role="tablist" aria-label="Dönem">
                        {DONEMLER.map((d, i) => (
                            <button key={d.id} type="button" role="tab" id={`lider-sekme-${d.id}`} className="lider-sekme"
                                aria-selected={donem === d.id} aria-controls="lider-panel" tabIndex={donem === d.id ? 0 : -1}
                                onClick={() => setDonem(d.id)} onKeyDown={(e) => sekmeTus(e, i)}>{d.ad}</button>
                        ))}
                    </div>

                    <div id="lider-panel" role="tabpanel" aria-labelledby={`lider-sekme-${donem}`}>
                        {durum === 'hazir' && veri && veri.guncelleme && (
                            <p className="lider-guncelleme">Son güncelleme: {yorumTarihYaz(veri.guncelleme)}</p>
                        )}

                        {durum === 'yukleniyor' && (
                            <div className="lider-iskelet" role="status" aria-label="Sıralama yükleniyor" aria-busy="true">
                                {Array.from({ length: 6 }).map((_, i) => <div key={i} className="iskelet-blok" aria-hidden="true"></div>)}
                            </div>
                        )}

                        {durum === 'hata' && (
                            <DurumKutu ikon="hata" rol="alert" baslik="Sıralama yüklenemedi" metin="Sunucuya ulaşılamadı. Biraz sonra tekrar dene.">
                                <button className="btn-ikincil" onClick={() => setDene(dene + 1)}>Tekrar dene</button>
                            </DurumKutu>
                        )}

                        {durum === 'hazir' && liste.length === 0 && (
                            <DurumKutu ikon="bos" baslik="Henüz kimse puan kazanmadı" metin={`${donemAd} için sıralama boş. İlk sırayı sen al: bir bölüm oku ya da yorum yaz.`} />
                        )}

                        {durum === 'hazir' && liste.length > 0 && (
                            <ol className="lider-liste" aria-label={`${donemAd} sıralaması`}>
                                {liste.map((x) => {
                                    const benim = !!ben && x.sira === ben.sira;
                                    return (
                                        <li key={`${x.sira}-${x.kullaniciId}`}
                                            className={`lider-satir ${x.sira <= 3 ? `ust t${x.sira}` : ''} ${benim ? 'ben' : ''}`}
                                            aria-current={benim ? 'true' : undefined}>
                                            <span className="lider-sira"><span className="sr-only">Sıra </span>{x.sira}</span>
                                            <Avatarcik ad={x.kullaniciAdi} resim={x.profilResmiURL} />
                                            <span className="lider-kimlik">
                                                <a href={`#/kullanici/${encodeURIComponent(x.kullaniciAdi || '')}`} className={`lider-ad ${window.Kage95AdStili.sinif(x.adStili)}`} style={window.Kage95AdStili.stil(x.adStili)} title={x.kullaniciAdi}>{x.kullaniciAdi}{window.Kage95AdStili.unvan(x.adStili) && <span className="as-unvan">{window.Kage95AdStili.unvan(x.adStili)}</span>}{benim && <em className="lider-sen"> (sen)</em>}</a>
                                                <span className="lider-rutbe">{x.rutbe}</span>
                                            </span>
                                            <span className="lider-puan"><strong>{sayiYaz(x.puan)}</strong><small>puan</small></span>
                                        </li>
                                    );
                                })}
                            </ol>
                        )}

                        {durum === 'hazir' && girisli && ben && !listede && (
                            <div className="lider-ben" role="status">
                                <strong>Senin sıran: {ben.sira}</strong>
                                <span>{sayiYaz(ben.puan)} puan · {ben.rutbe}</span>
                                <span>
                                    {ben.sonrakiRutbe
                                        ? `${ben.sonrakiRutbe} rütbesine ${sayiYaz(ben.sonrakiRutbeIcinKalan)} puan kaldı.`
                                        : 'En yüksek rütbedesin.'}
                                </span>
                            </div>
                        )}

                        {durum === 'hazir' && girisli && !ben && (
                            <div className="lider-ben" role="status">
                                <strong>Bu dönemde henüz puanın yok</strong>
                                <span>Bir bölümü sonuna kadar oku ya da yorum yaz; sıralamaya girersin.</span>
                            </div>
                        )}

                        {!girisli && durum !== 'yukleniyor' && (
                            <div className="lider-cagri">
                                <span>Sıralamaya girmek için giriş yap.</span>
                                <a className="btn-ana" href="login.html">Giriş yap</a>
                            </div>
                        )}
                    </div>

                    <KurallarKutusu kurallar={kuralVeri && kuralVeri.kurallar} tavan={kuralVeri && kuralVeri.bugun && kuralVeri.bugun.tavan} />
                </div>
            );
        };
