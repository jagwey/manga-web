                            <span className="sonuc-sayisi">{kutuphane.length} seri</span>
                        </div>
                        {kutuphane.length === 0 ? (
                            <p className="bilgi-satir">Bu kullanıcının kütüphanesinde henüz seri yok.</p>
                        ) : (
                            <div className="manga-grid">
                                {kutuphane.map(m => <MangaKart key={m.id} m={m} yeniGoster={false} />)}
                            </div>
                        )}
                    </section>

                    <section aria-label="Son yorumları">
                        <div className="bolum-baslik-satir">
                            <h2>Son yorumları</h2>
                            <span className="sonuc-sayisi">{sonYorumlar.length} yorum</span>
                        </div>
                        {sonYorumlar.length === 0 ? (
                            <p className="bilgi-satir">Bu kullanıcı henüz herkese açık yorum yazmamış.</p>
                        ) : (
                            <ul className="kprof-yorumlar">
                                {sonYorumlar.map(y => (
                                    <li key={`${y.tur}-${y.id}`} className="kprof-yorum">
                                        <div className="kprof-yorum-ust">
                                            <a href={y.baglanti}>{y.hedefBaslik}</a>
                                            <time dateTime={y.tarih}>{yorumTarihYaz(y.tarih)}</time>
                                        </div>
                                        <p className="kprof-yorum-metin">
                                            {window.Kage95Yorum && window.Kage95Yorum.htmlCoz ? window.Kage95Yorum.htmlCoz(y.metin) : y.metin}
                                        </p>
                                    </li>
                                ))}
                            </ul>
                        )}
                    </section>
                </div>
            );
        };

        /* ------------------------- BİLDİRİM MENÜSÜ ------------------------- */
        const BildirimMenusu = () => {
            const [kullanici, setKullanici] = React.useState(kullaniciAl);
            const [acik, setAcik] = React.useState(false);
            const [liste, setListe] = React.useState([]);
            const [okunmamis, setOkunmamis] = React.useState(0);
            const kap = React.useRef(null);

            React.useEffect(() => {
                const f = () => setKullanici(kullaniciAl());
                window.addEventListener('kage95-kullanici', f);
                return () => window.removeEventListener('kage95-kullanici', f);
            }, []);

            const yukle = React.useCallback(() => {
                const t = tokenAl();
                if (!t) return;
                fetch(`${API_URL}/bildirimler?limit=20`, { headers: { Authorization: `Bearer ${t}` } })
                    .then(r => r.ok ? r.json() : null)
                    .then(v => {
                        if (v) {
                            setListe(Array.isArray(v.liste) ? v.liste : []);
                            setOkunmamis(Number(v.okunmamisSayisi || 0));
                        }
                    })
                    .catch(() => {});
            }, []);

            React.useEffect(() => {
                if (!kullanici) { setListe([]); setOkunmamis(0); return undefined; }
                yukle();
                const id = setInterval(yukle, 45000);
                return () => clearInterval(id);
            }, [kullanici, yukle]);

            React.useEffect(() => {
                if (!acik) return undefined;
                const disTik = (e) => { if (kap.current && !kap.current.contains(e.target)) setAcik(false); };
                const tus = (e) => { if (e.key === 'Escape') setAcik(false); };
                document.addEventListener('mousedown', disTik);
                document.addEventListener('keydown', tus);
                return () => {
                    document.removeEventListener('mousedown', disTik);
                    document.removeEventListener('keydown', tus);
                };
            }, [acik]);

            if (!kullanici) return null;

            const tumunuOkunduYap = () => {
                const t = tokenAl();
                if (!t) return;
                fetch(`${API_URL}/bildirimler/okundu`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${t}` },
                    body: JSON.stringify({})
                }).then(() => {
                    setOkunmamis(0);
                    setListe(l => l.map(b => ({ ...b, okundu: true })));
                }).catch(() => {});
            };

            const temizle = () => {
                const t = tokenAl();
                if (!t) return;
                fetch(`${API_URL}/bildirimler`, {
                    method: 'DELETE',
                    headers: { Authorization: `Bearer ${t}` }
                }).then(() => {
                    setOkunmamis(0);
                    setListe([]);
                }).catch(() => {});
            };

            const bildirimTikla = (b) => {
                const t = tokenAl();
                if (t && !b.okundu) {
                    fetch(`${API_URL}/bildirimler/okundu`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${t}` },
                        body: JSON.stringify({ id: b.id })
                    }).catch(() => {});
                    setOkunmamis(n => Math.max(0, n - 1));
                    setListe(l => l.map(x => x.id === b.id ? { ...x, okundu: true } : x));
                }
                setAcik(false);
            };

            return (
                <div className="bildirim-kap" ref={kap}>
                    <button
                        type="button"
                        className="btn-ikon bildirim-btn"
                        onClick={() => { const yeni = !acik; setAcik(yeni); if (yeni) yukle(); }}
                        aria-haspopup="menu"
                        aria-expanded={acik}
                        aria-label={okunmamis > 0 ? `Bildirimler (${okunmamis} okunmamış)` : 'Bildirimler'}
                        title="Bildirimler"
                    >
                        <Ikon ad="zil" boyut={20} />
                        {okunmamis > 0 && <span className="bildirim-rozet" aria-hidden="true">{okunmamis > 99 ? '99+' : okunmamis}</span>}
                    </button>
                    {acik && (
                        <div className="bildirim-panel" role="menu" aria-label="Bildirimler">
                            <div className="bildirim-ust">
                                <strong>Bildirimler</strong>
                                {liste.length > 0 && (
                                    <div className="bildirim-ust-eylemler">
                                        {okunmamis > 0 && <button type="button" className="bildirim-ust-btn" onClick={tumunuOkunduYap}>Okundu işaretle</button>}
                                        <button type="button" className="bildirim-ust-btn" onClick={temizle}>Temizle</button>
                                    </div>
                                )}
                            </div>
                            {liste.length === 0 ? (
                                <p className="bildirim-bos">Henüz bildirimin yok.</p>
                            ) : (
                                <ul className="bildirim-liste">
                                    {liste.map(b => (
                                        <li key={b.id}>
                                            <a
                                                href={b.baglanti || '#/'}
                                                className={`bildirim-oge ${b.okundu ? '' : 'okunmamis'}`}
                                                onClick={() => bildirimTikla(b)}
                                            >
                                                <span>{b.baslik}</span>
                                                <time className="bildirim-tarih" dateTime={b.tarih}>{yorumTarihYaz(b.tarih)}</time>
                                            </a>
                                        </li>
                                    ))}
                                </ul>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        /* ------------------------- KÖK ------------------------- */
        // Üst çubuk menüsü: girişliyse profil rozeti, girişsizse üç çizgi; ikisi de aynı açılır menüyü kullanır.
        const HesapMenusu = ({ onGorunum, kayitAcik = true }) => {
            const [kullanici, setKullanici] = React.useState(kullaniciAl);
            React.useEffect(() => {
                const f = () => setKullanici(kullaniciAl());
                window.addEventListener('kage95-kullanici', f);
                return () => window.removeEventListener('kage95-kullanici', f);
            }, []);
            const [acik, setAcik] = React.useState(false);
            const kap = React.useRef(null);

            React.useEffect(() => {
                if (!acik) return;
                const disTik = (e) => { if (kap.current && !kap.current.contains(e.target)) setAcik(false); };
                const tus = (e) => { if (e.key === 'Escape') setAcik(false); };
                document.addEventListener('mousedown', disTik);
                document.addEventListener('keydown', tus);
                return () => {
                    document.removeEventListener('mousedown', disTik);
                    document.removeEventListener('keydown', tus);
                };
            }, [acik]);

            const resim = kullanici && kullanici.profilResmiURL;
            const gorunum = () => { setAcik(false); onGorunum(); };

            return (
                <div className="hesap-alani" ref={kap}>
                    {!kullanici && (
                        <>
                            <a href="login.html" className="btn-ikincil">Giriş yap</a>
                            {kayitAcik && <a href="login.html?kayit=1" className="btn-ikincil">Kayıt ol</a>}
                        </>
                    )}
                    {kullanici ? (
                        <button
                            className="profil-chip"
                            onClick={() => setAcik(!acik)}
                            aria-haspopup="menu"
                            aria-expanded={acik}
                            aria-label={`Hesap menüsü: ${kullanici.kullaniciAdi}`}
                        >
                            <span className="profil-avatar" aria-hidden="true">
                                {resim ? <img src={resim} alt="" /> : kullanici.kullaniciAdi.charAt(0).toUpperCase()}
                            </span>
                            <span className="profil-ad">{kullanici.kullaniciAdi}</span>
                        </button>
                    ) : (
                        <button
                            className="btn-ikon"
                            onClick={() => setAcik(!acik)}
                            aria-haspopup="menu"
                            aria-expanded={acik}
                            aria-label="Menü"
                        >
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" aria-hidden="true">
                                <path d="M3 5.5h14M3 10h14M3 14.5h14" />
                            </svg>
                        </button>
                    )}
                    {acik && (
                        <div className="profil-menu" role="menu">
                            {kullanici && <a href="#/profil" role="menuitem" onClick={() => setAcik(false)}>Hesabım</a>}
                            {kullanici && <a href="#/kutuphane" role="menuitem" onClick={() => setAcik(false)}>Kütüphanem</a>}
                            <button role="menuitem" onClick={gorunum}>Görünüm ve temalar</button>
                            {panelYetkisiVar(kullanici) && <a href="admin.html" role="menuitem">Yönetim paneli</a>}
                            {kullanici
                                ? <button role="menuitem" className="menu-ayrac" onClick={cikisYap}>Çıkış yap</button>
                                : <a href="login.html" role="menuitem" className="menu-ayrac">Giriş yap</a>}
                            {!kullanici && kayitAcik && <a href="login.html?kayit=1" role="menuitem">Kayıt ol</a>}
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [rota, setRota] = React.useState(rotaOku());
            const [menuAcik, setMenuAcik] = React.useState(false);
            const [aramaMetni, setAramaMetni] = React.useState('');
            const [aramaAcik, setAramaAcik] = React.useState(false);
            const mobilAramaRef = React.useRef(null);
            const girisli = !!kullaniciAl();
            const [yukariGoster, setYukariGoster] = React.useState(false);
            React.useEffect(() => {
                const f = () => setYukariGoster(window.scrollY > 600);
                f();
                window.addEventListener('scroll', f, { passive: true });
                return () => window.removeEventListener('scroll', f);
            }, []);
            // Sayfa başlığı rotaya göre güncellenir (seri adı MangaDetay yüklenince yazılır)
            React.useEffect(() => {
                const BASLIKLAR = { ana: 'Ana Sayfa', kutuphane: 'Kütüphane', profil: 'Hesabım', liderlik: 'Liderlik', sohbet: 'Sohbet' };
                const baslik = rota.sayfa === 'manga' ? 'Seri' : (rota.sayfa === 'kullanici' ? (rota.ad || 'Kullanıcı') : (BASLIKLAR[rota.sayfa] || 'Ana Sayfa'));
                document.title = baslik + ' | Kage 95';
            }, [rota]);
            const pop = usePopTema();

            // Herkese açık site ayarları (kayıt açık mı, duyuru, bakım). Ulaşılamazsa varsayılanlarla devam edilir.
            const [ayarlar, setAyarlar] = React.useState({});
            const [duyuruKapali, setDuyuruKapali] = React.useState(false);
            React.useEffect(() => {
                fetch(API_URL + '/ayarlar').then(r => r.ok ? r.json() : {}).then(v => {
                    setAyarlar(v || {});
                    try { if (v && v.duyuruMetni && sessionStorage.getItem('kage95_duyuru') === v.duyuruMetni) setDuyuruKapali(true); } catch (e) {}
                }).catch(() => {});
            }, []);
            const duyuruyuKapat = () => {
                setDuyuruKapali(true);
                try { sessionStorage.setItem('kage95_duyuru', ayarlar.duyuruMetni || ''); } catch (e) {}
            };

            const aramaDegistir = () => {
                if (rota.sayfa !== 'ana') window.location.hash = '#/';
                setAramaAcik(a => !a);
            };
            React.useEffect(() => {
                if (aramaAcik && mobilAramaRef.current) mobilAramaRef.current.focus();
            }, [aramaAcik]);

            const [temaRengi, setTemaRengi] = React.useState(localStorage.getItem('kage95_v2_temaRengi') || VARSAYILAN_RENK);
            const [bgGorsel, setBgGorsel] = React.useState(localStorage.getItem('kage95_v2_bgGorsel') || null);
            const [bgMod, setBgMod] = React.useState(localStorage.getItem('kage95_v2_bgMod') || 'kapla');

            React.useEffect(() => {
                const dinle = () => { setRota(rotaOku()); window.scrollTo(0, 0); };
                window.addEventListener('hashchange', dinle);
                return () => window.removeEventListener('hashchange', dinle);
            }, []);

            React.useEffect(() => {
                if (temaRengi && temaRengi !== VARSAYILAN_RENK) document.documentElement.style.setProperty('--vurgu-rengi', temaRengi);
                else document.documentElement.style.removeProperty('--vurgu-rengi');
                try {
                    localStorage.setItem('kage95_v2_temaRengi', temaRengi);
                    localStorage.setItem('kage95_v2_bgMod', bgMod);
                    if (bgGorsel) localStorage.setItem('kage95_v2_bgGorsel', bgGorsel);
                    else localStorage.removeItem('kage95_v2_bgGorsel');
                } catch (e) {}
            }, [temaRengi, bgGorsel, bgMod]);

            React.useEffect(() => {
                const tusDinleyici = (e) => { if (e.key === 'Escape' && menuAcik) setMenuAcik(false); };
                window.addEventListener('keydown', tusDinleyici);
                return () => window.removeEventListener('keydown', tusDinleyici);
            }, [menuAcik]);

            const gorselYukle = (e) => {
                const dosya = e.target.files[0];
                if (dosya) {
                    const reader = new FileReader();
                    reader.onloadend = () => setBgGorsel(reader.result);
                    reader.readAsDataURL(dosya);
                }
            };

            const [aktifTema, setAktifTema] = React.useState(() => (window.Kage95Tema ? window.Kage95Tema.al() : 'kage'));
            React.useEffect(() => {
                const d = (e) => setAktifTema(e.detail);
                window.addEventListener('kage95-tema', d);
                return () => window.removeEventListener('kage95-tema', d);
            }, []);
            const temaSec = (id) => {
                if (window.Kage95Tema) window.Kage95Tema.sec(id);
                setTemaRengi(VARSAYILAN_RENK); // özel vurgu rengi temayı bozmasın
            };

            const temayiSifirla = () => {
                if (window.Kage95Tema) window.Kage95Tema.sec('kage');
                setTemaRengi(VARSAYILAN_RENK);
                setBgGorsel(null);
                setBgMod('kapla');
            };

            const arkaPlanStili = {
                backgroundColor: 'var(--bg-ana)',
                backgroundImage: bgGorsel
                    ? `linear-gradient(rgba(14, 12, 12, 0.9), rgba(14, 12, 12, 0.97)), url(${bgGorsel})`
                    : 'none',
                backgroundRepeat: bgMod === 'desen' ? 'repeat' : 'no-repeat',
                backgroundSize: bgMod === 'desen' ? 'auto' : 'cover',
                backgroundPosition: 'center',
                backgroundAttachment: 'fixed',
                minHeight: '100vh'
            };

            if (ayarlar.bakimModu && !panelYetkisiVar(kullaniciAl())) {
                return (
                    <div className="bakim-ekrani" style={arkaPlanStili}>
                        <h1>Bakımdayız</h1>
                        <p>{ayarlar.bakimMesaji || 'Site kısa süreliğine bakımda. Birazdan tekrar dene.'}</p>
                        <a className="btn-ikincil" href="login.html">Yönetici girişi</a>
                    </div>
                );
            }

            return (
                <div style={arkaPlanStili}>
                    <a href="#ana-icerik" className="atla-link" onClick={(e) => { e.preventDefault(); const m = document.getElementById('ana-icerik'); if (m) m.focus(); }}>Ana içeriğe atla</a>
                    {ayarlar.duyuruAcik && ayarlar.duyuruMetni && !duyuruKapali && (
                        <div className="duyuru-bandi" role="status">
                            <span>{ayarlar.duyuruMetni}</span>
                            <button onClick={duyuruyuKapat} aria-label="Duyuruyu kapat">Kapat</button>
                        </div>
                    )}
                    {pop && (
                        <div className="pop-serit">
                            <span>★ Türkçe manga arşivi</span>
                            <span>Her gün yeni bölüm ★</span>
                        </div>
                    )}
                    <header className="site-header" role="banner">
                        <div className="header-ic">
                            <a href="#/" className="site-logo" aria-label="Kage 95 Ana Sayfa">
                                <span className="logo-muhur" aria-hidden="true">影</span>
                                KAGE <span className="logo-95">95</span>
                            </a>

                            <nav className="ana-menu" aria-label="Ana menü">
                                <a className="menu-link" href="#/">Ana Sayfa</a>
                                <a className="menu-link" href="#/kutuphane">Kütüphane</a>
                                <a className="menu-link" href="#/liderlik" aria-current={rota.sayfa === 'liderlik' ? 'page' : undefined}>Liderlik</a>
                                <a className="menu-link" href="#/sohbet" aria-current={rota.sayfa === 'sohbet' ? 'page' : undefined}>Sohbet</a>
                            </nav>

                            <div className="header-sag">
                                <SosyalBaglantilar sinif="sosyal-ust" />
                                {pop && (
                                    <form className="pop-arama" role="search" onSubmit={(e) => { e.preventDefault(); if (rota.sayfa !== 'ana') window.location.hash = '#/'; setTimeout(() => bolumeKaydir('seriler'), 80); }}>
                                        <input type="search" placeholder="Manga ara…" value={aramaMetni}
                                            onChange={(e) => { setAramaMetni(e.target.value); if (rota.sayfa !== 'ana') window.location.hash = '#/'; }}
                                            aria-label="Manga kütüphanesinde ara" />
                                    </form>
                                )}
                                <button
                                    className="btn-ikon arama-ac-btn"
                                    onClick={aramaDegistir}
                                    title="Ara"
                                    aria-label="Aramayı aç veya kapat"
                                    aria-expanded={aramaAcik}
                                    aria-controls="mobilAramaAlani"
                                >
                                    <Ikon ad="ara" boyut={20} />
                                </button>
                                <BildirimMenusu />
                                <HesapMenusu onGorunum={() => setMenuAcik(true)} kayitAcik={ayarlar.kayitAcik !== false} />
                            </div>
                        </div>
                        {aramaAcik && (
                            <div className="mobil-arama" id="mobilAramaAlani">
                                <div className="arama-kapsayici">
                                    <span className="arama-ikon" aria-hidden="true"><Ikon ad="ara" boyut={18} /></span>
                                    <input
                                        ref={mobilAramaRef}
                                        type="search"
                                        placeholder="Manga ara…"
                                        value={aramaMetni}
                                        onChange={(e) => setAramaMetni(e.target.value)}
                                        aria-label="Manga kütüphanesinde ara"
                                    />
                                </div>
                            </div>
                        )}
                    </header>

                    <div
                        className={`arka-plan-karartici ${menuAcik ? 'acik' : ''}`}
                        onClick={() => setMenuAcik(false)}
                        aria-hidden="true"
                    ></div>

                    <aside
                        className={`yan-menu ${menuAcik ? 'acik' : ''}`}
                        role="dialog"
                        aria-modal="true"
                        aria-label="Görünüm ve Tema Ayarları"
                        aria-hidden={!menuAcik}
                    >
                        <div className="yan-menu-header">
                            <h2>Kişiselleştirme</h2>
                            <button className="kapat-btn" onClick={() => setMenuAcik(false)} aria-label="Menüyü Kapat">Kapat</button>
                        </div>

                        <div className="yan-menu-icerik">
                            <div className="ayar-kutu">
                                <div className="ayar-kutu-baslik">Tema</div>
                                <div className="tema-listesi" role="radiogroup" aria-label="Tema seç">
                                    {(window.Kage95Tema ? window.Kage95Tema.liste : []).map(t => (
                                        <button key={t.id} type="button" role="radio" aria-checked={aktifTema === t.id}
                                            className={`tema-kart ${aktifTema === t.id ? 'aktif' : ''}`} onClick={() => temaSec(t.id)}>
                                            <span className="tema-onizleme" style={{ background: t.zemin }}><i style={{ background: t.renk }}></i></span>
                                            <span className="tema-ad">{t.ad}</span>
                                            <span className="tema-not">{t.not}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="ayar-kutu">
                                <div className="ayar-kutu-baslik">Vurgu rengi</div>
                                <div className="ayar-grubu">
                                    <label htmlFor="renkSecici">Buton ve başlık vurgusu</label>
                                    <input id="renkSecici" type="color" value={temaRengi} onChange={(e) => setTemaRengi(e.target.value)} />
                                </div>
                            </div>

                            <div className="ayar-kutu">
                                <div className="ayar-kutu-baslik">Arka plan görseli</div>
                                <div className="ayar-grubu">
                                    <label htmlFor="arkaplanYukle">Cihazınızdan özel görsel seçin</label>
                                    <input id="arkaplanYukle" type="file" accept="image/png, image/jpeg, image/webp" onChange={gorselYukle} />
                                </div>

                                {bgGorsel && (
                                    <div className="ayar-grubu">
                                        <label htmlFor="gorselMod">Yerleşim modu</label>
                                        <select id="gorselMod" value={bgMod} onChange={(e) => setBgMod(e.target.value)}>
                                            <option value="kapla">Ekrana yay</option>
                                            <option value="desen">Tekrarla</option>
                                        </select>
                                    </div>
                                )}
                            </div>

                            <button className="sifirla-btn" onClick={temayiSifirla}>Varsayılan temayı geri yükle</button>
                        </div>
                    </aside>

                    <main role="main" id="ana-icerik" tabIndex={-1}>
                        {rota.sayfa === 'manga' ? <MangaDetay key={rota.id} id={rota.id} />
                            : rota.sayfa === 'kullanici' ? <KullaniciProfilSayfasi key={rota.ad} ad={rota.ad} />
                            : rota.sayfa === 'kutuphane' ? <Kutuphane />
                            : rota.sayfa === 'profil' ? <ProfilSayfasi />
                            : rota.sayfa === 'liderlik' ? <LiderlikSayfasi />
                            : rota.sayfa === 'sohbet' ? <SohbetSayfasi />
                            : <AnaSayfa aramaMetni={aramaMetni} setAramaMetni={setAramaMetni} kayitAcik={ayarlar.kayitAcik !== false} />}
                    </main>

                    <footer className="site-footer">
                        <div className="footer-ic">
                            <span>KAGE 95 · Modern manga arşivi ve kütüphanesi</span>
                            <SosyalBaglantilar sinif="sosyal-alt" />
                            <nav aria-label="Alt menü">
                                <a href="#/">Ana Sayfa</a>
                                {!kullaniciAl() && <a href="login.html">Giriş</a>}
                            </nav>
                        </div>
                    </footer>

                    {yukariGoster && (
                        <button type="button" className="yukari-btn" aria-label="Sayfanın başına çık" onClick={() => window.scrollTo({ top: 0, behavior: (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) ? 'auto' : 'smooth' })}>Yukarı çık</button>
                    )}
                    <nav className="alt-gezinme" aria-label="Mobil gezinme">
                        <a href="#/" className={rota.sayfa === 'ana' || rota.sayfa === 'manga' ? 'aktif' : ''}
                           aria-current={rota.sayfa === 'ana' ? 'page' : undefined}>
                            <Ikon ad="ev" /><span>Ana Sayfa</span>
                        </a>
                        <a href="#/kutuphane" className={rota.sayfa === 'kutuphane' ? 'aktif' : ''}
                           aria-current={rota.sayfa === 'kutuphane' ? 'page' : undefined}>
                            <Ikon ad="kitap" /><span>Kütüphane</span>
                        </a>
                        <a href="#/liderlik" className={rota.sayfa === 'liderlik' ? 'aktif' : ''}
                           aria-current={rota.sayfa === 'liderlik' ? 'page' : undefined}>
                            <Ikon ad="liderlik" /><span>Liderlik</span>
                        </a>
                        <a href="#/sohbet" className={rota.sayfa === 'sohbet' ? 'aktif' : ''}
                           aria-current={rota.sayfa === 'sohbet' ? 'page' : undefined}>
                            <Ikon ad="sohbet" /><span>Sohbet</span>
                        </a>
                        <a href={girisli ? '#/profil' : 'login.html'} className={rota.sayfa === 'profil' ? 'aktif' : ''}
                           aria-current={rota.sayfa === 'profil' ? 'page' : undefined}>
                            <Ikon ad="kisi" /><span>Profil</span>
                        </a>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script src="js/yardim.js" defer></script>
</body>
</html>
