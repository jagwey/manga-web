        const LiderlikSayfasi = () => {
            const [donem, setDonem] = React.useState('hafta');
            const [durum, setDurum] = React.useState('yukleniyor'); // yukleniyor | hazir | hata
            const [veri, setVeri] = React.useState(null);
            const [dene, setDene] = React.useState(0);
            const [kuralVeri, setKuralVeri] = React.useState(null);
            const girisli = !!kullaniciAl();

            React.useEffect(() => {
                let iptal = false;
                setDurum('yukleniyor');
                puanApiGet(`/liderlik?donem=${donem}&limit=50`, girisli ? 'istege-bagli' : false)
                    .then(r => { if (!r.ok) throw new Error('HTTP'); return r.json(); })
                    .then(v => { if (!iptal) { setVeri(v || {}); setDurum('hazir'); } })
                    .catch(() => { if (!iptal) setDurum('hata'); });
                return () => { iptal = true; };
            }, [donem, dene]);

            // Girişliyse kurallar API'den gelir; olmazsa ya da giriş yoksa yedek metin gösterilir.
            React.useEffect(() => {
                if (!girisli) return;
                let iptal = false;
                puanApiGet('/hesap/puan', true)
                    .then(r => r.ok ? r.json() : null)
                    .then(v => { if (!iptal && v) setKuralVeri(v); })
                    .catch(() => {});
                return () => { iptal = true; };
            }, [girisli]);

            const sekmeTus = (e, i) => {
                let h = null;
                if (e.key === 'ArrowRight') h = (i + 1) % DONEMLER.length;
                else if (e.key === 'ArrowLeft') h = (i + DONEMLER.length - 1) % DONEMLER.length;
                if (h == null) return;
                e.preventDefault();
                setDonem(DONEMLER[h].id);
                const dugmeler = e.currentTarget.parentNode.querySelectorAll('[role="tab"]');
                if (dugmeler[h]) dugmeler[h].focus();
            };

            const liste = durum === 'hazir' && veri && Array.isArray(veri.liste) ? veri.liste : [];
            const ben = durum === 'hazir' && veri ? veri.ben : null;
            const listede = !!ben && liste.some(x => x.sira === ben.sira);
            const donemAd = (DONEMLER.find(d => d.id === donem) || {}).ad;

            return (
                <div className="ana-icerik lider-sayfa">
                    <div className="lider-baslik">
                        <h1>Liderlik tablosu</h1>
                        <p>En çok puan toplayan okurlar. Bölüm oku, yorum yaz, seri puanla; puan kazan ve rütbe atla.</p>
                    </div>

                    <div className="lider-sekmeler" role="tablist" aria-label="Dönem">
                        {DONEMLER.map((d, i) => (
                            <button key={d.id} type="button" role="tab" id={`lider-sekme-${d.id}`} className="lider-sekme"
                                aria-selected={donem === d.id} aria-controls="lider-panel" tabIndex={donem === d.id ? 0 : -1}
                                onClick={() => setDonem(d.id)} onKeyDown={(e) => sekmeTus(e, i)}>{d.ad}</button>
                        ))}
                    </div>

                    <div id="lider-panel" role="tabpanel" aria-labelledby={`lider-sekme-${donem}`}>
                        {durum === 'hazir' && veri && veri.guncelleme && (
                            <p className="lider-guncelleme">Son güncelleme: {yorumTarihYaz(veri.guncelleme)}</p>
                        )}

                        {durum === 'yukleniyor' && (
                            <div className="lider-iskelet" role="status" aria-label="Sıralama yükleniyor" aria-busy="true">
                                {Array.from({ length: 6 }).map((_, i) => <div key={i} className="iskelet-blok" aria-hidden="true"></div>)}
                            </div>
                        )}

                        {durum === 'hata' && (
                            <DurumKutu ikon="hata" rol="alert" baslik="Sıralama yüklenemedi" metin="Sunucuya ulaşılamadı. Biraz sonra tekrar dene.">
                                <button className="btn-ikincil" onClick={() => setDene(dene + 1)}>Tekrar dene</button>
                            </DurumKutu>
                        )}

                        {durum === 'hazir' && liste.length === 0 && (
                            <DurumKutu ikon="bos" baslik="Henüz kimse puan kazanmadı" metin={`${donemAd} için sıralama boş. İlk sırayı sen al: bir bölüm oku ya da yorum yaz.`} />
                        )}

                        {durum === 'hazir' && liste.length > 0 && (
                            <ol className="lider-liste" aria-label={`${donemAd} sıralaması`}>
                                {liste.map((x) => {
                                    const benim = !!ben && x.sira === ben.sira;
                                    return (
                                        <li key={`${x.sira}-${x.kullaniciId}`}
                                            className={`lider-satir ${x.sira <= 3 ? `ust t${x.sira}` : ''} ${benim ? 'ben' : ''}`}
                                            aria-current={benim ? 'true' : undefined}>
                                            <span className="lider-sira"><span className="sr-only">Sıra </span>{x.sira}</span>
                                            <a href={`#/kullanici/${encodeURIComponent(x.kullaniciAdi || '')}`} aria-label={`${x.kullaniciAdi} profili`}><Avatarcik ad={x.kullaniciAdi} resim={x.profilResmiURL} /></a>
                                            <span className="lider-kimlik">
                                                <a href={`#/kullanici/${encodeURIComponent(x.kullaniciAdi || '')}`} className={`lider-ad ${window.Kage95AdStili.sinif(x.adStili)}`} style={window.Kage95AdStili.stil(x.adStili)} title={x.kullaniciAdi}>{x.kullaniciAdi}{window.Kage95AdStili.unvan(x.adStili) && <span className="as-unvan">{window.Kage95AdStili.unvan(x.adStili)}</span>}{benim && <em className="lider-sen"> (sen)</em>}</a>
                                                <span className="lider-rutbe">{x.rutbe}</span>
                                            </span>
                                            <span className="lider-puan"><strong>{sayiYaz(x.puan)}</strong><small>puan</small></span>
                                        </li>
                                    );
                                })}
                            </ol>
                        )}

                        {durum === 'hazir' && girisli && ben && !listede && (
                            <div className="lider-ben" role="status">
                                <strong>Senin sıran: {ben.sira}</strong>
                                <span>{sayiYaz(ben.puan)} puan · {ben.rutbe}</span>
                                <span>
                                    {ben.sonrakiRutbe
                                        ? `${ben.sonrakiRutbe} rütbesine ${sayiYaz(ben.sonrakiRutbeIcinKalan)} puan kaldı.`
                                        : 'En yüksek rütbedesin.'}
                                </span>
                            </div>
                        )}

                        {durum === 'hazir' && girisli && !ben && (
                            <div className="lider-ben" role="status">
                                <strong>Bu dönemde henüz puanın yok</strong>
                                <span>Bir bölümü sonuna kadar oku ya da yorum yaz; sıralamaya girersin.</span>
                            </div>
                        )}

                        {!girisli && durum !== 'yukleniyor' && (
                            <div className="lider-cagri">
                                <span>Sıralamaya girmek için giriş yap.</span>
                                <a className="btn-ana" href="login.html">Giriş yap</a>
                            </div>
                        )}
                    </div>

                    <KurallarKutusu kurallar={kuralVeri && kuralVeri.kurallar} tavan={kuralVeri && kuralVeri.bugun && kuralVeri.bugun.tavan} />
                </div>
            );
        };

        // Sunucu açıklama göndermezse ham eylem kodunu (ör. yonetici_bonus) okunur hale getirir.
        const EYLEM_ADLARI = { yonetici_bonus: 'Yönetici bonusu' };
        const eylemAdi = (g) => {
            if (g.aciklama && g.aciklama !== g.eylem) return g.aciklama;
            const e = g.eylem || '';
            if (EYLEM_ADLARI[e]) return EYLEM_ADLARI[e];
            const s = e.replace(/_/g, ' ');
            return s.charAt(0).toLocaleUpperCase('tr') + s.slice(1);
        };

        // Seviye çubuğu yüzdesi: bulunulan seviyenin eşiğinden sonrakine.
        const seviyeYuzdesi = (p) => {
            if (!p) return 0;
            if (!(p.sonrakiSeviyeIcinKalan > 0)) return 100;
            const aralik = p.toplam + p.sonrakiSeviyeIcinKalan - p.seviyeIcinGereken;
            return Math.max(0, Math.min(100, Math.round(((p.toplam - p.seviyeIcinGereken) / Math.max(1, aralik)) * 100)));
        };

        // Hesabım > Genel: puan özeti, rütbe ilerlemesi ve son hareketler. Veri üst bileşenden gelir.
        const PuanimBolumu = ({ v }) => {
            const bugun = (v && v.bugun) || {};
            const gecmis = v && Array.isArray(v.gecmis) ? v.gecmis.slice(0, 30) : [];
            const doluluk = bugun.tavan ? Math.min(100, Math.round(((bugun.kazanilan || 0) / bugun.tavan) * 100)) : 0;

            return (
                <>
                    <dl className="hp-istatistik">
                        <div className="hp-stat"><dt>Toplam puan</dt><dd>{sayiYaz(v.toplam)}</dd></div>
                        <div className="hp-stat"><dt>Seviye</dt><dd>Lv.{v.seviye || 1}</dd></div>
                        <div className="hp-stat"><dt>Rütbe</dt><dd>{v.rutbe}</dd></div>
                        <div className="hp-stat">
                            <dt>Bugün</dt>
                            <dd>{sayiYaz(bugun.kazanilan || 0)}<small> / {sayiYaz(bugun.tavan)}</small></dd>
                            <span className="hp-mini-cubuk" aria-hidden="true"><i style={{ width: `${doluluk}%` }}></i></span>
                        </div>
                    </dl>

                    <section className="hp-kutu puanim" aria-labelledby="hb-rutbe">
                        <h2 id="hb-rutbe">Rütbe ilerlemesi</h2>
                        <IlerlemeCubugu toplam={v.toplam} kalan={v.kalan} sonraki={v.sonrakiRutbe} />
                        <p className="aciklama puanim-kalan">
                            {v.sonrakiRutbe ? `${v.sonrakiRutbe} rütbesine ${sayiYaz(v.kalan)} puan kaldı.` : 'En yüksek rütbedesin.'}
                        </p>
                        <a className="link-btn puanim-lider" href="#/liderlik">Liderlik tablosunu gör</a>
                    </section>

                    <section className="hp-kutu" aria-labelledby="hb-hareket">
                        <h2 id="hb-hareket">Son hareketler</h2>
                        {gecmis.length === 0
                            ? <p className="aciklama">Henüz puan hareketin yok. Bir bölüm oku ya da yorum yaz.</p>
                            : (
                                <ul className="puanim-gecmis">
                                    {gecmis.map((g, i) => (
                                        <li key={i}>
                                            <span className="pg-aciklama">{eylemAdi(g)}</span>
                                            <strong className="pg-puan">{g.puan > 0 ? '+' : ''}{sayiYaz(g.puan)}</strong>
                                            <time className="pg-tarih" dateTime={g.tarih}>{yorumTarihYaz(g.tarih)}</time>
                                        </li>
                                    ))}
                                </ul>
                            )}
                        <KurallarKutusu kurallar={v.kurallar} tavan={bugun.tavan} />
                    </section>
                </>
            );
        };

        // Hesabım > "Seviye ve ödüller" (mod 'odul') ve "Görünüm" (mod 'gorunum'): ödül listesi ve önizlemeli tercih seçici.
        const TERCIH_BOS = { adRengi: '', mesajFontu: '', adEfekti: '', rozet: false, unvan: '' };
        const GORUNUM_SEKMELERI = [
            { id: 'unvan', ad: 'Unvan' },
            { id: 'renk', ad: 'Ad rengi' },
            { id: 'efekt', ad: 'Ad efekti' },
            { id: 'font', ad: 'Yazı tipi' }
        ];
        const FONT_ORNEK = "Kage 95'te bugün ne okudun?";
        const HEX_RENK = /^#[0-9a-f]{6}$/i;
        const hslHex = (h, s, l) => {
            s /= 100; l /= 100;
            const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
            const c = n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1)))).toString(16).padStart(2, '0');
            return `#${c(0)}${c(8)}${c(4)}`;
        };
        const hexHsl = (hex) => {
            const v = parseInt(hex.slice(1), 16), r = (v >> 16 & 255) / 255, g = (v >> 8 & 255) / 255, b = (v & 255) / 255;
            const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
            let h = 0;
            if (d) h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
            return { h: Math.round((h * 60 + 360) % 360), s: d ? Math.round(d / (1 - Math.abs(2 * l - 1)) * 100) : 0, l: Math.round(l * 100) };
        };
        // Sunucudaki OdulKatalogu.OzelRenk ile aynı okunabilirlik sınırı.
        const renkOkunur = (hex) => {
            if (!HEX_RENK.test(hex)) return false;
            const v = parseInt(hex.slice(1), 16);
            const k = c => { const s = c / 255; return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4); };
            const p = 0.2126 * k(v >> 16 & 255) + 0.7152 * k(v >> 8 & 255) + 0.0722 * k(v & 255);
            return p >= 0.06 && p <= 0.75;
        };
        // Katalog öğelerini kategoriye göre sırayı bozmadan gruplar (eski sunucuda kategori yoksa tek grup).
        const kategoriyeGore = (liste) => {
            const gruplar = [];
            (liste || []).forEach(o => {
                const k = o.kategori || 'Seçenekler';
                let g = gruplar.find(x => x.ad === k);
                if (!g) { g = { ad: k, ogeler: [] }; gruplar.push(g); }
                g.ogeler.push(o);
            });
            return gruplar;
        };
        const SeviyeBolumu = ({ puan, mod, yenile }) => {
            const AS = window.Kage95AdStili;
            const [durum, setDurum] = React.useState('yukleniyor'); // yukleniyor | hazir | hata | oturum
            const [dene, setDene] = React.useState(0);
            const [katalog, setKatalog] = React.useState(null);
            const [acik, setAcik] = React.useState(null);
            const [f, setF] = React.useState(TERCIH_BOS);
            const [mesgul, setMesgul] = React.useState(false);
            const [not, setNot] = React.useState(null); // { tur: 'basari' | 'hata', metin }
            const [sekme, setSekme] = React.useState('unvan');
            const kullanici = kullaniciAl();

            // Eski kayıt: parlak -> aura, parlak + animasyon -> nabiz
            const tercihYaz = (t) => setF({
                adRengi: (t && t.adRengi) || '', mesajFontu: (t && t.mesajFontu) || '',
                adEfekti: (t && (t.adEfekti || (t.parlak ? (t.animasyon ? 'nabiz' : 'aura') : ''))) || '',
                rozet: !!(t && t.rozet), unvan: (t && t.unvan) || ''
            });

            React.useEffect(() => {
                if (sekme === 'font' && katalog && AS) katalog.fontlar.forEach(x => AS.fontYukle(x.id));
            }, [sekme, katalog]);

            React.useEffect(() => {
                let iptal = false;
                const yetki = { Authorization: `Bearer ${tokenAl()}` };
                setDurum(d => (d === 'hazir' ? d : 'yukleniyor'));
                Promise.all([
                    fetch(`${API_URL}/oduller`),
                    fetch(`${API_URL}/hesap/tercihler`, { headers: yetki })
                ]).then(async ([a, b]) => {
                    if (b.status === 401) { if (!iptal) setDurum('oturum'); return; }
                    if (!a.ok || !b.ok) throw new Error('HTTP');
                    const [kat, ter] = await Promise.all([a.json(), b.json()]);
                    if (iptal) return;
                    setKatalog(kat); setAcik(ter.acik); tercihYaz(ter.tercihler); setDurum('hazir');
                }).catch(() => { if (!iptal) setDurum('hata'); });
                return () => { iptal = true; };
            }, [yenile, dene]);

            const sv = puan ? puan.seviye : 1;
            const sonrakiVar = puan && puan.sonrakiSeviyeIcinKalan > 0;
            const yuzde = seviyeYuzdesi(puan);
            const renkHex = (id) => { if (HEX_RENK.test(id)) return id; const r = katalog && katalog.renkler.find(x => x.id === id); return r ? r.hex : null; };
            const ozelRenkMi = HEX_RENK.test(f.adRengi);
            const skala = hexHsl(ozelRenkMi ? f.adRengi : '#e0343c');
            const skalaYaz = (d) => { const y = { ...skala, ...d }; set('adRengi')(hslHex(y.h, y.s, y.l)); };
            const ozelRenkSv = (katalog && katalog.ozelRenkSeviye) || 15;
            const onizleme = {
                adRengiHex: renkHex(f.adRengi), adEfekti: f.adEfekti, rozet: f.rozet,
                unvan: f.unvan.trim(), mesajFontu: f.mesajFontu
            };
            const hazirUnvanlar = (katalog && katalog.unvanlar) || [];
            const ozelUnvanMi = !!f.unvan.trim() && !hazirUnvanlar.some(u => u.ad === f.unvan.trim());
            const ozelSv = (katalog && katalog.ozelUnvanSeviye) || 30;
            const rozetSv = (katalog && katalog.rozetSeviye) || 20;
            const kilitEtiket = (s) => <span className="gr-kilit">Lv.{s}</span>;
            const set = (alan) => (v) => { setF(o => ({ ...o, [alan]: v })); setNot(null); };

            const kaydet = async (e) => {
                e.preventDefault();
                setMesgul(true); setNot(null);
                try {
                    const r = await fetch(`${API_URL}/hesap/tercihler`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${tokenAl()}` },
                        body: JSON.stringify({
                            adRengi: f.adRengi || null, mesajFontu: f.mesajFontu || null,
                            adEfekti: f.adEfekti || null, rozet: f.rozet, unvan: f.unvan.trim()

                    });
                    const g = await r.json().catch(() => ({}));
                    if (!r.ok) throw new Error(g.message || 'Tercihler kaydedilemedi.');
                    setAcik(g.acik); tercihYaz(g.tercihler);
                    setNot({ tur: 'basari', metin: 'Tercihlerin kaydedildi.' });
                } catch (err) {
                    setNot({ tur: 'hata', metin: err && err.message && err.message !== 'Failed to fetch' ? err.message : 'Sunucuya ulaşılamadı. Biraz sonra tekrar dene.' });
                } finally { setMesgul(false); }

            const odulMod = mod === 'odul';
            return (
                <section className="hp-kutu seviyem" aria-labelledby="hb-seviye">

                    {durum === 'oturum' && <p className="hesap-not hata" role="alert">Oturumun sona ermiş. <a className="link-ac" href="login.html">Tekrar giriş yap</a>.</p>}
                    {durum === 'hata' && (

                    {durum === 'hazir' && puan && katalog && acik && odulMod && (
                        <>
                            <div className="seviye-ust">

                            <div className="ilerleme" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow={yuzde} aria-label="Sonraki seviyeye ilerleme" style={{ marginTop: 10 }}>

                            <p className="aciklama puanim-kalan">
                                {sonrakiVar ? `Seviye ${sv + 1} için ${sayiYaz(puan.sonrakiSeviyeIcinKalan)} puan kaldı.` : 'En yüksek seviyedesin.'}
                            </p>

                            <h3 className="puanim-alt">Ödüller</h3>
                            <ul className="odul-liste">
                                {katalog.seviyeler.map(o => {

                                    return (

                                            <span className="odul-sv">Lv.{o.seviye}</span>

                    )}
                    {durum === 'hazir' && puan && katalog && acik && !odulMod && (
                        <>
                            <form className="gr" onSubmit={kaydet}>
                                <div className="gr-onizleme" aria-live="polite">
                                    <span className="gr-onizleme-baslik">Sohbette böyle görünürsün</span>
                                    <div className="gr-mesaj">
                                        <span className="gr-av" aria-hidden="true">{((kullanici && kullanici.kullaniciAdi) || 'K').charAt(0).toUpperCase()}</span>
                                        <div className="gr-govde">
                                            <div className="gr-ust">
                                                <span className={`gr-ad ${AS.sinif(onizleme)}`} style={AS.stil(onizleme)}>{kullanici ? kullanici.kullaniciAdi : 'Kullanıcı'}</span>
                                                <span className="gr-sv">Lv.{sv}</span>
                                                {onizleme.unvan && <span className="as-unvan">{onizleme.unvan}</span>}
                                            </div>
                                            <span className="gr-balon" style={{ fontFamily: AS.font(onizleme) }}>{FONT_ORNEK}</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="gr-sekmeler" role="tablist" aria-label="Görünüm seçenekleri">
                                    {GORUNUM_SEKMELERI.map(s => (
                                        <button key={s.id} type="button" role="tab" aria-selected={sekme === s.id}
                                            className={`gr-sekme ${sekme === s.id ? 'aktif' : ''}`} onClick={() => setSekme(s.id)}>{s.ad}</button>
                                    ))}
                                </div>

                                {sekme === 'unvan' && (
                                    <div className="gr-panel" role="tabpanel">
                                        <p className="gr-ipucu">Unvan adının yanında görünür. Okudukça ve sohbete katıldıkça yenileri açılır.</p>
                                        <div className="gr-kategori">
                                            <div className="gr-cipler">
                                                <button type="button" className={`gr-cip ${!f.unvan.trim() ? 'secili' : ''}`} aria-pressed={!f.unvan.trim()} onClick={() => set('unvan')('')}>Unvan yok</button>
                                            </div>
                                        </div>
                                        {kategoriyeGore(hazirUnvanlar).map(g => (
                                            <div className="gr-kategori" key={g.ad}>
                                                <h3 className="gr-kat-ad">{g.ad}</h3>
                                                <div className="gr-cipler">
                                                    {g.ogeler.map(u => {
                                                        const kilit = !(acik.unvanlar || []).includes(u.ad);
                                                        return (
                                                            <button key={u.ad} type="button" disabled={kilit} aria-pressed={f.unvan.trim() === u.ad}
                                                                className={`gr-cip ${f.unvan.trim() === u.ad ? 'secili' : ''}`}
                                                                title={kilit ? `Seviye ${u.seviye} gerekir` : u.ad}

                                        <div className="gr-kategori">
                                            <h3 className="gr-kat-ad">Özel {!acik.unvan && kilitEtiket(ozelSv)}</h3>
                                            <input id="tr-unvan" className="tercih-alan" type="text" maxLength={24} aria-label="Kendi unvanın"
                                                value={ozelUnvanMi ? f.unvan : ''} disabled={!acik.unvan}
                                                placeholder={acik.unvan ? 'Kendi unvanını yaz (en fazla 24 karakter)' : `Seviye ${ozelSv}'da kendi unvanını yazabilirsin`}
                                                onChange={(e) => set('unvan')(e.target.value)} />
                                        </div>
                                    </div>
                                )}

                                {sekme === 'renk' && (
                                    <div className="gr-panel" role="tabpanel">
                                        <p className="gr-ipucu">Adının rengi sohbette, yorumlarda ve liderlik tablosunda görünür.</p>
                                        <div className="gr-kategori">
                                            <div className="renk-secenekleri" role="radiogroup" aria-label="Varsayılan">
                                                <button type="button" role="radio" aria-checked={f.adRengi === ''} className="renk-btn varsayilan" title="Varsayılan" aria-label="Varsayılan renk" onClick={() => set('adRengi')('')}>Yok</button>
                                            </div>
                                        </div>
                                        {kategoriyeGore(katalog.renkler).map(g => (
                                            <div className="gr-kategori" key={g.ad}>
                                                <h3 className="gr-kat-ad">{g.ad}</h3>
                                                <div className="renk-secenekleri" role="radiogroup" aria-label={g.ad}>
                                                    {g.ogeler.map(r => {
                                                        const kilit = !acik.renkler.includes(r.id);
                                                        return (
                                                            <span key={r.id} className={`gr-renk ${kilit ? 'kilitli' : ''}`}>
                                                                <button type="button" role="radio" aria-checked={f.adRengi === r.id} disabled={kilit}
                                                                    className="renk-btn" style={{ background: r.hex }}
                                                                    title={kilit ? `${r.ad}: seviye ${r.seviye} gerekir` : r.ad}
                                                                    aria-label={kilit ? `${r.ad} (seviye ${r.seviye} gerekir)` : r.ad}
                                                                    onClick={() => set('adRengi')(r.id)}></button>
                                                                <small>{kilit ? `Lv.${r.seviye}` : r.ad}</small>
                                                            </span>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        ))}
                                        {katalog.ozelRenkSeviye && (
                                            <div className={`gr-kategori gr-skala ${acik.ozelRenk ? '' : 'kilitli'}`}>
                                                <h3 className="gr-kat-ad">Kendi rengin {!acik.ozelRenk && kilitEtiket(ozelRenkSv)}</h3>
                                                <label className="gr-kaydirici">
                                                    <span>Ton</span>
                                                    <input type="range" min="0" max="359" value={skala.h} disabled={!acik.ozelRenk} className="gr-ton"
                                                        onChange={(e) => skalaYaz({ h: +e.target.value })} />
                                                </label>
                                                <label className="gr-kaydirici">
                                                    <span>Canlılık</span>
                                                    <input type="range" min="20" max="100" value={skala.s} disabled={!acik.ozelRenk}
                                                        style={{ background: `linear-gradient(90deg, ${hslHex(skala.h, 20, skala.l)}, ${hslHex(skala.h, 100, skala.l)})` }}
                                                        onChange={(e) => skalaYaz({ s: +e.target.value })} />
                                                </label>
                                                <label className="gr-kaydirici">
                                                    <span>Açıklık</span>
                                                    <input type="range" min="25" max="85" value={skala.l} disabled={!acik.ozelRenk}
                                                        style={{ background: `linear-gradient(90deg, ${hslHex(skala.h, skala.s, 25)}, ${hslHex(skala.h, skala.s, 55)}, ${hslHex(skala.h, skala.s, 85)})` }}
                                                        onChange={(e) => skalaYaz({ l: +e.target.value })} />
                                                </label>
                                                <div className="gr-skala-alt">
                                                    <input type="color" aria-label="Renk seçici" disabled={!acik.ozelRenk} value={ozelRenkMi ? f.adRengi : '#e0343c'}
                                                        onChange={(e) => set('adRengi')(e.target.value)} />
                                                    <code>{ozelRenkMi ? f.adRengi.toUpperCase() : 'Henüz seçilmedi'}</code>
                                                    {ozelRenkMi && !renkOkunur(f.adRengi) && <span className="gr-uyari">Bu renk çok koyu ya da çok açık, adın okunmaz.</span>}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {sekme === 'efekt' && (
                                    <div className="gr-panel" role="tabpanel">
                                        <p className="gr-ipucu">Adına manga havası katan bir efekt seç. Aynı anda tek efekt kullanılır.</p>
                                        <div className="gr-kartlar">
                                            <button type="button" aria-pressed={!f.adEfekti} className={`gr-kart ${!f.adEfekti ? 'secili' : ''}`} onClick={() => set('adEfekti')('')}>
                                                <span className="gr-kart-ornek" style={AS.stil(onizleme)}>{kullanici ? kullanici.kullaniciAdi : 'Kullanıcı'}</span>
                                                <strong>Sade</strong>
                                                <span className="gr-kart-acik">Efekt yok.</span>
                                            </button>
                                            {(katalog.efektler || []).map(e => {
                                                const kilit = !(acik.efektler || []).includes(e.id);
                                                return (
                                                    <button key={e.id} type="button" disabled={kilit} aria-pressed={f.adEfekti === e.id}
                                                        className={`gr-kart ${f.adEfekti === e.id ? 'secili' : ''}`} onClick={() => set('adEfekti')(e.id)}>
                                                        <span className={`gr-kart-ornek as-ef as-ef-${e.id}`} style={AS.stil(onizleme)}>{kullanici ? kullanici.kullaniciAdi : 'Kullanıcı'}</span>
                                                        <strong>{e.ad}{kilit && kilitEtiket(e.seviye)}</strong>
                                                        <span className="gr-kart-acik">{e.aciklama}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                        {!katalog.efektler && <p className="gr-ipucu">Efektler sunucu güncellemesinden sonra açılacak.</p>}
                                        <div className="gr-kategori">
                                            <h3 className="gr-kat-ad">Çerçeve</h3>
                                            <label className={`gr-anahtar ${acik.rozet ? '' : 'kilitli'}`}>
                                                <input type="checkbox" checked={f.rozet} disabled={!acik.rozet} onChange={(e) => set('rozet')(e.target.checked)} />
                                                <span><span className="as-rozet">Mühür</span> çerçevesi: adın hanko mühür gibi kutulanır.</span>
                                                {!acik.rozet && kilitEtiket(rozetSv)}
                                            </label>
                                        </div>
                                    </div>
                                )}

                                {sekme === 'font' && (
                                    <div className="gr-panel" role="tabpanel">
                                        <p className="gr-ipucu">Sohbet mesajların bu yazı tipiyle görünür. Her kart kendi yazı tipiyle örnek gösterir.</p>
                                        {kategoriyeGore(katalog.fontlar).map(g => (
                                            <div className="gr-kategori" key={g.ad}>
                                                <h3 className="gr-kat-ad">{g.ad}</h3>
                                                <div className="gr-kartlar gr-fontlar">
                                                    {g.ogeler.map(x => {
                                                        const v = x.id === 'varsayilan' ? '' : x.id;
                                                        const kilit = v !== '' && !acik.fontlar.includes(x.id);
                                                        return (
                                                            <button key={x.id} type="button" disabled={kilit} aria-pressed={f.mesajFontu === v}
                                                                className={`gr-kart ${f.mesajFontu === v ? 'secili' : ''}`} onClick={() => set('mesajFontu')(v)}>
                                                                <span className="gr-font-ornek" style={{ fontFamily: v ? AS.fontlar[v] : undefined }}>{FONT_ORNEK}</span>
                                                                <strong>{x.ad}{kilit && kilitEtiket(x.seviye)}</strong>
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                <div className="gr-kaydet">
                                    <button type="submit" className="btn-ana" disabled={mesgul || (ozelRenkMi && !renkOkunur(f.adRengi))}>{mesgul ? 'Kaydediliyor…' : 'Görünümü kaydet'}</button>
                                    {not && <p className={`hesap-not ${not.tur === 'hata' ? 'hata' : ''}`} role={not.tur === 'hata' ? 'alert' : 'status'}>{not.metin}</p>}
                                </div>
                            </form>
                        </>
                    )}
                </section>
            );
        };

        const HESAP_SEKMELERI = [
            { id: 'genel', ad: 'Genel bakış', ikon: 'liderlik' },
            { id: 'odul', ad: 'Seviye ve ödüller', ikon: 'odul' },
            { id: 'gorunum', ad: 'Görünüm', ikon: 'boya' },
            { id: 'ayarlar', ad: 'Hesap ayarları', ikon: 'ayar' }
        ];

        const ProfilSayfasi = () => {
            const [kullanici, setKullanici] = React.useState(kullaniciAl);
            React.useEffect(() => { if (!kullanici) window.location.href = 'login.html'; }, []);
            const [bilgi, setBilgi] = React.useState({ ad: kullanici ? kullanici.kullaniciAdi : '', email: kullanici ? (kullanici.email || '') : '', sifre: '' });
            const [sifreForm, setSifreForm] = React.useState({ mevcut: '', yeni: '', tekrar: '' });
            const [silSifre, setSilSifre] = React.useState('');
            const [mesaj, setMesaj] = React.useState({}); // { bolum: { tur, metin } }
            const [mesgul, setMesgul] = React.useState('');
            const [puanYenile, setPuanYenile] = React.useState(0);
            const [puan, setPuan] = React.useState(null);
            const [puanDurum, setPuanDurum] = React.useState('yukleniyor'); // yukleniyor | hazir | hata | oturum
            const [puanDene, setPuanDene] = React.useState(0);
            const [sekme, setSekmeHam] = React.useState(() => {
                try { const s = sessionStorage.getItem('kage95_hesap_sekme'); if (HESAP_SEKMELERI.some(x => x.id === s)) return s; } catch (e) {}
                return 'genel';
            });
            const dosyaRef = React.useRef(null);
            const sekmeRef = React.useRef({});

            React.useEffect(() => {
                if (!kullanici) return;
                let iptal = false;
                setPuanDurum(d => (d === 'hazir' ? d : 'yukleniyor'));
                puanApiGet('/hesap/puan', true)
                    .then(r => {
                        if (r.status === 401) { if (!iptal) setPuanDurum('oturum'); return null; }
                        if (!r.ok) throw new Error('HTTP');
                        return r.json();
                    })
                    .then(g => { if (!iptal && g) { setPuan(g); setPuanDurum('hazir'); } })
                    .catch(() => { if (!iptal) setPuanDurum('hata'); });
                return () => { iptal = true; };
            }, [puanYenile, puanDene]);

            const setSekme = (id, odakla) => {
                setSekmeHam(id);
                try { sessionStorage.setItem('kage95_hesap_sekme', id); } catch (e) {}
                if (odakla && sekmeRef.current[id]) sekmeRef.current[id].focus();
            };
            const sekmeTus = (e) => {
                const i = HESAP_SEKMELERI.findIndex(x => x.id === sekme);
                const n = HESAP_SEKMELERI.length;
                let j = null;
                if (e.key === 'ArrowRight' || e.key === 'ArrowDown') j = (i + 1) % n;
                else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') j = (i - 1 + n) % n;
                else if (e.key === 'Home') j = 0;
                else if (e.key === 'End') j = n - 1;
                if (j === null) return;
                e.preventDefault();
                setSekme(HESAP_SEKMELERI[j].id, true);
            };

            if (!kullanici) return <div className="ana-icerik"><DurumKutu ikon="kilit" baslik="Giriş sayfasına yönlendiriliyorsun…" /></div>;

            const not = (bolum, tur, metin) => setMesaj(m => ({ ...m, [bolum]: { tur, metin } }));

            const yerelGuncelle = (veri) => {
                try {
                    const yeniKullanici = { ...kullanici, ...veri };
                    delete yeniKullanici.token;
                    localStorage.setItem('kage95_user', JSON.stringify(yeniKullanici));
                    if (veri.token) localStorage.setItem('kage95_token', veri.token);
                    setKullanici(yeniKullanici);
                    window.dispatchEvent(new Event('kage95-kullanici'));
                } catch (e) {}
            };

            const istek = async (bolum, yol, secenek) => {
                setMesgul(bolum);
                not(bolum, '', '');
                try {
                    const yanit = await fetch(API_URL + yol, {
                        ...secenek,
                        headers: { ...(secenek.headers || {}), 'Authorization': 'Bearer ' + tokenAl() }
                    });
                    const veri = await yanit.json().catch(() => ({}));
                    if (yanit.status === 401) { not(bolum, 'hata', 'Oturumun sona ermiş. Lütfen yeniden giriş yap.'); return null; }
                    if (!yanit.ok) { not(bolum, 'hata', veri.message || 'İşlem başarısız oldu.'); return null; }
                    return veri;
                } catch (e) {
                    not(bolum, 'hata', 'Sunucuya ulaşılamadı. Biraz sonra tekrar dene.');
                    return null;
                } finally {
                    setMesgul('');
                }
            };

            const bilgiKaydet = async (e) => {
                e.preventDefault();
                const veri = await istek('bilgi', '/hesap/profil', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ kullaniciAdi: bilgi.ad.trim(), email: bilgi.email.trim(), mevcutSifre: bilgi.sifre })
                });
                if (veri) {
                    yerelGuncelle(veri);
                    setBilgi(b => ({ ...b, sifre: '' }));
                    not('bilgi', 'basari', 'Bilgilerin güncellendi.');
                }
            };

            const sifreKaydet = async (e) => {
                e.preventDefault();
                if (sifreForm.yeni.length < 8) { not('sifre', 'hata', 'Yeni şifre en az 8 karakter olmalı.'); return; }
                if (sifreForm.yeni !== sifreForm.tekrar) { not('sifre', 'hata', 'Yeni şifreler birbiriyle aynı değil.'); return; }
                const veri = await istek('sifre', '/hesap/sifre', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mevcutSifre: sifreForm.mevcut, yeniSifre: sifreForm.yeni })
                });
                if (veri) {
                    if (veri.token) { try { localStorage.setItem('kage95_token', veri.token); } catch (e2) {} }
                    setSifreForm({ mevcut: '', yeni: '', tekrar: '' });
                    not('sifre', 'basari', 'Şifren değiştirildi. Diğer cihazlardaki oturumların kapatıldı.');
                }
            };

            const avatarYukle = async (e) => {
                const dosya = e.target.files && e.target.files[0];
                e.target.value = '';
                if (!dosya) return;
                if (dosya.size > 2 * 1024 * 1024) { not('avatar', 'hata', 'Dosya en fazla 2 MB olabilir.'); return; }
                const form = new FormData();
                form.append('dosya', dosya);
                const veri = await istek('avatar', '/hesap/avatar', { method: 'POST', body: form });
                if (veri) {
                    yerelGuncelle({ profilResmiURL: veri.profilResmiURL });
                    not('avatar', 'basari', 'Profil resmin güncellendi.');
                    if (window.Kage95Liderlik) window.Kage95Liderlik.yanittan(veri);
                    setPuanYenile(n => n + 1);
                }
            };

            const avatarKaldir = async () => {
                const veri = await istek('avatar', '/hesap/avatar', { method: 'DELETE' });
                if (veri) { yerelGuncelle({ profilResmiURL: null }); not('avatar', 'basari', 'Profil resmin kaldırıldı.'); }
            };

            const hesapSil = async (e) => {
                e.preventDefault();
                if (!window.confirm('Hesabın ve ona bağlı tüm veriler kalıcı olarak silinecek. Emin misin?')) return;
                const veri = await istek('sil', '/hesap', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sifre: silSifre })
                });
                if (veri) cikisYap();
            };

            const Not = ({ b }) => (mesaj[b] && mesaj[b].metin)
                ? <p className={`hesap-not ${mesaj[b].tur === 'hata' ? 'hata' : ''}`} role={mesaj[b].tur === 'hata' ? 'alert' : 'status'}>{mesaj[b].metin}</p>
                : null;

            const avatarIcerik = kullanici.profilResmiURL ? <img src={kullanici.profilResmiURL} alt="" /> : kullanici.kullaniciAdi.charAt(0).toUpperCase();
            const resimSec = () => dosyaRef.current && dosyaRef.current.click();
            const puanHazir = puanDurum === 'hazir' && puan;
            const svYuzde = seviyeYuzdesi(puan);
            const PuanDurumu = () => (
                <>
                    {puanDurum === 'yukleniyor' && <div className="hp-kutu"><p className="aciklama" role="status">Puanın yükleniyor…</p></div>}
                    {puanDurum === 'oturum' && <div className="hp-kutu"><p className="hesap-not hata" role="alert">Oturumun sona ermiş. <a className="link-ac" href="login.html">Tekrar giriş yap</a>.</p></div>}
                    {puanDurum === 'hata' && (
                        <div className="hp-kutu">
                            <p className="hesap-not hata" role="alert">Puanın yüklenemedi.</p>
                            <button type="button" className="btn-ikincil" onClick={() => setPuanDene(n => n + 1)}>Tekrar dene</button>
                        </div>
                    )}
                </>
            );

            return (
                <div className="ana-icerik profil-sayfa hp">
                    <input ref={dosyaRef} type="file" accept="image/jpeg,image/png,image/webp" onChange={avatarYukle} hidden />
                    <aside className="hp-yan">
                        <section className="hp-kahraman" aria-label="Profil özeti">
                            <div className="hp-avatar-kap">
                                <span className="profil-avatar hp-avatar" aria-hidden="true">{avatarIcerik}</span>
                                <button type="button" className="hp-avatar-btn" onClick={resimSec} disabled={mesgul === 'avatar'} aria-label="Profil resmini değiştir" title="Profil resmini değiştir">
                                    <Ikon ad="kamera" boyut={18} />
                                </button>
                            </div>
                            <h1 className="hp-ad">{kullanici.kullaniciAdi}</h1>
                            <div className="hp-cipler">
                                <span className="hp-cip">{rolEtiketi(kullanici)}</span>
                                {puanHazir && <span className="hp-cip vurgu">Lv.{puan.seviye || 1}</span>}
                            </div>
                            {puanHazir && (
                                <div className="hp-seviye">
                                    <div className="hp-seviye-ust">
                                        <span>{puan.rutbe}</span>
                                        <strong>{sayiYaz(puan.toplam)} puan</strong>
                                    </div>
                                    <div className="ilerleme" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow={svYuzde} aria-label="Sonraki seviyeye ilerleme">
                                        <i style={{ width: `${svYuzde}%` }}></i>
                                    </div>
                                    <small>{puan.sonrakiSeviyeIcinKalan > 0 ? `Seviye ${(puan.seviye || 1) + 1} için ${sayiYaz(puan.sonrakiSeviyeIcinKalan)} puan` : 'En yüksek seviye'}</small>
                                </div>
                            )}
                            {sekme !== 'ayarlar' && <Not b="avatar" />}
                            <nav className="hp-hizli" aria-label="Hızlı bağlantılar">
                                <a href={`#/kullanici/${encodeURIComponent(kullanici.kullaniciAdi)}`}><Ikon ad="kisi" boyut={18} />Profilimi gör</a>
                                <a href="#/kutuphane"><Ikon ad="kitap" boyut={18} />Kütüphanem</a>
                                {panelYetkisiVar(kullanici) && <a href="admin.html"><Ikon ad="panel" boyut={18} />Yönetim paneli</a>}
                                <button type="button" onClick={cikisYap}><Ikon ad="cikis" boyut={18} />Çıkış yap</button>
                            </nav>
                        </section>

                        <div className="hp-sekmeler" role="tablist" aria-label="Hesap bölümleri" onKeyDown={sekmeTus}>
                            {HESAP_SEKMELERI.map(s => (
                                <button key={s.id} type="button" role="tab" id={`hp-tab-${s.id}`} aria-controls="hp-panel"
                                    aria-selected={sekme === s.id} tabIndex={sekme === s.id ? 0 : -1}
                                    ref={el => { sekmeRef.current[s.id] = el; }}
                                    className="hp-sekme" onClick={() => setSekme(s.id)}>
                                    <Ikon ad={s.ikon} boyut={20} /><span>{s.ad}</span>
                                </button>
                            ))}
                        </div>
                    </aside>

                    <div className="hp-icerik" role="tabpanel" id="hp-panel" aria-labelledby={`hp-tab-${sekme}`} tabIndex={-1}>
                        {sekme === 'genel' && (puanHazir ? <PuanimBolumu v={puan} /> : <PuanDurumu />)}
                        {(sekme === 'odul' || sekme === 'gorunum') && (puanHazir ? <SeviyeBolumu puan={puan} mod={sekme} yenile={puanYenile} /> : <PuanDurumu />)}
                        {sekme === 'ayarlar' && (
                    <div className="hp-ayarlar">
                    <section className="hp-kutu" aria-labelledby="hb-avatar">
                        <h2 id="hb-avatar">Profil resmi</h2>
                        <div className="avatar-satiri">
                            <span className="profil-avatar" aria-hidden="true">{avatarIcerik}</span>
                            <div className="hesap-eylem-satiri">
                                <button className="btn-ikincil" disabled={mesgul === 'avatar'} onClick={resimSec}>Resim yükle</button>
                                {kullanici.profilResmiURL && <button className="btn-ikincil" disabled={mesgul === 'avatar'} onClick={avatarKaldir}>Kaldır</button>}
                            </div>
                        </div>
                        <p className="aciklama">JPG, PNG veya WebP, en fazla 2 MB. Yalnızca kullanım hakkına sahip olduğun görselleri yükle.</p>
                        <Not b="avatar" />
                    </section>

                    <section className="hp-kutu" aria-labelledby="hb-bilgi">
                        <h2 id="hb-bilgi">Hesap bilgileri</h2>
                        <form onSubmit={bilgiKaydet}>
                            <div className="form-satir">
                                <label htmlFor="hs-ad">Kullanıcı adı</label>
                                <input id="hs-ad" value={bilgi.ad} onChange={e => setBilgi({ ...bilgi, ad: e.target.value })} minLength={3} maxLength={30} autoComplete="username" required />
                            </div>
                            <div className="form-satir">
                                <label htmlFor="hs-email">E-posta</label>
                                <input id="hs-email" type="email" value={bilgi.email} onChange={e => setBilgi({ ...bilgi, email: e.target.value })} autoComplete="email" required />
                            </div>
                            <div className="form-satir">
                                <label htmlFor="hs-sifre">Mevcut şifre (değişikliği onaylamak için)</label>
                                <input id="hs-sifre" type="password" value={bilgi.sifre} onChange={e => setBilgi({ ...bilgi, sifre: e.target.value })} autoComplete="current-password" required />
                            </div>
                            <Not b="bilgi" />
                            <button type="submit" className="btn-ana" disabled={mesgul === 'bilgi'}>{mesgul === 'bilgi' ? 'Kaydediliyor…' : 'Kaydet'}</button>
                        </form>
                    </section>

                    <section className="hp-kutu" aria-labelledby="hb-sifre">
                        <h2 id="hb-sifre">Şifre değiştir</h2>
                        <form onSubmit={sifreKaydet}>
                            <div className="form-satir">
                                <label htmlFor="hs-mevcut">Mevcut şifre</label>
                                <input id="hs-mevcut" type="password" value={sifreForm.mevcut} onChange={e => setSifreForm({ ...sifreForm, mevcut: e.target.value })} autoComplete="current-password" required />
                            </div>
                            <div className="form-satir">
                                <label htmlFor="hs-yeni">Yeni şifre (en az 8 karakter)</label>
                                <input id="hs-yeni" type="password" value={sifreForm.yeni} onChange={e => setSifreForm({ ...sifreForm, yeni: e.target.value })} minLength={8} autoComplete="new-password" required />
                            </div>
                            <div className="form-satir">
                                <label htmlFor="hs-tekrar">Yeni şifre (tekrar)</label>
                                <input id="hs-tekrar" type="password" value={sifreForm.tekrar} onChange={e => setSifreForm({ ...sifreForm, tekrar: e.target.value })} minLength={8} autoComplete="new-password" required />
                            </div>
                            <Not b="sifre" />
                            <button type="submit" className="btn-ana" disabled={mesgul === 'sifre'}>{mesgul === 'sifre' ? 'Değiştiriliyor…' : 'Şifreyi değiştir'}</button>
                        </form>
                    </section>

                    {kullanici.rol !== 'Owner' && (
                        <section className="hp-kutu hp-tehlike" aria-labelledby="hb-sil">
                            <h2 id="hb-sil">Hesabı sil</h2>
                            <p className="aciklama">Hesabın, yorumların, kütüphanen ve okuma geçmişin kalıcı olarak silinir. Bu işlem geri alınamaz.</p>
                            <form onSubmit={hesapSil}>
                                <div className="form-satir">
                                    <label htmlFor="hs-sil">Şifren</label>
                                    <input id="hs-sil" type="password" value={silSifre} onChange={e => setSilSifre(e.target.value)} autoComplete="current-password" required />
                                </div>
                                <Not b="sil" />
                                <button type="submit" className="btn-ikincil tehlike" disabled={mesgul === 'sil'}>Hesabımı kalıcı olarak sil</button>
                            </form>
                        </section>
                    )}
                    </div>
                        )}
                    </div>
                </div>
            );
        };

        /* ------------------------- ÖNE ÇIKANLAR ------------------------- */
        // Bağlantı: '/', '#/', http(s) dışını yok say.
        const ocBaglantiGuvenli = (u) => (typeof u === 'string' && /^(\/(?!\/)|#\/|https?:\/\/)/i.test(u.trim())) ? u.trim() : '';
        const ocGorselGuvenli = (u) => {
            if (typeof u !== 'string' || !/^(\/(?!\/)|https?:\/\/)/i.test(u.trim())) return '';
            u = u.trim();
            if (u.startsWith('/')) { try { return new URL(API_URL).origin + u; } catch (e) { return u; } }
            return u;
        };
        // "adres#o=X,Y&k=kucuk.webp": odak noktası (yüzde) ve aynı klasördeki küçük varyant
        const ocGorselCoz = (u) => {
            const t = ocGorselGuvenli(u);
            const i = t.indexOf('#');
            if (i < 0) return { url: t, odak: '', kucuk: '', video: '' };
            const p = new URLSearchParams(t.slice(i + 1));
            const url = t.slice(0, i);
            const o = (p.get('o') || '').split(',').map(Number);
            const odak = o.length === 2 && o.every(n => Number.isFinite(n) && n >= 0 && n <= 100) ? o[0] + '% ' + o[1] + '%' : '';
            const k = p.get('k') || '';
            const kucuk = /^[\w.-]+$/.test(k) ? url.slice(0, url.lastIndexOf('/') + 1) + k : '';
            const v = p.get('v') || '';
            const video = /^[\w.-]+$/.test(v) ? url.slice(0, url.lastIndexOf('/') + 1) + v : '';
            return { url, odak, kucuk, video };
        };
        // Döngü video yalnız geniş ekranda, tasarruf/azaltılmış hareket/yavaş ağ yokken oynar; yoksa resim kalır
        const ocVideoUygun = () => {
            try {
                if (!window.matchMedia('(min-width: 769px)').matches) return false;
                if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return false;
                const c = navigator.connection;
                if (c && (c.saveData || /(^|-)2g$|3g/.test(c.effectiveType || ''))) return false;
                return true;
            } catch (e) { return false; }
        };
        const OcVideo = ({ src, odak, oynat }) => {
            const ref = React.useRef(null);
            const [hazir, setHazir] = React.useState(false);
            const [hata, setHata] = React.useState(false);
            React.useEffect(() => {
                const v = ref.current;
                if (!v) return;
                if (oynat) { const pr = v.play(); if (pr && pr.catch) pr.catch(() => {}); }
                else v.pause();
            }, [oynat, hazir]);
            // Slayt değişince eleman sökülür; indirmeyi ve çözücüyü bırak
            React.useEffect(() => () => {
                const v = ref.current;
                if (v) { v.pause(); v.removeAttribute('src'); v.load(); }
            }, []);
            if (hata) return null;
            return <video ref={ref} className={`oc-video ${hazir ? 'hazir' : ''}`} src={src} muted loop playsInline preload="auto"
                aria-hidden="true" tabIndex={-1} disablePictureInPicture disableRemotePlayback
                style={odak ? { objectPosition: odak } : undefined}
                onCanPlay={() => setHazir(true)} onError={() => setHata(true)} />;
        };
        const OC_SURE = 8500;
        // Slaytın bağlı olduğu manga: seri kaydı ("m12") ya da "/#/manga/12" bağlantısı
        const ocMangaId = (s) => {
            if (typeof s.id === 'string' && /^m\d+$/.test(s.id)) return Number(s.id.slice(1));
            const m = /#\/manga\/(\d+)/.exec(typeof s.baglanti === 'string' ? s.baglanti : '');
            return m ? Number(m[1]) : null;
        };
        // Kapak fareyi izleyerek hafif eğilir ve üzerinden ışık geçer (yalnız fare olan cihazlarda)
        const ocEgim = (e) => {
            if (!window.matchMedia('(hover: hover)').matches || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            const el = e.currentTarget, r = el.getBoundingClientRect();
            const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
            el.style.setProperty('--ry', ((x - .5) * 14).toFixed(1) + 'deg');
            el.style.setProperty('--rx', ((.5 - y) * 14).toFixed(1) + 'deg');
            el.style.setProperty('--isik', (x * 100 - 60).toFixed(0) + '%');
        };
        const ocEgimSifirla = (e) => {
            ['--ry', '--rx', '--isik'].forEach(k => e.currentTarget.style.removeProperty(k));
        };
        const OneCikanlar = () => {
            const [liste, setListe] = React.useState([]);
            const [i, setI] = React.useState(0);
            const [gorunur, setGorunur] = React.useState(() => document.visibilityState !== 'hidden');
            const dokun = React.useRef(null);

            React.useEffect(() => {
                let iptal = false;
                fetch(`${API_URL}/one-cikanlar`)
                    .then(r => { if (!r.ok) throw new Error(); return r.json(); })
                    .then(v => {
                        if (iptal) return;
                        const l = (Array.isArray(v) ? v : []).filter(x => x && typeof x.baslik === 'string' && x.baslik.trim()).slice(0, 12);
                        setListe(l);
                    })
                    .catch(() => { if (!iptal) setListe([]); });
                return () => { iptal = true; };
            }, []);

            React.useEffect(() => {
                const f = () => setGorunur(document.visibilityState !== 'hidden');
                document.addEventListener('visibilitychange', f);
                return () => document.removeEventListener('visibilitychange', f);
            }, []);

            const n = liste.length;
            const git = React.useCallback((k) => { if (n) setI(((k % n) + n) % n); }, [n]);
            // Kullanıcı durdurabilir; ayrıca sekme gizliyken bekler
            const [dur, setDur] = React.useState(false);
            const otomatik = n > 1 && gorunur && !dur;
            React.useEffect(() => {
                if (!otomatik) return;
                const t = setTimeout(() => setI(x => (x + 1) % n), OC_SURE);
                return () => clearTimeout(t);
            }, [otomatik, i, n]);

            // Slayt bir mangaya bağlıysa ayrıntıyı (türler, ilk bölüm, kapak) çek; sonuç önbellekte tutulur
            const [detay, setDetay] = React.useState({});
            const sAn = n ? liste[Math.min(i, n - 1)] : null;
            const mId = sAn ? ocMangaId(sAn) : null;
            React.useEffect(() => {
                if (!mId || detay[mId] !== undefined) return;
                let iptal = false;
                setDetay(d => ({ ...d, [mId]: null }));
                fetch(`${API_URL}/mangas/${mId}`)
                    .then(r => { if (!r.ok) throw new Error(); return r.json(); })
                    .then(v => { if (!iptal) setDetay(d => ({ ...d, [mId]: v && typeof v === 'object' ? v : false })); })
                    .catch(() => { if (!iptal) setDetay(d => ({ ...d, [mId]: false })); });
                return () => { iptal = true; };
            }, [mId]);

            if (n === 0) return null;
            const s = sAn;
            const d = (mId && detay[mId]) || {};
            const bag = ocBaglantiGuvenli(s.baglanti);
            const gorselCoz = ocGorselCoz(s.gorselUrl);
            const gorsel = gorselCoz.url;
            // Geniş görsel değilse (dikey kapak) zemin bulanıklaşır
            const bulanik = s.genis !== true;
            const afis = ocGorselGuvenli(s.kapakUrl) || ocGorselGuvenli(d.kapakResmiURL) || gorsel;
            const disBag = /^https?:/i.test(bag) ? { target: '_blank', rel: 'noopener noreferrer' } : {};
            const turler = (Array.isArray(d.kategoriler) ? d.kategoriler : []).filter(x => typeof x === 'string' && x.trim()).slice(0, 4);
            const bolumler = Array.isArray(d.bolumler) ? d.bolumler.filter(b => b && Number.isInteger(b.id)) : [];
            const ilk = Number.isInteger(s.ilkBolumId) ? s.ilkBolumId
                : (bolumler.length ? bolumler.reduce((a, b) => (Number(b.bolumNo) < Number(a.bolumNo) ? b : a)).id : null);
            const bolumSayisi = s.bolumSayisi > 0 ? s.bolumSayisi : bolumler.length;
            const ozet = (typeof s.ozet === 'string' && s.ozet.trim()) || (typeof d.aciklama === 'string' ? d.aciklama.trim() : '');
            const dokunBasla = (e) => { const t = e.touches[0]; dokun.current = { x: t.clientX, y: t.clientY }; };
            const dokunBitir = (e) => {
                const b = dokun.current; dokun.current = null;
                if (!b || !e.changedTouches[0]) return;
                const dx = e.changedTouches[0].clientX - b.x, dy = e.changedTouches[0].clientY - b.y;
                if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) git(i + (dx < 0 ? 1 : -1));
            };
            const tus = (e) => {
                if (e.key === 'ArrowLeft') { e.preventDefault(); git(i - 1); }
                else if (e.key === 'ArrowRight') { e.preventDefault(); git(i + 1); }
            };
            const oynat = <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="5 3 19 12 5 21 5 3" /></svg>;
            return (
                <section className="oc" aria-roledescription="carousel" aria-label="Öne çıkanlar"
                    onTouchStart={dokunBasla} onTouchEnd={dokunBitir} onKeyDown={tus}>
                    <div className="oc-kutu">
                        <div className="oc-slayt" key={s.id != null ? s.id : i} role="group" aria-roledescription="slide" aria-label={`${i + 1} / ${n}`} aria-live="off">
                            <div className={`oc-gorsel ${gorsel ? '' : 'oc-gorsel-yok'} ${bulanik ? 'oc-bulanik' : ''}`}>
                                {/* Dar dikey ekranda yatay afiş aşırı büyür; orada dikey kapak zemin olur */}
                                {gorsel && <picture>
                                    {afis && afis !== gorsel && <source media="(max-width: 768px)" srcSet={afis} />}
                                    <img src={gorsel} alt="" decoding="async"
                                        srcSet={gorselCoz.kucuk ? `${gorselCoz.kucuk} 960w, ${gorsel} 1920w` : undefined}
                                        sizes={gorselCoz.kucuk ? '100vw' : undefined}
                                        style={gorselCoz.odak ? { objectPosition: gorselCoz.odak } : undefined} onError={(e) => { e.currentTarget.style.display = 'none'; }} />
                                </picture>}
                                {gorsel && gorselCoz.video && ocVideoUygun() && <OcVideo src={gorselCoz.video} odak={gorselCoz.odak} oynat={gorunur && !dur} />}
                            </div>
                            <div className="oc-karart" aria-hidden="true"></div>
                            <div className="oc-parilti" aria-hidden="true"></div>
                            <div className="oc-govde">
                                <div className="oc-icerik">
                                    <div className="oc-meta">
                                        <span className="oc-rozet"><span aria-hidden="true">影 ·</span> {mId ? 'Öne Çıkan Seri' : 'Öne Çıkan'}</span>
                                        {s.etiket && String(s.etiket).trim() && <span className="oc-etiket">{String(s.etiket).trim()}</span>}
                                        {bolumSayisi > 0 && <span className="oc-etiket">{bolumSayisi} Bölüm</span>}
                                    </div>
                                    <h2 className="oc-baslik">{s.baslik}</h2>
                                    {turler.length > 0 && <ul className="oc-turler" aria-label="Türler">
                                        {turler.map((t, k) => <li key={t} className={k === 0 ? 'vurgu' : ''}>{t}</li>)}
                                    </ul>}
                                    {ozet && <p className="oc-ozet">{ozet}</p>}
                                    {bag && <div className="oc-eylem">
                                        {mId
                                            ? <a className="oc-btn" href={ilk ? `read.html?chapter=${ilk}` : bag}>{oynat} Okumaya Başla</a>
                                            : <a className="oc-btn" href={bag} {...disBag}>{oynat} Şimdi Oku</a>}
                                        {mId && <a className="oc-btn-ikincil" href={bag}>Detaylar</a>}
                                    </div>}
                                </div>
                                {afis && <div className="oc-vitrin" style={{ '--afis': `url(${JSON.stringify(afis)})` }}>
                                    {bag
                                        ? <a className="oc-afis" href={bag} {...disBag} onMouseMove={ocEgim} onMouseLeave={ocEgimSifirla} aria-label={`${s.baslik} sayfasına git`}><img src={afis} alt="" decoding="async" onError={(e) => { e.currentTarget.parentElement.style.display = 'none'; }} /></a>
                                        : <div className="oc-afis" aria-hidden="true"><img src={afis} alt="" decoding="async" onError={(e) => { e.currentTarget.parentElement.style.display = 'none'; }} /></div>}
                                </div>}
                            </div>
                        </div>
                        {n > 1 && <>
                            <button type="button" className="oc-ok oc-ok-sol" aria-label="Önceki slayt" onClick={() => git(i - 1)}><span aria-hidden="true">‹</span></button>
                            <button type="button" className="oc-ok oc-ok-sag" aria-label="Sonraki slayt" onClick={() => git(i + 1)}><span aria-hidden="true">›</span></button>
                            <div className="oc-noktalar" aria-hidden="true">{liste.map((_, k) => <span key={k} className={k === i ? 'aktif' : ''}></span>)}</div>
                            <button type="button" className={`oc-dur ${dur ? 'durdu' : ''}`} aria-label={dur ? 'Otomatik geçişi başlat' : 'Otomatik geçişi durdur'} aria-pressed={dur} title={dur ? 'Oynat' : 'Duraklat'} onClick={() => setDur(d => !d)}>
                                {dur
                                    ? <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M2 1l7 4-7 4z" fill="currentColor"/></svg>
                                    : <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M2 1h2v8H2zM6 1h2v8H6z" fill="currentColor"/></svg>}
                            </button>
                        </>}
                    </div>
                </section>
            );
        };

        /* ------------------------- ANA SAYFA ------------------------- */

        // Popüler seriler: GET /mangas/populer?donem=hafta|ay|tum; kartta ilk/son bölüme hızlı bağlantı
        const PopulerSeriler = () => {
            const DONEMLER = [['hafta', 'Bu hafta'], ['ay', 'Bu ay'], ['tum', 'Tüm zamanlar']];
            const [donem, setDonem] = React.useState('hafta');
            const [liste, setListe] = React.useState([]);
            React.useEffect(() => {
                let iptal = false;
                fetch(`${API_URL}/mangas/populer?donem=${donem}&limit=10`)
                    .then(r => { if (!r.ok) throw new Error(); return r.json(); })
                    .then(v => { if (!iptal) setListe(Array.isArray(v) ? v : []); })
                    .catch(() => { if (!iptal) setListe([]); });
                return () => { iptal = true; };
            }, [donem]);
            if (!liste.length) return null;
            return (
                <section className="ana-icerik populer" aria-labelledby="populerBaslik">
                    <div className="bolum-baslik-satir">
                        <h2 id="populerBaslik">En çok okunanlar</h2>
                        <div className="baslik-sag" role="group" aria-label="Dönem">
                            {DONEMLER.map(([k, ad]) => (
                                <button key={k} type="button" className={`kategori-btn ${donem === k ? 'aktif' : ''}`} aria-pressed={donem === k} onClick={() => setDonem(k)}>{ad}</button>
                            ))}
                        </div>
                    </div>
                    <ol className="populer-liste">
                        {liste.map((m, i) => (
                            <li key={m.id} className="populer-kart">
                                <a className="populer-kapak" href={mangaLink(m)} aria-label={`${i + 1}. ${m.mangaAdi}`}>
                                    <span className="populer-sira" aria-hidden="true">{i + 1}</span>
                                    <span className={`kart-kapak desen-${(m.id || 0) % 5} ${m.kapakResmiURL ? '' : 'kapak-yok'}`}>
                                        <img src={m.kapakResmiURL || YER_TUTUCU} alt={`${m.mangaAdi} kapak görseli`} loading="lazy" decoding="async" onError={gorselHata} />
                                        <HizliOku m={m} />
                                    </span>
                                </a>
                                <a className="populer-ad" href={mangaLink(m)}>{m.mangaAdi}</a>
                                {m.bolumSayisi != null && <span className="manga-meta">{m.bolumSayisi > 0 ? `${m.bolumSayisi} Bölüm` : 'Yakında'}</span>}
                            </li>
                        ))}
                    </ol>
                </section>
            );
        };

        // "3 saat önce" biçiminde kısa göreli zaman
        const kacOnce = (t) => {
            const ms = Date.now() - new Date(t).getTime();
            if (!isFinite(ms)) return '';
            const dk = Math.max(0, Math.floor(ms / 60000));
            if (dk < 60) return dk <= 1 ? 'az önce' : `${dk} dk önce`;
            const sa = Math.floor(dk / 60);
            if (sa < 24) return `${sa} saat önce`;
            const gun = Math.floor(sa / 24);
            if (gun < 30) return `${gun} gün önce`;
            const ay = Math.floor(gun / 30);
            return ay < 12 ? `${ay} ay önce` : `${Math.floor(ay / 12)} yıl önce`;
        };

        // Yatay seri şeridi: sirala=guncel (son bölüm çıkanlar) ya da yeni (son eklenen seriler)
        const SeriSeridi = ({ baslik, sirala }) => {
            const [liste, setListe] = React.useState([]);
            React.useEffect(() => {
                let iptal = false;
                fetch(`${API_URL}/mangas?sirala=${sirala}&pageSize=14`)
                    .then(r => { if (!r.ok) throw new Error(); return r.json(); })
                    .then(v => { if (!iptal) setListe((Array.isArray(v) ? v : []).filter(m => sirala !== 'guncel' || (m.sonBolumId && m.sonBolumTarihi))); })
                    .catch(() => { if (!iptal) setListe([]); });
                return () => { iptal = true; };
            }, [sirala]);
            if (liste.length < 3) return null;
            const bid = `serit-${sirala}`;
            return (
                <section className="ana-icerik populer seri-serit" aria-labelledby={bid}>
                    <div className="bolum-baslik-satir">
                        <h2 id={bid}>{baslik}</h2>
                    </div>
                    <ul className="populer-liste">
                        {liste.map(m => {
                            const yeni = m.sonBolumTarihi && Date.now() - new Date(m.sonBolumTarihi).getTime() < 3 * 864e5;
                            return (
                                <li key={m.id} className="populer-kart">
                                    <a className="populer-kapak" href={mangaLink(m)} aria-label={m.mangaAdi}>
                                        {sirala === 'guncel' && yeni && <span className="populer-sira serit-rozet" aria-hidden="true">Yeni</span>}
                                        <span className={`kart-kapak desen-${(m.id || 0) % 5} ${m.kapakResmiURL ? '' : 'kapak-yok'}`}>
                                            <img src={m.kapakResmiURL || YER_TUTUCU} alt={`${m.mangaAdi} kapak görseli`} loading="lazy" decoding="async" onError={gorselHata} />
                                            <HizliOku m={m} />
                                        </span>
                                    </a>
                                    <a className="populer-ad" href={mangaLink(m)}>{m.mangaAdi}</a>
                                    {sirala === 'guncel'
                                        ? <a className="serit-bolum" href={`read.html?chapter=${m.sonBolumId}`}>
                                            <span>Bölüm {Number(m.sonBolumNo)}</span>
                                            {m.sonBolumTarihi && <span className="manga-meta">{kacOnce(m.sonBolumTarihi)}</span>}
                                        </a>
                                        : <span className="manga-meta">{(m.kategoriler && m.kategoriler[0]) || 'Manga'} · {m.bolumSayisi > 0 ? `${m.bolumSayisi} Bölüm` : 'Yakında'}</span>}
                                </li>
                            );
                        })}
                    </ul>
                </section>
            );
        };

        // Aranan metni addaki ilk geçtiği yerde <mark> ile vurgular (büyük/küçük harf duyarsız, Türkçe).
        const eslesmeVurgula = (metin, q) => {
            const s = String(metin || '');
            const i = q ? s.toLocaleLowerCase('tr').indexOf(q.toLocaleLowerCase('tr')) : -1;
            if (i < 0) return s;
            return <>{s.slice(0, i)}<mark>{s.slice(i, i + q.length)}</mark>{s.slice(i + q.length)}</>;
        };

        // Arama kutusu + anlık öneri listesi. Her harfte (kısa gecikmeyle) /mangas/oneri sorgulanır,
        // en alakalı seri en üstte. Enter/“tüm sonuçlar” ana listeye kaydırır.
        const AramaKutusu = ({ deger, degistir, aciklama, setAciklama, girdiRef, id, sinif = 'arama-kapsayici', ikon = true, onAra }) => {
            const [oneriler, setOneriler] = React.useState([]);
            const [toplam, setToplam] = React.useState(0);
            const [durum, setDurum] = React.useState('bos');
            const [acik, setAcik] = React.useState(false);
            const [aktif, setAktif] = React.useState(-1);
            const kapRef = React.useRef(null);
            const listeId = React.useId();
            const q = deger.trim();

            React.useEffect(() => {
                if (!q) { setOneriler([]); setToplam(0); setDurum('bos'); return; }
                setDurum('yukleniyor');
                const ctrl = new AbortController();
                const t = setTimeout(() => {
                    fetch(`${API_URL}/mangas/oneri?q=${encodeURIComponent(q)}&aciklama=${aciklama ? 'true' : 'false'}`, { signal: ctrl.signal })
                        .then(r => { if (!r.ok) throw new Error(); return r.json(); })
                        .then(v => {
                            setOneriler(Array.isArray(v && v.sonuclar) ? v.sonuclar : []);
                            setToplam((v && v.toplam) || 0);
                            setAktif(-1);
                            setDurum('hazir');
                        })
                        .catch(e => { if (e.name !== 'AbortError') setDurum('hata'); });
                }, 120);
                return () => { clearTimeout(t); ctrl.abort(); };
            }, [q, aciklama]);

            // Dışarı tıklanınca liste kapanır.
            React.useEffect(() => {
                if (!acik) return;
                const d = (e) => { if (kapRef.current && !kapRef.current.contains(e.target)) setAcik(false); };
                document.addEventListener('pointerdown', d);
                return () => document.removeEventListener('pointerdown', d);
            }, [acik]);

            // Öneriden seçilen mangaya gidince arama temizlenir; yoksa Seriler listesi o aramayla süzülü kalır.
            const git = (m) => { setAcik(false); degistir(''); window.location.hash = mangaLink(m); };
            const tumunuGor = () => { setAcik(false); if (onAra) onAra(); };

            const tus = (e) => {
                if (e.key === 'ArrowDown' && oneriler.length) { e.preventDefault(); setAcik(true); setAktif(a => (a + 1) % oneriler.length); }
                else if (e.key === 'ArrowUp' && oneriler.length) { e.preventDefault(); setAktif(a => (a <= 0 ? oneriler.length - 1 : a - 1)); }
                else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (acik && aktif >= 0 && oneriler[aktif]) git(oneriler[aktif]); else tumunuGor();
                }
                else if (e.key === 'Escape' && acik) { e.stopPropagation(); setAcik(false); }
            };

            const listeGoster = acik && q && durum !== 'bos';
            return (
