        // Hesabım içindeki "Puanım" bölümü: toplam puan, rütbe, ilerleme, bugünkü kazanım ve son hareketler.
        const PuanimBolumu = ({ yenile }) => {
            const [durum, setDurum] = React.useState('yukleniyor'); // yukleniyor | hazir | hata | oturum
            const [v, setV] = React.useState(null);
            const [dene, setDene] = React.useState(0);

            React.useEffect(() => {
                let iptal = false;
                setDurum(d => (d === 'hazir' ? d : 'yukleniyor'));
                puanApiGet('/hesap/puan', true)
                    .then(r => {
                        if (r.status === 401) { if (!iptal) setDurum('oturum'); return null; }
                        if (!r.ok) throw new Error('HTTP');
                        return r.json();
                    })
                    .then(g => { if (!iptal && g) { setV(g); setDurum('hazir'); } })
                    .catch(() => { if (!iptal) setDurum('hata'); });
                return () => { iptal = true; };
            }, [yenile, dene]);

            const bugun = (v && v.bugun) || {};
            const gecmis = v && Array.isArray(v.gecmis) ? v.gecmis.slice(0, 30) : [];

            return (
                <section className="hesap-bolum puanim" aria-labelledby="hb-puan">
                    <h2 id="hb-puan">Puanım</h2>
                    {durum === 'yukleniyor' && <p className="aciklama" role="status">Puanın yükleniyor…</p>}
                    {durum === 'oturum' && <p className="hesap-not hata" role="alert">Oturumun sona ermiş. <a className="link-ac" href="login.html">Tekrar giriş yap</a>.</p>}
                    {durum === 'hata' && (
                        <>
                            <p className="hesap-not hata" role="alert">Puanın yüklenemedi.</p>
                            <button type="button" className="btn-ikincil" onClick={() => setDene(dene + 1)}>Tekrar dene</button>
                        </>
                    )}
                    {durum === 'hazir' && v && (
                        <>
                            <dl className="puanim-ozet">
                                <div><dt>Toplam puan</dt><dd>{sayiYaz(v.toplam)}</dd></div>
                                <div><dt>Rütbe</dt><dd>{v.rutbe}</dd></div>
                                <div><dt>Bugün</dt><dd>{sayiYaz(bugun.kazanilan)} / {sayiYaz(bugun.tavan)}</dd></div>
                            </dl>
                            <IlerlemeCubugu toplam={v.toplam} kalan={v.kalan} sonraki={v.sonrakiRutbe} />
                            <p className="aciklama puanim-kalan">
                                {v.sonrakiRutbe ? `${v.sonrakiRutbe} rütbesine ${sayiYaz(v.kalan)} puan kaldı.` : 'En yüksek rütbedesin.'}
                            </p>

                            <h3 className="puanim-alt">Son hareketler</h3>
                            {gecmis.length === 0
                                ? <p className="aciklama">Henüz puan hareketin yok. Bir bölüm oku ya da yorum yaz.</p>
                                : (
                                    <ul className="puanim-gecmis">
                                        {gecmis.map((g, i) => (
                                            <li key={i}>
                                                <span className="pg-aciklama">{g.aciklama || g.eylem}</span>
                                                <strong className="pg-puan">{g.puan > 0 ? '+' : ''}{g.puan}</strong>
                                                <time className="pg-tarih" dateTime={g.tarih}>{yorumTarihYaz(g.tarih)}</time>
                                            </li>
                                        ))}
                                    </ul>
                                )}

                            <KurallarKutusu kurallar={v.kurallar} tavan={bugun.tavan} />
                        </>
                    )}
                    <a className="link-btn puanim-lider" href="#/liderlik">Liderlik tablosunu gör</a>
                </section>
            );
        };

        // Hesabım içindeki "Seviye ve ödüller": seviye ilerlemesi, açık/kilitli ödüller ve önizlemeli tercih seçici.
        const TERCIH_BOS = { adRengi: '', mesajFontu: '', parlak: false, animasyon: false, rozet: false, unvan: '' };
        const SeviyeBolumu = ({ yenile }) => {
            const AS = window.Kage95AdStili;
            const [durum, setDurum] = React.useState('yukleniyor'); // yukleniyor | hazir | hata | oturum
            const [dene, setDene] = React.useState(0);
            const [puan, setPuan] = React.useState(null);
            const [katalog, setKatalog] = React.useState(null);
            const [acik, setAcik] = React.useState(null);
            const [f, setF] = React.useState(TERCIH_BOS);
            const [mesgul, setMesgul] = React.useState(false);
            const [not, setNot] = React.useState(null); // { tur: 'basari' | 'hata', metin }
            const kullanici = kullaniciAl();

            const tercihYaz = (t) => setF({
                adRengi: (t && t.adRengi) || '', mesajFontu: (t && t.mesajFontu) || '', parlak: !!(t && t.parlak),
                animasyon: !!(t && t.animasyon), rozet: !!(t && t.rozet), unvan: (t && t.unvan) || ''
            });

            React.useEffect(() => {
                let iptal = false;
                const yetki = { Authorization: `Bearer ${tokenAl()}` };
                setDurum(d => (d === 'hazir' ? d : 'yukleniyor'));
                Promise.all([
                    fetch(`${API_URL}/oduller`),
                    fetch(`${API_URL}/hesap/tercihler`, { headers: yetki }),
                    fetch(`${API_URL}/hesap/puan`, { headers: yetki })
                ]).then(async ([a, b, c]) => {
                    if (b.status === 401 || c.status === 401) { if (!iptal) setDurum('oturum'); return; }
                    if (!a.ok || !b.ok || !c.ok) throw new Error('HTTP');
                    const [kat, ter, pu] = await Promise.all([a.json(), b.json(), c.json()]);
                    if (iptal) return;
                    setKatalog(kat); setAcik(ter.acik); setPuan(pu); tercihYaz(ter.tercihler); setDurum('hazir');
                }).catch(() => { if (!iptal) setDurum('hata'); });
                return () => { iptal = true; };
            }, [yenile, dene]);

            const sv = puan ? puan.seviye : 1;
            const sonrakiVar = puan && puan.sonrakiSeviyeIcinKalan > 0;
            const aralik = puan ? puan.toplam + puan.sonrakiSeviyeIcinKalan - puan.seviyeIcinGereken : 0;
            const yuzde = !puan ? 0 : (!sonrakiVar ? 100 : Math.max(0, Math.min(100, Math.round(((puan.toplam - puan.seviyeIcinGereken) / Math.max(1, aralik)) * 100))));
            const renkHex = (id) => { const r = katalog && katalog.renkler.find(x => x.id === id); return r ? r.hex : null; };
            const onizleme = {
                adRengiHex: renkHex(f.adRengi), parlak: f.parlak, animasyon: f.animasyon, rozet: f.rozet,
                unvan: f.unvan.trim(), mesajFontu: f.mesajFontu
            };
            const set = (alan) => (v) => { setF(o => ({ ...o, [alan]: v })); setNot(null); };

            const kaydet = async (e) => {
                e.preventDefault();
                setMesgul(true); setNot(null);
                try {
                    const r = await fetch(`${API_URL}/hesap/tercihler`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${tokenAl()}` },
                        body: JSON.stringify({
                            adRengi: f.adRengi || null, mesajFontu: f.mesajFontu || null, parlak: f.parlak,
                            animasyon: f.animasyon, rozet: f.rozet, unvan: f.unvan.trim()
                        })
                    });
                    const g = await r.json().catch(() => ({}));
                    if (!r.ok) throw new Error(g.message || 'Tercihler kaydedilemedi.');
                    setAcik(g.acik); tercihYaz(g.tercihler);
                    setNot({ tur: 'basari', metin: 'Tercihlerin kaydedildi.' });
                } catch (err) {
                    setNot({ tur: 'hata', metin: err && err.message && err.message !== 'Failed to fetch' ? err.message : 'Sunucuya ulaşılamadı. Biraz sonra tekrar dene.' });
                } finally { setMesgul(false); }
            };

            return (
                <section className="hesap-bolum seviyem" aria-labelledby="hb-seviye">
                    <h2 id="hb-seviye">Seviye ve ödüller</h2>
                    {durum === 'yukleniyor' && <p className="aciklama" role="status">Seviyen yükleniyor…</p>}
                    {durum === 'oturum' && <p className="hesap-not hata" role="alert">Oturumun sona ermiş. <a className="link-ac" href="login.html">Tekrar giriş yap</a>.</p>}
                    {durum === 'hata' && (
                        <>
                            <p className="hesap-not hata" role="alert">Seviye bilgin yüklenemedi.</p>
                            <button type="button" className="btn-ikincil" onClick={() => setDene(dene + 1)}>Tekrar dene</button>
                        </>
                    )}
                    {durum === 'hazir' && puan && katalog && acik && (
                        <>
                            <div className="seviye-ust">
                                <span className="seviye-no" aria-label={`Seviye ${sv}`}>Lv.{sv}</span>
                                <span className="aciklama">{puan.rutbe} · {sayiYaz(puan.toplam)} puan</span>
                            </div>
                            <div className="ilerleme" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow={yuzde} aria-label="Sonraki seviyeye ilerleme" style={{ marginTop: 10 }}>
                                <i style={{ width: `${yuzde}%` }}></i>
                            </div>
                            <p className="aciklama puanim-kalan">
                                {sonrakiVar ? `Seviye ${sv + 1} için ${sayiYaz(puan.sonrakiSeviyeIcinKalan)} puan kaldı.` : 'En yüksek seviyedesin.'}
                            </p>

                            <h3 className="puanim-alt">Ödüller</h3>
                            <ul className="odul-liste">
                                {katalog.seviyeler.map(o => {
                                    const ac = sv >= o.seviye;
                                    return (
                                        <li key={o.seviye} className={`odul-oge ${ac ? '' : 'kilitli'}`}>
                                            <span className="odul-sv">Lv.{o.seviye}</span>
                                            <span>
                                                <strong>{o.ad}{ac ? '' : ' (kilitli)'}</strong>
                                                <span className="odul-acik">{o.aciklama}</span>
                                            </span>
                                        </li>
                                    );
                                })}
                            </ul>

                            <h3 className="puanim-alt">Görünümünü seç</h3>
                            <form className="tercih-form" onSubmit={kaydet}>
                                <div className="tercih-onizleme" aria-live="polite">
                                    <span className={`yorum-yazar ${AS.sinif(onizleme)}`} style={AS.stil(onizleme)}>{kullanici ? kullanici.kullaniciAdi : 'Kullanıcı'}</span>
                                    {onizleme.unvan && <span className="as-unvan">{onizleme.unvan}</span>}
                                    <span style={{ marginLeft: 10, fontFamily: AS.font(onizleme) }}>Merhaba, sohbet önizlemesi!</span>
                                </div>

                                <div className="tercih-grup">
                                    <span className="tercih-baslik" id="tr-renk">Ad rengi</span>
                                    <div className="renk-secenekleri" role="radiogroup" aria-labelledby="tr-renk">
                                        <button type="button" role="radio" aria-checked={f.adRengi === ''} className="renk-btn varsayilan" title="Varsayılan" aria-label="Varsayılan renk" onClick={() => set('adRengi')('')}>Yok</button>
                                        {katalog.renkler.map(r => {
                                            const kilit = !acik.renkler.includes(r.id);
                                            return (
                                                <button key={r.id} type="button" role="radio" aria-checked={f.adRengi === r.id} disabled={kilit}
                                                    className="renk-btn" style={{ background: r.hex }}
                                                    title={kilit ? `${r.ad}: seviye ${r.seviye} gerekir` : r.ad}
                                                    aria-label={kilit ? `${r.ad} (seviye ${r.seviye} gerekir)` : r.ad}
                                                    onClick={() => set('adRengi')(r.id)}></button>
                                            );
                                        })}
                                    </div>
                                </div>

                                <div className="tercih-grup">
                                    <label htmlFor="tr-font">Sohbet yazı tipi</label>
                                    <select id="tr-font" className="tercih-alan" value={f.mesajFontu} onChange={(e) => set('mesajFontu')(e.target.value)}>
                                        <option value="">Varsayılan</option>
                                        {katalog.fontlar.filter(x => x.id !== 'varsayilan').map(x => (
                                            <option key={x.id} value={x.id} disabled={!acik.fontlar.includes(x.id)}>{x.ad}{acik.fontlar.includes(x.id) ? '' : ` (seviye ${x.seviye})`}</option>
                                        ))}
                                    </select>
                                </div>

                                <div className="tercih-grup">
                                    <span className="tercih-baslik">Efektler</span>
                                    <label className={`tercih-satir ${acik.parlak ? '' : 'kilitli'}`}>
                                        <input type="checkbox" checked={f.parlak} disabled={!acik.parlak} onChange={(e) => set('parlak')(e.target.checked)} />
                                        Parlak kullanıcı adı{acik.parlak ? '' : ' (seviye 10)'}
                                    </label>
                                    <label className={`tercih-satir ${acik.animasyon ? '' : 'kilitli'}`}>
                                        <input type="checkbox" checked={f.animasyon} disabled={!acik.animasyon} onChange={(e) => set('animasyon')(e.target.checked)} />
                                        Animasyonlu parlama{acik.animasyon ? '' : ' (seviye 20)'}
                                    </label>
                                    <label className={`tercih-satir ${acik.rozet ? '' : 'kilitli'}`}>
                                        <input type="checkbox" checked={f.rozet} disabled={!acik.rozet} onChange={(e) => set('rozet')(e.target.checked)} />
                                        Rozet çerçevesi{acik.rozet ? '' : ' (seviye 20)'}
                                    </label>
                                </div>

                                <div className="tercih-grup">
                                    <label htmlFor="tr-unvan">Özel unvan{acik.unvan ? '' : ' (seviye 30)'}</label>
                                    <input id="tr-unvan" className="tercih-alan" type="text" maxLength={24} value={f.unvan} disabled={!acik.unvan}
                                        placeholder="En fazla 24 karakter" onChange={(e) => set('unvan')(e.target.value)} />
                                </div>

                                <div>
                                    <button type="submit" className="btn-ana" disabled={mesgul}>{mesgul ? 'Kaydediliyor…' : 'Tercihleri kaydet'}</button>
                                    {not && <p className={`hesap-not ${not.tur === 'hata' ? 'hata' : ''}`} role={not.tur === 'hata' ? 'alert' : 'status'} style={{ marginTop: 8 }}>{not.metin}</p>}
                                </div>
                            </form>
                        </>
                    )}
                </section>
            );
        };

        const ProfilSayfasi = () => {
            const [kullanici, setKullanici] = React.useState(kullaniciAl);
            React.useEffect(() => { if (!kullanici) window.location.href = 'login.html'; }, []);
            const [bilgi, setBilgi] = React.useState({ ad: kullanici ? kullanici.kullaniciAdi : '', email: kullanici ? (kullanici.email || '') : '', sifre: '' });
            const [sifreForm, setSifreForm] = React.useState({ mevcut: '', yeni: '', tekrar: '' });
            const [silSifre, setSilSifre] = React.useState('');
            const [mesaj, setMesaj] = React.useState({}); // { bolum: { tur, metin } }
            const [mesgul, setMesgul] = React.useState('');
            const [puanYenile, setPuanYenile] = React.useState(0);
            const dosyaRef = React.useRef(null);

            if (!kullanici) return <div className="ana-icerik"><DurumKutu ikon="kilit" baslik="Giriş sayfasına yönlendiriliyorsun…" /></div>;

            const not = (bolum, tur, metin) => setMesaj(m => ({ ...m, [bolum]: { tur, metin } }));

            const yerelGuncelle = (veri) => {
                try {
                    const yeniKullanici = { ...kullanici, ...veri };
                    delete yeniKullanici.token;
                    localStorage.setItem('kage95_user', JSON.stringify(yeniKullanici));
                    if (veri.token) localStorage.setItem('kage95_token', veri.token);
                    setKullanici(yeniKullanici);
                    window.dispatchEvent(new Event('kage95-kullanici'));
                } catch (e) {}
            };

            const istek = async (bolum, yol, secenek) => {
                setMesgul(bolum);
                not(bolum, '', '');
                try {
                    const yanit = await fetch(API_URL + yol, {
                        ...secenek,
                        headers: { ...(secenek.headers || {}), 'Authorization': 'Bearer ' + tokenAl() }
                    });
                    const veri = await yanit.json().catch(() => ({}));
                    if (yanit.status === 401) { not(bolum, 'hata', 'Oturumun sona ermiş. Lütfen yeniden giriş yap.'); return null; }
                    if (!yanit.ok) { not(bolum, 'hata', veri.message || 'İşlem başarısız oldu.'); return null; }
                    return veri;
                } catch (e) {
                    not(bolum, 'hata', 'Sunucuya ulaşılamadı. Biraz sonra tekrar dene.');
                    return null;
                } finally {
                    setMesgul('');
                }
            };

            const bilgiKaydet = async (e) => {
                e.preventDefault();
                const veri = await istek('bilgi', '/hesap/profil', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ kullaniciAdi: bilgi.ad.trim(), email: bilgi.email.trim(), mevcutSifre: bilgi.sifre })
                });
                if (veri) {
                    yerelGuncelle(veri);
                    setBilgi(b => ({ ...b, sifre: '' }));
                    not('bilgi', 'basari', 'Bilgilerin güncellendi.');
                }
            };

            const sifreKaydet = async (e) => {
                e.preventDefault();
                if (sifreForm.yeni.length < 8) { not('sifre', 'hata', 'Yeni şifre en az 8 karakter olmalı.'); return; }
                if (sifreForm.yeni !== sifreForm.tekrar) { not('sifre', 'hata', 'Yeni şifreler birbiriyle aynı değil.'); return; }
                const veri = await istek('sifre', '/hesap/sifre', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mevcutSifre: sifreForm.mevcut, yeniSifre: sifreForm.yeni })
                });
                if (veri) {
                    if (veri.token) { try { localStorage.setItem('kage95_token', veri.token); } catch (e2) {} }
                    setSifreForm({ mevcut: '', yeni: '', tekrar: '' });
                    not('sifre', 'basari', 'Şifren değiştirildi. Diğer cihazlardaki oturumların kapatıldı.');
                }
            };

            const avatarYukle = async (e) => {
                const dosya = e.target.files && e.target.files[0];
                e.target.value = '';
                if (!dosya) return;
                if (dosya.size > 2 * 1024 * 1024) { not('avatar', 'hata', 'Dosya en fazla 2 MB olabilir.'); return; }
                const form = new FormData();
                form.append('dosya', dosya);
                const veri = await istek('avatar', '/hesap/avatar', { method: 'POST', body: form });
                if (veri) {
                    yerelGuncelle({ profilResmiURL: veri.profilResmiURL });
                    not('avatar', 'basari', 'Profil resmin güncellendi.');
                    if (window.Kage95Liderlik) window.Kage95Liderlik.yanittan(veri);
                    setPuanYenile(n => n + 1);
                }
            };

            const avatarKaldir = async () => {
                const veri = await istek('avatar', '/hesap/avatar', { method: 'DELETE' });
                if (veri) { yerelGuncelle({ profilResmiURL: null }); not('avatar', 'basari', 'Profil resmin kaldırıldı.'); }
            };

            const hesapSil = async (e) => {
                e.preventDefault();
                if (!window.confirm('Hesabın ve ona bağlı tüm veriler kalıcı olarak silinecek. Emin misin?')) return;
                const veri = await istek('sil', '/hesap', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sifre: silSifre })
                });
                if (veri) cikisYap();
            };

            const Not = ({ b }) => (mesaj[b] && mesaj[b].metin)
                ? <p className={`hesap-not ${mesaj[b].tur === 'hata' ? 'hata' : ''}`} role={mesaj[b].tur === 'hata' ? 'alert' : 'status'}>{mesaj[b].metin}</p>
                : null;

            return (
                <div className="ana-icerik profil-sayfa">
                    <div className="profil-kart">
                        <span className="profil-avatar" aria-hidden="true">
                            {kullanici.profilResmiURL ? <img src={kullanici.profilResmiURL} alt="" /> : kullanici.kullaniciAdi.charAt(0).toUpperCase()}
                        </span>
                        <div>
                            <strong>{kullanici.kullaniciAdi}</strong>
                            <span className="rol">{rolEtiketi(kullanici)}</span>
                        </div>
                    </div>
                    <div className="profil-eylemler">
                        {panelYetkisiVar(kullanici) && <a className="btn-ikincil" href="admin.html">Yönetim paneli</a>}
                        <a className="btn-ikincil" href="#/kutuphane">Kütüphanem</a>
                        <button className="btn-ikincil" onClick={cikisYap}>Çıkış yap</button>
                    </div>

                    <PuanimBolumu yenile={puanYenile} />
                    <SeviyeBolumu yenile={puanYenile} />

                    <section className="hesap-bolum" aria-labelledby="hb-avatar">
                        <h2 id="hb-avatar">Profil resmi</h2>
                        <div className="avatar-satiri">
                            <span className="profil-avatar" aria-hidden="true">
                                {kullanici.profilResmiURL ? <img src={kullanici.profilResmiURL} alt="" /> : kullanici.kullaniciAdi.charAt(0).toUpperCase()}
                            </span>
                            <div className="hesap-eylem-satiri">
                                <input ref={dosyaRef} type="file" accept="image/jpeg,image/png,image/webp" onChange={avatarYukle} hidden />
                                <button className="btn-ikincil" disabled={mesgul === 'avatar'} onClick={() => dosyaRef.current && dosyaRef.current.click()}>Resim yükle</button>
                                {kullanici.profilResmiURL && <button className="btn-ikincil" disabled={mesgul === 'avatar'} onClick={avatarKaldir}>Kaldır</button>}
                            </div>
                        </div>
                        <p className="aciklama">JPG, PNG veya WebP, en fazla 2 MB. Yalnızca kullanım hakkına sahip olduğun görselleri yükle.</p>
                        <Not b="avatar" />
                    </section>

                    <section className="hesap-bolum" aria-labelledby="hb-bilgi">
                        <h2 id="hb-bilgi">Hesap bilgileri</h2>
                        <form onSubmit={bilgiKaydet}>
                            <div className="form-satir">
                                <label htmlFor="hs-ad">Kullanıcı adı</label>
                                <input id="hs-ad" value={bilgi.ad} onChange={e => setBilgi({ ...bilgi, ad: e.target.value })} minLength={3} maxLength={30} autoComplete="username" required />
                            </div>
                            <div className="form-satir">
                                <label htmlFor="hs-email">E-posta</label>
                                <input id="hs-email" type="email" value={bilgi.email} onChange={e => setBilgi({ ...bilgi, email: e.target.value })} autoComplete="email" required />
                            </div>
                            <div className="form-satir">
                                <label htmlFor="hs-sifre">Mevcut şifre (değişikliği onaylamak için)</label>
                                <input id="hs-sifre" type="password" value={bilgi.sifre} onChange={e => setBilgi({ ...bilgi, sifre: e.target.value })} autoComplete="current-password" required />
                            </div>
                            <Not b="bilgi" />
                            <button type="submit" className="btn-ana" disabled={mesgul === 'bilgi'}>{mesgul === 'bilgi' ? 'Kaydediliyor…' : 'Kaydet'}</button>
                        </form>
                    </section>

                    <section className="hesap-bolum" aria-labelledby="hb-sifre">
                        <h2 id="hb-sifre">Şifre değiştir</h2>
                        <form onSubmit={sifreKaydet}>
                            <div className="form-satir">
                                <label htmlFor="hs-mevcut">Mevcut şifre</label>
                                <input id="hs-mevcut" type="password" value={sifreForm.mevcut} onChange={e => setSifreForm({ ...sifreForm, mevcut: e.target.value })} autoComplete="current-password" required />
                            </div>
                            <div className="form-satir">
                                <label htmlFor="hs-yeni">Yeni şifre (en az 8 karakter)</label>
                                <input id="hs-yeni" type="password" value={sifreForm.yeni} onChange={e => setSifreForm({ ...sifreForm, yeni: e.target.value })} minLength={8} autoComplete="new-password" required />
                            </div>
                            <div className="form-satir">
                                <label htmlFor="hs-tekrar">Yeni şifre (tekrar)</label>
                                <input id="hs-tekrar" type="password" value={sifreForm.tekrar} onChange={e => setSifreForm({ ...sifreForm, tekrar: e.target.value })} minLength={8} autoComplete="new-password" required />
                            </div>
                            <Not b="sifre" />
                            <button type="submit" className="btn-ana" disabled={mesgul === 'sifre'}>{mesgul === 'sifre' ? 'Değiştiriliyor…' : 'Şifreyi değiştir'}</button>
                        </form>
                    </section>

                    {kullanici.rol !== 'Owner' && (
                        <section className="hesap-bolum" aria-labelledby="hb-sil">
                            <h2 id="hb-sil">Hesabı sil</h2>
                            <p className="aciklama">Hesabın, yorumların, kütüphanen ve okuma geçmişin kalıcı olarak silinir. Bu işlem geri alınamaz.</p>
                            <form onSubmit={hesapSil}>
                                <div className="form-satir">
                                    <label htmlFor="hs-sil">Şifren</label>
                                    <input id="hs-sil" type="password" value={silSifre} onChange={e => setSilSifre(e.target.value)} autoComplete="current-password" required />
                                </div>
                                <Not b="sil" />
                                <button type="submit" className="btn-ikincil tehlike" disabled={mesgul === 'sil'}>Hesabımı kalıcı olarak sil</button>
                            </form>
                        </section>
                    )}
                </div>
            );
        };

        /* ------------------------- POP TEMASI BÖLÜMLERİ ------------------------- */
        const PopPanel = () => {
            const isinlar = Array.from({ length: 36 }, (_, i) => {
                const a0 = (i / 36) * Math.PI * 2, a1 = a0 + (Math.PI * 2 / 36) * 0.42;
                const r0 = 170 + (i % 2) * 18, r1 = 330;
                const n = (a, r) => `${(200 + Math.cos(a) * r).toFixed(1)},${(200 + Math.sin(a) * r).toFixed(1)}`;
                return <polygon key={i} points={`${n(a0, r0)} ${n(a0, r1)} ${n(a1, r1)} ${n(a1, r0)}`} />;
            });
            return (
                <div className="hero-pop-panel" aria-hidden="true">
                    <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" focusable="false">
                        <defs>
                            <pattern id="pp-nokta-k" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="1.6" fill="#0d0d0d" /></pattern>
                            <pattern id="pp-nokta-kr" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="1.7" fill="#0d0d0d" opacity=".75" /></pattern>
                            <pattern id="pp-cizgi" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-55)"><rect width="6" height="12" fill="#0d0d0d" /></pattern>
                            <clipPath id="pp-kes"><rect x="0" y="0" width="400" height="400" /></clipPath>
                        </defs>
                        <g clipPath="url(#pp-kes)">
                            <g fill="#0d0d0d">{isinlar}</g>
                            <g transform="rotate(-3 120 120)">
                                <rect x="18" y="22" width="222" height="178" fill="#ff3b2a" stroke="#0d0d0d" strokeWidth="3" />
                                <rect x="18" y="22" width="222" height="178" fill="url(#pp-nokta-kr)" />
                            </g>
                            <g transform="rotate(3 320 100)">
                                <rect x="248" y="38" width="146" height="122" fill="#f1ede2" stroke="#0d0d0d" strokeWidth="3" />
                                <rect x="248" y="38" width="146" height="122" fill="url(#pp-cizgi)" />
                                <circle cx="352" cy="82" r="30" fill="#0d0d0d" />
                            </g>
                            <g transform="rotate(-2 110 290)">
                                <rect x="42" y="208" width="140" height="150" fill="#f1ede2" stroke="#0d0d0d" strokeWidth="3" />
                                <rect x="42" y="208" width="140" height="150" fill="url(#pp-nokta-k)" />
                            </g>
                            <g transform="rotate(2 290 270)">
                                <rect x="192" y="168" width="198" height="190" fill="#0d0d0d" />
                                <circle cx="318" cy="238" r="62" fill="#ff3b2a" />
                                <circle cx="318" cy="238" r="24" fill="#f1ede2" />
                                <polygon points="192,358 192,322 238,288 262,312 292,276 330,318 358,284 390,330 390,358" fill="#f1ede2" stroke="#0d0d0d" strokeWidth="3" />
                            </g>
                            <text x="62" y="150" className="pp-ses" transform="rotate(-6 62 150)">ドン</text>
                            <text x="168" y="154" className="pp-ses pp-ses-unlem" transform="rotate(-4 168 154)">!</text>
                            <g transform="rotate(-6 262 178)">
                                <ellipse cx="262" cy="178" rx="68" ry="25" fill="#f1ede2" stroke="#0d0d0d" strokeWidth="3" />
                                <path d="M300 197 L322 214 L290 201 Z" fill="#0d0d0d" stroke="#0d0d0d" strokeWidth="2" strokeLinejoin="round" />
                                <text x="262" y="185" textAnchor="middle" className="pp-balon">YENİ BÖLÜM!</text>
                            </g>
                        </g>
                    </svg>
                </div>
            );
        };

        const PopKapak = ({ src, alt, indeks }) => {
            const [hata, setHata] = React.useState(false);
            if (!src || hata) return <div className={`pop-kapak-yok desen-${indeks % 5}`} role="img" aria-label={`${alt} (kapak yok)`}></div>;
            return <img src={src} alt={alt} loading="lazy" decoding="async" onError={() => setHata(true)} />;
        };

        const PopHero = ({ ilkManga }) => (
            <section className="hero-pop" aria-label="Karşılama">
                <div className="hero-pop-metin">
                    <span className="pop-etiket">Karanlıkta başlayan hikâyeler</span>
                    <h1 className="pop-baslik" aria-label="Gölgeden çık.">
                        <span className="pop-kontur" aria-hidden="true">GÖLGE</span>
                        <span className="pop-dolu" aria-hidden="true">DEN ÇIK<i className="pop-nokta"></i></span>
                    </h1>
                    <p className="pop-soz">{BUGUNKU_SOZ.satirlar.join(' ')} <span lang="ja">{BUGUNKU_SOZ.japonca}</span></p>
                    <p className="pop-aciklama">Türkçe manga arşivi. Aradığın seri ve yeni çıkan bölümler tek yerde.</p>
                    <div className="pop-eylemler">
                        {ilkManga
                            ? <a className="pop-btn pop-btn-dolu" href={`#/manga/${ilkManga.id}`}>Okumaya başla <span aria-hidden="true">→</span></a>
                            : <a className="pop-btn pop-btn-dolu" href="#/" onClick={(e) => { e.preventDefault(); bolumeKaydir('seriler'); }}>Okumaya başla <span aria-hidden="true">→</span></a>}
                        <a className="pop-btn pop-btn-bos" href="#/" onClick={(e) => { e.preventDefault(); bolumeKaydir('pop-ruh'); }}>Türlere göz at</a>
                    </div>
                </div>
                <PopPanel />
            </section>
        );

        const PopBant = ({ kategoriler }) => {
            if (!kategoriler.length) return null;
            let temel = [];
            while (temel.length < 14) temel = temel.concat(kategoriler);
            const oge = (anahtar) => temel.map((k, i) => (
                <React.Fragment key={`${anahtar}-${i}`}><span className="pop-bant-kelime">{k}</span><i className="pop-bant-yildiz">✦</i></React.Fragment>
            ));
            return (
                <div className="pop-bant-kap" aria-hidden="true">
                    <div className="pop-bant"><div className="pop-bant-yol">{oge('a')}{oge('b')}</div></div>
                </div>
            );
        };

        const PopZirve = ({ liste, listeyiGor }) => {
            if (!liste.length) return null;
            return (
                <section className="pop-bolum pop-zirve" aria-labelledby="pop-zirve-b">
                    <div className="pop-bolum-ust">
                        <div>
                            <span className="pop-eyebrow">İlk {liste.length}</span>
                            <h2 id="pop-zirve-b" className="pop-h2">Zirvedekiler</h2>
                        </div>
                        <button type="button" className="pop-link" onClick={listeyiGor}>Tüm listeyi gör <span aria-hidden="true">→</span></button>
                    </div>
                    <ol className="pop-zirve-liste">
                        {liste.map((m, i) => (
                            <li key={m.id}>
                                <a className="pop-zirve-kart" href={`#/manga/${m.id}`} aria-label={`${i + 1}. ${m.mangaAdi}, ${m.bolumSayisi || 0} bölüm`}>
                                    <span className="pop-numara" aria-hidden="true">{i + 1}</span>
                                    <span className="pop-zirve-kapak">
                                        <PopKapak src={m.kapakResmiURL} alt={`${m.mangaAdi} kapak görseli`} indeks={i} />
                                        <span className="pop-zirve-tur">{(m.kategoriler && m.kategoriler[0]) || 'Genel'}</span>
                                    </span>
                                    <span className="pop-zirve-ad">{m.mangaAdi}</span>
                                    <span className="pop-zirve-meta">{m.bolumSayisi || 0} bölüm</span>
                                </a>
                            </li>
                        ))}
                    </ol>
                </section>
            );
        };

        const PopRuh = ({ kategoriler, aktif, sec }) => {
            if (!kategoriler.length) return null;
            return (
                <section id="pop-ruh" className="pop-bolum pop-ruh" aria-labelledby="pop-ruh-b">
                    <h2 id="pop-ruh-b" className="pop-h2 pop-h2-buyuk">Ruh halini <span>seç</span></h2>
                    <div className="pop-ruh-izgara">
                        {kategoriler.map(k => (
                            <button key={k} type="button" className={`pop-ruh-kutu ${aktif === k ? 'aktif' : ''}`} aria-pressed={aktif === k} onClick={() => sec(k)}>
                                <span className="pop-ruh-ad">{k}</span>
                                <span className="pop-ruh-ja" lang="ja" aria-hidden="true">{japoncaKarsilik(k)}</span>
                            </button>
                        ))}
                    </div>
                </section>
            );
        };

        const PopCta = () => (
            <section className="pop-cta" aria-labelledby="pop-cta-b">
                <div className="pop-cta-ic">
                    <h2 id="pop-cta-b" className="pop-cta-baslik">Kütüphaneni<br />kur.</h2>
                    <div className="pop-cta-sag">
                        <p>Ücretsiz hesap aç; favorilerini işaretle, kaldığın bölümü kaybetme.</p>
                        <a className="pop-btn pop-btn-siyah" href="login.html?kayit=1">Hemen katıl <span aria-hidden="true">→</span></a>
                    </div>
                </div>
            </section>
        );

        /* ------------------------- ÖNE ÇIKANLAR ------------------------- */
        // Bağlantı: '/', '#/', http(s) dışını yok say.
        const ocBaglantiGuvenli = (u) => (typeof u === 'string' && /^(\/(?!\/)|#\/|https?:\/\/)/i.test(u.trim())) ? u.trim() : '';
        const ocGorselGuvenli = (u) => {
            if (typeof u !== 'string' || !/^(\/(?!\/)|https?:\/\/)/i.test(u.trim())) return '';
            u = u.trim();
            if (u.startsWith('/')) { try { return new URL(API_URL).origin + u; } catch (e) { return u; } }
            return u;
        };
        const OC_SURE = 6000;
        const OneCikanlar = () => {
            const [liste, setListe] = React.useState([]);
            const [i, setI] = React.useState(0);
            const [durdur, setDurdur] = React.useState(false);   // fare/odak
            const [elle, setElle] = React.useState(false);       // kullanıcı duraklattı
            const [gorunur, setGorunur] = React.useState(() => document.visibilityState !== 'hidden');
            const [azalt] = React.useState(() => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches));
            const dokun = React.useRef(null);

            React.useEffect(() => {
                let iptal = false;
                fetch(`${API_URL}/one-cikanlar`)
                    .then(r => { if (!r.ok) throw new Error(); return r.json(); })
                    .then(v => {
                        if (iptal) return;
                        const l = (Array.isArray(v) ? v : []).filter(x => x && typeof x.baslik === 'string' && x.baslik.trim()).slice(0, 12);
                        setListe(l);
                    })
                    .catch(() => { if (!iptal) setListe([]); });
                return () => { iptal = true; };
            }, []);

            React.useEffect(() => {
                const f = () => setGorunur(document.visibilityState !== 'hidden');
                document.addEventListener('visibilitychange', f);
                return () => document.removeEventListener('visibilitychange', f);
            }, []);

            const n = liste.length;
            const git = React.useCallback((k) => { if (n) setI(((k % n) + n) % n); }, [n]);
            const otomatik = n > 1 && !azalt && !durdur && !elle && gorunur;
            React.useEffect(() => {
                if (!otomatik) return;
                const t = setTimeout(() => setI(x => (x + 1) % n), OC_SURE);
                return () => clearTimeout(t);
            }, [otomatik, i, n]);

            if (n === 0) return null;
            const s = liste[Math.min(i, n - 1)];
            const bag = ocBaglantiGuvenli(s.baglanti);
            const gorsel = ocGorselGuvenli(s.gorselUrl);
            const dokunBasla = (e) => { const t = e.touches[0]; dokun.current = { x: t.clientX, y: t.clientY }; };
            const dokunBitir = (e) => {
                const b = dokun.current; dokun.current = null;
                if (!b || !e.changedTouches[0]) return;
                const dx = e.changedTouches[0].clientX - b.x, dy = e.changedTouches[0].clientY - b.y;
                if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) git(i + (dx < 0 ? 1 : -1));
            };
            const tus = (e) => {
                if (e.key === 'ArrowLeft') { e.preventDefault(); git(i - 1); }
                else if (e.key === 'ArrowRight') { e.preventDefault(); git(i + 1); }
            };
            return (
                <section className="oc" aria-roledescription="carousel" aria-label="Öne çıkanlar"
                    onMouseEnter={() => setDurdur(true)} onMouseLeave={() => setDurdur(false)}
                    onFocus={() => setDurdur(true)} onBlur={(e) => { if (!e.currentTarget.contains(e.relatedTarget)) setDurdur(false); }}
                    onTouchStart={dokunBasla} onTouchEnd={dokunBitir} onKeyDown={tus}>
                    <div className="oc-kutu">
                        <div className="oc-slayt" key={s.id != null ? s.id : i} role="group" aria-roledescription="slide" aria-label={`${i + 1} / ${n}`} aria-live={otomatik ? 'off' : 'polite'}>
                            <div className={`oc-gorsel ${gorsel ? '' : 'oc-gorsel-yok'}`}>
                                {gorsel && <img src={gorsel} alt="" decoding="async" onError={(e) => { e.currentTarget.style.display = 'none'; }} />}
                            </div>
                            <div className="oc-karart" aria-hidden="true"></div>
                            <div className="oc-icerik">
                                {s.etiket && String(s.etiket).trim() && <span className="oc-etiket">{String(s.etiket).trim()}</span>}
                                <h2 className="oc-baslik">{s.baslik}</h2>
                                {s.ozet && <p className="oc-ozet">{s.ozet}</p>}
                                {bag && <a className="oc-btn" href={bag} {...(/^https?:/i.test(bag) ? { target: '_blank', rel: 'noopener noreferrer' } : {})}>Şimdi oku <span aria-hidden="true">→</span></a>}
                            </div>
                        </div>
                        {n > 1 && <>
                            <button type="button" className="oc-ok oc-ok-sol" aria-label="Önceki slayt" onClick={() => git(i - 1)}><span aria-hidden="true">‹</span></button>
                            <button type="button" className="oc-ok oc-ok-sag" aria-label="Sonraki slayt" onClick={() => git(i + 1)}><span aria-hidden="true">›</span></button>
                            <div className="oc-alt">
                                <div className="oc-noktalar">
                                    {liste.map((x, k) => (
                                        <button key={k} type="button" className={`oc-nokta ${k === i ? 'aktif' : ''}`} aria-label={`${k + 1}. slayta git`} aria-current={k === i ? 'true' : undefined} onClick={() => git(k)}></button>
                                    ))}
                                </div>
                                {!azalt && <button type="button" className="oc-dur" aria-pressed={elle} aria-label={elle ? 'Otomatik kaydırmayı başlat' : 'Otomatik kaydırmayı durdur'} onClick={() => setElle(v => !v)}><span aria-hidden="true">{elle ? '▶' : '❚❚'}</span></button>}
                            </div>
                        </>}
                    </div>
                </section>
            );
        };

        /* ------------------------- ANA SAYFA ------------------------- */
        // Ana ekran sloganı: sabit tek söz (Japonca karşılığı altında küçük yazılır).
        const BUGUNKU_SOZ = {
            satirlar: ['Sessizce oku,', 'derinlere in.'],
            japonca: '静かに読み、深く潜れ',
            yazar: 'Kage 95'
        };

        // Popüler seriler: GET /mangas/populer?donem=hafta|ay|tum; kartta ilk/son bölüme hızlı bağlantı
        const PopulerSeriler = () => {
            const DONEMLER = [['hafta', 'Bu hafta'], ['ay', 'Bu ay'], ['tum', 'Tüm zamanlar']];
            const [donem, setDonem] = React.useState('hafta');
            const [liste, setListe] = React.useState([]);
            React.useEffect(() => {
                let iptal = false;
                fetch(`${API_URL}/mangas/populer?donem=${donem}&limit=10`)
                    .then(r => { if (!r.ok) throw new Error(); return r.json(); })
                    .then(v => { if (!iptal) setListe(Array.isArray(v) ? v : []); })
                    .catch(() => { if (!iptal) setListe([]); });
                return () => { iptal = true; };
            }, [donem]);
            if (!liste.length) return null;
            return (
                <section className="ana-icerik populer" aria-labelledby="populerBaslik">
                    <div className="bolum-baslik-satir">
                        <h2 id="populerBaslik">En çok okunanlar</h2>
                        <div className="baslik-sag" role="group" aria-label="Dönem">
                            {DONEMLER.map(([k, ad]) => (
                                <button key={k} type="button" className={`kategori-btn ${donem === k ? 'aktif' : ''}`} aria-pressed={donem === k} onClick={() => setDonem(k)}>{ad}</button>
                            ))}
                        </div>
                    </div>
                    <ol className="populer-liste">
                        {liste.map((m, i) => (
                            <li key={m.id} className="populer-kart">
                                <a className="populer-kapak" href={`#/manga/${m.id}`} aria-label={`${i + 1}. ${m.mangaAdi}`}>
                                    <span className="populer-sira" aria-hidden="true">{i + 1}</span>
                                    <span className={`kart-kapak desen-${(m.id || 0) % 5} ${m.kapakResmiURL ? '' : 'kapak-yok'}`}>
                                        <img src={m.kapakResmiURL || YER_TUTUCU} alt={`${m.mangaAdi} kapak görseli`} loading="lazy" decoding="async" onError={gorselHata} />
                                    </span>
                                </a>
                                <a className="populer-ad" href={`#/manga/${m.id}`}>{m.mangaAdi}</a>
                                {m.bolumSayisi != null && <span className="manga-meta">{m.bolumSayisi} Bölüm</span>}
                            </li>
                        ))}
                    </ol>
                </section>
            );
        };

        const AnaSayfa = ({ aramaMetni, setAramaMetni, kayitAcik = true }) => {
            const pop = usePopTema();
            const [zirve, setZirve] = React.useState([]);
            const [arama, setArama] = React.useState('');
            const [secilenKategoriler, setSecilenKategoriler] = React.useState([]);
            const kategori = secilenKategoriler.join(',');
            const [durumFiltre, setDurumFiltre] = React.useState('');
            const [rastgeleBusy, setRastgeleBusy] = React.useState(false);
            const [kategoriler, setKategoriler] = React.useState([]);
            const [mangalar, setMangalar] = React.useState([]);
            const [toplam, setToplam] = React.useState(0);
            const [sayfa, setSayfa] = React.useState(1);
            const [yukleniyor, setYukleniyor] = React.useState(true);
            const [hata, setHata] = React.useState(null);
            const istekNo = React.useRef(0);
            const [sirala, setSirala] = React.useState('yeni');
            const [devam] = React.useState(() => {
                try {
                    const v = JSON.parse(localStorage.getItem('kage95_son_okunan') || 'null');
                    return v && v.bolumId && v.mangaAdi ? v : null;
                } catch (e) { return null; }
            });

            React.useEffect(() => {
                fetch(`${API_URL}/categories`)
                    .then(r => { if (!r.ok) throw new Error(); return r.json(); })
                    .then(v => setKategoriler(Array.isArray(v) ? v.map(k => k.kategoriAdi) : []))
                    .catch(() => setKategoriler([]));
            }, []);

            // Pop temasında 'Zirvedekiler' (yalnızca tema aktifken istek atılır)
            React.useEffect(() => {
                if (!pop) return;
                let iptal = false;
                fetch(`${API_URL}/mangas?sirala=puan&pageSize=5`)
                    .then(r => { if (!r.ok) throw new Error(); return r.json(); })
                    .then(v => { if (!iptal) setZirve(Array.isArray(v) ? v.slice(0, 5) : []); })
                    .catch(() => { if (!iptal) setZirve([]); });
                return () => { iptal = true; };
            }, [pop]);
            const kategoriDegistir = (k) => {
                if (!k) { setSecilenKategoriler([]); return; }
                setSecilenKategoriler(onceki => onceki.includes(k) ? onceki.filter(x => x !== k) : [...onceki, k]);
            };
            const turSec = (k) => {
                kategoriDegistir(k);
                setTimeout(() => bolumeKaydir('seriler'), 60);
            };
            const listeyiGor = () => { setSirala('puan'); setTimeout(() => bolumeKaydir('seriler'), 60); };
            const rastgeleGit = () => {
                if (rastgeleBusy) return;
                setRastgeleBusy(true);
                fetch(`${API_URL}/mangas/rastgele`)
                    .then(r => r.ok ? r.json() : null)
                    .then(v => {
                        if (v && v.id) { window.location.hash = `#/manga/${v.id}`; return; }
                        if (mangalar.length > 0) {
                            const m = mangalar[Math.floor(Math.random() * mangalar.length)];
                            window.location.hash = `#/manga/${m.id}`;
                        }
                    })
                    .catch(() => {
                        if (mangalar.length > 0) {
                            const m = mangalar[Math.floor(Math.random() * mangalar.length)];
                            window.location.hash = `#/manga/${m.id}`;
                        }
                    })
                    .finally(() => setRastgeleBusy(false));
            };

            // Arama kutusunu gecikmeli uygula
            React.useEffect(() => {
                const t = setTimeout(() => setArama(aramaMetni.trim()), 350);
                return () => clearTimeout(t);
            }, [aramaMetni]);

            const yukle = React.useCallback((hedefSayfa) => {
                const no = ++istekNo.current;
                setYukleniyor(true);
                setHata(null);
                const p = new URLSearchParams({ page: hedefSayfa, pageSize: SAYFA_BOYUTU });
                if (arama) p.set('search', arama);
                if (kategori) p.set('category', kategori);
                if (durumFiltre) p.set('durum', durumFiltre);
                if (sirala !== 'yeni') p.set('sirala', sirala);
                fetch(`${API_URL}/mangas?${p.toString()}`)
                    .then(r => {
                        if (!r.ok) throw new Error(`HTTP ${r.status}`);
                        const t = parseInt(r.headers.get('X-Total-Count') || '0', 10);
                        return r.json().then(v => ({ v, t }));
                    })
                    .then(({ v, t }) => {
                        if (no !== istekNo.current) return;
                        const liste = Array.isArray(v) ? v : [];
                        setToplam(t || liste.length);
                        setMangalar(onceki => hedefSayfa === 1 ? liste : [...onceki, ...liste]);
                        setSayfa(hedefSayfa);
                    })
                    .catch(() => { if (no === istekNo.current) setHata('Manga listesi yüklenemedi. Sunucu çalışmıyor olabilir; biraz sonra tekrar deneyin.'); })
                    .finally(() => { if (no === istekNo.current) setYukleniyor(false); });
            }, [arama, kategori, durumFiltre, sirala]);

            React.useEffect(() => { yukle(1); }, [yukle]);

            const dahaVar = mangalar.length < toplam;
            const ilkYukleme = yukleniyor && mangalar.length === 0;
            const tumKategoriler = ['', ...kategoriler];

            return (
                <>
                    {pop && <PopHero ilkManga={zirve[0] || null} />}
                    {pop && <OneCikanlar />}
                    {pop && <PopBant kategoriler={kategoriler} />}
                    {pop && <PopZirve liste={zirve} listeyiGor={listeyiGor} />}
                    {pop && <PopRuh kategoriler={kategoriler} aktif={kategori} sec={turSec} />}

                    {!pop && <section className="hero" aria-label="Karşılama ve arama">
                        <div className="hero-metin">
                            <div className="hero-etiket">影 · Kage</div>
                            <h1 className="hero-baslik">{BUGUNKU_SOZ.satirlar[0]}<br />{BUGUNKU_SOZ.satirlar[1]}</h1>
                            <p className="hero-japonca" lang="ja">{BUGUNKU_SOZ.japonca}</p>
                            <p className="hero-yazar">— {BUGUNKU_SOZ.yazar}</p>
                            <p className="hero-aciklama">Türkçe manga arşivi. Aradığın seri ve yeni çıkan bölümler tek yerde.</p>
                            <div className="arama-kapsayici">
                                <span className="arama-ikon" aria-hidden="true"><Ikon ad="ara" boyut={18} /></span>
                                <input
                                    type="search"
                                    id="mangaAramaInput"
                                    placeholder="Manga ara…"
                                    value={aramaMetni}
                                    onChange={(e) => setAramaMetni(e.target.value)}
                                    aria-label="Manga kütüphanesinde ara"
                                />
                            </div>
                        </div>
                        <div className="hero-gorsel" aria-hidden="true">
                            <div className="gunes"></div>
                            <svg className="torii" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
                                <g fill="#050404" stroke="rgba(224,52,60,0.35)" strokeWidth="1" strokeLinejoin="round">
                                    <path d="M6 62 C 90 92, 310 92, 394 62 L 388 86 C 300 112, 100 112, 12 86 Z" />
                                    <rect x="34" y="94" width="332" height="12" />
                                    <rect x="64" y="136" width="272" height="11" />
                                    <rect x="190" y="106" width="20" height="30" />
                                    <rect x="82" y="102" width="26" height="210" />
                                    <rect x="292" y="102" width="26" height="210" />
                                </g>
                            </svg>
                            <div className="ufuk"></div>
                            <div className="dikey-yazi">漫画の世界</div>
                        </div>
                    </section>}
                    {!pop && <OneCikanlar />}

                    <DuyuruSeridi />

                    {!pop && <PopulerSeriler />}

                    <section id="turler" className="tur-bolum" aria-label="Türlere göre filtrele">
                        <span className="tur-etiket">Türler</span>
                        {tumKategoriler.map(kat => {
                            const secili = kat ? secilenKategoriler.includes(kat) : secilenKategoriler.length === 0;
                            return (
                                <button
                                    key={kat || 'tumu'}
                                    aria-pressed={secili}
                                    className={`kategori-btn ${secili ? 'aktif' : ''}`}
                                    onClick={() => kategoriDegistir(kat)}
                                >
                                    {kat || 'Tümü'}
                                </button>
                            );
                        })}
                    </section>

                    <section id="seriler" className="ana-icerik" aria-label="Manga Listesi">
                        {devam && !arama && !kategori && !durumFiltre && (
                            <div className="devam-serit">
                                <div>
                                    <small>Okumaya devam et</small>
                                    <strong>{devam.mangaAdi}</strong>
                                    <span className="devam-alt">Bölüm {devam.bolumNo}{devam.toplam ? ` · Sayfa ${devam.sayfa}/${devam.toplam}` : ''}</span>
                                </div>
                                <a className="btn-ana" href={`read.html?chapter=${devam.bolumId}`}>Devam et</a>
                            </div>
                        )}
                        <div className="bolum-baslik-satir">
                            <h2>{secilenKategoriler.length ? `${secilenKategoriler.join(' + ')} serileri` : 'Seriler'}</h2>
                            <div className="baslik-sag" style={{ flexWrap: 'wrap' }}>
                                <button type="button" className="siralama" style={{ cursor: 'pointer', padding: '0 12px' }} onClick={rastgeleGit} disabled={rastgeleBusy}>
                                    {rastgeleBusy ? 'Seçiliyor…' : 'Rastgele seri'}
                                </button>
                                <label className="sr-only" htmlFor="durumSec">Durum</label>
                                <select id="durumSec" className="siralama" value={durumFiltre} onChange={(e) => setDurumFiltre(e.target.value)}>
                                    <option value="">Tüm durumlar</option>
                                    <option value="DevamEdiyor">Devam ediyor</option>
                                    <option value="Tamamlandi">Tamamlandı</option>
                                    <option value="AraVerdi">Ara verdi</option>
                                </select>
                                <label className="sr-only" htmlFor="siralamaSec">Sırala</label>
                                <select id="siralamaSec" className="siralama" value={sirala} onChange={(e) => setSirala(e.target.value)}>
                                    <option value="yeni">En yeni</option>
                                    <option value="puan">En yüksek puan</option>
                                    <option value="ad">A-Z</option>
                                </select>
                                <span className="sonuc-sayisi" aria-live="polite">{toplam} seri</span>
                            </div>
                        </div>

                        {ilkYukleme && <IskeletGrid adet={SAYFA_BOYUTU} />}

                        {!yukleniyor && hata && mangalar.length === 0 && (
                            <DurumKutu ikon="hata" rol="alert" baslik="Bağlantı kurulamadı" metin={hata}>
                                <button className="btn-ikincil" onClick={() => yukle(1)}>Tekrar dene</button>
                            </DurumKutu>
                        )}

                        {mangalar.length > 0 && (
                            <div className="manga-grid">
                                {mangalar.map(m => <MangaKart key={m.id} m={m} yeniGoster={!(mangalar.length > 1 && mangalar.every(x => yeniMi(x.eklenmeTarihi)))} />)}
                            </div>
                        )}

                        {!yukleniyor && !hata && mangalar.length === 0 && (
                            <DurumKutu ikon="ara" baslik="Eşleşen manga bulunamadı"
                                metin={arama || kategori || durumFiltre ? 'Arama, tür veya durum filtresiyle eşleşen kayıt yok.' : 'Arşivde henüz manga yok.'}>
                                {(arama || kategori || durumFiltre) && (
                                    <button className="btn-ikincil" onClick={() => { setAramaMetni(''); setSecilenKategoriler([]); setDurumFiltre(''); }}>Filtreleri temizle</button>
                                )}
                            </DurumKutu>
                        )}

                        {mangalar.length > 0 && hata && (
                            <p className="hata-satir" role="alert">{hata}</p>
                        )}

                        {mangalar.length > 0 && (dahaVar || hata) && (
                            <div className="daha-fazla">
                                <button className="btn-ikincil" disabled={yukleniyor} onClick={() => yukle(sayfa + 1)}>
                                    {yukleniyor ? 'Yükleniyor…' : 'Daha fazla yükle'}
                                </button>
                            </div>
                        )}
                    </section>

                    <div className="ana-icerik sohbet-alt"><SohbetKap mod="serit" /></div>

                    {pop && !kullaniciAl() && kayitAcik && <PopCta />}
                </>
            );
        };

        /* ------------------------- MANGA DETAY ------------------------- */
        const MangaDetay = ({ id }) => {
            const [manga, setManga] = React.useState(null);
            const [yukleniyor, setYukleniyor] = React.useState(true);
            const [hata, setHata] = React.useState(null);
            const [yeniFirst, setYeniFirst] = React.useState(true);
            const [okunan, setOkunan] = React.useState(() => okunanlariAl(id));
            const [kayitli, setKayitli] = React.useState(false);
            const [kutuphaneMesaj, setKutuphaneMesaj] = React.useState('');
            const [kutuphaneBusy, setKutuphaneBusy] = React.useState(false);
            const [dene, setDene] = React.useState(0);
            const [kopyaMesaj, setKopyaMesaj] = React.useState('');
            const [okumaDurumu, setOkumaDurumu] = React.useState(() => kutuphaneDurumuAl(id));
            React.useEffect(() => {
                if (manga && manga.mangaAdi) document.title = manga.mangaAdi + ' | Kage 95';
            }, [manga]);
            const baglantiKopyala = () => {
                const url = window.location.href;
                const bitti = (ok) => setKopyaMesaj(ok ? 'Bağlantı kopyalandı.' : 'Kopyalanamadı; adresi adres çubuğundan kopyalayın.');
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(url).then(() => bitti(true), () => bitti(false));
                    return;
                }
                try {
                    const t = document.createElement('textarea');
                    t.value = url; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
                    document.body.appendChild(t); t.select();
                    const ok = document.execCommand('copy');
                    document.body.removeChild(t);
                    bitti(ok);
                } catch (e) { bitti(false); }
            };

            React.useEffect(() => {
                let iptal = false;
                setYukleniyor(true); setHata(null); setManga(null);
                setOkunan(okunanlariAl(id));
                fetch(`${API_URL}/mangas/${id}`)
                    .then(r => {
                        if (r.status === 404) throw new Error('404');
                        if (!r.ok) throw new Error('HTTP');
                        return r.json();
                    })
                    .then(v => { if (!iptal) setManga(v); })
                    .catch(e => { if (!iptal) setHata(e.message === '404' ? 'Bu manga bulunamadı.' : 'Manga yüklenemedi. Sunucu çalışmıyor olabilir.'); })
                    .finally(() => { if (!iptal) setYukleniyor(false); });

                const token = tokenAl();
                if (token) {
                    fetch(`${API_URL}/user/library/check/${id}`, { headers: { Authorization: `Bearer ${token}` } })
                        .then(r => r.ok ? r.json() : null)
                        .then(v => { if (!iptal && v) setKayitli(!!v.isSaved); })
                        .catch(() => {});
                }
                return () => { iptal = true; };
            }, [id, dene]);

            const kutuphaneDegistir = () => {
                const token = tokenAl();
                if (!token) { setKutuphaneMesaj('GIRIS'); return; }
                setKutuphaneBusy(true);
                fetch(`${API_URL}/user/library/toggle`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
                    body: JSON.stringify({ mangaId: id })
                })
                    .then(r => {
                        if (r.status === 401) { setKutuphaneMesaj('GIRIS'); return null; }
                        if (!r.ok) throw new Error();
                        return r.json();
                    })
                    .then(v => {
                        if (v) {
                            setKayitli(!!v.isSaved); setKutuphaneMesaj(v.message || '');
                            if (window.Kage95Liderlik) window.Kage95Liderlik.yanittan(v);
                        }
                    })
                    .catch(() => setKutuphaneMesaj('İşlem başarısız oldu. Daha sonra tekrar deneyin.'))
                    .finally(() => setKutuphaneBusy(false));
            };

            if (yukleniyor) return (
                <div className="ana-icerik detay" role="status" aria-label="Yükleniyor" aria-busy="true">
                    <div className="detay-ust" aria-hidden="true">
                        <div className="detay-kapak iskelet-blok"></div>
                        <div className="detay-bilgi">
                            <div className="iskelet-blok" style={{ height: 36, width: '70%' }}></div>
                            <div className="iskelet-blok iskelet-satir ilk"></div>
                            <div className="iskelet-blok iskelet-satir"></div>
                            <div className="iskelet-blok iskelet-satir kisa"></div>
                        </div>
                    </div>
                </div>
            );
            if (hata || !manga) return (
                <div className="ana-icerik">
                    <a className="geri-link" href="#/">Tüm seriler</a>
                    <DurumKutu ikon="hata" rol="alert" baslik="Açılamadı" metin={hata}>
                        <button className="btn-ikincil" onClick={() => setDene(dene + 1)}>Tekrar dene</button>
                        <a className="btn-ikincil" href="#/">Ana sayfaya dön</a>
                    </DurumKutu>
                </div>
            );

            const bolumler = [...(manga.bolumler || [])].sort((a, b) => yeniFirst ? b.bolumNo - a.bolumNo : a.bolumNo - b.bolumNo);
            const ilkBolum = [...(manga.bolumler || [])].sort((a, b) => a.bolumNo - b.bolumNo)[0];
            // Kaldığı bölüm: okunan listesinde en son açılan, bu seride hâlâ var olan bölüm
            const devamBolum = (() => {
                const l = Array.from(okunan);
                for (let i = l.length - 1; i >= 0; i--) {
                    const b = (manga.bolumler || []).find(x => String(x.id) === l[i]);
                    if (b) return b;
                }
                return null;
            })();

            return (
                <div className="ana-icerik detay">
                    <a className="geri-link" href="#/">Tüm seriler</a>

                    <section className="detay-ust" aria-label="Manga bilgileri">
                        <div className={`detay-kapak desen-${(manga.id || 0) % 5} ${manga.kapakResmiURL ? '' : 'kapak-yok'}`}>
                            <img src={manga.kapakResmiURL || YER_TUTUCU} alt={`${manga.mangaAdi} kapak görseli`} decoding="async" onError={gorselHata} />
                        </div>
                        <div className="detay-bilgi">
                            <h1 className="detay-baslik">{manga.mangaAdi}</h1>
                            <dl className="detay-meta">
                                <div><dt>Yazar</dt><dd>{manga.yazar || 'Bilinmiyor'}</dd></div>
                                <div><dt>Çizer</dt><dd>{manga.cizer || 'Bilinmiyor'}</dd></div>
                                <div><dt>Durum</dt><dd>{durumMetni(manga.durum)}</dd></div>
                            </dl>
                            {manga.kategoriler && manga.kategoriler.length > 0 && (
                                <ul className="etiketler" aria-label="Türler">
                                    {manga.kategoriler.map(k => <li key={k}>{k}</li>)}
                                </ul>
                            )}
                            <div className="detay-puan"><PuanKutu url={`${API_URL}/mangas/${id}/puan`} etiket="Bu seriyi puanla" /></div>
                            <p className="detay-aciklama">{manga.aciklama || 'Bu seri için açıklama eklenmemiş.'}</p>
                            <div className="detay-eylemler">
                                {ilkBolum ? (
                                    <a className="btn-ana" href={`read.html?chapter=${ilkBolum.id}`} onClick={() => okunduIsaretle(id, ilkBolum.id)}>İlk bölümü oku</a>
                                ) : (
                                    <span className="btn-ana pasif" aria-disabled="true">Henüz bölüm yok</span>
                                )}
                                {devamBolum && (
                                    <a className="btn-ikincil" href={`read.html?chapter=${devamBolum.id}`} onClick={() => okunduIsaretle(id, devamBolum.id)}>Bölüm {bolumNoYaz(devamBolum.bolumNo)}'ten devam et</a>
                                )}
                                <button type="button" className="btn-ikincil" onClick={baglantiKopyala}>Bağlantıyı kopyala</button>
                                <button className={`btn-ikincil ${kayitli ? 'aktif' : ''}`} onClick={kutuphaneDegistir} disabled={kutuphaneBusy} aria-pressed={kayitli}>
                                    {kayitli ? 'Kütüphanede' : 'Kütüphaneye ekle'}
                                </button>
                            </div>
                            {kopyaMesaj && <p className="bilgi-satir" role="status">{kopyaMesaj}</p>}
                            {kayitli && (
                                <div className="durum-secici">
                                    <label htmlFor="okumaDurumu">Okuma durumu</label>
                                    <select id="okumaDurumu" value={okumaDurumu} onChange={(e) => { setOkumaDurumu(e.target.value); kutuphaneDurumuYaz(id, e.target.value); }}>
                                        {KUTUPHANE_DURUMLARI.map(([k, ad]) => <option key={k} value={k}>{ad}</option>)}
                                    </select>
                                </div>
                            )}
                            {kutuphaneMesaj === 'GIRIS' ? (
                                <p className="bilgi-satir" role="status">Kütüphaneye eklemek için <a href="login.html">giriş yapın</a>.</p>
                            ) : kutuphaneMesaj ? (
                                <p className="bilgi-satir" role="status">{kutuphaneMesaj}</p>
                            ) : null}
                        </div>
                    </section>

                    <section aria-label="Bölümler">
                        <div className="bolum-baslik-satir">
                            <h2>Bölümler</h2>
                            <button className="link-btn" onClick={() => setYeniFirst(!yeniFirst)} aria-label="Bölüm sıralamasını değiştir">
                                {yeniFirst ? 'Yeniden eskiye' : 'Eskiden yeniye'}
                            </button>
                        </div>
                        {bolumler.length === 0 ? (
                            <DurumKutu ikon="kitap" baslik="Henüz bölüm eklenmemiş" metin="Bu seriye yeni bölümler eklendiğinde burada görünecek.">
                                <a className="btn-ikincil" href="#/">Ana sayfaya dön</a>
                            </DurumKutu>
                        ) : (
                            <ul className="bolum-listesi">
                                {bolumler.map(b => {
                                    const okundu = okunan.has(String(b.id));
                                    return (
                                        <li key={b.id}>
                                            <a className={`bolum-satir ${okundu ? 'okundu' : ''}`}
                                               href={`read.html?chapter=${b.id}`}
                                               onClick={() => { okunduIsaretle(id, b.id); }}>
                                                <span className="bolum-ad">
                                                    <strong>Bölüm {bolumNoYaz(b.bolumNo)}</strong>
                                                    {b.bolumAdi ? <span> · {b.bolumAdi}</span> : null}
                                                </span>
                                                <span className="bolum-sag">
                                                    {okundu && <span className="okundu-rozet">Okundu</span>}
                                                    <span className="bolum-tarih">{tarihYaz(b.yayinTarihi)}</span>
                                                </span>
                                            </a>
                                        </li>
                                    );
                                })}
                            </ul>
                        )}
                    </section>

                    <MangaYorumlari mangaId={id} />
                </div>
            );
        };

        /* ------------------------- HERKESE AÇIK KULLANICI PROFİLİ ------------------------- */
        const KullaniciProfilSayfasi = ({ ad }) => {
            const [durum, setDurum] = React.useState('yukleniyor'); // yukleniyor | hazir | yok | hata
            const [veri, setVeri] = React.useState(null);
            const [dene, setDene] = React.useState(0);

            React.useEffect(() => {
                let iptal = false;
                setDurum('yukleniyor');
                fetch(`${API_URL}/kullanicilar/${encodeURIComponent(ad || '')}/profil`)
                    .then(r => {
                        if (r.status === 404) throw new Error('404');
                        if (!r.ok) throw new Error('HTTP');
                        return r.json();
                    })
                    .then(v => { if (!iptal) { setVeri(v); setDurum('hazir'); } })
                    .catch(e => { if (!iptal) setDurum(e.message === '404' ? 'yok' : 'hata'); });
                return () => { iptal = true; };
            }, [ad, dene]);

            if (durum === 'yukleniyor') {
                return <div className="ana-icerik detay"><IskeletGrid adet={4} /></div>;
            }
            if (durum === 'yok' || durum === 'hata' || !veri) {
                return (
                    <div className="ana-icerik detay">
                        <a className="geri-link" href="#/">Ana sayfaya dön</a>
                        <DurumKutu ikon="hata" rol="alert"
                            baslik={durum === 'yok' ? 'Kullanıcı bulunamadı' : 'Profil yüklenemedi'}
                            metin={durum === 'yok' ? 'Aradığınız kullanıcı mevcut değil veya hesabı kapatılmış.' : 'Sunucuya ulaşılamadı. Lütfen tekrar deneyin.'}>
                            {durum === 'hata' && <button className="btn-ikincil" onClick={() => setDene(dene + 1)}>Tekrar dene</button>}
                            <a className="btn-ikincil" href="#/">Ana sayfaya dön</a>
                        </DurumKutu>
                    </div>
                );
            }

            const AS = window.Kage95AdStili;
            const kutuphane = Array.isArray(veri.kutuphane) ? veri.kutuphane : [];
            const sonYorumlar = Array.isArray(veri.sonYorumlar) ? veri.sonYorumlar : [];

            return (
                <div className="ana-icerik detay">
                    <a className="geri-link" href="#/">Ana sayfaya dön</a>
                    <section className="kprof-ust" aria-label="Kullanıcı bilgileri">
                        <span className="kprof-avatar" aria-hidden="true">
                            {veri.profilResmiURL
                                ? <img src={veri.profilResmiURL} alt="" onError={(e) => { e.currentTarget.style.display = 'none'; }} />
                                : String(veri.kullaniciAdi || '?').charAt(0).toUpperCase()}
                        </span>
                        <div className="kprof-bilgi">
                            <h1 className="kprof-ad">
                                <span className={AS ? AS.sinif(veri.adStili) : ''} style={AS ? AS.stil(veri.adStili) : undefined}>{veri.kullaniciAdi}</span>
                                {AS && AS.unvan(veri.adStili) && <span className="as-unvan">{AS.unvan(veri.adStili)}</span>}
                            </h1>
                            <div className="kprof-rozetler">
                                <span className="kprof-rozet">Seviye {veri.seviye || 1} · {veri.rutbe || 'Çırak'}</span>
                                <span className="kprof-rozet">{sayiYaz(veri.toplamPuan || 0)} puan</span>
                                <span>{rolEtiketi(veri)}</span>
                                {veri.kayitTarihi && <span>Katılım: {tarihYaz(veri.kayitTarihi)}</span>}
                            </div>
                        </div>
                    </section>

                    <section aria-label="Kütüphanesi" style={{ marginBottom: 'var(--bosluk-4)' }}>
                        <div className="bolum-baslik-satir">
                            <h2>Kütüphanesi</h2>
